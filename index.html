function StyleManagerPage({styles,obMap,onExport,page:currentPage}){
  const [tab,setTab]=useState("all");
  // Per-tab state
  const [allSearch,setAllSearch]=useState("");
  const [allLine,setAllLine]=useState("all");
  const [allExpanded,setAllExpanded]=useState({});
  const [allShowFull,setAllShowFull]=useState({});

  const [todaySearch,setTodaySearch]=useState("");
  const [todayLine,setTodayLine]=useState("all");
  const [todayExpanded,setTodayExpanded]=useState({});
  const [todayShowFull,setTodayShowFull]=useState({});

  const [opsSearch,setOpsSearch]=useState("");
  const [opsFilter,setOpsFilter]=useState("all"); // "all"|"has"|"missing"
  const [opsExpanded,setOpsExpanded]=useState({});
  const [opsShowFull,setOpsShowFull]=useState({});

  const today=new Date();today.setHours(0,0,0,0);
  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  const obLoaded=obMap&&Object.keys(obMap).length>0;

  function isActive(s){
    if(!s.startDate||!s.endDate)return false;
    const st=new Date(s.startDate);st.setHours(0,0,0,0);
    const en=new Date(s.endDate);en.setHours(0,0,0,0);
    return st<=today&&en>=today;
  }
  function hasOps(s){
    const ob=obMap&&obMap[s.styleName];
    return ob&&ob.ops&&ob.ops.length>0;
  }
  function daysLeft(s){
    if(!s.endDate)return null;
    return Math.round((new Date(s.endDate)-today)/(86400*1000));
  }
  function workingDaysBetween(fromDate,toDate){
    // Count Mon-Sat days from fromDate up to and including toDate
    if(!fromDate||!toDate)return 0;
    let count=0;
    let cur=new Date(fromDate);cur.setHours(0,0,0,0);
    const end=new Date(toDate);end.setHours(0,0,0,0);
    while(cur<=end){
      if(cur.getDay()!==0)count++;
      cur.setDate(cur.getDate()+1);
    }
    return Math.max(0,count);
  }
  function daysElapsed(s){
    if(!s.startDate)return 0;
    return workingDaysBetween(s.startDate,today);
  }
  // Total working days based on actual start/end dates (more accurate than PRD DYS sum)
  function totalWorkingDays(s){
    if(!s.startDate||!s.endDate)return s.prodDays||1;
    return Math.max(1,workingDaysBetween(s.startDate,s.endDate));
  }
  function delCountdown(s){
    if(!s.delDate)return null;
    return Math.round((new Date(s.delDate)-today)/(86400*1000));
  }

  // Summary stats
  const totalStyles=styles.length;
  const runningToday=styles.filter(isActive).length;
  const haveOps=styles.filter(hasOps).length;
  const missingOps=totalStyles-haveOps;

  // Filtered lists per tab
  function applySearch(list,search,line){
    const q=search.toLowerCase();
    return list.filter(s=>{
      const matchQ=!q||s.styleName.toLowerCase().includes(q)||(s.gmtType||"").toLowerCase().includes(q)||String(s.line).includes(q);
      const matchL=line==="all"||String(s.line)===String(line);
      return matchQ&&matchL;
    });
  }
  const allFiltered=applySearch(styles,allSearch,allLine);
  const todayFiltered=applySearch(styles.filter(isActive),todaySearch,todayLine);
  const opsBase=opsFilter==="has"?styles.filter(hasOps):opsFilter==="missing"?styles.filter(s=>!hasOps(s)):styles;
  const opsFiltered=applySearch(opsBase,opsSearch,"all");

  function toggleExpand(id,expandState,setExpandState){
    setExpandState(p=>({...p,[id]:!p[id]}));
  }
  function toggleShowFull(id,state,setState){
    setState(p=>({...p,[id]:!p[id]}));
  }

  // ── Shared style card renderer ──────────────────────────────────────────────
  function StyleCard({s,expandedMap,setExpandedMap,showFullMap,setShowFullMap,showProgress=false,urgent=false}){
    const ob=obMap&&obMap[s.styleName];
    const sHasOps=ob&&ob.ops&&ob.ops.length>0;
    const isExpanded=!!expandedMap[s.id];
    const isShowFull=!!showFullMap[s.id];
    const active=isActive(s);
    const dl=daysLeft(s);
    const elapsed=daysElapsed(s);
    const dc=delCountdown(s);
    const dlColor=dl===null?"#94a3b8":dl<0?"#dc2626":dl<=2?"#d97706":"#16a34a";
    const dlLabel=dl===null?"—":dl<0?"Overdue by "+Math.abs(dl)+"d":dl===0?"Last day":dl+" days left";
    const dcLabel=dc===null?"—":dc<0?"Overdue by "+Math.abs(dc)+"d":dc===0?"Del today":"Del in "+dc+" days";
    const previewOps=sHasOps?ob.ops.slice(0,3):[];
    const allOps=sHasOps?ob.ops:[];

    return el("div",{style:{
      border:`1px solid ${urgent?"#fca5a5":active?"#bbf7d0":sHasOps?"#e2e8f0":"#e8e8e8"}`,
      borderRadius:12,overflow:"hidden",marginBottom:8,
      boxShadow:urgent?"0 2px 8px rgba(220,38,38,.12)":active?"0 1px 6px rgba(22,163,74,.08)":"none",
    }},
      // Main row
      el("div",{
        onClick:()=>toggleExpand(s.id,expandedMap,setExpandedMap),
        style:{padding:"12px 16px",
          background:urgent?"#fff5f5":active?"#f0fdf4":"#fff",

// ─── CompactView ──────────────────────────────────────────────────────────────
function CompactView({styles,colorMode}){
  const containerRef=useRef();const boardRef=useRef();
  const [scale,setScale]=useState(1);const [genPDF,setGenPDF]=useState(false);

  // Date filter state
  let globalMin=null,globalMax=null;
  styles.forEach(s=>{
    if(s.startDate&&(!globalMin||s.startDate<globalMin))globalMin=s.startDate;
    if(s.endDate&&(!globalMax||s.endDate>globalMax))globalMax=s.endDate;
  });
  const [filterFrom,setFilterFrom]=useState(globalMin?ds(globalMin):"");
  const [filterTo,setFilterTo]=useState(globalMax?ds(globalMax):"");

  // Filter styles to only those overlapping the selected range
  const fromDate=filterFrom?new Date(filterFrom):null;
  const toDate=filterTo?new Date(filterTo):null;
  const filteredStyles=styles.filter(s=>{
    if(!s.startDate||!s.endDate)return false;
    if(fromDate&&s.endDate<fromDate)return false;
    if(toDate&&s.startDate>toDate)return false;
    return true;
  });

  // recalcScale: waits 2 frames so the board DOM is fully painted at natural size
  function recalcScale(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(!containerRef.current||!boardRef.current)return;
      const cw=containerRef.current.clientWidth;
      const bW=boardRef.current.scrollWidth;
      // Fit to the available WIDTH only — with many production lines, height is almost always
      // the smaller ratio, and forcing a fit to both dimensions shrinks the board far more than
      // necessary just to avoid a bit of vertical scrolling.
      if(bW>0)setScale(Math.min(cw/bW,1));
    }));
  }

  // Mount + resize
  useEffect(()=>{
    recalcScale();
    window.addEventListener("resize",recalcScale);
    return()=>window.removeEventListener("resize",recalcScale);
  },[]);

  // When filter changes: reset scale → board renders at natural width → measure → fit
  useEffect(()=>{
    setScale(1);
    recalcScale();
  },[filterFrom,filterTo]);

  async function handlePDF(){
    if(!boardRef.current||genPDF)return;setGenPDF(true);
    try{
      const clone=boardRef.current.cloneNode(true);
      clone.style.transform="none";clone.style.position="fixed";clone.style.top="-99999px";
      clone.style.left="0";clone.style.width="auto";clone.style.height="auto";clone.style.zIndex="-1";
      document.body.appendChild(clone);
      const canvas=await window.html2canvas(clone,{scale:1.5,useCORS:true,backgroundColor:"#ffffff",logging:false});
      document.body.removeChild(clone);
      const{jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
      const pW=pdf.internal.pageSize.getWidth(),pH=pdf.internal.pageSize.getHeight();
      const margin=6,imgW=canvas.width/3.78,imgH=canvas.height/3.78;
      const ratio=Math.min((pW-margin*2)/imgW,(pH-margin*2-10)/imgH);
      const fW=imgW*ratio,fH=imgH*ratio,mx=(pW-fW)/2;
      pdf.setFontSize(11);pdf.setTextColor(11,42,74);pdf.setFont(undefined,"bold");
      pdf.text("SGL Production Plan",margin,margin+4);
      pdf.setFont(undefined,"normal");pdf.setFontSize(8);pdf.setTextColor(100,116,139);
      const rangeLabel=(filterFrom||"start")+" → "+(filterTo||"end");
      pdf.text("Range: "+rangeLabel,margin,margin+9);
      pdf.text("Generated: "+new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),pW-margin,margin+4,{align:"right"});
      pdf.addImage(canvas.toDataURL("image/jpeg",.92),"JPEG",mx,margin+12,fW,fH);
      pdf.save("SGL_Production_Plan_"+new Date().toISOString().slice(0,10)+".pdf");
    }catch(e){alert("PDF failed: "+e.message);}finally{setGenPDF(false);}
  }

  if(!styles.length)return el(NoData,{});
  return el("div",{style:{display:"flex",flexDirection:"column",height:"calc(100vh - 160px)"}},
    // Controls bar
    el("div",{style:{background:"#f1f5f9",border:"0.5px solid #e2e8f0",borderRadius:8,padding:"10px 14px",
      marginBottom:12,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}},
      el("i",{className:"ti ti-maximize","aria-hidden":"true",style:{color:NAVY}}),
      el("p",{style:{fontSize:12,color:"#64748b",marginRight:4}},"Date Range:"),
      // From

  const [obRawBytes,setObRawBytes]=useState(null);// raw bytes of OB file for GitHub save
  const [uploadInfo,setUploadInfo]=useState(null);
  const [obInfo,setObInfo]=useState(null);
  const [colorMode,setColorMode]=useState("garment");
  // Which slice of the data to DISPLAY on the read-only Planning Board — purely a view filter.
  // The full `styles` array (all months) is always what's edited, saved, and exported; this only
  // narrows what's shown on screen. null = show everything.
  const [boardDateFilter,setBoardDateFilter]=useState(null); // {from:Date,to:Date,label:string}
  const [monthFilterOpen,setMonthFilterOpen]=useState(false);
  // Auto-detect which calendar months are actually present in the uploaded data, so the
  // dropdown can offer them directly (e.g. "September 2026") instead of a blank date picker.
  const boardMonthOptions=useMemo(()=>{
    const seen=new Map(); // "YYYY-M" -> {year,month,label}
    styles.forEach(s=>{
      if(!s.startDate||!s.endDate)return;
      let cur=new Date(s.startDate.getFullYear(),s.startDate.getMonth(),1);
      const end=new Date(s.endDate.getFullYear(),s.endDate.getMonth(),1);
      while(cur<=end){
        const key=cur.getFullYear()+"-"+cur.getMonth();
        if(!seen.has(key))seen.set(key,{year:cur.getFullYear(),month:cur.getMonth(),
          label:MONS[cur.getMonth()]+" "+cur.getFullYear()});
        cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
      }
    });
    return[...seen.values()].sort((a,b)=>a.year-b.year||a.month-b.month);
  },[styles]);
  // Which garment type (if any) is focused via clicking a legend chip — matching styles stay
  // full-color/sharp, everything else dims. Read-only Planning Board only, not the canvas.
  const [gmtFocus,setGmtFocus]=useState(null);
  const [canvasOpen,setCanvasOpen]=useState(false);
  const [ghStatus,setGhStatus]=useState(null);
  const [ghSaveMenu,setGhSaveMenu]=useState(false);
  const [exportMenu,setExportMenu]=useState(false);
  const [obGhLoading,setObGhLoading]=useState(false);
  const [obGhStatus,setObGhStatus]=useState(null);
  const [ghLoading,setGhLoading]=useState(false);
  const [ghLoadErr,setGhLoadErr]=useState(null);
  const [loadStatus,setLoadStatus]=useState("Connecting to GitHub...");
  const [loadError,setLoadError]=useState(null);
  const [lastUpdated,setLastUpdated]=useState(null);
  const [refreshing,setRefreshing]=useState(false);
  const [fileKey,setFileKey]=useState(0);
  const [frDragging,setFrDragging]=useState(false);
  const [obDragging,setObDragging]=useState(false);
  const [selectMode,setSelectMode]=useState(false);
  const [selectedId,setSelectedId]=useState(null);
  const [simMode,setSimMode]=useState(false);
  const [simFilters,setSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  // Always-on consecutive similarity
  const [alwaysSimFilters,setAlwaysSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [lineSimMode,setLineSimMode]=useState(false);
  const [lineSimFilters,setLineSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [lineSimThreshold,setLineSimThreshold]=useState(80);
  const [lineSimSelectedId,setLineSimSelectedId]=useState(null);
  const [simSubTab,setSimSubTab]=useState('consecutive');
  const [showSimGroupInfo,setShowSimGroupInfo]=useState(false);
  const [viewPanelOpen,setViewPanelOpen]=useState(false);
  const [boardZoom,setBoardZoom]=useState(1);
  // simGroups computed lazily — NOT on every styles change (O(n²) blocks UI on confirm)
  // simGroups — useMemo for instant recompute whenever styles/obMap change
  const simGroups=useMemo(()=>{
    if(!styles.length||!obMap||Object.keys(obMap).length===0)return{colorMap:{},groups:[]};

    check.forEach(s=>console.log("[SimGroups] 52056x style:",s.styleName,"id:",s.id,"color:",result.colorMap[s.id]||"grey(no group)","hasOps:",!!obMap[s.styleName]));
    return result;
  },[styles,obMap]);
  const [simShowPanel,setSimShowPanel]=useState(false);
  // Persistent state for StyleSimilaritiesTab — survives tab navigation
  const [simTabState,setSimTabState]=useState({
    selectedLine:"all",selectedStyleId:null,
    filters:{description:true,mcCode:false,gmtType:false},
    threshold:90,results:null,expandedMatch:{}
  });
  const frRef=useRef();const obRef=useRef();

  function loadFRFile(file){
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:false,raw:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const result=parseFRPlan(ws);
        const parsed=result.styles;
        const lines=[...new Set(parsed.map(s=>s.line))].sort((a,b)=>a-b);
        setStyles(parsed);
        setOriginalStyles(parsed.map(s=>({...s})));// snapshot for change detection
        setRawFRData(result);// store raw data for faithful save
        setFileKey(k=>k+1);
        setUploadInfo({file:file.name,count:parsed.length,lines:lines.length,linesList:lines});
        // Stay on upload page so user can also load OB data before proceeding
      }catch(err){setUploadInfo({error:err.message});}
    };
    reader.readAsArrayBuffer(file);
  }

  function loadOBFile(file){
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const bytes=new Uint8Array(ev.target.result);
        // Parse OB data
        const wb=XLSX.read(bytes,{type:"array",cellDates:false,raw:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const map=parseOB(ws);
        setObMap(map);
        // Store original bytes directly as base64 — no re-encoding
        // This preserves the file exactly as uploaded, works for both .xls and .xlsx
        setObRawBytes(bytesToBase64(bytes));
        setObInfo({file:file.name,count:Object.keys(map).length});
      }catch(err){setObInfo({error:err.message});}
    };
    reader.readAsArrayBuffer(file);
  }

  async function loadOBFromGitHub(){
    try{
      setObGhLoading(true);setObGhStatus('loading');
      // Step 1: Get file metadata to get the SHA (works even for large files)
      const metaRes=await fetch(GH_OB_URL,{headers:{Authorization:'Bearer '+GH_TOKEN,Accept:'application/vnd.github+json'}});
      if(!metaRes.ok){
        if(metaRes.status===404)throw new Error('No OB file in GitHub yet. Upload your OB file and use Save OB Data first.');
        throw new Error('GitHub error '+metaRes.status);
      }
      const meta=await metaRes.json();
      let bytes;
      // GitHub Contents API returns empty content for files >1MB
      // Must use Git Blobs API with the file's SHA for large files
      if(meta.content&&meta.content.replace(/[\n\r]/g,'').length>0){
        // Small file — content returned directly
        const b64=meta.content.replace(/[\n\r]/g,'');
        const bin=atob(b64);
        bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      }else{
        // Large file (>1MB) — use Git Blobs API
        const blobUrl='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/git/blobs/'+meta.sha;
        const blobRes=await fetch(blobUrl,{headers:{
          Authorization:'Bearer '+GH_TOKEN,
          Accept:'application/vnd.github+json'
        }});
        if(!blobRes.ok)throw new Error('Blob fetch failed: '+blobRes.status);
        const blobData=await blobRes.json();
        const b64=blobData.content.replace(/[\n\r]/g,'');
        const bin=atob(b64);
        bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      }
      // Parse OB data
      const wb=XLSX.read(bytes,{type:'array',cellDates:false,raw:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const map=parseOB(ws);
      setObMap(map);
      setObRawBytes(bytesToBase64(bytes));
      const obStyleCount=Object.keys(map).length;
      setObInfo({file:'OB_Data.xlsx (GitHub)',count:obStyleCount});
      setObGhStatus('loaded');
      setTimeout(()=>setObGhStatus(null),3000);
    }catch(e){
      console.error('OB GitHub error:',e);
      setObGhStatus('error:'+e.message);
      alert('OB Load Error: '+e.message);
      setTimeout(()=>setObGhStatus(null),8000);
    }finally{setObGhLoading(false);}
  }

  // Loads the latest FR Plan + OB data straight from GitHub. This is the same robust flow the
  // original standalone viewer used — chunked/non-blocking base64 decoding (so large files don't
  // freeze the tab), a proper loading screen, an error screen with retry, and periodic
  // auto-refresh so the viewer stays current without needing a manual reload.
  async function fetchFromGitHub(showLoading){
    if(showLoading)setLoadStatus("Fetching FR Plan from GitHub...");
    else setRefreshing(true);
    try{
      const frRes=await fetch(GH_FR_URL,{
        headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"},
        cache:"no-cache"
      });
      if(!frRes.ok)throw new Error("FR Plan fetch failed (HTTP "+frRes.status+"). Token may have expired.");
      const frData=await frRes.json();
      const frB64=frData.content.replace(/[\n\r]/g,"");
      await new Promise(r=>setTimeout(r,0));
      const frBin=atob(frB64);
      await new Promise(r=>setTimeout(r,0));
      const frBytes=new Uint8Array(frBin.length);
      for(let i=0;i<frBin.length;i+=50000){
        const end=Math.min(i+50000,frBin.length);
        for(let j=i;j<end;j++)frBytes[j]=frBin.charCodeAt(j);
        if(i+50000<frBin.length)await new Promise(r=>setTimeout(r,0));
      }
      await new Promise(r=>setTimeout(r,0));
      const frWb=XLSX.read(frBytes,{type:"array",cellDates:false,raw:true});
      await new Promise(r=>setTimeout(r,0));
      const frWs=frWb.Sheets[frWb.SheetNames[0]];
      const result=parseFRPlan(frWs);
      await new Promise(r=>setTimeout(r,0));

      if(showLoading)setLoadStatus("Fetching OB Data from GitHub...");
      const isMobileDevice=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      let obMapResult={};
      if(isMobileDevice){
        console.log("Mobile device — skipping OB data fetch to save memory");
      } else
      try{
        const obMetaRes=await fetch(GH_OB_URL,{
          headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"},
          cache:"no-cache"
        });
        if(obMetaRes.ok){
          const obMeta=await obMetaRes.json();
          let obBytes;
          if(obMeta.content&&obMeta.content.replace(/[\n\r]/g,"").length>100){
            const b64=obMeta.content.replace(/[\n\r]/g,"");
            await new Promise(r=>setTimeout(r,0));
            const bin=atob(b64);obBytes=new Uint8Array(bin.length);
            for(let i=0;i<bin.length;i+=50000){
              const end=Math.min(i+50000,bin.length);
              for(let j=i;j<end;j++)obBytes[j]=bin.charCodeAt(j);
              if(i+50000<bin.length)await new Promise(r=>setTimeout(r,0));
            }
          }else if(obMeta.git_url){
            const blobRes=await fetch(obMeta.git_url,{
              headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}
            });
            if(blobRes.ok){
              const blobData=await blobRes.json();
              const b64=blobData.content.replace(/[\n\r]/g,"");
              await new Promise(r=>setTimeout(r,0));
              const bin=atob(b64);obBytes=new Uint8Array(bin.length);
              for(let i=0;i<bin.length;i+=50000){
                const end=Math.min(i+50000,bin.length);
                for(let j=i;j<end;j++)obBytes[j]=bin.charCodeAt(j);
                if(i+50000<bin.length)await new Promise(r=>setTimeout(r,0));
              }
            }
          }
          if(obBytes){
            await new Promise(r=>setTimeout(r,0));
            const obWb=XLSX.read(obBytes,{type:"array"});
            const obWs=obWb.Sheets[obWb.SheetNames[0]];
            obMapResult=parseOB(obWs);
          }
        }
      }catch(obErr){
        console.warn("OB data fetch failed (non-fatal):",obErr.message);
      }

      if(showLoading)setLoadStatus("Rendering planning board...");
      await new Promise(r=>setTimeout(r,0));
      setStyles(result.styles);
      setRawFRData(result);
      await new Promise(r=>setTimeout(r,0));
      setObMap(obMapResult);
      setLastUpdated(new Date());
      setLoadError(null);
      setRefreshing(false);
      if(showLoading)setPage("board");
    }catch(err){
      console.error("GitHub fetch error:",err);
      setLoadError(err.message);
      setRefreshing(false);
      if(styles.length===0)setPage("error");
      else if(showLoading)setPage("board");// show stale data rather than blocking the viewer
    }
  }
  useEffect(()=>{fetchFromGitHub(true);},[]);
  useEffect(()=>{
    const t=setInterval(()=>fetchFromGitHub(false),REFRESH_INTERVAL);
    return()=>clearInterval(t);
  },[]);

  function handleConfirm(newStyles){
    setStyles(newStyles);
    setCanvasOpen(false);
    setPage("board");// always return to planning board after confirm
  }

  function exportChanges(){
    if(!originalStyles.length){alert("No original plan loaded to compare against.");return;}
    const ds=d=>d?fmtDate(d):"—";
    const tm=d=>d?fmtTimeOfDay(d):"—";
    const origMap={};
    originalStyles.forEach(s=>{origMap[s.id]=s;});
    const changes=[];
    styles.forEach(s=>{
      const o=origMap[s.id];
      if(!o)return;
      const lineChanged=s.line!==o.line;
      // Compare full timestamps (date + time), not just the date — a time-only change
      // (e.g. dragged 30 minutes later, same day) should still count as a real change.
      const startChanged=s.startDate?.getTime()!==o.startDate?.getTime();
      const endChanged=s.endDate?.getTime()!==o.endDate?.getTime();
      if(!lineChanged&&!startChanged&&!endChanged)return;
      const types=[];
      if(lineChanged)types.push("Line Changed");
      if(startChanged||endChanged)types.push("Time Changed");
      changes.push([
        s.styleName,s.gmtType||"",
        "L-"+o.line,"L-"+s.line,
        ds(o.startDate),tm(o.startDate),ds(s.startDate),tm(s.startDate),
        ds(o.endDate),tm(o.endDate),ds(s.endDate),tm(s.endDate),
        ds(s.delDate),ds(s.tgtCutDate),
        types.join(" & ")
      ]);
    });
    if(!changes.length){alert("No changes detected from the original plan.");return;}
    const wb=XLSX.utils.book_new();
    const hdr=["Style Name","GMT Type","Original Line","New Line",
      "Original Start Date","Original Start Time","New Start Date","New Start Time",
      "Original End Date","Original End Time","New End Date","New End Time",
      "Delivery Date","Target Cut Date","Change Type"];
    const ws=XLSX.utils.aoa_to_sheet([hdr,...changes]);
    ws["!cols"]=[{wch:28},{wch:18},{wch:14},{wch:12},{wch:16},{wch:14},{wch:16},{wch:14},
      {wch:16},{wch:14},{wch:16},{wch:14},{wch:14},{wch:14},{wch:22}];
    XLSX.utils.book_append_sheet(wb,ws,"Changes");
    XLSX.writeFile(wb,"SGL_Plan_Changes_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  function handleExport(what="fr"){
    const stamp=new Date().toISOString().slice(0,10);
    if(what==="ob"&&obRawBytes){
      // obRawBytes is base64 — decode and download
      const bin=atob(obRawBytes);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download="SGL_OB_Data_"+stamp+".xlsx";a.click();URL.revokeObjectURL(a.href);
      return;
    }
    // Export FR Plan — faithful format if raw data available
    if(rawFRData){
      const b64=buildFRPlanBase64(styles,rawFRData);
      const bin=atob(b64);const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download="SGL_FR_Plan_"+stamp+".xlsx";a.click();URL.revokeObjectURL(a.href);
      return;
    }
    // Fallback simple format
    const rows=[...styles].sort((a,b)=>a.line-b.line||(a.startDate-b.startDate)).map(s=>({
      "Style Name":s.styleName,"Style No":s.styleNo||s.styleName,"GMT Type":s.gmtType,
      "Line":s.line,"Start Date":ds(s.startDate),"End Date":ds(s.endDate),
      "Del Date":ds(s.delDate),"PLN QTY":s.plnQty,"Ord Qty":s.ordQty,
      "Daily Qty":s.dailyQty,"Prod Days":s.prodDays,"EFF%":s.eff,"TGT":s.tgt,
      "TGT CUT":ds(s.tgtCutDate),"Merchant":s.merchant,
    }));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Production_Data");
    XLSX.writeFile(wb,"SGL_FR_Plan_"+stamp+".xlsx");
  }

        lineSimMode&&el("span",{style:{fontSize:11,color:"rgba(255,255,255,.4)",fontStyle:"italic"}},
          lineSimSelectedId?"Click another block to compare":"← Click any block on the board to select it"),
        el("div",{style:{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}},
          lineSimMode&&lineSimSelectedId&&el("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            [["#4ade80","≥80%"],["#60a5fa","≥60%"],["#fbbf24","≥40%"],["#f87171","<40%"]].map(([c,l])=>
              el("div",{key:l,style:{display:"flex",alignItems:"center",gap:3}},
                el("div",{style:{width:8,height:8,borderRadius:"50%",background:c}}),
                el("span",{style:{fontSize:10,color:"rgba(255,255,255,.5)"}},l)))
          ),
          el("span",{style:{fontSize:10,color:"rgba(255,255,255,.35)",fontFamily:"'DM Mono',monospace"}},
            obMap&&Object.keys(obMap).length>0?"OB: "+Object.keys(obMap).length+" styles":"⚠ No OB file")
        )
      )
    ),


      // LANDING PAGE
      page==="landing"&&el("div",{style:{
        position:"fixed",inset:0,
        background:"linear-gradient(160deg,#0B2A4A 0%,#0f3460 50%,#0B2A4A 100%)",
        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        zIndex:999,overflow:"hidden",fontFamily:"'DM Sans',system-ui,sans-serif"}},

        // Decorative bg circles
        el("div",{style:{position:"absolute",width:700,height:700,borderRadius:"50%",
          background:"rgba(255,255,255,.025)",top:-250,right:-250,pointerEvents:"none"}}),
        el("div",{style:{position:"absolute",width:500,height:500,borderRadius:"50%",
          background:"rgba(255,255,255,.02)",bottom:-200,left:-200,pointerEvents:"none"}}),
        el("div",{style:{position:"absolute",width:300,height:300,borderRadius:"50%",
          background:"rgba(224,123,57,.07)",top:"25%",left:"8%",pointerEvents:"none"}}),

        // Main content — NO animation so content is always immediately visible
        el("div",{style:{
          position:"relative",zIndex:1,
          display:"flex",flexDirection:"column",alignItems:"center",
          gap:20,maxWidth:540,width:"90%",textAlign:"center"}},

          // Star logo — text fallback shown by default, img shown if loads
          el("div",{style:{marginBottom:4}},
            el("img",{
              src:"https://www.star.lk/wp-content/uploads/2024/12/star-logo.svg",
              alt:"Star Garments - Katunayaka",height:48,
              style:{filter:"brightness(0) invert(1)",display:"block"},
              onError:e=>{e.target.style.display="none";}
            }),
          ),

          // Orange divider
          el("div",{style:{width:56,height:3,borderRadius:3,
            background:"linear-gradient(90deg,transparent,#E07B39,transparent)"}}),

          // Title
          el("div",{style:{margin:0}},
            el("div",{style:{fontSize:13,fontWeight:600,color:"rgba(255,255,255,.45)",
              letterSpacing:4,textTransform:"uppercase",marginBottom:10}},"Star Garments - Katunayaka"),
            el("div",{style:{fontSize:40,fontWeight:800,color:"#ffffff",lineHeight:1.15,letterSpacing:-1}},
              "Production"),
            el("div",{style:{fontSize:40,fontWeight:800,
              background:"linear-gradient(90deg,#E07B39,#f59e0b)",
              WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
              lineHeight:1.15,letterSpacing:-1}},
              "Planning Board")
          ),

          // Subtitle
          el("p",{style:{fontSize:14,color:"rgba(255,255,255,.55)",lineHeight:1.75,
            maxWidth:400,margin:0}},
            "Visualize, edit and analyse production style schedules across all factory lines."
          ),

          // Enter button
          el("button",{
            onClick:()=>{
              setIsEntering(true);
              setTimeout(()=>{setIsEntering(false);setPage("board");},2000);
            },
            style:{
              marginTop:6,padding:"14px 44px",
              background:"linear-gradient(135deg,#E07B39,#c96b28)",
              color:"#fff",border:"none",borderRadius:50,
              fontSize:15,fontWeight:700,cursor:"pointer",
              display:"flex",alignItems:"center",gap:10,
              boxShadow:"0 8px 30px rgba(224,123,57,.45)",
              letterSpacing:0.5}},
            "Enter System",
            el("i",{className:"ti ti-arrow-right","aria-hidden":"true",style:{fontSize:17}})
          ),

          // Loading overlay — shown after clicking Enter System
          isEntering&&el("div",{style:{
            position:"fixed",inset:0,
            background:"linear-gradient(160deg,#0B2A4A 0%,#0f3460 50%,#0B2A4A 100%)",
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            zIndex:1000,gap:28}},
            el("div",{style:{position:"relative",width:80,height:80}},
              el("div",{style:{position:"absolute",inset:0,borderRadius:"50%",border:"3px solid rgba(255,255,255,.1)"}}),
              el("div",{style:{position:"absolute",inset:0,borderRadius:"50%",border:"3px solid transparent",
                borderTopColor:"#E07B39",borderRightColor:"rgba(224,123,57,.4)",
                animation:"spin 1s linear infinite"}}),
              el("div",{style:{position:"absolute",inset:8,borderRadius:"50%",border:"2px solid transparent",
                borderTopColor:"rgba(255,255,255,.6)",animation:"spin .7s linear infinite reverse"}}),
              el("div",{style:{position:"absolute",top:"50%",left:"50%",
                transform:"translate(-50%,-50%)",width:10,height:10,borderRadius:"50%",
                background:"#E07B39",boxShadow:"0 0 12px rgba(224,123,57,.8)"}})
            ),
            el("div",{style:{textAlign:"center"}},
              el("div",{style:{fontSize:16,fontWeight:700,color:"#fff",marginBottom:6,letterSpacing:.5}},
                "Initializing System"),
              el("div",{style:{fontSize:12,color:"rgba(255,255,255,.45)",fontFamily:"'DM Mono',monospace"}},
                "Preparing your workspace...")
            ),
            el("div",{style:{width:200,height:3,background:"rgba(255,255,255,.1)",borderRadius:10,overflow:"hidden"}},
              el("div",{style:{height:"100%",borderRadius:10,
                background:"linear-gradient(90deg,#E07B39,#f59e0b)",
                animation:"progress 2s linear forwards"}})
            )
          ),

          // Powered by card
          el("div",{style:{
            display:"flex",flexDirection:"column",alignItems:"center",gap:10,
            padding:"14px 32px",marginTop:8,
            background:"rgba(255,255,255,.04)",
            border:"1px solid rgba(255,255,255,.1)",
            borderRadius:14,backdropFilter:"blur(8px)"}},
            el("span",{style:{fontSize:10,color:"rgba(255,255,255,.3)",
              textTransform:"uppercase",letterSpacing:3,fontWeight:700}},"Powered by"),
            el("div",{style:{display:"flex",alignItems:"center",gap:10}},
              el("img",{
                src:"https://www.end2end.lk/images/logo-2.png",
                alt:"End2End Solutions",height:30,
                style:{filter:"none",opacity:1,background:"rgba(255,255,255,.9)",borderRadius:6,padding:"3px 8px"},
                onError:e=>{e.target.style.display="none";
                  e.target.parentNode.querySelector("span").style.display="block";}
              }),
              el("span",{style:{display:"none",color:"rgba(255,255,255,.8)",
                fontSize:15,fontWeight:700,letterSpacing:.3}},"End2End Solutions")
            )
          ),

          el("span",{style:{fontSize:11,color:"rgba(255,255,255,.18)",
            fontFamily:"monospace",marginTop:2}},"v2.0 · 2026")
        )
      ),

    // Page content — hidden on landing (landing renders as fixed overlay)
    page!=="landing"&&el("div",{style:{
      padding:isBoardPage?0:22,
      flex:isBoardPage?"1 1 0":undefined,
      overflow:isBoardPage?"hidden":"visible",
      display:isBoardPage?"flex":undefined,
      flexDirection:isBoardPage?"column":undefined,
    }},

            // UPLOAD PAGE
      page==="upload"&&el("div",{style:{display:"flex",flexDirection:"column",gap:16}},

        // FR Plan upload
        el(Card,{},
          el("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:6}},
            el("div",{style:{width:32,height:32,borderRadius:8,background:NAVY,display:"flex",alignItems:"center",justifyContent:"center"}},
              el("i",{className:"ti ti-file-spreadsheet","aria-hidden":"true",style:{color:"#fff",fontSize:16}})),
            el("div",{},
              el("p",{style:{fontWeight:700,fontSize:14,color:"#0f172a",margin:0}},"SGL FR Plan"),
              el("p",{style:{fontSize:12,color:"#64748b",margin:0}},"Main planning file — drives the board")
            )
          ),
          el("button",{onClick:loadFromGitHub,disabled:ghLoading,
            style:{width:"100%",padding:"12px",marginBottom:10,borderRadius:9,border:"2px solid "+ORANGE,
              background:ghLoading?"#fff7ed":"#fff4ec",cursor:ghLoading?"not-allowed":"pointer",
              display:"flex",alignItems:"center",justifyContent:"center",gap:10,fontSize:13,fontWeight:700,color:ORANGE}},
            el("i",{className:"ti "+(ghLoading?"ti-loader ti-spin":"ti-brand-github"),"aria-hidden":"true",style:{fontSize:18}}),
            ghLoading?"Loading from GitHub...":"Load Latest Plan from GitHub"
          ),
          ghLoadErr&&el("div",{style:{background:"#fef2f2",border:"0.5px solid #fca5a5",borderRadius:7,
            padding:"9px 12px",marginBottom:10,fontSize:12,color:"#dc2626",display:"flex",alignItems:"center",gap:8}},
            el("i",{className:"ti ti-alert-circle","aria-hidden":"true"}),ghLoadErr
          ),
          el("p",{style:{textAlign:"center",fontSize:12,color:"#64748b",marginBottom:10}},"— or upload manually —"),
          el("div",{
            onDragOver:e=>{e.preventDefault();setFrDragging(true);},
            onDragLeave:()=>setFrDragging(false),
            onDrop:e=>{e.preventDefault();setFrDragging(false);const f=e.dataTransfer.files[0];if(f)loadFRFile(f);},
            onClick:()=>frRef.current.click(),
            style:{border:`2px dashed ${frDragging?ORANGE:"#cbd5e1"}`,borderRadius:10,padding:"36px 24px",
              textAlign:"center",cursor:"pointer",background:frDragging?"rgba(224,123,57,.04)":"#f8fafc",transition:"all .15s"}},
            el("i",{className:"ti ti-table-import","aria-hidden":"true",style:{fontSize:38,color:frDragging?ORANGE:"#94a3b8",display:"block",marginBottom:10}}),
            el("p",{style:{margin:"0 0 4px",fontWeight:600,fontSize:14,color:"#334155"}},"Drop SGL_FR_Plan.xlsx here"),
            el("p",{style:{margin:0,fontSize:12,color:"#64748b"}},"or click to browse"),
            el("input",{ref:frRef,type:"file",accept:".xlsx",style:{display:"none"},onChange:e=>e.target.files[0]&&loadFRFile(e.target.files[0])})
          ),
          uploadInfo&&(uploadInfo.error
            ?el("div",{style:{marginTop:12,background:"#fef2f2",border:"0.5px solid #fca5a5",borderRadius:8,padding:12,color:"#dc2626",fontSize:12}},
                el("i",{className:"ti ti-alert-circle","aria-hidden":"true",style:{marginRight:6}}),"Error: ",uploadInfo.error)
            :el("div",{style:{marginTop:12,background:"#f0fdf4",border:"0.5px solid #bbf7d0",borderRadius:8,padding:12,display:"flex",alignItems:"center",gap:10}},
                el("i",{className:"ti ti-circle-check","aria-hidden":"true",style:{fontSize:20,color:"#16a34a"}}),
                el("div",{},
                  el("p",{style:{margin:0,fontWeight:600,fontSize:13,color:"#0f172a"}},"Loaded: "+uploadInfo.file),
                  el("p",{style:{margin:0,fontSize:12,color:"#15803d"}},uploadInfo.count+" styles • "+uploadInfo.lines+" lines ("+uploadInfo.linesList.join(", ")+")")
                )
              )
          )
        ),

        // OB upload
        el(Card,{},
          el("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
            el("div",{style:{width:32,height:32,borderRadius:8,background:"#374151",display:"flex",alignItems:"center",justifyContent:"center"}},
              el("i",{className:"ti ti-clipboard-list","aria-hidden":"true",style:{color:"#fff",fontSize:16}})),
            el("div",{flex:1},
              el("p",{style:{fontWeight:700,fontSize:14,color:"#0f172a",margin:0}},"Operation Breakdown (OB)"),
              el("p",{style:{fontSize:12,color:"#64748b",margin:0}},"Optional — maps operations to styles for Style Manager")
            )
          ),
          el('button',{onClick:loadOBFromGitHub,disabled:obGhLoading,
            style:{width:'100%',padding:'10px',marginBottom:10,borderRadius:9,
              border:`2px solid ${obGhStatus==='loaded'?'#16a34a':obGhStatus&&obGhStatus.startsWith('error')?'#dc2626':'#374151'}`,
              background:obGhLoading?'#f9f9f9':obGhStatus==='loaded'?'#f0fdf4':obGhStatus&&obGhStatus.startsWith('error')?'#fef2f2':'#f8fafc',
              cursor:obGhLoading?'not-allowed':'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontSize:12,fontWeight:700,
              color:obGhStatus==='loaded'?'#16a34a':obGhStatus&&obGhStatus.startsWith('error')?'#dc2626':'#374151'}},
            el('i',{className:'ti '+(obGhLoading?'ti-loader ti-spin':obGhStatus==='loaded'?'ti-circle-check':obGhStatus&&obGhStatus.startsWith('error')?'ti-alert-circle':'ti-brand-github'),'aria-hidden':'true',style:{fontSize:16}}),
            obGhLoading?'Loading OB from GitHub...':obGhStatus==='loaded'?'OB Data Loaded ✓':obGhStatus&&obGhStatus.startsWith('error')?'Error — check alert':'Load Latest OB Data from GitHub'
          ),
          el("p",{style:{textAlign:"center",fontSize:12,color:"#94a3b8",marginBottom:10}},"— or upload manually —"),
          el("div",{
            onDragOver:e=>{e.preventDefault();setObDragging(true);},
            onDragLeave:()=>setObDragging(false),
            onDrop:e=>{e.preventDefault();setObDragging(false);const f=e.dataTransfer.files[0];if(f)loadOBFile(f);},
            onClick:()=>obRef.current.click(),
            style:{border:`2px dashed ${obDragging?"#374151":"#cbd5e1"}`,borderRadius:10,padding:"28px 24px",
              textAlign:"center",cursor:"pointer",background:obDragging?"rgba(55,65,81,.04)":"#f8fafc",transition:"all .15s"}},
            el("i",{className:"ti ti-clipboard-list","aria-hidden":"true",style:{fontSize:34,color:obDragging?"#374151":"#94a3b8",display:"block",marginBottom:8}}),
            el("p",{style:{margin:"0 0 4px",fontWeight:600,fontSize:13,color:"#334155"}},"Drop OB file here (.xlsx or .xls)"),
            el("p",{style:{margin:0,fontSize:12,color:"#64748b"}},"or click to browse"),
            el("input",{ref:obRef,type:"file",accept:".xlsx,.xls",style:{display:"none"},onChange:e=>e.target.files[0]&&loadOBFile(e.target.files[0])})
          ),
          obInfo&&(obInfo.error
            ?el("div",{style:{marginTop:12,background:"#fef2f2",border:"0.5px solid #fca5a5",borderRadius:8,padding:12,color:"#dc2626",fontSize:12}},
                el("i",{className:"ti ti-alert-circle","aria-hidden":"true",style:{marginRight:6}}),"Error: ",obInfo.error)
            :el("div",{style:{marginTop:12,background:"#f0fdf4",border:"0.5px solid #bbf7d0",borderRadius:8,padding:12,display:"flex",alignItems:"center",gap:10}},
                el("i",{className:"ti ti-circle-check","aria-hidden":"true",style:{fontSize:20,color:"#16a34a"}}),
                el("p",{style:{margin:0,fontWeight:600,fontSize:13,color:"#0f172a"}},"Loaded: "+obInfo.file+" ("+obInfo.count+" styles)")
              )
          )
        ),

        uploadInfo&&!uploadInfo.error&&el("div",{style:{display:"flex",gap:10}},
          el(Btn,{onClick:()=>setPage("board"),style:{background:ORANGE,color:"#fff",fontWeight:700,padding:"10px 22px"}},
            el("i",{className:"ti ti-layout-kanban","aria-hidden":"true",style:{marginRight:6}}),"View Planning Board"),
          el(Btn,{onClick:()=>setPage("styles"),style:{background:NAVY,color:"#fff",fontWeight:600,padding:"10px 22px"}},
            el("i",{className:"ti ti-shirt","aria-hidden":"true",style:{marginRight:6}}),"Style Manager")
        )
      ),

      // STYLE MANAGER PAGE
      page==="styles"&&el(StyleManagerPage,{styles,obMap,onExport:null}),

      // PLANNING BOARD — displays either the full dataset or a filtered slice (boardDateFilter),
      // but `styles` itself is never touched by this (there's nothing to edit in this viewer).
      page==="board"&&(styles.length===0?el(NoData,{}):
        el(ErrorBoundary,{key:"pb-"+fileKey},
          el(PlanningBoardView,{
            styles:boardDateFilter
              ?styles.filter(s=>s.startDate&&s.endDate&&s.endDate>=boardDateFilter.from&&s.startDate<=boardDateFilter.to)
              :styles,
            dateRangeOverride:boardDateFilter?{start:boardDateFilter.from,end:boardDateFilter.to}:null,
            colorMode,onEdit:null,
            selectMode,selectedId,onSelectStyle:id=>{setSelectedId(p=>p===id?null:id);},key:fileKey,
            simMode,simFilters,obMap,highlightId:null,
            lineSimMode,lineSimFilters,lineSimThreshold,
            lineSimSelectedId,onLineSimSelect:id=>setLineSimSelectedId(p=>p===id?null:id),
            alwaysSimFilters,simGroups,boardZoom,setBoardZoom,gmtFocus})
        )
      ),

      showSimGroupInfo&&el("div",{onClick:()=>setShowSimGroupInfo(false),
        style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:999,
          display:"flex",alignItems:"center",justifyContent:"center",padding:24}},
        el("div",{onClick:e=>e.stopPropagation(),style:{
          background:"#fff",borderRadius:14,padding:24,maxWidth:640,width:"100%",
          maxHeight:"80vh",display:"flex",flexDirection:"column",gap:14,
          boxShadow:"0 20px 60px rgba(0,0,0,.3)"}},
          el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},
            el("h2",{style:{margin:0,fontSize:18,fontWeight:700,color:"#0f172a"}},"Similarity Groups"),
            el("button",{onClick:()=>setShowSimGroupInfo(false),
              style:{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#94a3b8"}},"×")
          ),
          el("p",{style:{margin:"0 0 8px",fontSize:12,color:"#64748b"}},"Grouped by ≥90% op name similarity. Same color = similar work."),
          el("div",{style:{overflowY:"auto",flex:1,display:"flex",flexDirection:"column",gap:8}},
            simGroups&&simGroups.groups.length===0
              ?el("p",{style:{color:"#94a3b8",textAlign:"center",padding:20}},"No groups found. Load OB data first.")
              :(simGroups?simGroups.groups:[]).map((g,gi)=>{
                const gs=styles.filter(s=>g.styleIds.includes(s.id)||g.styleIds.includes(s.styleNo));
                return el("div",{key:gi,style:{border:"1.5px solid "+g.color+"50",borderRadius:10,overflow:"hidden"}},
                  el("div",{style:{background:g.color,padding:"8px 14px",display:"flex",alignItems:"center",gap:8}},
                    el("span",{style:{fontWeight:700,fontSize:13,color:"#fff"}},"Group "+(gi+1)),
                    el("span",{style:{fontSize:11,color:"rgba(255,255,255,.75)"}},"— "+g.styleIds.length+" styles")
                  ),
                  el("div",{style:{padding:"8px 14px",display:"flex",flexDirection:"column",gap:4}},
                    gs.map(s=>el("div",{key:s.id,style:{display:"flex",alignItems:"center",gap:10,fontSize:12}},
                      el("span",{style:{fontWeight:600,color:"#0f172a",minWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},s.styleName),
                      el("span",{style:{color:"#94a3b8",fontSize:11}},"Line "+s.line),
                      el("span",{style:{color:"#64748b",fontSize:11}},s.gmtType)
                    ))
                  )
                );
              })
          )
        )
      ),
      page==="dashboard"&&el(DashboardPage,{styles,boardDateFilter,key:fileKey})
    )
  );
}

ReactDOM.render(el(ErrorBoundary,{},el(App,{})),document.getElementById("root"));
</script>
</body>
</html>
