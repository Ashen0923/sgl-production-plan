// ─── Date helpers ────────────────────────────────────────────────────────────
function excelSerialToDate(serial){
  if(!serial&&serial!==0)return null;
  if(serial instanceof Date){const d=new Date(serial);d.setHours(0,0,0,0);return d;}
  if(typeof serial==="string"){
    const n=parseFloat(serial);
    if(!isNaN(n)&&n>40000)serial=n;
    else{const d=new Date(serial);d.setHours(0,0,0,0);return isNaN(d)?null:d;}
  }
  if(typeof serial==="number"&&serial>40000){
    // Convert Excel serial to local midnight date (avoid UTC offset issues)
    const utcMs=Math.round((serial-25569)*86400*1000);
    const utcDate=new Date(utcMs);
    // Use local date parts to create a local midnight date
    const d=new Date(utcDate.getUTCFullYear(),utcDate.getUTCMonth(),utcDate.getUTCDate());
    d.setHours(0,0,0,0);return d;
  }
  return null;
}
function ds(d){if(!d)return"";return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
// Parse a date string "YYYY-MM-DD" as LOCAL midnight to avoid UTC timezone offset bugs
function localDate(str){
  if(!str)return null;
  const[y,m,d]=str.split("-").map(Number);
  const dt=new Date(y,m-1,d);dt.setHours(0,0,0,0);return dt;
}
function fmtDate(d){if(!d)return"—";return d.getDate()+" "+MONS[d.getMonth()]+" "+d.getFullYear();}
function fmtDateShort(d){if(!d)return"—";return d.getDate()+" "+MONS[d.getMonth()];}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function diffDays(a,b){return Math.round((b-a)/(86400*1000));}
// Add N working days (Mon-Sat) to a date
function addWorkingDays(startDate,n){
  let cur=new Date(startDate);cur.setHours(0,0,0,0);
  let added=0;
  while(added<n){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)added++;// skip Sunday
  }
  return cur;
}
// Get the date that is exactly N working days after startDate (inclusive of start = day 1)
function workingDayEnd(startDate,prodDays){
  // Start date is day 1. We need to go prodDays-1 more working days forward.
  let cur=new Date(startDate);cur.setHours(0,0,0,0);
  let count=1;
  while(count<prodDays){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)count++;
  }
  return cur;
}
// Get next working day after a date
function nextWorkingDay(d){
  let cur=new Date(d);cur.setHours(0,0,0,0);
  do{cur.setDate(cur.getDate()+1);}while(cur.getDay()===0);
  return cur;
}
// Split merged block sub-styles proportionally from a new start date on a new line
function splitMergedProportional(subStyles,newStart,newLine){
  let cursor=new Date(newStart);cursor.setHours(0,0,0,0);
  // Skip if cursor is Sunday
  while(cursor.getDay()===0)cursor.setDate(cursor.getDate()+1);
  return subStyles.map((sub,i)=>{
    const days=Math.max(1,sub.prodDays||1);
    const subStart=new Date(cursor);
    const subEnd=workingDayEnd(subStart,days);
    const updated={...sub,
      line:newLine,
      startDate:new Date(subStart),
      endDate:new Date(subEnd),
      dailyQty:r2((sub.plnQty||0)/days),
    };
    // Move cursor to next working day after subEnd
    cursor=nextWorkingDay(subEnd);
    return updated;
  });
}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function r2(n){return Math.round(n*100)/100;}
function roundPrdDys(sum){const fl=Math.floor(sum);return(sum-fl)>=0.5?fl+1:fl;}

// ─── Parse SGL_FR_Plan.xlsx ──────────────────────────────────────────────────
function parseFRPlan(sheet){
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
  if(!rows.length)throw new Error("Empty FR Plan sheet");
  const hdr=rows[0].map(h=>String(h||"").trim());
  const col=n=>{const i=hdr.indexOf(n);return i;};
  const C={
    facLine:col("Fac/Line"),acc:col("ACC"),styleNo:col("STYLE-NO"),
    styleOpt:col("Style# Optional"),gmtType:col("GMT TYPE"),
    ordQty:col("Ord Qty"),prdDys:col("PRD DYS"),plnQty:col("PLN QTY"),
    eff:col("Eff %"),tgt:col("TGT"),tgtCut:col("TGT CUT"),
    st:col("ST"),fi:col("FI"),delDate:col("Del Date"),merchant:col("Merchant"),
    mergeGroup:col("SGL_MergeGroup")// optional merge tag column
  };

  // Group consecutive rows by STYLE-NO
  const groups=[];
  let cur=null;
  let lastKeyByLine={};
  for(let i=1;i<rows.length;i++){
    const row=rows[i];
    const styleNo=String(row[C.styleNo]||"").trim();
    if(!styleNo||styleNo==="-")continue;
    const facLine=String(row[C.facLine]||"").trim();
    if(!facLine)continue;
    const key=facLine+"||"+styleNo;
    const acc=String(row[C.acc]||"").trim();
    const styleOpt=String(row[C.styleOpt]||"").trim();
    const isSummaryRow=!acc&&!styleOpt;
    // Use per-line lastKey tracking — global lastKey fails when lines interleave
    const lineLastKey=lastKeyByLine[facLine]||null;
    const isGap=!isSummaryRow&&cur&&cur.key===key&&lineLastKey!==null&&lineLastKey!==key;
    if(!cur||cur.key!==key||isGap){
      if(cur)groups.push(cur);
      const mg=C.mergeGroup>=0?String(row[C.mergeGroup]||"").trim():"";
      cur={key,facLine,styleNo,rows:[],summaryRow:null,mergeGroup:mg||null};
    }
    if(!isSummaryRow)lastKeyByLine[facLine]=key;
    if(isSummaryRow){cur.summaryRow=row;}else{cur.rows.push(row);}
  }
  if(cur)groups.push(cur);

  const styleColorMap={};let colorIdx=0;

  const styles=groups.map(g=>{
    const isSingleEntry=g.rows.length===0;
    const summaryRow=g.summaryRow||(isSingleEntry?g.rows[0]||null:null);
    const detailRows=isSingleEntry?[]:g.rows;

    // If no summary row but has detail rows, use last detail row as summary
    const sRow=summaryRow||(detailRows.length?detailRows[detailRows.length-1]:null);
    if(!sRow)return null;

    // Line number from Fac/Line
    const facLine=g.facLine;
    const lineNum=parseInt(facLine.replace(/\D/g,""))||1;

    // Style name from first detail row's Style# Optional, or single row
    const firstRow=isSingleEntry?(g.rows[0]||sRow):detailRows[0];
    const styleOptName=firstRow?String(firstRow[C.styleOpt]||"").trim():"";
    const styleDisplayName=styleOptName||g.styleNo;

    // PRD DYS: sum detail rows (or single row's value)
    let prdDysSum=0;
    if(isSingleEntry){
      prdDysSum=parseFloat(sRow[C.prdDys])||0;
    }else{
      detailRows.forEach(r=>{prdDysSum+=parseFloat(r[C.prdDys])||0;});
    }
    const prodDays=Math.max(1,roundPrdDys(prdDysSum));

    // From summary row (dates, quantities)
    const plnQty=parseFloat(sRow[C.plnQty])||0;
    const ordQty=parseFloat(sRow[C.ordQty])||0;
    const eff=parseFloat(sRow[C.eff])||0;
    const tgt=parseFloat(sRow[C.tgt])||0;
    // GMT TYPE: summary row has it blank — read from first detail row (or single row)
    const gmtSourceRow=firstRow||sRow;
    const gmtType=String(gmtSourceRow[C.gmtType]||sRow[C.gmtType]||"").trim();
    const merchant=String(sRow[C.merchant]||"").trim();

    const startDate=excelSerialToDate(sRow[C.st]);
    const endDate=excelSerialToDate(sRow[C.fi]);
    const delDate=excelSerialToDate(sRow[C.delDate]);
    const tgtCutDate=excelSerialToDate(sRow[C.tgtCut]);

    const dailyQty=prodDays>0?r2(plnQty/prodDays):0;

    if(!styleColorMap[styleDisplayName]){
      styleColorMap[styleDisplayName]=STYLE_COLORS[colorIdx%STYLE_COLORS.length];
      colorIdx++;
    }

    return{
      id:uid(),
      styleNo:g.styleNo,
      styleName:styleDisplayName,
      gmtType,
      line:lineNum,
      startDate,
      endDate,
      delDate,
      tgtCutDate,
      plnQty,
      ordQty,
      eff,
      tgt,
      prodDays,
      prdDysSum:r2(prdDysSum),
      dailyQty,
      merchant,
      styleColor:styleColorMap[styleDisplayName],
      isSingleEntry,
      mergeGroup:g.mergeGroup||null,// SGL_MergeGroup tag from Excel
      // for canvas editing
      locked:false,
      notes:"",
      operations:[],
      operationsConfirmed:false,
      isNew:false,
    };
  }).filter(Boolean);

  // Attach raw data to each style for faithful GitHub save
  const styleIdToGroupIdx={};
  styles.forEach((s,i)=>{if(s)styleIdToGroupIdx[s.id]=i;});

  // Deduplicate by styleNo+line
  const seen=new Set();
  const dedupedStyles=styles.filter(s=>{
    const key=s.styleNo+"||"+s.line+"||"+(s.startDate?s.startDate.getTime():0);
    if(seen.has(key))return false;
    seen.add(key);return true;
  });

  // Auto-merge: group styles that share same SGL_MergeGroup tag
  const mergeTagged=dedupedStyles.filter(s=>s.mergeGroup);
  const untagged=dedupedStyles.filter(s=>!s.mergeGroup);
  const mergeGroups={};
  mergeTagged.forEach(s=>{
    if(!mergeGroups[s.mergeGroup])mergeGroups[s.mergeGroup]=[];
    mergeGroups[s.mergeGroup].push(s);
  });
  const autoMerged=Object.entries(mergeGroups).map(([mgId,subs])=>{
    const sorted=[...subs].sort((a,b)=>a.startDate-b.startDate);
    const mergedId=uid();
    return{
      id:mergedId,
      styleName:sorted.map(s=>s.styleName).join(" + "),
      gmtType:sorted[0].gmtType,
      line:sorted[0].line,
      startDate:new Date(sorted[0].startDate),
      endDate:new Date(sorted[sorted.length-1].endDate),
      delDate:sorted[0].delDate,
      tgtCutDate:sorted[0].tgtCutDate,
      plnQty:sorted.reduce((a,s)=>a+(s.plnQty||0),0),
      ordQty:sorted.reduce((a,s)=>a+(s.ordQty||0),0),
      eff:Math.round(sorted.reduce((a,s)=>a+(s.eff||0),0)/sorted.length),
      tgt:sorted.reduce((a,s)=>a+(s.tgt||0),0),
      prodDays:sorted.reduce((a,s)=>a+(s.prodDays||0),0),
      dailyQty:0,merchant:sorted[0].merchant,
      styleColor:sorted[0].styleColor,
      isMerged:true,mergeGroup:mgId,
      subStyles:sorted.map(s=>({...s})),
      locked:false,notes:"",operations:[],operationsConfirmed:false,isNew:false,isSingleEntry:false,
    };
  });
  autoMerged.forEach(m=>{m.dailyQty=r2(m.plnQty/Math.max(1,m.prodDays));});

  const finalStyles=[...untagged,...autoMerged];
  return {styles:finalStyles, rawRows:rows, rawHdr:hdr, colIndices:C, groups};
}

// ─── Parse OB file ────────────────────────────────────────────────────────────
function parseOB(sheet){
  // Use header:1 to get raw rows, then do flexible column matching
  // This handles .xls files where column names may have extra spaces or different casing
  const rawRows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
  if(!rawRows.length)return{};
  const hdrRaw=rawRows[0].map(h=>String(h||"").trim());

  // Flexible column finder — case insensitive, trim spaces
  function findCol(candidates){
    for(const c of candidates){
      const idx=hdrRaw.findIndex(h=>h.toLowerCase()===c.toLowerCase());
      if(idx>=0)return idx;
    }
    // Partial match fallback
    for(const c of candidates){
      const idx=hdrRaw.findIndex(h=>h.toLowerCase().includes(c.toLowerCase()));
      if(idx>=0)return idx;
    }
    return -1;
  }

  const C={
    styleNo: findCol(["Style Number","StyleNumber","Style No","Style_Number"]),
    desc:    findCol(["Description","Desc","Operation"]),
    mcCode:  findCol(["Mc Code","MC Code","McCode","Machine Code","Mc_Code"]),
    dept:    findCol(["Department","Dept"]),
    smv:     findCol(["SMV","Smv"]),
    gsdsmv:  findCol(["GSDSMV","GSD SMV","GsdSmv","Gsd Smv"]),
  };

  const map={};
  for(let i=1;i<rawRows.length;i++){
    const row=rawRows[i];
    if(!row||!row.length)continue;
    const sn=C.styleNo>=0?String(row[C.styleNo]||"").trim():"";
    if(!sn||sn==="null"||sn==="undefined")continue;
    if(!map[sn])map[sn]={smv:0,ops:[],_keys:new Set()};
    const smvVal=C.smv>=0?parseFloat(row[C.smv])||0:0;
    if(smvVal>map[sn].smv)map[sn].smv=smvVal;// keep max SMV seen
    const desc=C.desc>=0?String(row[C.desc]||"").trim():"";
    if(desc){
      const op={
        description:desc,
        mcCode:C.mcCode>=0?String(row[C.mcCode]||"").trim():"",
        department:C.dept>=0?String(row[C.dept]||"").trim():"",
        gsdsmv:C.gsdsmv>=0?parseFloat(row[C.gsdsmv])||0:0,
      };
      const key=op.description+"||"+op.mcCode+"||"+op.department+"||"+op.gsdsmv;
      if(!map[sn]._keys.has(key)){
        map[sn]._keys.add(key);
        map[sn].ops.push(op);
      }
    }
  }
  return map;
}

function stylesToBase64(styles){
  const rows=[];
  [...styles].sort((a,b)=>a.line-b.line||(a.startDate-b.startDate)).forEach(s=>{
    rows.push({
      "Style Name":s.styleName,"Style No":s.styleNo,"GMT Type":s.gmtType,
      "Line":s.line,"Start Date":ds(s.startDate),"End Date":ds(s.endDate),
      "Del Date":ds(s.delDate),"PLN QTY":s.plnQty,"Ord Qty":s.ordQty,
      "Daily Qty":s.dailyQty,"Prod Days":s.prodDays,"EFF%":s.eff,"TGT":s.tgt,
      "TGT CUT":ds(s.tgtCutDate),"Merchant":s.merchant,
    });
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Production_Data");
  const bin=XLSX.write(wb,{type:"binary",bookType:"xlsx"});
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let b64="";const chunk=8192;
  for(let i=0;i<bytes.length;i+=chunk)b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(b64);
}

// Convert Uint8Array to base64
function bytesToBase64(bytes){
  let b64="";const chunk=8192;
  for(let i=0;i<bytes.length;i+=chunk)b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(b64);
}

// Build faithful FR Plan xlsx — same structure as original, only patching changed rows
function buildFRPlanBase64(styles,rawFRData){
  if(!rawFRData){
    return stylesToBase64(styles);
  }
  const{rawRows,colIndices:C,groups}=rawFRData;

  // Date to Excel serial using LOCAL date parts (avoids timezone offset)
  function dateToSerial(d){
    if(!d)return null;
    const dt=new Date(d);
    const local=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());
    return Math.round((local.getTime()/86400000)+25569);
  }

  // Build lookup: originalFacLine+"||"+styleNo -> updated style
  // Key must match the group key so duplicate styleNos on different lines are handled correctly
  // We map each group's ORIGINAL key to the CURRENT canvas style that came from it
  // Since canvas styles store styleNo=g.styleNo but line may have changed,
  // we need to match by styleNo AND original line from the group

  // First build a reverse map: styleNo -> list of canvas styles with that styleNo
  const stylesByNo={};
  styles.forEach(s=>{
    if(!stylesByNo[s.styleNo])stylesByNo[s.styleNo]=[];
    stylesByNo[s.styleNo].push(s);
  });
  // Also handle merged blocks
  styles.forEach(s=>{
    if(s.isMerged&&s.subStyles){
      s.subStyles.forEach(sub=>{
        if(!stylesByNo[sub.styleNo])stylesByNo[sub.styleNo]=[];
        stylesByNo[sub.styleNo].push(sub);
      });
    }
  });

  // Build group key -> canvas style map
  // For each group, find the canvas style that matches by styleNo
  // If multiple canvas styles have same styleNo (was on multiple lines originally),
  // match by closest original line
  const styleMap={};
  const usedStyleIds=new Set();
  groups.forEach(g=>{
    const candidates=(stylesByNo[g.styleNo]||[]).filter(s=>!usedStyleIds.has(s.id));
    if(candidates.length===0)return;
    // Pick candidate whose original line matches group's line (best match)
    const origLineNum=parseInt(g.facLine.replace(/\D/g,""))||0;
    let best=candidates.find(s=>s.line===origLineNum)||candidates[0];
    styleMap[g.key]=best;
    usedStyleIds.add(best.id);
  });

  // Build set of active group keys (groups that have a matching canvas style)
  const activeKeys=new Set(Object.keys(styleMap));

  // Build summary row identification: for each group, mark which row object is the summary
  const summaryRowSet=new Set();
  groups.forEach(g=>{ if(g.summaryRow)summaryRowSet.add(g.summaryRow); });

  const outRows=[rawRows[0]];// header row
  const writtenKeys=new Set();// prevent writing same group twice

  // Build mergeGroup column index — use existing if present, else append
  const totalCols=rawRows[0].length;
  let mgColIdx=C.mergeGroup>=0?C.mergeGroup:totalCols;// append if not present

  // Build map: styleNo -> mergeGroup tag (from merged styles on canvas)
  const mergeGroupMap={};// styleNo -> mgId
  styles.forEach(s=>{
    if(s.isMerged&&s.subStyles){
      // Generate stable merge group id from sorted sub-style IDs
      const mgId=s.mergeGroup||("MG-"+s.id.slice(0,6));
      s.subStyles.forEach(sub=>{mergeGroupMap[sub.styleNo]=mgId;});
    }
  });

  // Ensure header has SGL_MergeGroup column
  if(mgColIdx===totalCols){
    outRows[0]=[...rawRows[0],"SGL_MergeGroup"];
  }

  // Iterate groups
  groups.forEach(g=>{
    const styleNo=g.styleNo;
    if(writtenKeys.has(g.key))return;
    if(!activeKeys.has(g.key))return;
    writtenKeys.add(g.key);

    const updated=styleMap[g.key];
    const mgTag=mergeGroupMap[styleNo]||"";

    // Get sub-style dates if this style is part of a merge
    let subStyle=null;
    if(updated&&updated.isMerged&&updated.subStyles){
      subStyle=updated.subStyles.find(sub=>sub.styleNo===styleNo);
    }

    const allGroupRows=[...g.rows];
    if(g.summaryRow)allGroupRows.push(g.summaryRow);

    allGroupRows.forEach(row=>{
      const newRow=[...row];
      // Extend row to include merge group column
      while(newRow.length<=mgColIdx)newRow.push(null);
      newRow[mgColIdx]=mgTag||null;

      const isSummary=summaryRowSet.has(row);
      if(updated){
        const lineStr="SGL "+String(updated.line).padStart(2,"0");
        if(C.facLine>=0)newRow[C.facLine]=lineStr;
        if(isSummary){
          // Use sub-style dates if merged, otherwise use overall style dates
          const stDate=subStyle?subStyle.startDate:updated.startDate;
          const fiDate=subStyle?subStyle.endDate:updated.endDate;
          if(C.st>=0)newRow[C.st]=dateToSerial(stDate);
          if(C.fi>=0)newRow[C.fi]=dateToSerial(fiDate);
        }
      }
      outRows.push(newRow);
    });
  });

  const ws=XLSX.utils.aoa_to_sheet(outRows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  const bin=XLSX.write(wb,{type:"binary",bookType:"xlsx"});
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytesToBase64(bytes);
}

// Generic GitHub file push
async function ghPushFile(url,content,message,token){
  let sha=null;
  const chk=await fetch(url,{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});
  if(chk.ok){const d=await chk.json();sha=d.sha;}
  const body={message,content};
  if(sha)body.sha=sha;
  const res=await fetch(url,{method:"PUT",
    headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},
    body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json();throw new Error(e.message||"GitHub push failed");}
  return true;
}

const GH_OB_FILE="OB_Data.xlsx";
const GH_OB_URL="https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+GH_OB_FILE;

async function pushToGitHub(styles,rawFRData,obRawBytes,what,onStatus){
  // what: "fr" | "ob" | "both"
  try{
    onStatus("saving");
    const now=new Date();
    const stamp=now.toLocaleDateString("en-GB")+" "+now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    if(what==="fr"||what==="both"){
      const content=buildFRPlanBase64(styles,rawFRData);
      await ghPushFile(GH_URL,content,"SGL FR Plan — "+stamp,GH_TOKEN);
    }
    if((what==="ob"||what==="both")&&obRawBytes){
      // obRawBytes is already a base64 string — push directly
      await ghPushFile(GH_OB_URL,obRawBytes,"SGL OB Data — "+stamp,GH_TOKEN);
    }else if((what==="ob"||what==="both")&&!obRawBytes){
      throw new Error("No OB file loaded. Please upload the OB file on the Upload page first.");
    }
    onStatus("saved");setTimeout(()=>onStatus(null),3500);
  }catch(e){onStatus("error:"+e.message);}
}

// ─── Tooltip ─────────────────────────────────────────────────────────────────
function useTooltip(){
  const [tip,setTip]=useState(null);
  const show=useCallback((e,content)=>{setTip({x:e.clientX+14,y:e.clientY-10,content});},[]);
  const hide=useCallback(()=>setTip(null),[]);
  const move=useCallback((e)=>{if(tip)setTip(t=>({...t,x:e.clientX+14,y:e.clientY-10}));},[tip]);
  const Tooltip=tip?el("div",{className:"tooltip",style:{left:tip.x,top:tip.y}},tip.content):null;
  return{show,hide,move,Tooltip};

// ─── computeVisualDates ──────────────────────────────────────────────────────
// Computes display-only start/end adjustments so blocks never visually overlap.
// Rule: rawOverlap = diffDays(b.startDate, a.endDate)
//   rawOverlap <= 0  → gap or no touch → nothing to do
//   rawOverlap == 1  → a ends same day as b starts (or 1-day raw overlap from undo/redo)
//     → if A is single-day: push B visual start +1 day
//     → otherwise: shrink A visual end by 1 day
//   rawOverlap >= 2  → genuine conflict that user must fix manually
//                      no visual adjustment; detectConflicts will flag it
function computeVisualDates(styles){
  const byLine={};
  styles.forEach(s=>{if(!byLine[s.line])byLine[s.line]=[];byLine[s.line].push(s);});
  const visualEnd={};
  const visualStart={};
  Object.values(byLine).forEach(lineStyles=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    for(let i=0;i<sorted.length-1;i++){
      const a=sorted[i],b=sorted[i+1];
      if(!a.startDate||!a.endDate||!b.startDate)continue;
      // rawOverlap: how many days does A's end extend past B's start
      // 0 = same day (touch), 1 = 1 day past, negative = gap
      const rawOverlap=Math.round((a.endDate-b.startDate)/(86400*1000));
      if(rawOverlap===0||rawOverlap===1){
        const aIsSingleDay=ds(a.startDate)===ds(a.endDate);
        if(aIsSingleDay){
          // Push B forward 1 day — if that lands on Sunday (not a working day), push to Monday
          let newBStart=addDays(b.startDate,1);
          if(newBStart.getDay()===0)newBStart=addDays(newBStart,1);
          visualStart[b.id]=newBStart;
        }else{
          // Shrink A back 1 day — if that lands on Sunday (not a working day), go back to Saturday
          let newAEnd=addDays(a.endDate,-1);
          if(newAEnd.getDay()===0)newAEnd=addDays(newAEnd,-1);
          visualEnd[a.id]=newAEnd;
        }
      }
      // rawOverlap >= 2: real conflict, no adjustment here
    }
  });
  return{visualEnd,visualStart};
}

// ─── detectConflicts ─────────────────────────────────────────────────────────
// Only flags genuine conflicts: raw overlap >= 2 days.
// rawOverlap of 0 or 1 are handled purely visually by computeVisualDates above.
function detectConflicts(styles){
  const byLine={};
  styles.forEach(s=>{
    if(!byLine[s.line])byLine[s.line]=[];
    byLine[s.line].push(s);
  });
  const conflicts=[];
  Object.values(byLine).forEach(lineStyles=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    for(let i=0;i<sorted.length-1;i++){
      const a=sorted[i],b=sorted[i+1];
      if(!a.endDate||!b.startDate)continue;
      const rawOverlap=Math.round((a.endDate-b.startDate)/(86400*1000));
      if(rawOverlap>=2){
        conflicts.push({styleA:a.styleName,styleB:b.styleName,line:a.line,overlapDays:rawOverlap});
      }
    }
  });
  return conflicts;
}

// ─── Similarity Engine ────────────────────────────────────────────────────────
function getStyleOps(s,obMap){
  // For merged blocks use first sub-style
  const name=s.isMerged&&s.subStyles&&s.subStyles.length>0?s.subStyles[0].styleName:s.styleName;
  const ob=obMap&&obMap[name];
  return ob&&ob.ops?ob.ops:null;
}

function calcSimilarity(opsA,opsB,filters){
  // opsA = previous style ops, opsB = new style ops (denominator)
  if(!opsA||!opsB||opsB.length===0)return null;
  let matched=0;
  opsB.forEach(opB=>{
    const found=opsA.some(opA=>{
      let match=true;
      if(filters.description){
        match=match&&(opA.description||"").toLowerCase().trim()===(opB.description||"").toLowerCase().trim();
      }
      if(filters.mcCode){
        match=match&&(opA.mcCode||"").toLowerCase().trim()===(opB.mcCode||"").toLowerCase().trim();
      }
      // gmtType is style-level, not operation-level — handled separately in callers
      return match;
    });
    if(found)matched++;
  });
  return Math.round((matched/opsB.length)*100);
}

function buildLineSimilarities(styles,obMap,filters){
  // Group by line, sort by start date
  const byLine={};
  styles.forEach(s=>{if(!byLine[s.line])byLine[s.line]=[];byLine[s.line].push(s);});
  const result={};// styleId -> {pct, prevStyleName, hasOps}
  Object.entries(byLine).forEach(([line,lineStyles])=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    sorted.forEach((s,i)=>{
      if(i===0){result[s.id]={pct:null,first:true,hasOps:!!getStyleOps(s,obMap)};return;}
      const prev=sorted[i-1];
      const opsA=getStyleOps(prev,obMap);
      const opsB=getStyleOps(s,obMap);
      if(!opsA||!opsB){
        result[s.id]={pct:null,first:false,hasOps:!!opsB,prevHasOps:!!opsA};
      }else{
        // If gmtType filter is on and styles have different garment types → 0% similarity
        if(filters.gmtType&&(prev.gmtType||"").toLowerCase().trim()!==(s.gmtType||"").toLowerCase().trim()){
          result[s.id]={pct:0,first:false,hasOps:true,prevStyleName:prev.styleName};
        }else{
          const pct=calcSimilarity(opsA,opsB,filters);
          result[s.id]={pct,first:false,hasOps:true,prevStyleName:prev.styleName};
        }
      }
    });
  });
  return result;
}

function simColor(pct){
  if(pct===null)return null;
  if(pct>=80)return"#16a34a";
  if(pct>=60)return"#2563eb";
  if(pct>=40)return"#ca8a04";
  if(pct>=20)return"#dc2626";
  return"#6b7280";
}

function buildLineSimilarityForStyle(selectedStyle,allStyles,obMap,filters){
  const refOps=getStyleOps(selectedStyle,obMap);
  const result={};
  allStyles.forEach(s=>{
    if(s.id===selectedStyle.id){result[s.id]={pct:null,isSelf:true,hasOps:!!refOps};return;}
    const sOps=getStyleOps(s,obMap);
    if(!refOps||!sOps){result[s.id]={pct:null,hasOps:!!sOps,isSelf:false};return;}
    let pct;
    if(filters.gmtType&&(selectedStyle.gmtType||'').toLowerCase().trim()!==(s.gmtType||'').toLowerCase().trim()){
      pct=0;
    }else{
      pct=calcSimilarity(refOps,sOps,filters);
    }
    result[s.id]={pct,hasOps:true,isSelf:false};
  });
  return result;
}

// Build similarity groups: cluster styles with >=90% op name similarity
function buildSimGroups(styles,obMap){
  const palette=["#0891b2","#059669","#7c3aed","#b45309","#0369a1","#be185d",
    "#4338ca","#15803d","#9d174d","#c2410c","#0f766e","#6d28d9","#065f46","#92400e"];
  // Pre-build op description sets per style O(n)
  const opSets={};
  styles.forEach(s=>{
    const ops=getStyleOps(s,obMap);
    if(ops&&ops.length)opSets[s.id]=new Set(ops.map(o=>(o.description||"").toLowerCase().trim()));
  });
  // Bidirectional similarity — max of A→B and B→A
  function fastSim(idA,idB){
    const a=opSets[idA],b=opSets[idB];
    if(!a||!b||!a.size||!b.size)return 0;
    let ab=0;b.forEach(op=>{if(a.has(op))ab++;});
    let ba=0;a.forEach(op=>{if(b.has(op))ba++;});
    return Math.round(Math.max(ab/b.size,ba/a.size)*100);
  }
  // Union-Find so already-assigned styles are still considered
  const ids=styles.map(s=>s.id).filter(id=>opSets[id]);
  const par={};ids.forEach(id=>{par[id]=id;});
  function find(x){while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;}
  // Compare all pairs and union if >=90%
  for(let i=0;i<ids.length;i++)
    for(let j=i+1;j<ids.length;j++)
      if(fastSim(ids[i],ids[j])>=90)par[find(ids[i])]=find(ids[j]);
  // Cluster by root
  const clusters={};
  ids.forEach(id=>{const r=find(id);(clusters[r]=clusters[r]||[]).push(id);});
  const groups=[];let ci=0;
  Object.values(clusters).forEach(c=>{
    if(c.length<2)return;
    groups.push({color:palette[ci++%palette.length],styleIds:c});
  });
  const colorMap={};
  groups.forEach(g=>g.styleIds.forEach(id=>{colorMap[id]=g.color;}));
  return{colorMap,groups};
}

function buildRefIds(styles){
  // line -> sorted styles -> refId like "1-A", "1-B"
  const byLine={};
  styles.forEach(s=>{if(!byLine[s.line])byLine[s.line]=[];byLine[s.line].push(s);});
  const refMap={};// styleId -> refId
  Object.entries(byLine).forEach(([line,lineStyles])=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    sorted.forEach((s,i)=>{
      const letter=String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):"");
      refMap[s.id]=`${line}-${letter}`;
    });
  });
  return refMap;
}


// ─── PlanningBoardView ────────────────────────────────────────────────────────
function PlanningBoardView({styles,colorMode,onEdit,selectMode,selectedId,onSelectStyle,
  simMode=false,simFilters={description:true},obMap={},highlightId=null,
  lineSimMode=false,lineSimFilters={description:true},lineSimThreshold=80,
  lineSimSelectedId=null,onLineSimSelect=null,alwaysSimFilters={description:true,mcCode:false,gmtType:false},
  simGroups=null,boardZoom=1}){
  // Build similarity data if sim mode is on
  const simData=useMemo(()=>simMode?buildLineSimilarities(styles,obMap,simFilters):{},[simMode,styles,obMap,simFilters]);
  // Always-on consecutive similarity data — deferred to avoid blocking initial render
  const [alwaysSimData,setAlwaysSimData]=useState({});
  useEffect(()=>{
    if(!styles.length)return;
    // Defer similarity computation so board renders first
    const t=setTimeout(()=>{
      const result=buildLineSimilarities(styles,obMap,alwaysSimFilters);
      setAlwaysSimData(result);
    },200);
    return()=>clearTimeout(t);
  },[styles,obMap,alwaysSimFilters]);

  const lineSimData=useMemo(()=>{
    if(!lineSimMode||!lineSimSelectedId)return{};
    const sel=styles.find(s=>s.id===lineSimSelectedId);
    if(!sel)return{};
    const res=buildLineSimilarityForStyle(sel,styles,obMap,lineSimFilters);
    const vals=Object.values(res).filter(v=>!v.isSelf&&v.pct!==null).map(v=>v.pct).sort((a,b)=>b-a);
    return res;
  },[lineSimMode,lineSimSelectedId,styles,obMap,lineSimFilters]);
  const {show,hide,move,Tooltip}=useTooltip();
  if(!styles.length)return el(NoData,{});

  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  let minDate=null,maxDate=null;
  styles.forEach(s=>{
    if(s.startDate&&(!minDate||s.startDate<minDate))minDate=s.startDate;
    if(s.endDate&&(!maxDate||s.endDate>maxDate))maxDate=s.endDate;
    if(s.delDate&&(!maxDate||s.delDate>maxDate))maxDate=s.delDate;
  });
  if(!minDate||!maxDate)return el(NoData,{});
  // Build working dates: Mon–Sat only (exclude Sundays)
  const allDates=[];
  let cur=new Date(minDate);cur.setHours(0,0,0,0);
  const eod=new Date(maxDate);eod.setHours(0,0,0,0);
  while(cur<=eod){
    if(cur.getDay()!==0)allDates.push(new Date(cur)); // skip Sunday
    cur.setDate(cur.getDate()+1);
  }

  const dateIndex={};allDates.forEach((d,i)=>{dateIndex[ds(d)]=i;});

  function getColor(s){
    if(colorMode==="garment")return getGmtColor(s.gmtType);
    return s.styleColor;
  }

  const {visualEnd,visualStart}=computeVisualDates(styles);

  // Month groups for header
  const monthGroups=[];
  allDates.forEach((d,i)=>{
    const label=MONS[d.getMonth()]+" "+d.getFullYear();
    if(!monthGroups.length||monthGroups[monthGroups.length-1].label!==label)
      monthGroups.push({label,count:0,idx:i});
    monthGroups[monthGroups.length-1].count++;
  });

  const totalW=LBL_W+allDates.length*COL_W;

  // Delivery date line for selected style in select mode
  const selectedStyle=selectedId?styles.find(s=>s.id===selectedId):null;
  let delLineX=null;
  if(selectMode&&selectedStyle&&selectedStyle.delDate){
    const di=dateIndex[ds(selectedStyle.delDate)];
    if(di!=null)delLineX=LBL_W+di*COL_W+COL_W/2;
  }

  return el("div",{style:{position:"relative",height:"100%",display:"flex",flexDirection:"column"}},
    Tooltip,
    el("div",{style:{flex:1,overflowX:"auto",overflowY:"auto",border:"none",background:"#fff"}},
      el("div",{style:{width:totalW,position:"relative",
        transform:"scale("+boardZoom+")",transformOrigin:"top left",
        transition:"transform .15s"}},

        // Month header
        el("div",{style:{position:"sticky",top:0,zIndex:30,height:HDR_H/2,display:"flex",background:NAVY,marginLeft:LBL_W}},
          monthGroups.map((m,i)=>el("div",{key:i,style:{width:m.count*COL_W,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",borderRight:"1px solid rgba(255,255,255,.1)"}},
            el("span",{style:{color:"rgba(255,255,255,.9)",fontSize:11,fontWeight:600,fontFamily:"'DM Mono',monospace"}},m.label)
          ))
        ),

        // Day header
        el("div",{style:{position:"sticky",top:HDR_H/2,zIndex:30,height:HDR_H/2,display:"flex",background:"#132f4c",marginLeft:LBL_W}},
          allDates.map((d,i)=>el("div",{key:i,style:{width:COL_W,flexShrink:0,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",borderRight:"1px solid rgba(255,255,255,.07)",
            background:d.getDay()===6?"rgba(0,0,0,.18)":"transparent"}},
            el("span",{style:{color:d.getDay()===6?"rgba(255,255,255,.5)":"rgba(255,255,255,.9)",fontSize:11,fontWeight:600}},d.getDate()),
            el("span",{style:{color:d.getDay()===6?"rgba(255,255,255,.4)":"rgba(255,255,255,.45)",fontSize:9,fontFamily:"'DM Mono',monospace"}},DAYS[d.getDay()])
          ))
        ),

        // Delivery date line (red vertical line for selected style)
        delLineX!=null&&el("div",{style:{position:"absolute",top:HDR_H,bottom:0,left:delLineX,width:2,
          background:"#ef4444",zIndex:25,pointerEvents:"none"},
          title:"Delivery: "+fmtDate(selectedStyle.delDate)},
          el("div",{style:{position:"sticky",top:HDR_H+4,background:"#ef4444",color:"#fff",
            fontSize:9,padding:"2px 4px",borderRadius:3,whiteSpace:"nowrap",fontWeight:600,
            fontFamily:"'DM Mono',monospace",width:"fit-content",transform:"translateX(-50%)"}},
            "DEL "+fmtDateShort(selectedStyle.delDate))
        ),

        // Lines
        allLines.map((line,li)=>{
          const lineStyles=styles.filter(s=>s.line===line).sort((a,b)=>a.startDate-b.startDate);

          return el("div",{key:line,style:{display:"flex",borderBottom:"0.5px solid #f1f5f9",minHeight:ROW_H}},
            // Line label
            el("div",{style:{position:"sticky",left:0,zIndex:20,width:LBL_W,flexShrink:0,background:"#fff",
              borderRight:"1px solid #e8ecf2",display:"flex",alignItems:"center",justifyContent:"center",
              fontWeight:700,fontSize:13,color:LINE_COLORS[(line-1)%LINE_COLORS.length],
              fontFamily:"'DM Mono',monospace",boxShadow:"2px 0 8px rgba(0,0,0,.04)"}},
              "L-"+String(line).padStart(2,"0")
            ),

            // Grid area
            el("div",{style:{position:"relative",flex:1,minHeight:ROW_H,background:li%2===0?"transparent":"rgba(0,0,0,.012)"}},
              // Grid lines
              allDates.map((d,di)=>el("div",{key:di,style:{position:"absolute",top:0,bottom:0,left:di*COL_W,width:1,
                background:d.getDay()===6?"rgba(0,0,0,.1)":"rgba(0,0,0,.04)",pointerEvents:"none"}})),

              // Style blocks
              lineStyles.map(s=>{
                if(!s.startDate||!s.endDate)return null;
                const vStart=visualStart[s.id]||s.startDate;
                const vEnd=visualEnd[s.id]||s.endDate;
                const si=dateIndex[ds(vStart)]??dateIndex[ds(s.startDate)]??0;
                const ei=dateIndex[ds(vEnd)]??dateIndex[ds(s.endDate)]??si;
                if(si==null||ei==null)return null;
                const left=si*COL_W+2;
                const width=Math.max((ei-si+1)*COL_W-4,40);
                const simInfo=simMode?(simData[s.id]||null):null;
                const baseColor=getColor(s);
                const color=(simMode&&simInfo&&simInfo.pct!==null)?simColor(simInfo.pct):baseColor;
                const isSelected=selectMode&&selectedId===s.id;
                const isDimmed=selectMode&&selectedId&&selectedId!==s.id;
                const isHighlighted=highlightId===s.id;
                const lsData=lineSimData[s.id];
                const lsSelected=lineSimMode&&lineSimSelectedId===s.id;
                const lsPct=lsData?lsData.pct:null;
                const lsHasOps=lsData?lsData.hasOps:false;
                const lsPasses=lineSimMode&&lineSimSelectedId&&!lsSelected&&lsHasOps&&lsPct!==null&&lsPct>=lineSimThreshold;

                return el("div",{key:s.id,
                  className:"canvas-block"+(isDimmed?" dimmed":"")+(isSelected?" focused":""),
                  onClick:lineSimMode&&onLineSimSelect?()=>onLineSimSelect(s.id):(selectMode?()=>onSelectStyle(s.id):undefined),
                  onMouseEnter:e=>show(e,
                    `${s.styleName}\nStart: ${fmtDate(s.startDate)}  →  End: ${fmtDate(s.endDate)}\nDel: ${fmtDate(s.delDate)}`
                  ),
                  onMouseLeave:hide,
                  onMouseMove:move,
                  style:{
                    position:"absolute",left,top:4,width,height:ROW_H-8,
                    background:color,borderRadius:7,
                    cursor:lineSimMode?'pointer':selectMode?"pointer":"default",
                    opacity:lineSimMode&&lineSimSelectedId?(lsSelected?1:lsPasses?1:0.1):(isDimmed?0.35:1),
                    transition:'opacity .2s',
                    boxShadow:lsSelected?"0 0 0 3px #fff,0 0 0 5px #7c3aed,0 4px 20px rgba(124,58,237,.5)":
                      lsPasses?"0 0 0 2px rgba(255,255,255,.5),0 4px 16px rgba(0,0,0,.25)":
                      isHighlighted?"0 0 0 3px #fff,0 0 0 5px "+ORANGE+",0 4px 20px rgba(224,123,57,.4)":
                      isSelected?"0 0 0 2.5px #fff, 0 0 0 4px #ef4444, 0 4px 16px rgba(0,0,0,.25)":"0 2px 8px rgba(0,0,0,.18)",
                    border:lsSelected?"2px solid #a78bfa":lsPasses?"1px solid rgba(255,255,255,.5)":
                      isHighlighted?"2px solid "+ORANGE:"1px solid rgba(255,255,255,.2)",
                    overflow:"hidden",zIndex:lsSelected?6:isSelected?5:2,
                  }},
                  lineSimMode&&lineSimSelectedId&&(lsPasses||lsSelected)&&el('div',{style:{
                    position:'absolute',top:4,right:4,zIndex:10,
                    background:'rgba(0,0,0,.65)',borderRadius:10,
                    padding:'2px 7px',display:'flex',alignItems:'center',gap:3}},
                    lsSelected
                      ?el('span',{style:{fontSize:9,fontWeight:700,color:'#c4b5fd',fontFamily:"'DM Mono',monospace"}},'SELECTED')
                      :el('span',{style:{fontSize:9,fontWeight:700,
                          color:lsPct>=80?'#4ade80':lsPct>=60?'#60a5fa':lsPct>=40?'#fbbf24':'#f87171',
                          fontFamily:"'DM Mono',monospace"}},lsPct+'%')
                  ),
                  // Block content — merged vs normal
                  s.isMerged
                  // ── MERGED block in planning board ──────────────────────
                  ? el("div",{style:{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden"}},
                      // Header bar
                      el("div",{style:{padding:"3px 7px",background:"rgba(0,0,0,.3)",flexShrink:0,
                        display:"flex",alignItems:"center",gap:5,borderBottom:"1px solid rgba(255,255,255,.15)"}},
                        el("i",{className:"ti ti-arrows-join","aria-hidden":"true",style:{fontSize:8,color:"rgba(255,255,255,.7)"}}),
                        el("span",{style:{fontSize:8,color:"rgba(255,255,255,.85)",fontWeight:700,
                          fontFamily:"'DM Mono',monospace"}},"MERGED ×"+s.subStyles.length),
                        el("span",{style:{marginLeft:"auto",fontSize:7.5,color:"rgba(255,255,255,.4)",
                          fontFamily:"'DM Mono',monospace"}},"scroll ↕")
                      ),
                      // Scrollable sub-styles
                      el("div",{style:{flex:1,overflowY:"auto",padding:"2px 0"}},
                        s.subStyles.map((sub,si)=>el("div",{key:si,style:{
                          padding:"5px 7px",
                          borderBottom:si<s.subStyles.length-1?"1px solid rgba(255,255,255,.1)":"none",
                          background:si%2===0?"transparent":"rgba(0,0,0,.1)"}},
                          // Sub-style name
                          el("div",{style:{fontWeight:700,fontSize:9,color:"#fff",
                            whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:3}},
                            sub.styleName),
                          // Sub-style data grid
                          el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1px 8px"}},
                            [["QTY",(sub.plnQty||0).toLocaleString()],
                             ["Daily",(sub.dailyQty||0)+"/day"],
                             ["Days",(sub.prodDays||0)+" days"],
                             ["Ord",(sub.ordQty||0).toLocaleString()],
                             ["TGT",(sub.tgt||0)],
                             ["Eff",(sub.eff||0)+"%"],
                            ].map(([k,v])=>el("div",{key:k,style:{display:"flex",gap:3,alignItems:"center"}},
                              el("span",{style:{fontSize:7,color:"rgba(255,255,255,.4)",fontFamily:"'DM Mono',monospace"}},k+":"),
                              el("span",{style:{fontSize:7,color:"rgba(255,255,255,.85)",fontWeight:500}},v)
                            ))
                          ),
                          // Del date per sub-style
                          sub.delDate&&el("div",{style:{marginTop:3,background:"rgba(239,68,68,.2)",
                            borderRadius:2,padding:"1px 4px",display:"inline-block"}},
                            el("span",{style:{fontSize:7,color:"#fca5a5",fontFamily:"'DM Mono',monospace",fontWeight:600}},
                              "DEL: "+fmtDateShort(sub.delDate))
                          )
                        ))
                      )
                    )
                  // ── NORMAL block in planning board ───────────────────────
                  : el("div",{style:{padding:"6px 8px",height:"100%",display:"flex",flexDirection:"column",gap:2,overflow:"hidden"}},
                      el("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:4}},
                        el("p",{style:{margin:0,fontWeight:700,fontSize:11,color:"#fff",
                          whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flex:1}},s.styleName),
                        s.isSingleEntry&&el("span",{style:{fontSize:8,background:"rgba(255,255,255,.25)",color:"#fff",
                          borderRadius:3,padding:"1px 4px",flexShrink:0,whiteSpace:"nowrap"}},"1-row")
                      ),
                      // Always-on consecutive sim (no color, just label)
                      el("div",{style:{marginBottom:2}},
                        (()=>{
                          const ai=alwaysSimData[s.id];
                          if(!ai)return null;
                          if(ai.first)return el("span",{style:{fontSize:7.5,color:"rgba(255,255,255,.4)",fontStyle:"italic"}},"First style");
                          if(ai.pct===null)return el("span",{style:{fontSize:7.5,color:"rgba(255,255,255,.3)",fontStyle:"italic"}},"No ops data");
                          const prevStyle=styles.find(ps=>ps.line===s.line&&ps.id!==s.id&&ps.endDate<=s.startDate);
                          const prevName=ai.prevStyleName||"prev";
                          // With Check Similarities ON → colorful; without → plain
                          return el("span",{style:{fontSize:7.5,
                            color:simMode&&simInfo&&simInfo.pct!==null
                              ?(simInfo.pct>=80?"#4ade80":simInfo.pct>=60?"#60a5fa":simInfo.pct>=40?"#fbbf24":"#ef4444")
                              :"rgba(255,255,255,.55)",
                            background:"rgba(0,0,0,.25)",borderRadius:3,padding:"1px 5px",
                            fontFamily:"'DM Mono',monospace",fontWeight:500,fontSize:7.5}},
                            ai.pct+"% sim to "+prevName);
                        })()
                      ),
                      el("p",{style:{margin:0,fontSize:9,color:"rgba(255,255,255,.75)",
                        whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},s.gmtType),
                      el("div",{style:{marginTop:2,display:"flex",flexDirection:"column",gap:1}},
                        [
                          ["QTY",s.plnQty?.toLocaleString()],
                          ["Daily",s.dailyQty+"/day"],
                          ["Days",s.prodDays+" days"],
                          ["Ord",s.ordQty?.toLocaleString()],
                          ["TGT",s.tgt],
                          ["Eff",s.eff+"%"],
                        ].map(([k,v])=>el("div",{key:k,style:{display:"flex",justifyContent:"flex-start",alignItems:"center",gap:3}},
                          el("span",{style:{fontSize:8,color:"rgba(255,255,255,.5)",fontFamily:"'DM Mono',monospace",minWidth:26}},k+":"),
                          el("span",{style:{fontSize:8,color:"#fff",fontWeight:500,fontFamily:"'DM Mono',monospace"}},v)
                        ))
                      ),
                      // Delivery date in red
                      s.delDate&&el("div",{style:{marginTop:"auto",background:"rgba(239,68,68,.25)",borderRadius:3,
                        padding:"2px 5px",display:"flex",alignItems:"center",gap:3}},
                        el("span",{style:{fontSize:8,color:"#fca5a5",fontFamily:"'DM Mono',monospace",fontWeight:600}},
                          "DEL: "+fmtDateShort(s.delDate))
                      ),
                      // TGT CUT
                      s.tgtCutDate&&el("div",{style:{background:"rgba(255,255,255,.12)",borderRadius:3,
                        padding:"2px 5px"}},
                        el("span",{style:{fontSize:8,color:"rgba(255,255,255,.8)",fontFamily:"'DM Mono',monospace"}},
                          "CUT: "+fmtDateShort(s.tgtCutDate))
                      ),
                    )
                );
              })
            )
          );
        })
      )
    )
  );
}

// ─── Canvas Editor ────────────────────────────────────────────────────────────
function CanvasEditor({initialStyles,onConfirm,onCancel,obMap={}}){
  // Deduplicate initialStyles by id to prevent ghost duplicates
  const dedupedInitial=initialStyles.filter((s,i,arr)=>arr.findIndex(x=>x.id===s.id)===i);
  const [styles,setStyles]=useState(dedupedInitial.map(s=>({...s})));
  const [parked,setParked]=useState([]);// parking zone styles
  const [parkDragInfo,setParkDragInfo]=useState(null);// dragging FROM parking zone
  const [dragInfo,setDragInfo]=useState(null);
  const [dragVisual,setDragVisual]=useState(null);
  const [resizeInfo,setResizeInfo]=useState(null);
  const [resizeVisual,setResizeVisual]=useState(null);
  const [editModal,setEditModal]=useState(null);
  const [addModal,setAddModal]=useState(false);
  const [history,setHistory]=useState([{styles,parked:[]}]);
  const [histIdx,setHistIdx]=useState(0);
  const [changeLog,setChangeLog]=useState([]);
  const [showHistory,setShowHistory]=useState(false);
  const [colorMode,setColorMode]=useState("style");
  const [conflictErrors,setConflictErrors]=useState([]);
  const [mergeMode,setMergeMode]=useState(false); // merge select mode
  const [mergeSelected,setMergeSelected]=useState([]); // selected style ids
  const [mergeError,setMergeError]=useState(null); // error message
  const [mergeConfirmModal,setMergeConfirmModal]=useState(null); // {styles,differentDel}
  const [splitSelectedId,setSplitSelectedId]=useState(null); // id of merged block selected for split
  // Line Similarity in canvas
  const [canvasZoom,setCanvasZoom]=useState(1);
  const [canvasLineSimMode,setCanvasLineSimMode]=useState(false);
  const [canvasLineSimFilters,setCanvasLineSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [canvasLineSimThreshold,setCanvasLineSimThreshold]=useState(80);
  const [canvasLineSimSelId,setCanvasLineSimSelId]=useState(null);
  const canvasRef=useRef();
  const parkRef=useRef();
  const moveRef=useRef();
  const upRef=useRef();
  const didDragRef=useRef(false);
  const {show,hide,move:tipMove,Tooltip}=useTooltip();

  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  const canvasLineSimData=useMemo(()=>{
    if(!canvasLineSimMode||!canvasLineSimSelId)return{};
    const sel=styles.find(s=>s.id===canvasLineSimSelId);
    if(!sel)return{};
    return buildLineSimilarityForStyle(sel,styles,obMap,canvasLineSimFilters);
  },[canvasLineSimMode,canvasLineSimSelId,styles,obMap,canvasLineSimFilters]);
  let minDate=null,maxDate=null;
  styles.forEach(s=>{
    if(s.startDate&&(!minDate||s.startDate<minDate))minDate=s.startDate;
    if(s.endDate&&(!maxDate||s.endDate>maxDate))maxDate=s.endDate;
    if(s.delDate&&(!maxDate||s.delDate>maxDate))maxDate=s.delDate;
  });
  if(!minDate)minDate=new Date();
  if(!maxDate)maxDate=addDays(minDate,30);

  const allDates=[];
  let dc=new Date(minDate);dc.setHours(0,0,0,0);
  const de=new Date(maxDate);de.setHours(0,0,0,0);
  while(dc<=de){
    if(dc.getDay()!==0)allDates.push(new Date(dc)); // Mon–Sat only
    dc.setDate(dc.getDate()+1);
  }
  const dateIndex={};allDates.forEach((d,i)=>{dateIndex[ds(d)]=i;});

  const monthGroups=[];
  allDates.forEach((d,i)=>{
    const label=MONS[d.getMonth()]+" "+d.getFullYear();
    if(!monthGroups.length||monthGroups[monthGroups.length-1].label!==label)monthGroups.push({label,count:0});
    monthGroups[monthGroups.length-1].count++;
  });

  const totalW=LBL_W+allDates.length*COL_W;
  const totalH=HDR_H+allLines.length*ROW_H+80;

  function getColor(s){
    if(colorMode==="garment")return getGmtColor(s.gmtType);
    return s.styleColor;
  }

  function pushHistory(ns,np){
    // Store both canvas styles and parked list as a single snapshot
    const snapshot={styles:ns,parked:np!==undefined?np:parked};
    const nh=history.slice(0,histIdx+1);nh.push(snapshot);
    setHistory(nh);setHistIdx(nh.length-1);
  }
  function addChange(msg){setChangeLog(p=>[...p,{msg,time:new Date().toLocaleTimeString()}]);}

  // Undo/redo restore a snapshot — restore both styles and parked
  function undo(){
    if(histIdx<=0)return;
    const snap=history[histIdx-1];
    setHistIdx(h=>h-1);
    setStyles(snap.styles);
    setParked(snap.parked||[]);
    setConflictErrors(detectConflicts(snap.styles));
  }
  function redo(){
    if(histIdx>=history.length-1)return;
    const snap=history[histIdx+1];
    setHistIdx(h=>h+1);
    setStyles(snap.styles);
    setParked(snap.parked||[]);
    setConflictErrors(detectConflicts(snap.styles));
  }

  // Apply a new state, check conflicts, push to history
  function applyAndCheck(ns,np){
    const conflicts=detectConflicts(ns);
    setConflictErrors(conflicts);
    setStyles(ns);
    if(np!==undefined)setParked(np);
    pushHistory(ns,np);
  }

  function parkStyle(id){
    const s=styles.find(x=>x.id===id);
    if(!s)return;
    const ns=styles.filter(x=>x.id!==id);
    const np=[...parked,s];
    addChange(`Parked "${s.styleName}"`);
    applyAndCheck(ns,np);
  }
  function unparkStyle(id){
    const s=parked.find(x=>x.id===id);
    if(!s)return;
    const np=parked.filter(x=>x.id!==id);
    const normDate=d=>{
      if(!d)return d;
      const n=new Date(d.getFullYear(),d.getMonth(),d.getDate());
      n.setHours(0,0,0,0);return n;
    };
    const restored={...s,
      startDate:normDate(s.startDate),
      endDate:normDate(s.endDate),
      delDate:normDate(s.delDate),
      // For merged blocks — also normalize sub-style dates
      subStyles:s.isMerged&&s.subStyles?s.subStyles.map(sub=>({...sub,
        startDate:normDate(sub.startDate),
        endDate:normDate(sub.endDate),
      })):s.subStyles,
    };
    // Guard: remove any existing style with same id before adding back
    // For merged blocks, only filter by id (styleNo is undefined/composite)
    const ns=[...styles.filter(x=>{
      if(x.id===s.id)return false;
      // For non-merged blocks, also check styleNo+line to prevent duplicates
      if(!s.isMerged&&s.styleNo&&x.styleNo===s.styleNo&&x.line===s.line)return false;
      return true;
    }),restored];
    addChange(`Restored "${s.styleName}" from parking`);
    applyAndCheck(ns,np);
  }

  // Canvas rect helper
  function canvasRect(){return canvasRef.current?canvasRef.current.getBoundingClientRect():{left:0,top:0,scrollLeft:0,scrollTop:0};}
  function clientToCanvas(cx,cy){
    const el=canvasRef.current;if(!el)return{x:0,y:0};
    const r=el.getBoundingClientRect();
    // canvasZoom scales the content inside, so divide coords by zoom
    // to convert from screen space to logical canvas space
    const x=(cx-r.left+el.scrollLeft)/canvasZoom;
    const y=(cy-r.top+el.scrollTop)/canvasZoom;
    return{x,y};
  }
  function xToDateIdx(x){return Math.max(0,Math.min(allDates.length-1,Math.floor((x-LBL_W)/COL_W)));}
  function yToLineIdx(y){return Math.max(0,Math.min(allLines.length-1,Math.floor((y-HDR_H)/ROW_H)));}

  function startDrag(e,style){
    if(e.button!==0)return;
    if(style.locked)return;
    if(mergeMode)return;// no drag in merge mode
    didDragRef.current=false;
    const {x,y}=clientToCanvas(e.clientX,e.clientY);
    const si=dateIndex[ds(style.startDate)]??0;
    const ei=dateIndex[ds(style.endDate)]??si;
    setDragInfo({styleId:style.id,offsetX:x-LBL_W-si*COL_W,origLine:style.line,origSi:si,origEi:ei});
    e.preventDefault();
  }
  function startResize(e,style){
    if(e.button!==0)return;
    didDragRef.current=false;
    setResizeInfo({styleId:style.id,origStart:style.startDate});
    e.preventDefault();e.stopPropagation();
  }

  function startParkDrag(e,s){
    if(e.button!==0)return;
    didDragRef.current=false;
    // Find nearest working day index for dates that may land on Sunday
    function nearestIdx(date,fallback){
      if(!date)return fallback;
      // Try exact date first
      let idx=dateIndex[ds(date)];
      if(idx!=null)return idx;
      // If Sunday or not found, try adjacent days (±3 days)
      for(let delta=1;delta<=3;delta++){
        idx=dateIndex[ds(addDays(date,delta))];
        if(idx!=null)return idx;
        idx=dateIndex[ds(addDays(date,-delta))];
        if(idx!=null)return idx;
      }
      return fallback;
    }
    const si=nearestIdx(s.startDate,0);
    const ei=nearestIdx(s.endDate,si);
    const safeEi=Math.max(si,ei);// ensure end >= start
    setParkDragInfo({styleId:s.id,style:s,offsetX:0,origSi:si,origEi:safeEi});
    e.preventDefault();
  }

  function onMove(e){
    if(parkDragInfo){
      didDragRef.current=true;
      const {x,y}=clientToCanvas(e.clientX,e.clientY);
      const span=parkDragInfo.origEi-parkDragInfo.origSi;
      const si=xToDateIdx(x-LBL_W);
      const ei=Math.min(allDates.length-1,si+span);
      const li=yToLineIdx(y);
      setDragVisual({styleId:parkDragInfo.styleId,si,ei,line:allLines[li]});
    }
    if(dragInfo){
      didDragRef.current=true;
      const {x,y}=clientToCanvas(e.clientX,e.clientY);
      const si=xToDateIdx(x-dragInfo.offsetX+LBL_W);
      const span=dragInfo.origEi-dragInfo.origSi;
      const ei=Math.min(allDates.length-1,si+span);
      const li=yToLineIdx(y);
      setDragVisual({styleId:dragInfo.styleId,si,ei,line:allLines[li]});
    }
    if(resizeInfo){
      didDragRef.current=true;
      const {x}=clientToCanvas(e.clientX,e.clientY);
      const ei=xToDateIdx(x);
      const si=dateIndex[ds(resizeInfo.origStart)]??0;
      if(ei>=si)setResizeVisual({styleId:resizeInfo.styleId,ei});
    }
  }
  function onUp(e){
    // Dropped a parked block onto the canvas
    if(parkDragInfo&&dragVisual&&didDragRef.current){
      const pr=parkRef.current?parkRef.current.getBoundingClientRect():null;
      const overPark=pr&&e.clientX>=pr.left&&e.clientX<=pr.right&&e.clientY>=pr.top&&e.clientY<=pr.bottom;
      if(!overPark){
        // Place on canvas — normalize to local midnight to avoid timezone conflicts
        const {si,ei,line}=dragVisual;
        const safeSi=Math.max(0,Math.min(si,allDates.length-1));
        const safeEi=Math.max(safeSi,Math.min(ei,allDates.length-1));
        const days=Math.max(1,safeEi-safeSi+1);
        const rawStart=allDates[safeSi];
        const rawEnd=allDates[safeEi];
        if(!rawStart||!rawEnd){setParkDragInfo(null);setDragVisual(null);return;}
        // Ensure local midnight
        const newStart=new Date(rawStart.getFullYear(),rawStart.getMonth(),rawStart.getDate());
        const newEnd=new Date(rawEnd.getFullYear(),rawEnd.getMonth(),rawEnd.getDate());
        newStart.setHours(0,0,0,0);newEnd.setHours(0,0,0,0);
        const s=parkDragInfo.style;
        let placed;
        if(s.isMerged&&s.subStyles&&s.subStyles.length>0){
          const updatedSubs=splitMergedProportional(s.subStyles,newStart,line);
          const lastSub=updatedSubs[updatedSubs.length-1];
          placed={...s,line,startDate:newStart,endDate:lastSub.endDate,
            prodDays:s.prodDays,dailyQty:r2(s.plnQty/Math.max(1,s.prodDays)),
            subStyles:updatedSubs};
        }else{
          placed={...s,line,startDate:newStart,endDate:newEnd,
            prodDays:days,dailyQty:r2(s.plnQty/days)};
        }
        const np=parked.filter(x=>x.id!==s.id);
        // Guard: remove any duplicate with same id before adding
        const ns=[...styles.filter(x=>x.id!==s.id),placed];
        addChange(`Placed "${s.styleName}" from parking → Line ${line} (${fmtDateShort(placed.startDate)})`);
        applyAndCheck(ns,np);
      }
      setParkDragInfo(null);setDragVisual(null);didDragRef.current=false;
      return;
    }
    if(dragInfo&&dragVisual&&didDragRef.current){
      // Check if dropped on parking zone
      const pr=parkRef.current?parkRef.current.getBoundingClientRect():null;
      const overPark=pr&&e.clientX>=pr.left&&e.clientX<=pr.right&&e.clientY>=pr.top&&e.clientY<=pr.bottom;
      if(overPark){
        parkStyle(dragInfo.styleId);
      }else{
        const {si,ei,line}=dragVisual;
        const safeSi2=Math.max(0,Math.min(si,allDates.length-1));
        const safeEi2=Math.max(safeSi2,Math.min(ei,allDates.length-1));
        const span=safeEi2-safeSi2;
        const ns=styles.map(s=>{
          if(s.id!==dragInfo.styleId)return s;
          const rawSt=allDates[safeSi2];
          const rawEn=allDates[safeEi2];
          if(!rawSt||!rawEn)return s;// safety: keep original if out of bounds
          const newStart=new Date(rawSt.getFullYear(),rawSt.getMonth(),rawSt.getDate());
          const newEnd=new Date(rawEn.getFullYear(),rawEn.getMonth(),rawEn.getDate());
          newStart.setHours(0,0,0,0);newEnd.setHours(0,0,0,0);
          const days=Math.max(1,span+1);
          // For merged blocks: recalculate sub-style dates proportionally
          if(s.isMerged&&s.subStyles&&s.subStyles.length>0){
            const updatedSubs=splitMergedProportional(s.subStyles,newStart,line);
            const lastSub=updatedSubs[updatedSubs.length-1];
            return{...s,line,startDate:newStart,endDate:lastSub.endDate,
              prodDays:s.prodDays,dailyQty:r2(s.plnQty/Math.max(1,s.prodDays)),
              subStyles:updatedSubs};
          }
          return{...s,line,startDate:newStart,endDate:newEnd,
            prodDays:days,dailyQty:r2(s.plnQty/days)};
        });
        const st=ns.find(s=>s.id===dragInfo.styleId);
        addChange(`Moved ${st?.styleName} → Line ${line} (${fmtDateShort(st?.startDate)})`);
        applyAndCheck(ns);
      }
    }
    if(resizeInfo&&resizeVisual&&didDragRef.current){
      const s=styles.find(st=>st.id===resizeInfo.styleId);
      if(s){
        const rawResEnd=allDates[resizeVisual.ei];
        const newEnd=new Date(rawResEnd.getFullYear(),rawResEnd.getMonth(),rawResEnd.getDate());
        newEnd.setHours(0,0,0,0);
        const si=dateIndex[ds(s.startDate)]??0;
        const days=Math.max(1,resizeVisual.ei-si+1);
        let updated={...s,endDate:newEnd,prodDays:days,dailyQty:r2(s.plnQty/days)};
        // For merged block: update last sub-style's end date too
        if(s.isMerged&&s.subStyles&&s.subStyles.length>0){
          const subs=[...s.subStyles];
          subs[subs.length-1]={...subs[subs.length-1],endDate:new Date(newEnd)};
          updated={...updated,subStyles:subs};
        }
        const ns=styles.map(st=>st.id===s.id?updated:st);
        addChange(`Resized ${s.styleName} → end ${fmtDateShort(newEnd)}`);
        applyAndCheck(ns);
      }
    }
    setDragInfo(null);setDragVisual(null);setResizeInfo(null);setResizeVisual(null);
    setParkDragInfo(null);
    didDragRef.current=false;
  }

  function toggleMergeSelect(id,line){
    setMergeError(null);

      if(prev.includes(id))return prev.filter(x=>x!==id);
      // Check same line — find line of first selected
      if(prev.length>0){
        const firstStyle=styles.find(s=>s.id===prev[0]);
        if(firstStyle&&firstStyle.line!==line){
          setMergeError("Can only merge blocks on the same line");
          return prev;
        }
      }
      return [...prev,id];
    });
  }

  function doMerge(confirmed=false){
    if(mergeSelected.length<2){setMergeError("Select at least 2 blocks to merge");return;}
    const selected=styles.filter(s=>mergeSelected.includes(s.id));
    // Check same line
    const lines=[...new Set(selected.map(s=>s.line))];
    if(lines.length>1){setMergeError("All blocks must be on the same line to merge");return;}
    // Sort by start date
    const sorted=[...selected].sort((a,b)=>a.startDate-b.startDate);
    // Check consecutive — each block's end must touch/overlap next block's start (within 2 days)
    for(let i=0;i<sorted.length-1;i++){
      const gap=Math.round((sorted[i+1].startDate-sorted[i].endDate)/(86400*1000));
      if(gap>2){setMergeError("Blocks must be consecutive (no large gaps between them)");return;}
    }
    // Check delivery dates
    const delDates=[...new Set(sorted.map(s=>ds(s.delDate)).filter(Boolean))];
    if(delDates.length>1&&!confirmed){
      setMergeConfirmModal({sortedStyles:sorted,differentDel:true});
      return;
    }
    // Build merged block
    const mergedId=uid();
    const mgId="MG-"+uid().slice(0,6);// stable unique merge group ID
    const mergedStyle={
      id:mergedId,
      mergeGroup:mgId,// tag for Excel save/load
      styleName:sorted.map(s=>s.styleName).join(" + "),
      gmtType:sorted[0].gmtType,
      line:sorted[0].line,
      startDate:new Date(sorted[0].startDate),
      endDate:new Date(sorted[sorted.length-1].endDate),
      delDate:sorted[0].delDate,// use first; warned if different
      tgtCutDate:sorted[0].tgtCutDate,
      plnQty:sorted.reduce((s,x)=>s+(x.plnQty||0),0),
      ordQty:sorted.reduce((s,x)=>s+(x.ordQty||0),0),
      eff:Math.round(sorted.reduce((s,x)=>s+(x.eff||0),0)/sorted.length),
      tgt:sorted.reduce((s,x)=>s+(x.tgt||0),0),
      prodDays:sorted.reduce((s,x)=>s+(x.prodDays||0),0),
      dailyQty:0,
      merchant:sorted[0].merchant,
      styleColor:getMergedColor(sorted),
      isMerged:true,
      subStyles:sorted.map(s=>({...s,mergeGroup:mgId})),// tag each sub with group ID
      locked:false,notes:"",operations:[],operationsConfirmed:false,isNew:false,isSingleEntry:false,
    };
    mergedStyle.dailyQty=r2(mergedStyle.plnQty/Math.max(1,mergedStyle.prodDays));
    const ns=styles.filter(s=>!mergeSelected.includes(s.id));
    ns.push(mergedStyle);
    addChange(`Merged ${sorted.length} blocks: ${sorted.map(s=>s.styleName).join(", ")}`);
    applyAndCheck(ns);
    setMergeMode(false);setMergeSelected([]);setMergeError(null);setMergeConfirmModal(null);
  }

  function doSplit(mergedId){
    const merged=styles.find(s=>s.id===mergedId);
    if(!merged||!merged.isMerged)return;
    const ns=styles.filter(s=>s.id!==mergedId);
    // Use current subStyle dates (which reflect any drags/moves)
    // Remove mergeGroup tag so they save as individual blocks
    merged.subStyles.forEach(sub=>ns.push({...sub,mergeGroup:null,isMerged:false}));
    addChange(`Split merged block: ${merged.styleName}`);
    applyAndCheck(ns);
    setSplitSelectedId(null);
  }

  function getMergedColor(sortedStyles){
    // If all same garment type, use that color; else use special merged purple-grey
    const gmts=[...new Set(sortedStyles.map(s=>s.gmtType))];
    if(gmts.length===1)return getGmtColor(gmts[0]);
    // Mixed: check style colors
    const colors=[...new Set(sortedStyles.map(s=>s.styleColor))];
    if(colors.length===1)return colors[0];
    return"#4B5563"; // neutral grey for mixed merge

              if(canvasLineSimMode){setCanvasLineSimSelId(p=>p===s.id?null:s.id);return;}
