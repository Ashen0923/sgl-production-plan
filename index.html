              // Clear split selection when clicking any non-merged block
              if(!s.isMerged)setSplitSelectedId(null);
              // Allow dragging merged blocks — split selection handled on click (mouseUp without drag)
              startDrag(e,s);
            },
            onClick:e=>{
              // Select merged block for split only on simple click (no drag)
              if(s.isMerged&&!mergeMode&&!didDragRef.current){
                setSplitSelectedId(p=>p===s.id?null:s.id);
              }
            },
            onDoubleClick:e=>{e.stopPropagation();if(!s.locked&&!mergeMode)setEditModal(s);},
            onMouseEnter:e=>show(e,`${s.styleName}
Start: ${fmtDate(s.startDate)}  →  End: ${fmtDate(s.endDate)}
Del: ${fmtDate(s.delDate)}`),
            onMouseLeave:hide,
            onMouseMove:tipMove,
            style:{position:"absolute",left,top:top+4,width,height:ROW_H-8,
              background:conflictIdSet.has(s.id)?"repeating-linear-gradient(45deg,rgba(220,38,38,.85) 0px,rgba(220,38,38,.85) 8px,rgba(0,0,0,.7) 8px,rgba(0,0,0,.7) 16px)":color,
              opacity:isDragging||isResizing?0.35:canvasLineSimMode&&canvasLineSimSelId&&!clsSelected&&!clsPasses?0.1:conflictIdSet.has(s.id)?0.75:1,
              transition:"opacity .2s",
              cursor:canvasLineSimMode?"pointer":mergeMode?"pointer":s.locked?"default":"grab",
              boxShadow:clsSelected?"0 0 0 3px #fff,0 0 0 5px #7c3aed,0 4px 20px rgba(124,58,237,.5)":
                clsPasses?"0 0 0 2px rgba(255,255,255,.5),0 4px 16px rgba(0,0,0,.25)":
                isMergeSelected?"0 0 0 3px #fff,0 0 0 5px #3b82f6,0 4px 16px rgba(59,130,246,.4)":
                splitSelectedId===s.id?"0 0 0 3px #fff,0 0 0 5px #10b981,0 4px 16px rgba(16,185,129,.4)":
                conflictIdSet.has(s.id)?"0 0 0 2.5px #ef4444,0 0 12px rgba(239,68,68,.5)":"0 2px 10px rgba(0,0,0,.2)",
              border:clsSelected?"2px solid #a78bfa":clsPasses?"1px solid rgba(255,255,255,.5)":
                isMergeSelected?"2px solid #3b82f6":splitSelectedId===s.id?"2px solid #10b981":
                conflictIdSet.has(s.id)?"2px solid #ef4444":"1px solid rgba(255,255,255,.2)",
              zIndex:isDragging||isResizing?10:isMergeSelected?7:splitSelectedId===s.id?7:conflictIdSet.has(s.id)?6:3,overflow:"hidden"}},

            // Merge tick indicator
            mergeMode&&el("div",{style:{position:"absolute",top:5,right:5,width:16,height:16,borderRadius:"50%",
              background:isMergeSelected?"#3b82f6":"rgba(255,255,255,.2)",border:"2px solid #fff",
              display:"flex",alignItems:"center",justifyContent:"center",zIndex:5,pointerEvents:"none"}},
              isMergeSelected&&el("i",{className:"ti ti-check","aria-hidden":"true",style:{fontSize:9,color:"#fff",fontWeight:900}})
            ),

            // Canvas line sim badge
            canvasLineSimMode&&canvasLineSimSelId&&(clsPasses||clsSelected)&&el("div",{style:{
              position:"absolute",top:4,right:mergeMode?26:4,zIndex:10,
              background:"rgba(0,0,0,.7)",borderRadius:10,
              padding:"2px 7px",display:"flex",alignItems:"center",gap:3,pointerEvents:"none"}},
              clsSelected
                ?el("span",{style:{fontSize:9,fontWeight:700,color:"#c4b5fd",fontFamily:"'DM Mono',monospace"}},"SELECTED")
                :el("span",{style:{fontSize:9,fontWeight:700,
                    color:clsPct>=80?"#4ade80":clsPct>=60?"#60a5fa":clsPct>=40?"#fbbf24":"#f87171",
                    fontFamily:"'DM Mono',monospace"}},clsPct+"%")
            ),
            // Block content — merged vs normal
            s.isMerged
              // ── MERGED BLOCK ─────────────────────────────────────────────
              ? el("div",{style:{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden"}},
                  // Header
                  el("div",{style:{padding:"4px 8px",background:"rgba(0,0,0,.25)",flexShrink:0,
                    display:"flex",alignItems:"center",gap:5,borderBottom:"1px solid rgba(255,255,255,.15)"}},
                    el("i",{className:"ti ti-arrows-join","aria-hidden":"true",style:{fontSize:9,color:"rgba(255,255,255,.7)"}}),
                    el("span",{style:{fontSize:9,color:"rgba(255,255,255,.8)",fontWeight:700,fontFamily:"'DM Mono',monospace"}},"MERGED ×"+s.subStyles.length),
                    splitSelectedId===s.id&&el("span",{style:{fontSize:8,color:"#6ee7b7",fontWeight:600,fontFamily:"'DM Mono',monospace",
                      background:"rgba(16,185,129,.2)",borderRadius:3,padding:"1px 5px"}},
                      "Selected — click Split in toolbar"),
                    splitSelectedId===s.id&&el("span",{style:{marginLeft:"auto",fontSize:8,
                      color:"#93c5fd",fontWeight:700,fontFamily:"'DM Mono',monospace"}},"→ use Split in toolbar")
                  ),
                  // Sub-styles scrollable
                  el("div",{style:{flex:1,overflowY:"auto",padding:"3px 0"}},
                    s.subStyles.map((sub,si)=>el("div",{key:si,style:{
                      padding:"4px 8px",borderBottom:si<s.subStyles.length-1?"1px solid rgba(255,255,255,.1)":"none"}},
                      el("div",{style:{fontWeight:700,fontSize:9,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:2}},
                        sub.styleName),
                      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1px 6px"}},
                        [["QTY",(sub.plnQty||0).toLocaleString()],["Daily",sub.dailyQty+"/d"],
                         ["Del",fmtDateShort(sub.delDate)],["Eff",(sub.eff||0)+"%"]]
                        .map(([k,v])=>el("div",{key:k,style:{display:"flex",gap:3}},
                          el("span",{style:{fontSize:7,color:"rgba(255,255,255,.45)",fontFamily:"'DM Mono',monospace"}},k+":"),
                          el("span",{style:{fontSize:7,color:"rgba(255,255,255,.85)",fontWeight:500}},v)
                        ))
                      )
                    ))
                  )
                )
              // ── NORMAL BLOCK ──────────────────────────────────────────────
              : el("div",{style:{padding:"5px 8px",height:"100%",display:"flex",flexDirection:"column",gap:1.5,overflow:"hidden",pointerEvents:"none"}},
                  el("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:2}},
                    el("p",{style:{margin:0,fontWeight:700,fontSize:10,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flex:1}},s.styleName),
                    conflictIdSet.has(s.id)&&el("i",{className:"ti ti-alert-triangle","aria-hidden":"true",style:{fontSize:10,color:"#fca5a5",flexShrink:0}}),
                    s.isSingleEntry&&el("span",{style:{fontSize:7.5,background:"rgba(255,255,255,.2)",color:"#fff",borderRadius:2,padding:"1px 3px",flexShrink:0}},"1-row"),
                    s.locked&&el("i",{className:"ti ti-lock","aria-hidden":"true",style:{fontSize:9,color:"rgba(255,255,255,.6)",flexShrink:0}})
                  ),
                  el("p",{style:{margin:0,fontSize:8.5,color:"rgba(255,255,255,.7)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},s.gmtType),
                  [["QTY",s.plnQty?.toLocaleString()],["Daily",s.dailyQty+"/d"],["Days",s.prodDays],["Eff",s.eff+"%"],["TGT",s.tgt]]
                    .map(([k,v])=>el("div",{key:k,style:{display:"flex",justifyContent:"space-between"}},
                      el("span",{style:{fontSize:7.5,color:"rgba(255,255,255,.5)",fontFamily:"'DM Mono',monospace"}},k+":"),
                      el("span",{style:{fontSize:7.5,color:"#fff",fontWeight:500,fontFamily:"'DM Mono',monospace"}},v)
                    )),
                  s.delDate&&el("div",{style:{marginTop:"auto",background:"rgba(239,68,68,.3)",borderRadius:3,padding:"2px 4px"}},
                    el("span",{style:{fontSize:7.5,color:"#fca5a5",fontFamily:"'DM Mono',monospace",fontWeight:700}},"DEL: "+fmtDateShort(s.delDate))
                  ),
                ),

            // Resize handle — on merged block resizes last sub-style end date
            !s.locked&&isRightEdge&&!mergeMode&&el("div",{className:"resize-handle",
              onMouseDown:e=>{e.stopPropagation();startResize(e,s);}})
          );
        }),

        // Drag ghost — shown for both canvas drags and park drags
        dragVisual&&(()=>{
          const li=allLines.indexOf(dragVisual.line);
          const top=(li<0?0:li)*ROW_H+HDR_H;
          const left=dragVisual.si*COL_W+LBL_W+2;
          const width=(dragVisual.ei-dragVisual.si+1)*COL_W-4;
          const fromPark=!!parkDragInfo;
          return el("div",{className:"drop-ghost",style:{
            left,top:top+4,width,height:ROW_H-8,zIndex:9,
            borderColor:fromPark?ORANGE:"rgba(255,255,255,.7)",
            background:fromPark?"rgba(224,123,57,.15)":"transparent"}},
            fromPark&&el("div",{style:{position:"absolute",top:4,left:6,fontSize:8,
              color:ORANGE,fontWeight:700,fontFamily:"'DM Mono',monospace",pointerEvents:"none"}},
              "↓ DROP FROM PARKING")
          );
        })()
      )
    ),// end canvas scroll div

    // Parking Zone — glows when a canvas block is being dragged over it
    el("div",{ref:parkRef,style:{
      width:220,flexShrink:0,
      background:dragInfo&&dragVisual?"#162032":"#1e293b",
      borderLeft:`1px solid ${dragInfo&&dragVisual?"#E07B39":"#334155"}`,
      display:"flex",flexDirection:"column",
      height:"100%",minHeight:0,overflow:"hidden",
      transition:"background .2s,border-color .2s"}},
      el("div",{style:{padding:"10px 12px",borderBottom:"1px solid #334155",flexShrink:0}},
        el("p",{style:{color:"rgba(255,255,255,.5)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,fontFamily:"'DM Mono',monospace",margin:"0 0 2px"}},"Parking Zone"),
        el("p",{style:{color:"rgba(255,255,255,.3)",fontSize:9,margin:0}},"Drag to/from canvas to park or restore"),
        parked.length>0&&el("p",{style:{color:ORANGE,fontSize:9,margin:"4px 0 0",fontWeight:600}},parked.length+" style"+(parked.length>1?"s":"")+" parked")
      ),
      el("div",{style:{flex:1,minHeight:0,overflowY:"auto",padding:8,display:"flex",flexDirection:"column",gap:6}},
        parked.length===0&&el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          height:"100%",gap:8,opacity:.35}},
          el("i",{className:"ti ti-parking","aria-hidden":"true",style:{fontSize:32,color:"#fff"}}),
          el("p",{style:{color:"#fff",fontSize:11,textAlign:"center"}},"Drop style blocks\nhere to park")
        ),
        parked.map(s=>{
          const isParkDragging=parkDragInfo&&parkDragInfo.styleId===s.id;
          return el("div",{key:s.id,
            onMouseDown:e=>startParkDrag(e,s),
            style:{
              background:getColor(s),borderRadius:6,padding:"7px 9px",
              cursor:"grab",border:"1px solid rgba(255,255,255,.15)",
              position:"relative",overflow:"hidden",
              opacity:isParkDragging?0.4:1,
              transition:"opacity .15s",
              userSelect:"none"}},
            el("div",{style:{display:"flex",alignItems:"center",gap:4,marginBottom:2}},
              el("i",{className:"ti ti-grip-vertical","aria-hidden":"true",
                style:{fontSize:10,color:"rgba(255,255,255,.4)",flexShrink:0}}),
              el("p",{style:{margin:0,fontWeight:700,fontSize:9.5,color:"#fff",
                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},s.styleName)
            ),
            el("p",{style:{margin:"0 0 4px",fontSize:8,color:"rgba(255,255,255,.7)",
              whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",paddingLeft:14}},s.gmtType),
            el("p",{style:{margin:"0 0 5px",fontSize:8,color:"rgba(255,255,255,.6)",fontFamily:"'DM Mono',monospace",paddingLeft:14}},
              (s.plnQty||0).toLocaleString()+" pcs"),
            el("div",{style:{display:"flex",gap:4}},
              el("button",{
                onMouseDown:e=>e.stopPropagation(),
                onClick:e=>{e.stopPropagation();unparkStyle(s.id);},
                style:{flex:1,padding:"3px 0",borderRadius:4,border:"none",
                  background:"rgba(255,255,255,.15)",color:"#fff",fontSize:8.5,
                  cursor:"pointer",fontWeight:600}},
                "↩ Restore"),
              el("button",{
                onMouseDown:e=>e.stopPropagation(),
                onClick:e=>{e.stopPropagation();deleteStyle(s.id);},
                style:{padding:"3px 7px",borderRadius:4,border:"none",
                  background:"rgba(239,68,68,.25)",color:"#fca5a5",fontSize:8.5,
                  cursor:"pointer",fontWeight:600}},
                "✕")
            )
          );
        })
      )
    )// end parking zone

    ),// end main flex row

    // Modals
    editModal&&el(EditModal,{style:editModal,allLines,onSave:saveEdit,onDelete:deleteStyle,onClose:()=>setEditModal(null)}),
    addModal&&el(AddModal,{allLines,onAdd:addStyle,onClose:()=>setAddModal(false)}),
    showHistory&&el(HistoryPanel,{log:changeLog,onClose:()=>setShowHistory(false)}),

    // Merge confirm modal (different delivery dates)
    mergeConfirmModal&&el("div",{className:"modal-overlay"},
      el("div",{className:"modal fade",style:{maxWidth:420}},
        el("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16}},
          el("div",{style:{width:36,height:36,borderRadius:"50%",background:"#fef3c7",
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
            el("i",{className:"ti ti-alert-triangle","aria-hidden":"true",style:{color:"#d97706",fontSize:18}})),
          el("p",{style:{fontWeight:700,fontSize:15,color:"#0f172a"}},"Different Delivery Dates")
        ),
        el("p",{style:{fontSize:13,color:"#475569",marginBottom:8}},"The selected blocks have different delivery dates:"),
        el("div",{style:{background:"#fef3c7",borderRadius:8,padding:"10px 14px",marginBottom:16}},
          mergeConfirmModal.sortedStyles.map((s,i)=>el("div",{key:i,style:{fontSize:12,color:"#92400e",
            display:"flex",justifyContent:"space-between",padding:"2px 0"}},
            el("span",{style:{fontWeight:600}},s.styleName),
            el("span",{},"Del: "+fmtDateShort(s.delDate))
          ))
        ),
        el("p",{style:{fontSize:12,color:"#64748b",marginBottom:18}},"The merged block will use the delivery date of the first block. Do you want to continue?"),
        el("div",{style:{display:"flex",gap:10,justifyContent:"flex-end"}},
          el(Btn,{onClick:()=>setMergeConfirmModal(null),
            style:{background:"#f8fafc",color:"#64748b",border:"0.5px solid #e2e8f0"}},"Cancel"),
          el(Btn,{onClick:()=>doMerge(true),
            style:{background:ORANGE,color:"#fff",fontWeight:700}},
            el("i",{className:"ti ti-arrows-join","aria-hidden":"true",style:{marginRight:5}}),"Merge Anyway")
        )
      )
    ),
  );
}

// ─── EditModal ────────────────────────────────────────────────────────────────
function EditModal({style:s,allLines,onSave,onDelete,onClose}){
  const [form,setForm]=useState({
    styleName:s.styleName,gmtType:s.gmtType,line:s.line,
    startDate:ds(s.startDate),endDate:ds(s.endDate),
    plnQty:s.plnQty,notes:s.notes||""
  });
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));
  const newStart=localDate(form.startDate);const newEnd=localDate(form.endDate);
  const dayDiff=Math.max(1,diffDays(newStart,newEnd)+1);
  const newDaily=r2(form.plnQty/dayDiff);

  return el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    el("div",{className:"modal fade"},
      el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
        el("p",{style:{fontWeight:700,fontSize:16,color:"#0f172a"}},"Edit Style Block"),
        el("button",{onClick:onClose,style:{background:"none",border:"none",fontSize:22,color:"#64748b",cursor:"pointer"}},"×")
      ),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}},
        el(Inp,{label:"Style Name",value:form.styleName,onChange:e=>upd("styleName",e.target.value)}),
        el(Inp,{label:"Garment Type",value:form.gmtType,onChange:e=>upd("gmtType",e.target.value)}),
        el("div",{style:{marginBottom:12}},
          el("label",{style:{display:"block",fontSize:12,color:"#64748b",marginBottom:5,fontWeight:500}},"Line"),
          el("select",{value:form.line,onChange:e=>upd("line",parseInt(e.target.value)),
            style:{width:"100%",padding:"9px 11px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:13}},
            allLines.map(l=>el("option",{key:l,value:l},"Line "+l))
          )
        ),
        el(Inp,{label:"PLN QTY",value:form.plnQty,onChange:e=>upd("plnQty",parseFloat(e.target.value)||0),type:"number"}),
        el(Inp,{label:"Start Date",value:form.startDate,onChange:e=>upd("startDate",e.target.value),type:"date"}),
        el(Inp,{label:"End Date",value:form.endDate,onChange:e=>upd("endDate",e.target.value),type:"date"}),
      ),
      dayDiff>0&&el("div",{style:{background:"#f8fafc",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#475569"}},
        `${dayDiff} days → ${newDaily} pcs/day`
      ),
      // Delivery date — read only
      s.delDate&&el("div",{style:{background:"#fef2f2",borderRadius:8,padding:"10px 14px",marginBottom:14,
        display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#dc2626"}},
        el("i",{className:"ti ti-calendar-event","aria-hidden":"true"}),
        el("span",{style:{fontWeight:600}},"Delivery Date: "+fmtDate(s.delDate)+" (fixed — cannot be changed)")
      ),
      el("div",{style:{marginBottom:14}},
        el("label",{style:{display:"block",fontSize:12,color:"#64748b",marginBottom:5,fontWeight:500}},"Notes"),
        el("textarea",{value:form.notes,onChange:e=>upd("notes",e.target.value),rows:2,
          style:{width:"100%",padding:"9px 11px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:13,resize:"vertical"}})
      ),
      el("div",{style:{display:"flex",gap:8,justifyContent:"space-between"}},
        el(Btn,{onClick:()=>onDelete(s.id),style:{background:"#fef2f2",color:"#dc2626",border:"0.5px solid #fca5a5"}},
          el("i",{className:"ti ti-trash","aria-hidden":"true",style:{marginRight:5}}),"Delete"),
        el("div",{style:{display:"flex",gap:8}},
          el(Btn,{onClick:onClose,style:{background:"#f8fafc",color:"#64748b",border:"0.5px solid #e2e8f0"}},"Cancel"),
          el(Btn,{onClick:()=>onSave({...s,...form,
            startDate:localDate(form.startDate),endDate:localDate(form.endDate),
            plnQty:parseFloat(form.plnQty)||0,prodDays:dayDiff,dailyQty:newDaily}),
            style:{background:NAVY,color:"#fff",fontWeight:600}},"Save Changes")
        )
      )
    )
  );
}

// ─── AddModal ─────────────────────────────────────────────────────────────────
function AddModal({allLines,onAdd,onClose}){
  const [form,setForm]=useState({styleName:"",gmtType:"BLOUSE",line:allLines[0]||1,
    startDate:"",endDate:"",plnQty:500,notes:""});

  const dayDiff=form.startDate&&form.endDate?Math.max(1,diffDays(localDate(form.startDate),localDate(form.endDate))+1):0;
  return el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)onClose();}},

      el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
        el("p",{style:{fontWeight:700,fontSize:16,color:"#0f172a"}},"Add Style Block"),
        el("button",{onClick:onClose,style:{background:"none",border:"none",fontSize:22,color:"#64748b",cursor:"pointer"}},"×")
      ),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}},
        el(Inp,{label:"Style Name *",value:form.styleName,onChange:e=>upd("styleName",e.target.value)}),
        el("div",{style:{marginBottom:12}},
          el("label",{style:{display:"block",fontSize:12,color:"#64748b",marginBottom:5,fontWeight:500}},"Garment Type"),
          el("select",{value:form.gmtType,onChange:e=>upd("gmtType",e.target.value),
            style:{width:"100%",padding:"9px 11px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:13}},
            ["BLOUSE","SHIRT","PANT (TROUSER)","CASUAL JACKET","FORMAL JACKET","LADIES SHIRT","DRESS (GOWN)","SHORT","OTHER"].map(g=>el("option",{key:g,value:g},g))
          )
        ),
        el("div",{style:{marginBottom:12}},
          el("label",{style:{display:"block",fontSize:12,color:"#64748b",marginBottom:5,fontWeight:500}},"Line"),
          el("select",{value:form.line,onChange:e=>upd("line",parseInt(e.target.value)),
            style:{width:"100%",padding:"9px 11px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:13}},
            allLines.map(l=>el("option",{key:l,value:l},"Line "+l))
          )
        ),
        el(Inp,{label:"PLN QTY",value:form.plnQty,onChange:e=>upd("plnQty",parseFloat(e.target.value)||0),type:"number"}),
        el(Inp,{label:"Start Date *",value:form.startDate,onChange:e=>upd("startDate",e.target.value),type:"date"}),
        el(Inp,{label:"End Date *",value:form.endDate,onChange:e=>upd("endDate",e.target.value),type:"date"}),
      ),
      dayDiff>0&&el("div",{style:{background:"#f8fafc",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#475569"}},
        `${dayDiff} days → ${r2(form.plnQty/dayDiff)} pcs/day`
      ),
      el("div",{style:{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}},
        el(Btn,{onClick:onClose,style:{background:"#f8fafc",color:"#64748b",border:"0.5px solid #e2e8f0"}},"Cancel"),
        el(Btn,{onClick:()=>{if(!ok)return;onAdd({id:uid(),...form,
          startDate:localDate(form.startDate),endDate:localDate(form.endDate),
          prodDays:dayDiff,dailyQty:r2(form.plnQty/dayDiff),
          styleColor:STYLE_COLORS[Math.floor(Math.random()*STYLE_COLORS.length)],
          locked:false,isNew:true,operationsConfirmed:false,operations:[],isSingleEntry:false,
          delDate:null,tgtCutDate:null,plnQty:parseFloat(form.plnQty)||0,ordQty:0,eff:0,tgt:0,merchant:""});},
          disabled:!ok,style:{background:ORANGE,color:"#fff",fontWeight:600}},
          el("i",{className:"ti ti-plus","aria-hidden":"true",style:{marginRight:5}}),"Add Block"
        )
      )
    )
  );
}

// ─── HistoryPanel ─────────────────────────────────────────────────────────────
function HistoryPanel({log,onClose}){
  return el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    el("div",{className:"modal fade",style:{maxHeight:"65vh",display:"flex",flexDirection:"column",minWidth:440}},
      el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
        el("p",{style:{fontWeight:700,fontSize:15,color:"#0f172a"}},
          el("i",{className:"ti ti-history","aria-hidden":"true",style:{marginRight:8,color:NAVY}}),"Change History"),
        el("button",{onClick:onClose,style:{background:"none",border:"none",fontSize:22,color:"#64748b",cursor:"pointer"}},"×")
      ),
      log.length===0?el("p",{style:{color:"#64748b",fontSize:13,textAlign:"center",padding:"24px 0"}},"No changes yet."):
      el("div",{style:{overflowY:"auto",flex:1}},
        [...log].reverse().map((entry,i)=>el("div",{key:i,style:{display:"flex",gap:10,padding:"8px 0",borderBottom:"0.5px solid #f1f5f9",alignItems:"flex-start"}},
          el("span",{style:{width:22,height:22,borderRadius:"50%",background:"#EEF2F8",display:"flex",alignItems:"center",
            justifyContent:"center",flexShrink:0,fontSize:10,color:NAVY,fontWeight:700}},log.length-i),
          el("div",{},
            el("p",{style:{fontSize:12,color:"#0f172a"}},entry.msg),
            el("p",{style:{fontSize:10,color:"#64748b",marginTop:2,fontFamily:"'DM Mono',monospace"}},entry.time)
          )
        ))
      )
    )
  );
}

// ─── StyleManagerPage ─────────────────────────────────────────────────────────
function StyleManagerPage({styles,obMap,onExport,page:currentPage}){
  const [tab,setTab]=useState("all");
  // Per-tab state
  const [allSearch,setAllSearch]=useState("");
  const [allLine,setAllLine]=useState("all");
  const [allExpanded,setAllExpanded]=useState({});
  const [allShowFull,setAllShowFull]=useState({});

  const [todaySearch,setTodaySearch]=useState("");
  const [todayLine,setTodayLine]=useState("all");
  const [todayExpanded,setTodayExpanded]=useState({});
  const [todayShowFull,setTodayShowFull]=useState({});

  const [opsSearch,setOpsSearch]=useState("");
  const [opsFilter,setOpsFilter]=useState("all"); // "all"|"has"|"missing"
  const [opsExpanded,setOpsExpanded]=useState({});
  const [opsShowFull,setOpsShowFull]=useState({});

  const today=new Date();today.setHours(0,0,0,0);
  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  const obLoaded=obMap&&Object.keys(obMap).length>0;

  function isActive(s){
    if(!s.startDate||!s.endDate)return false;
    const st=new Date(s.startDate);st.setHours(0,0,0,0);
    const en=new Date(s.endDate);en.setHours(0,0,0,0);
    return st<=today&&en>=today;
  }
  function hasOps(s){
    const ob=obMap&&obMap[s.styleName];
    return ob&&ob.ops&&ob.ops.length>0;
  }
  function daysLeft(s){
    if(!s.endDate)return null;
    return Math.round((new Date(s.endDate)-today)/(86400*1000));
  }
  function workingDaysBetween(fromDate,toDate){
    // Count Mon-Sat days from fromDate up to and including toDate
    if(!fromDate||!toDate)return 0;
    let count=0;
    let cur=new Date(fromDate);cur.setHours(0,0,0,0);
    const end=new Date(toDate);end.setHours(0,0,0,0);
    while(cur<=end){
      if(cur.getDay()!==0)count++;
      cur.setDate(cur.getDate()+1);
    }
    return Math.max(0,count);
  }
  function daysElapsed(s){
    if(!s.startDate)return 0;
    return workingDaysBetween(s.startDate,today);
  }
  // Total working days based on actual start/end dates (more accurate than PRD DYS sum)
  function totalWorkingDays(s){
    if(!s.startDate||!s.endDate)return s.prodDays||1;
    return Math.max(1,workingDaysBetween(s.startDate,s.endDate));
  }
  function delCountdown(s){
    if(!s.delDate)return null;
    return Math.round((new Date(s.delDate)-today)/(86400*1000));
  }

  // Summary stats
  const totalStyles=styles.length;
  const runningToday=styles.filter(isActive).length;
  const haveOps=styles.filter(hasOps).length;
  const missingOps=totalStyles-haveOps;

  // Filtered lists per tab
  function applySearch(list,search,line){
    const q=search.toLowerCase();
    return list.filter(s=>{
      const matchQ=!q||s.styleName.toLowerCase().includes(q)||(s.gmtType||"").toLowerCase().includes(q)||String(s.line).includes(q);
      const matchL=line==="all"||String(s.line)===String(line);
      return matchQ&&matchL;
    });
  }
  const allFiltered=applySearch(styles,allSearch,allLine);
  const todayFiltered=applySearch(styles.filter(isActive),todaySearch,todayLine);
  const opsBase=opsFilter==="has"?styles.filter(hasOps):opsFilter==="missing"?styles.filter(s=>!hasOps(s)):styles;
  const opsFiltered=applySearch(opsBase,opsSearch,"all");

  function toggleExpand(id,expandState,setExpandState){
    setExpandState(p=>({...p,[id]:!p[id]}));
  }
  function toggleShowFull(id,state,setState){
    setState(p=>({...p,[id]:!p[id]}));
  }

  // ── Shared style card renderer ──────────────────────────────────────────────
  function StyleCard({s,expandedMap,setExpandedMap,showFullMap,setShowFullMap,showProgress=false,urgent=false}){
    const ob=obMap&&obMap[s.styleName];
    const sHasOps=ob&&ob.ops&&ob.ops.length>0;
    const isExpanded=!!expandedMap[s.id];
    const isShowFull=!!showFullMap[s.id];
    const active=isActive(s);
    const dl=daysLeft(s);
    const elapsed=daysElapsed(s);
    const dc=delCountdown(s);
    const dlColor=dl===null?"#94a3b8":dl<0?"#dc2626":dl<=2?"#d97706":"#16a34a";
    const dlLabel=dl===null?"—":dl<0?"Overdue by "+Math.abs(dl)+"d":dl===0?"Last day":dl+" days left";
    const dcLabel=dc===null?"—":dc<0?"Overdue by "+Math.abs(dc)+"d":dc===0?"Del today":"Del in "+dc+" days";
    const previewOps=sHasOps?ob.ops.slice(0,3):[];
    const allOps=sHasOps?ob.ops:[];

    return el("div",{style:{
      border:`1px solid ${urgent?"#fca5a5":active?"#bbf7d0":sHasOps?"#e2e8f0":"#e8e8e8"}`,
      borderRadius:12,overflow:"hidden",marginBottom:8,
      boxShadow:urgent?"0 2px 8px rgba(220,38,38,.12)":active?"0 1px 6px rgba(22,163,74,.08)":"none",
    }},
      // Main row
      el("div",{
        onClick:()=>toggleExpand(s.id,expandedMap,setExpandedMap),
        style:{padding:"12px 16px",
          background:urgent?"#fff5f5":active?"#f0fdf4":"#fff",
          display:"flex",alignItems:"center",gap:12,cursor:"pointer"}},

        // Color dot
        el("div",{style:{width:11,height:11,borderRadius:"50%",
          background:s.styleColor||getGmtColor(s.gmtType),flexShrink:0,
          boxShadow:"0 0 0 2px rgba(0,0,0,.08)"}}),

        // Info
        el("div",{style:{flex:1,minWidth:0}},
          // Name + badges row
          el("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:4}},
            el("span",{style:{fontWeight:700,fontSize:13,color:"#0f172a"}},s.styleName),
            urgent&&el("span",{style:{fontSize:10,fontWeight:700,color:"#fff",background:"#dc2626",
              padding:"2px 7px",borderRadius:20,display:"flex",alignItems:"center",gap:3}},
              el("i",{className:"ti ti-alert-triangle","aria-hidden":"true",style:{fontSize:9}}),"URGENT"),
            active&&!urgent&&el("span",{style:{fontSize:10,fontWeight:700,color:"#16a34a",background:"#dcfce7",
              padding:"2px 7px",borderRadius:20,border:"0.5px solid #bbf7d0",display:"flex",alignItems:"center",gap:3}},
              el("span",{style:{width:5,height:5,borderRadius:"50%",background:"#16a34a",display:"inline-block"}}),
              dlLabel),
            !sHasOps&&el("span",{style:{fontSize:10,color:"#92400e",background:"#fef3c7",
              padding:"2px 7px",borderRadius:20,border:"0.5px solid #fde68a"}},"No operations"),
            s.isSingleEntry&&el("span",{style:{fontSize:10,color:"#6d28d9",background:"#f3e8ff",
              padding:"2px 7px",borderRadius:20,border:"0.5px solid #ddd6fe"}},"Single entry"),
          ),
          // Details row
          el("div",{style:{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}},
            el("span",{style:{fontSize:11,color:"#64748b"}},
              el("i",{className:"ti ti-layout-rows","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),"Line "+s.line),
            el("span",{style:{fontSize:11,color:"#64748b"}},s.gmtType),
            el("span",{style:{fontSize:11,color:"#64748b"}},
              el("i",{className:"ti ti-box","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),(s.plnQty||0).toLocaleString()+" pcs"),
            el("span",{style:{fontSize:11,color:"#64748b"}},
              el("i",{className:"ti ti-calendar","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),fmtDateShort(s.startDate)+" → "+fmtDateShort(s.endDate)),
            el("span",{style:{fontSize:11,color:"#dc2626",fontWeight:500}},
              el("i",{className:"ti ti-truck","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),"Del: "+fmtDateShort(s.delDate)),
            active&&dc!==null&&el("span",{style:{fontSize:11,fontWeight:600,
              color:dc<0?"#dc2626":dc<=3?"#d97706":"#16a34a"}},dcLabel),
          ),

          // Progress bar (Running Today tab)
          showProgress&&active&&(()=>{
            const totalDays=totalWorkingDays(s);
            const pct=Math.min(100,Math.round((elapsed/totalDays)*100));
            const isOverrun=elapsed>totalDays;
            const barColor=isOverrun?"#dc2626":dl<=2?"#f59e0b":"#16a34a";
            return el("div",{style:{marginTop:7}},
              el("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:3}},
                el("span",{style:{fontSize:10,color:"#64748b"}},"Day "+elapsed+" of "+totalDays),
                el("span",{style:{fontSize:10,color:barColor,fontWeight:600}},
                  isOverrun?"Overrun by "+(elapsed-totalDays)+" day(s)":dlLabel)
              ),
              el("div",{style:{height:5,background:"#e2e8f0",borderRadius:10,overflow:"hidden"}},
                el("div",{style:{height:"100%",borderRadius:10,background:barColor,
                  width:pct+"%",transition:"width .3s"}})
              )
            );
          })()
        ),

        // Right: ops count + chevron
        el("div",{style:{display:"flex",alignItems:"center",gap:10,flexShrink:0}},
          sHasOps&&el("div",{style:{textAlign:"right"}},
            el("div",{style:{fontSize:12,fontWeight:600,color:NAVY}},ob.ops.length+" ops"),
            el("div",{style:{fontSize:11,color:"#64748b",fontFamily:"'DM Mono',monospace"}},"SMV "+(ob.smv||0).toFixed(2))
          ),
          el("div",{style:{width:26,height:26,borderRadius:"50%",
            background:isExpanded?NAVY:"#f1f5f9",
            display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}},
            el("i",{className:"ti "+(isExpanded?"ti-chevron-up":"ti-chevron-down"),"aria-hidden":"true",
              style:{fontSize:13,color:isExpanded?"#fff":"#64748b"}})
          )
        )
      ),

      // Expanded panel
      isExpanded&&el("div",{style:{borderTop:"1px solid #e2e8f0",background:"#f8fafc"}},
        !sHasOps
        // No ops message
        ? el("div",{style:{padding:"16px",display:"flex",alignItems:"center",gap:10,color:"#92400e"}},
            el("i",{className:"ti ti-alert-circle","aria-hidden":"true",style:{fontSize:18,flexShrink:0}}),
            el("div",{},
              el("p",{style:{fontSize:13,fontWeight:600,margin:"0 0 2px"}},"No operations data for this style"),
              el("p",{style:{fontSize:12,color:"#b45309",margin:0}},"Upload the Operation Breakdown (OB) file on the Upload page.")
            )
          )
        // Has ops — show preview or full
        : el("div",{},
            // Summary bar
            el("div",{style:{padding:"8px 16px",background:"#eef2f8",display:"flex",
              gap:16,flexWrap:"wrap",alignItems:"center"}},
              el("span",{style:{fontSize:11,fontWeight:600,color:NAVY}},"Operations Breakdown"),
              el("span",{style:{fontSize:11,color:"#64748b",display:"flex",alignItems:"center",gap:4}},
                "Total SMV: ",el("strong",{style:{color:"#0f172a",fontFamily:"'DM Mono',monospace"}},(ob.smv||0).toFixed(2))),
              el("span",{style:{fontSize:11,color:"#64748b",display:"flex",alignItems:"center",gap:4}},
                "Operations: ",el("strong",{style:{color:"#0f172a"}},String(ob.ops.length))),
              el("div",{style:{display:"flex",gap:5,flexWrap:"wrap",marginLeft:"auto"}},
                [...new Set(ob.ops.map(op=>op.department).filter(Boolean))].map(dept=>
                  el("span",{key:dept,style:{fontSize:10,padding:"2px 7px",borderRadius:20,fontWeight:600,
                    background:dept==="SEW"?"#dbeafe":dept==="FIN"?"#dcfce7":dept==="PCK"?"#fef3c7":"#f3e8ff",
                    color:dept==="SEW"?"#1d4ed8":dept==="FIN"?"#15803d":dept==="PCK"?"#92400e":"#6d28d9"}},dept)
                )
              )
            ),
            // Column headers
            el("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 70px",
              padding:"5px 16px",borderBottom:"0.5px solid #e2e8f0",background:"#f1f5f9"}},
              ["Description","MC Code","Dept","GSD SMV"].map(h=>
                el("span",{key:h,style:{fontSize:10,fontWeight:700,color:"#64748b",
                  textTransform:"uppercase",letterSpacing:.5}},h)
              )
            ),
            // Ops rows — preview (top 3) or full
            el("div",{style:{maxHeight:isShowFull?280:120,overflowY:"auto"}},
              (isShowFull?allOps:previewOps).map((op,i)=>
                el("div",{key:i,style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 70px",
                  padding:"6px 16px",borderBottom:"0.5px solid #f1f5f9",
                  background:i%2===0?"#fff":"#fafafa",alignItems:"center"}},
                  el("span",{style:{fontSize:12,color:"#0f172a"}},op.description||"—"),
                  el("span",{style:{fontSize:11,color:"#475569",fontFamily:"'DM Mono',monospace"}},op.mcCode||"—"),
                  el("span",{style:{fontSize:10,padding:"2px 6px",borderRadius:20,width:"fit-content",fontWeight:600,
                    background:op.department==="SEW"?"#dbeafe":op.department==="FIN"?"#dcfce7":op.department==="PCK"?"#fef3c7":"#f3e8ff",
                    color:op.department==="SEW"?"#1d4ed8":op.department==="FIN"?"#15803d":op.department==="PCK"?"#92400e":"#6d28d9"}},
                    op.department||"—"),
                  el("span",{style:{fontSize:11,color:"#475569",fontFamily:"'DM Mono',monospace",textAlign:"right"}},
                    (op.gsdsmv||0).toFixed(3))
                )
              )
            ),
            // Show more/less button
            allOps.length>3&&el("button",{
              onClick:e=>{e.stopPropagation();toggleShowFull(s.id,showFullMap,setShowFullMap);},
              style:{width:"100%",padding:"7px",border:"none",borderTop:"0.5px solid #e2e8f0",
                background:"#f8fafc",color:NAVY,fontSize:12,fontWeight:600,cursor:"pointer",
                display:"flex",alignItems:"center",justifyContent:"center",gap:5}},
              el("i",{className:"ti "+(isShowFull?"ti-chevron-up":"ti-chevron-down"),"aria-hidden":"true",style:{fontSize:13}}),
              isShowFull?"Show less":"Show all "+allOps.length+" operations"
            )
          )
      )
    );
  }

  // ── Tab content renderers ────────────────────────────────────────────────────
  function renderAll(){
    return el("div",{},
      // Search + line filter
      el("div",{style:{display:"flex",gap:10,marginBottom:14,alignItems:"center"}},
        el("div",{style:{flex:1,position:"relative"}},
          el("i",{className:"ti ti-search","aria-hidden":"true",style:{position:"absolute",left:10,top:"50%",
            transform:"translateY(-50%)",color:"#64748b",fontSize:14,pointerEvents:"none"}}),
          el("input",{placeholder:"Search style name, garment type, line...",value:allSearch,
            onChange:e=>setAllSearch(e.target.value),
            style:{width:"100%",padding:"9px 12px 9px 32px",border:"0.5px solid #cbd5e1",
              borderRadius:8,fontSize:13}})
        ),
        el("select",{value:allLine,onChange:e=>setAllLine(e.target.value),
          style:{padding:"9px 12px",border:"0.5px solid #cbd5e1",borderRadius:8,fontSize:13,
            background:"#fff",color:"#374151",minWidth:120}},
          el("option",{value:"all"},"All Lines"),
          allLines.map(l=>el("option",{key:l,value:l},"Line "+l))
        )
      ),
      el("div",{style:{fontSize:12,color:"#64748b",marginBottom:10}},allFiltered.length+" styles"),
      allFiltered.map(s=>el(StyleCard,{key:s.id,s,
        expandedMap:allExpanded,setExpandedMap:setAllExpanded,
        showFullMap:allShowFull,setShowFullMap:setAllShowFull})),
      allFiltered.length===0&&el("p",{style:{textAlign:"center",color:"#64748b",padding:"24px 0",fontSize:13}},"No styles match your search.")
    );
  }

  function renderToday(){
    const list=todayFiltered;
    return el("div",{},
      el("div",{style:{display:"flex",gap:10,marginBottom:14,alignItems:"center"}},
        el("div",{style:{flex:1,position:"relative"}},
          el("i",{className:"ti ti-search","aria-hidden":"true",style:{position:"absolute",left:10,top:"50%",
            transform:"translateY(-50%)",color:"#64748b",fontSize:14,pointerEvents:"none"}}),
          el("input",{placeholder:"Search running styles...",value:todaySearch,
            onChange:e=>setTodaySearch(e.target.value),
            style:{width:"100%",padding:"9px 12px 9px 32px",border:"0.5px solid #cbd5e1",
              borderRadius:8,fontSize:13}})
        ),
        el("select",{value:todayLine,onChange:e=>setTodayLine(e.target.value),
          style:{padding:"9px 12px",border:"0.5px solid #cbd5e1",borderRadius:8,fontSize:13,
            background:"#fff",color:"#374151",minWidth:120}},
          el("option",{value:"all"},"All Lines"),
          allLines.map(l=>el("option",{key:l,value:l},"Line "+l))
        )
      ),
      el("div",{style:{fontSize:12,color:"#64748b",marginBottom:10}},list.length+" styles running today"),
      list.length===0
        ?el("div",{style:{textAlign:"center",padding:"40px 0"}},
            el("i",{className:"ti ti-calendar-off","aria-hidden":"true",style:{fontSize:36,color:"#cbd5e1",display:"block",marginBottom:8}}),
            el("p",{style:{fontSize:13,color:"#64748b"}},todaySearch||todayLine!=="all"?"No styles match your filter.":"No styles running today."))
        :list.map(s=>el(StyleCard,{key:s.id,s,showProgress:true,
            expandedMap:todayExpanded,setExpandedMap:setTodayExpanded,
            showFullMap:todayShowFull,setShowFullMap:setTodayShowFull}))
    );
  }

  function renderOps(){
    return el("div",{},
      // No OB file banner
      !obLoaded&&el("div",{style:{background:"#fef3c7",border:"0.5px solid #fde68a",borderRadius:10,
        padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:10}},
        el("i",{className:"ti ti-alert-triangle","aria-hidden":"true",style:{color:"#d97706",fontSize:20,flexShrink:0}}),
        el("div",{},
          el("p",{style:{fontWeight:600,fontSize:13,color:"#92400e",margin:"0 0 2px"}},"No OB file loaded"),
          el("p",{style:{fontSize:12,color:"#b45309",margin:0}},"Upload the Operation Breakdown file on the Upload page to see operations status.")
        )
      ),
      // Search + toggle
      el("div",{style:{display:"flex",gap:10,marginBottom:14,alignItems:"center",flexWrap:"wrap"}},
        el("div",{style:{flex:1,position:"relative",minWidth:180}},
          el("i",{className:"ti ti-search","aria-hidden":"true",style:{position:"absolute",left:10,top:"50%",
            transform:"translateY(-50%)",color:"#64748b",fontSize:14,pointerEvents:"none"}}),
          el("input",{placeholder:"Search styles...",value:opsSearch,
            onChange:e=>setOpsSearch(e.target.value),
            style:{width:"100%",padding:"9px 12px 9px 32px",border:"0.5px solid #cbd5e1",
              borderRadius:8,fontSize:13}})
        ),
        el("div",{style:{display:"flex",gap:0,borderRadius:8,overflow:"hidden",border:"0.5px solid #cbd5e1"}},
          [["all","All"],["has","✅ Has Ops"],["missing","⚠ Missing"]].map(([v,label])=>
            el("button",{key:v,onClick:()=>setOpsFilter(v),style:{
              padding:"9px 14px",border:"none",fontSize:12,fontWeight:600,cursor:"pointer",
              background:opsFilter===v?NAVY:"#fff",
              color:opsFilter===v?"#fff":"#64748b",

      el("div",{style:{fontSize:12,color:"#64748b",marginBottom:10}},opsFiltered.length+" styles"),
      opsFiltered.map(s=>{

        return el(StyleCard,{key:s.id,s,urgent,
          expandedMap:opsExpanded,setExpandedMap:setOpsExpanded,
          showFullMap:opsShowFull,setShowFullMap:setOpsShowFull});
      }),
      opsFiltered.length===0&&el("p",{style:{textAlign:"center",color:"#64748b",padding:"24px 0",fontSize:13}},
        opsFilter==="has"?"All styles have operations data!":opsFilter==="missing"?"No missing operations — great!":"No styles match your search.")
    );
  }

  // ── Exported list based on current tab ──────────────────────────────────────
  function handleExportTab(){
    const list=tab==="all"?allFiltered:tab==="today"?todayFiltered:opsFiltered;
    const rows=list.map(s=>({
      "Style Name":s.styleName,"GMT Type":s.gmtType,"Line":s.line,
      "Start":ds(s.startDate),"End":ds(s.endDate),"Del":ds(s.delDate),
      "PLN QTY":s.plnQty,"Daily QTY":s.dailyQty,"Prod Days":s.prodDays,
      "Has Operations":hasOps(s)?"Yes":"No",

    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Styles");
    XLSX.writeFile(wb,"SGL_Styles_"+(tab==="all"?"All":tab==="today"?"RunningToday":"OpsStatus")+"_"+new Date().toISOString().slice(0,10)+".xlsx");

  const tabDef=[
    {id:"all",label:"All Styles — FR Plan",icon:"ti-list",count:totalStyles},

    // ── Summary stat cards ──────────────────────────────────────────────────
    el("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}},
      [
        {label:"Total Styles",value:totalStyles,icon:"ti-shirt",color:NAVY,bg:"#EEF2F8"},
        {label:"Running Today",value:runningToday,icon:"ti-player-play",color:"#16a34a",bg:"#f0fdf4"},

function ViewerApp(){
  const [page,setPage]=useState("loading");
  const [styles,setStyles]=useState([]);
  const [obMap,setObMap]=useState({});
  const [loadStatus,setLoadStatus]=useState("Connecting to GitHub...");
  const [loadError,setLoadError]=useState(null);
  const [lastUpdated,setLastUpdated]=useState(null);
  const [refreshing,setRefreshing]=useState(false);
  const [colorMode,setColorMode]=useState("simgroup");
  const [selectMode,setSelectMode]=useState(false);
  const [selectedId,setSelectedId]=useState(null);
  const [simShowPanel,setSimShowPanel]=useState(false);
  const [simMode,setSimMode]=useState(false);
  const [simFilters,setSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [alwaysSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [lineSimMode,setLineSimMode]=useState(false);
  const [lineSimFilters,setLineSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [lineSimThreshold,setLineSimThreshold]=useState(80);
  const [lineSimSelectedId,setLineSimSelectedId]=useState(null);
  const [simSubTab,setSimSubTab]=useState("consecutive");
  const [showSimGroupInfo,setShowSimGroupInfo]=useState(false);
  const [boardZoom,setBoardZoom]=useState(1);
  const [viewPanelOpen,setViewPanelOpen]=useState(false);
  // Only compute sim groups when colorMode=simgroup to avoid blocking the UI
  const simGroups=useMemo(()=>{
    if(colorMode!=="simgroup"&&!showSimGroupInfo)return{colorMap:{},groups:[]};
    if(!styles.length||!obMap||!Object.keys(obMap).length)return{colorMap:{},groups:[]};
    return buildSimGroups(styles,obMap);
  },[colorMode,showSimGroupInfo,styles,obMap]);

  async function fetchFromGitHub(showLoading){
    if(showLoading)setLoadStatus("Fetching FR Plan from GitHub...");
    else setRefreshing(true);
    try{
      // ── FR Plan ───────────────────────────────────────────────────────
      const frRes=await fetch(GH_FR_URL,{
        headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"},
        cache:"no-cache"
      });
      if(!frRes.ok)throw new Error("FR Plan fetch failed (HTTP "+frRes.status+"). Token may have expired.");
      const frData=await frRes.json();
      const frB64=frData.content.replace(/[\n\r]/g,"");
      // Yield before heavy decode+parse to keep UI responsive
      await new Promise(r=>setTimeout(r,0));
      const frBin=atob(frB64);
      await new Promise(r=>setTimeout(r,0));
      const frBytes=new Uint8Array(frBin.length);
      // Chunk the byte copy to avoid blocking
      for(let i=0;i<frBin.length;i+=50000){
        const end=Math.min(i+50000,frBin.length);
        for(let j=i;j<end;j++)frBytes[j]=frBin.charCodeAt(j);
        if(i+50000<frBin.length)await new Promise(r=>setTimeout(r,0));
      }
      await new Promise(r=>setTimeout(r,0));
      const frWb=XLSX.read(frBytes,{type:"array",cellDates:false,raw:true});
      await new Promise(r=>setTimeout(r,0));
      const frWs=frWb.Sheets[frWb.SheetNames[0]];
      const parsed=parseFRPlan(frWs);
      await new Promise(r=>setTimeout(r,0));

      // ── OB Data ───────────────────────────────────────────────────────
      if(showLoading)setLoadStatus("Fetching OB Data from GitHub...");
      let obMapResult={};
      try{
        const obMetaRes=await fetch(GH_OB_URL,{
          headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"},
          cache:"no-cache"
        });
        if(obMetaRes.ok){
          const obMeta=await obMetaRes.json();
          let obBytes;
          // Small file: content embedded in response
          if(obMeta.content&&obMeta.content.replace(/[\n\r]/g,"").length>100){
            const b64=obMeta.content.replace(/[\n\r]/g,"");
            await new Promise(r=>setTimeout(r,0));
            const bin=atob(b64);obBytes=new Uint8Array(bin.length);
            for(let i=0;i<bin.length;i+=50000){
              const end=Math.min(i+50000,bin.length);
              for(let j=i;j<end;j++)obBytes[j]=bin.charCodeAt(j);
              if(i+50000<bin.length)await new Promise(r=>setTimeout(r,0));
            }
          }else if(obMeta.git_url){
            // Large file: fetch via git blob API
            const blobRes=await fetch(obMeta.git_url,{
              headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}
            });
            if(blobRes.ok){
              const blobData=await blobRes.json();
              const b64=blobData.content.replace(/[\n\r]/g,"");
              await new Promise(r=>setTimeout(r,0));
              const bin=atob(b64);obBytes=new Uint8Array(bin.length);
              for(let i=0;i<bin.length;i+=50000){
                const end=Math.min(i+50000,bin.length);
                for(let j=i;j<end;j++)obBytes[j]=bin.charCodeAt(j);
                if(i+50000<bin.length)await new Promise(r=>setTimeout(r,0));
              }
            }
          }
          if(obBytes){
            // Parse OB after a tick to avoid blocking
            await new Promise(r=>setTimeout(r,0));
            const obWb=XLSX.read(obBytes,{type:"array"});
            const obWs=obWb.Sheets[obWb.SheetNames[0]];
            obMapResult=parseOB(obWs);
          }
        }
      }catch(obErr){
        console.warn("OB data fetch failed (non-fatal):",obErr.message);
        // Continue without OB data — planning board still works
      }

      // Yield to browser before setting state to avoid blocking render
      if(showLoading)setLoadStatus("Rendering planning board...");
      await new Promise(r=>setTimeout(r,0));
      setStyles(parsed.styles);
      await new Promise(r=>setTimeout(r,0));
      setObMap(obMapResult);
      setLastUpdated(new Date());
      setLoadError(null);
      setRefreshing(false);
      if(showLoading)setPage("board");
    }catch(err){
      console.error("GitHub fetch error:",err);
      // Show last known data if available, otherwise show error screen
      setLoadError(err.message);
      setRefreshing(false);
      if(styles.length===0)setPage("error");
      else if(showLoading)setPage("board");// show stale data
    }
  }

  useEffect(()=>{fetchFromGitHub(true);},[]);
  useEffect(()=>{
    const t=setInterval(()=>fetchFromGitHub(false),REFRESH_INTERVAL);
    return()=>clearInterval(t);
  },[]);

  const tabs=[{id:"board",icon:"ti-layout-kanban",label:"Planning Board"},{id:"styles",icon:"ti-shirt",label:"Style Manager"}];

  if(page==="loading")return el(LoadingScreen,{status:loadStatus});
  // Refreshing overlay — shown during background refresh

  if(page==="error")return el("div",{style:{minHeight:"100vh",background:NAVY,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}},
    el("i",{className:"ti ti-wifi-off",style:{fontSize:52,color:"rgba(255,255,255,.25)"}}),
    el("h2",{style:{color:"#fff",fontSize:18,fontWeight:600,margin:0}},"Could not load planning data"),
    el("p",{style:{color:"rgba(255,255,255,.4)",fontSize:13,maxWidth:360,textAlign:"center",lineHeight:1.6}},loadError),
    el("button",{onClick:()=>{setPage("loading");fetchFromGitHub(true);},
      style:{padding:"10px 28px",background:ORANGE,color:"#fff",border:"none",
        borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",marginTop:8}},"Retry")
  );

  return el("div",{style:{minHeight:"100vh",background:"#F0F2F7",display:"flex",flexDirection:"column"}},
    refreshing&&el("div",{style:{position:"fixed",top:60,left:"50%",transform:"translateX(-50%)",
      zIndex:9999,background:"rgba(11,42,74,.92)",color:"#fff",
      padding:"8px 20px",borderRadius:20,fontSize:12,fontWeight:600,
      display:"flex",alignItems:"center",gap:8,boxShadow:"0 4px 20px rgba(0,0,0,.3)"}},
      el("i",{className:"ti ti-refresh",style:{fontSize:14,animation:"spin 1s linear infinite"}}),
      "Refreshing data..."
    ),

    showSimGroupInfo&&el("div",{onClick:()=>setShowSimGroupInfo(false),
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:24}},
      el("div",{onClick:e=>e.stopPropagation(),style:{background:"#fff",borderRadius:14,padding:24,maxWidth:640,width:"100%",
        maxHeight:"80vh",display:"flex",flexDirection:"column",gap:14,boxShadow:"0 20px 60px rgba(0,0,0,.3)"}},
        el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          el("h2",{style:{margin:0,fontSize:18,fontWeight:700,color:"#0f172a"}},"Similarity Groups"),
          el("button",{onClick:()=>setShowSimGroupInfo(false),style:{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#94a3b8"}},"×")
        ),
        el("p",{style:{margin:0,fontSize:12,color:"#64748b"}},"Grouped by ≥90% op name similarity. Same color = similar work."),

            style:{padding:"5px 10px",border:"none",background:"transparent",color:"rgba(255,255,255,.7)",fontSize:15,cursor:"pointer",fontWeight:700,lineHeight:1}},"−"),
          el("span",{style:{fontSize:11,color:"rgba(255,255,255,.6)",padding:"0 2px",minWidth:36,textAlign:"center",fontWeight:500}},Math.round(boardZoom*100)+"%"),
          el("button",{onClick:()=>setBoardZoom(z=>Math.min(1.5,+(z+.1).toFixed(1))),
            style:{padding:"5px 10px",border:"none",background:"transparent",color:"rgba(255,255,255,.7)",fontSize:15,cursor:"pointer",fontWeight:700,lineHeight:1}},"+")
        ),
        el("div",{style:{display:"flex",alignItems:"center",gap:6}},
          el("span",{style:{color:"rgba(255,255,255,.25)",fontSize:10}},"Powered by"),
          el("img",{src:"https://www.end2end.lk/images/logo-2.png",alt:"End2End",height:24,
            style:{filter:"none",opacity:1,background:"rgba(255,255,255,.9)",borderRadius:5,padding:"2px 7px"},
            onError:ev=>ev.target.style.display="none"})
        )
      )
    ),

    el("div",{style:{background:NAVY,borderBottom:"3px solid "+ORANGE,display:"flex",padding:"0 22px",gap:2,flexShrink:0}},
      tabs.map(t=>el("button",{key:t.id,onClick:()=>setPage(t.id),style:{
        background:page===t.id?ORANGE:"transparent",border:"none",
        color:page===t.id?"#fff":"rgba(255,255,255,.55)",
        padding:"10px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:7,
        fontSize:13,fontWeight:page===t.id?600:400,borderRadius:"4px 4px 0 0"}},
        el("i",{className:"ti "+t.icon,style:{fontSize:15}}),t.label
      ))
    ),

    page==="board"&&styles.length>0&&el("div",{style:{background:NAVY,padding:"6px 22px",
      display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",flexShrink:0}},
      el("span",{style:{color:"rgba(255,255,255,.4)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,flexShrink:0}},"Legend:"),
      GMT_COLORS_MAP.map(([gmt,color])=>
        el("div",{key:gmt,style:{display:"flex",alignItems:"center",gap:4}},
          el("div",{style:{width:9,height:9,borderRadius:"50%",background:color,flexShrink:0}}),
          el("span",{style:{fontSize:10,color:"rgba(255,255,255,.6)",whiteSpace:"nowrap"}},gmt)
        )
      )
    ),

    page==="board"&&simShowPanel&&el("div",{style:{background:"#1a2744",borderBottom:"1px solid #2d3f6e",padding:"0 22px",flexShrink:0}},
      el("div",{style:{display:"flex",gap:0,borderBottom:"1px solid #2d3f6e"}},
        [["consecutive","Consecutive Similarity"],["line","Line Similarity"]].map(([id,label])=>
          el("button",{key:id,onClick:()=>{setSimSubTab(id);if(id==="consecutive"){setLineSimMode(false);setLineSimSelectedId(null);}if(id==="line")setSimMode(false);},
            style:{padding:"8px 18px",border:"none",background:"transparent",cursor:"pointer",fontSize:12,
              fontWeight:simSubTab===id?700:400,color:simSubTab===id?"#fde68a":"rgba(255,255,255,.45)",
              borderBottom:simSubTab===id?"2px solid "+ORANGE:"2px solid transparent",marginBottom:-1}},label)
        )
      ),
      simSubTab==="consecutive"&&el("div",{style:{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",padding:"10px 0"}},
        el("span",{style:{color:"rgba(255,255,255,.5)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1}},"Match by:"),
        [["description","Operation Name"],["mcCode","Machine Code"],["gmtType","Garment Type"]].map(([k,label])=>
          el("label",{key:k,style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",color:"rgba(255,255,255,.75)",fontSize:12}},
            el("input",{type:"checkbox",checked:simFilters[k],onChange:e=>setSimFilters(p=>({...p,[k]:e.target.checked})),
              style:{width:14,height:14,accentColor:ORANGE,cursor:"pointer"}}),label)
        ),
        el("div",{style:{width:1,height:18,background:"rgba(255,255,255,.15)"}}),
        el("button",{onClick:()=>setSimMode(m=>!m),disabled:!Object.values(simFilters).some(Boolean),
          style:{padding:"5px 14px",borderRadius:6,border:"none",fontSize:11,fontWeight:700,cursor:"pointer",
            background:simMode?ORANGE:"rgba(255,255,255,.15)",color:"#fff"}},simMode?"✓ ON — Click to Hide":"Apply & Show"),
        simMode&&el("button",{onClick:()=>setSimMode(false),
          style:{padding:"5px 10px",borderRadius:6,border:"0.5px solid rgba(255,255,255,.2)",background:"transparent",color:"rgba(255,255,255,.5)",fontSize:11,cursor:"pointer"}},"Reset"),
        el("div",{style:{marginLeft:"auto",fontSize:10,color:"rgba(255,255,255,.35)",fontFamily:"'DM Mono',monospace"}},
          Object.keys(obMap).length>0?"OB: "+Object.keys(obMap).length+" styles":"⚠ No OB data"),
        simMode&&el("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
          [["#16a34a","80–100%"],["#2563eb","60–80%"],["#ca8a04","40–60%"],["#dc2626","20–40%"],["#6b7280","0–20%"]].map(([c,l])=>
            el("div",{key:l,style:{display:"flex",alignItems:"center",gap:4}},
              el("div",{style:{width:10,height:10,borderRadius:"50%",background:c}}),
              el("span",{style:{fontSize:10,color:"rgba(255,255,255,.55)"}},l)))
        )
      ),
      simSubTab==="line"&&el("div",{style:{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",padding:"10px 0"}},
        el("span",{style:{color:"rgba(255,255,255,.5)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1}},"Match by:"),
        [["description","Operation Name"],["mcCode","Machine Code"],["gmtType","Garment Type"]].map(([k,label])=>
          el("label",{key:k,style:{display:"flex",alignItems:"center",gap:5,cursor:"pointer",color:"rgba(255,255,255,.75)",fontSize:12}},
            el("input",{type:"checkbox",checked:lineSimFilters[k],onChange:e=>setLineSimFilters(p=>({...p,[k]:e.target.checked})),
              style:{width:14,height:14,accentColor:"#a78bfa",cursor:"pointer"}}),label)
        ),
        el("div",{style:{width:1,height:18,background:"rgba(255,255,255,.15)"}}),
        el("span",{style:{color:"rgba(255,255,255,.5)",fontSize:11}},"Threshold:"),
        el("input",{type:"number",value:lineSimThreshold,min:0,max:100,step:5,
          onChange:e=>setLineSimThreshold(parseInt(e.target.value)||80),
          style:{width:56,padding:"3px 7px",borderRadius:5,border:"0.5px solid rgba(255,255,255,.2)",
            background:"rgba(255,255,255,.08)",color:"#fff",fontSize:12,textAlign:"center"}}),
        el("span",{style:{color:"rgba(255,255,255,.4)",fontSize:11}},"%"),
        el("div",{style:{width:1,height:18,background:"rgba(255,255,255,.15)"}}),
        el("button",{onClick:()=>{if(lineSimMode){setLineSimMode(false);setLineSimSelectedId(null);}else setLineSimMode(true);},
          style:{padding:"5px 14px",borderRadius:6,border:"none",fontSize:11,fontWeight:700,cursor:"pointer",
            background:lineSimMode?"#7c3aed":"rgba(255,255,255,.15)",color:"#fff"}},
          lineSimMode?"✓ Line Sim ON — Click to disable":"Enable Line Similarity"),
        lineSimMode&&el("button",{onClick:()=>{setLineSimMode(false);setLineSimSelectedId(null);},
          style:{padding:"5px 10px",borderRadius:6,border:"0.5px solid rgba(255,255,255,.2)",background:"transparent",color:"rgba(255,255,255,.5)",fontSize:11,cursor:"pointer"}},"Reset"),
        lineSimMode&&el("span",{style:{fontSize:11,color:"rgba(255,255,255,.4)",fontStyle:"italic"}},
          lineSimSelectedId?"Click another block to compare":"← Click any block to select it"),
        el("div",{style:{marginLeft:"auto",fontSize:10,color:"rgba(255,255,255,.35)",fontFamily:"'DM Mono',monospace"}},
          Object.keys(obMap).length>0?"OB: "+Object.keys(obMap).length+" styles":"⚠ No OB data")
      )
    ),

    page==="board"&&(styles.length===0
      ?el("div",{style:{padding:40,textAlign:"center",color:"#94a3b8",fontSize:14}},"Loading data...")
      :el(ErrorBoundary,{key:"pb"},
          el(PlanningBoardView,{styles,colorMode,onEdit:null,selectMode,selectedId,
            onSelectStyle:id=>setSelectedId(p=>p===id?null:id),key:"pbv",
            simMode,simFilters,obMap,highlightId:null,
            lineSimMode,lineSimFilters,lineSimThreshold,
            lineSimSelectedId,onLineSimSelect:id=>setLineSimSelectedId(p=>p===id?null:id),
            alwaysSimFilters,simGroups,boardZoom})
        )
    ),
    page==="styles"&&el(StyleManagerPage,{styles,obMap,onExport:null})
  );
}

ReactDOM.render(el(ErrorBoundary,{},el(ViewerApp,{})),document.getElementById("root"));

</script>
</body>
</html>
