  constructor(p){super(p);this.state={error:null};}

  }
}

function toD(v){
  if(v===null||v===undefined||v==="")return null;
  if(v instanceof Date){
    const d=new Date(v.getFullYear(),v.getMonth(),v.getDate());
    d.setHours(0,0,0,0);return d;
  }
  if(typeof v==="number"){
    if(v>40000){
      // Excel serial number -> local date
      const d=new Date(Math.round((v-25569)*86400*1000));
      const dt=new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
      dt.setHours(0,0,0,0);return dt;
    }
    return null;
  }
  if(typeof v==="string"){
    const s=v.trim();
    const iso=s.slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){
      const pts=iso.split("-").map(Number);
      const dt=new Date(pts[0],pts[1]-1,pts[2]);dt.setHours(0,0,0,0);return dt;
    }
    const d=new Date(s);
    if(!isNaN(d)){const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());dt.setHours(0,0,0,0);return dt;}
  }
  return null;
}

function excelSerialToDate(serial){
  if(!serial&&serial!==0)return null;
  if(serial instanceof Date){const d=new Date(serial);d.setHours(0,0,0,0);return d;}
  if(typeof serial==="string"){
    const n=parseFloat(serial);
    if(!isNaN(n)&&n>40000)serial=n;
    else{const d=new Date(serial);d.setHours(0,0,0,0);return isNaN(d)?null:d;}
  }
  if(typeof serial==="number"&&serial>40000){
    // Convert Excel serial to local midnight date (avoid UTC offset issues)
    const utcMs=Math.round((serial-25569)*86400*1000);
    const utcDate=new Date(utcMs);
    // Use local date parts to create a local midnight date
    const d=new Date(utcDate.getUTCFullYear(),utcDate.getUTCMonth(),utcDate.getUTCDate());
    d.setHours(0,0,0,0);return d;
  }
  return null;
}
// ─── Working-hours time helpers (Phase 1: time-precise blocks) ──────────────
const WORK_START_MIN=7*60;      // 7:00 AM
const WORK_END_MIN=18*60+30;    // 6:30 PM
const WORK_SPAN_MIN=WORK_END_MIN-WORK_START_MIN;
// Parse a "time of day" cell (Excel time serial fraction, JS Date, or string) into minutes since midnight.
// Returns null if blank/dash/unparseable.
function parseTimeOfDay(val){
  if(val===null||val===undefined||val==="")return null;
  if(val instanceof Date){
    return val.getHours()*60+val.getMinutes();
  }
  if(typeof val==="number"){
    // Excel time-only cells come through as a fraction of a day (0..1)
    if(val>=0&&val<1)return Math.round(val*1440);
    // Full datetime serial (has both date+time) — extract the fractional part
    if(val>1){
      const frac=val-Math.floor(val);
      return Math.round(frac*1440);
    }
    return 0;
  }
  if(typeof val==="string"){
    const s=val.trim();
    if(!s||s==="-")return null;
    // Try "H:MM AM/PM" or "HH:MM" formats
    const m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?$/);
    if(m){
      let h=parseInt(m[1],10);const min=parseInt(m[2],10);
      const ap=m[3]?m[3].toUpperCase():null;
      if(ap==="PM"&&h!==12)h+=12;
      if(ap==="AM"&&h===12)h=0;
      return h*60+min;
    }
    const d=new Date(s);
    if(!isNaN(d))return d.getHours()*60+d.getMinutes();
    return null;
  }
  return null;
}
// Combine a date-only value (from excelSerialToDate, local midnight) with a time-of-day
// (minutes since midnight, from parseTimeOfDay). Falls back to fallbackMin if time is missing.
// Result is clamped into the working window [WORK_START_MIN, WORK_END_MIN].
function combineDateAndTime(dateOnly,timeMinutes,fallbackMin){
  if(!dateOnly)return null;
  let mins=(timeMinutes==null)?fallbackMin:timeMinutes;
  mins=Math.max(WORK_START_MIN,Math.min(WORK_END_MIN,mins));
  const d=new Date(dateOnly);
  d.setHours(Math.floor(mins/60),mins%60,0,0);
  return d;
}
// Fractional day-index for a time-precise datetime, given a map of "YYYY-MM-DD" -> integer day index.
// e.g. 10:32 AM on a day whose index is 3 → 3 + (10:32-7:00)/(18:30-7:00)
function dateTimeToFracIndex(dt,dateIndexMap){
  if(!dt)return null;
  const dayIdx=dateIndexMap[ds(dt)];
  if(dayIdx==null)return null;
  const mins=dt.getHours()*60+dt.getMinutes();
  const clamped=Math.max(WORK_START_MIN,Math.min(WORK_END_MIN,mins));
  const frac=(clamped-WORK_START_MIN)/WORK_SPAN_MIN;
  return dayIdx+frac;
}
function fmtDateShort(d){if(!d)return"—";return d.getDate()+" "+MONS[d.getMonth()];}
function fmtTimeOfDay(d){
  if(!d)return"";
  let h=d.getHours(),m=d.getMinutes();
  const ap=h>=12?"PM":"AM";
  h=h%12;if(h===0)h=12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;
}
function fmtDateTime(d){if(!d)return"—";return fmtDate(d)+", "+fmtTimeOfDay(d);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function diffDays(a,b){return Math.round((b-a)/(86400*1000));}
// Add N working days (Mon-Sat) to a date
function addWorkingDays(startDate,n){
  let cur=new Date(startDate);cur.setHours(0,0,0,0);
  let added=0;
  while(added<n){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)added++;// skip Sunday
  }
  return cur;
}
// Get the date that is exactly N working days after startDate (inclusive of start = day 1)
function workingDayEnd(startDate,prodDays){
  // Start date is day 1. We need to go prodDays-1 more working days forward.
  let cur=new Date(startDate);cur.setHours(0,0,0,0);
  let count=1;
  while(count<prodDays){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)count++;
  }
  return cur;
}
// Get next working day after a date
function nextWorkingDay(d){
  let cur=new Date(d);cur.setHours(0,0,0,0);
  do{cur.setDate(cur.getDate()+1);}while(cur.getDay()===0);
  return cur;
}
// Split merged block sub-styles proportionally from a new start date on a new line
function splitMergedProportional(subStyles,newStart,newLine){
  let cursor=new Date(newStart);cursor.setHours(0,0,0,0);
  // Skip if cursor is Sunday
  while(cursor.getDay()===0)cursor.setDate(cursor.getDate()+1);
  return subStyles.map((sub,i)=>{
    const days=Math.max(1,sub.prodDays||1);
    const subStart=new Date(cursor);
    const subEnd=workingDayEnd(subStart,days);
    const updated={...sub,
      line:newLine,
      startDate:new Date(subStart),
      endDate:new Date(subEnd),
      dailyQty:r2((sub.plnQty||0)/days),
    };
    // Move cursor to next working day after subEnd
    cursor=nextWorkingDay(subEnd);
    return updated;
  });
}

function parseOB(sheet){
  const rawRows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
  if(!rawRows.length)return{};
  const hdrRaw=rawRows[0].map(h=>String(h||"").trim());
  function findCol(candidates){
    for(const c of candidates){
      const idx=hdrRaw.findIndex(h=>h.toLowerCase()===c.toLowerCase());
      if(idx>=0)return idx;
    }
    for(const c of candidates){
      const idx=hdrRaw.findIndex(h=>h.toLowerCase().includes(c.toLowerCase()));
      if(idx>=0)return idx;
    }
    return -1;
  }
  const C={
    styleNo:findCol(["Style Number","StyleNumber","Style No","Style_Number"]),
    desc:findCol(["Description","Desc","Operation"]),
    mcCode:findCol(["Mc Code","MC Code","McCode","Machine Code","Mc_Code"]),
    dept:findCol(["Department","Dept"]),
    smv:findCol(["SMV","Smv"]),
    gsdsmv:findCol(["GSDSMV","GSD SMV","GsdSmv"]),
    gmtType:findCol(["Garment Type","GarmentType","GMT Type"]),
  };
  const map={};
  for(let i=1;i<rawRows.length;i++){
    const row=rawRows[i];
    if(!row||!row.length)continue;
    const sn=C.styleNo>=0?String(row[C.styleNo]||"").trim():"";
    if(!sn||sn==="null")continue;
    if(!map[sn])map[sn]={smv:0,ops:[],_keys:new Set()};
    const smvVal=C.smv>=0?parseFloat(row[C.smv])||0:0;
    if(smvVal>map[sn].smv)map[sn].smv=smvVal;
    const desc=C.desc>=0?String(row[C.desc]||"").trim():"";
    if(desc){
      const op={
        description:desc,
        mcCode:C.mcCode>=0?String(row[C.mcCode]||"").trim():"",
        department:C.dept>=0?String(row[C.dept]||"").trim():"",
        gsdsmv:C.gsdsmv>=0?parseFloat(row[C.gsdsmv])||0:0,
      };
      const key=op.description+"||"+op.mcCode+"||"+op.department+"||"+op.gsdsmv;
      if(!map[sn]._keys.has(key)){map[sn]._keys.add(key);map[sn].ops.push(op);}
    }
  }
  return map;
}

function parseFRPlan(sheet){
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
  if(!rows.length)throw new Error("Empty FR Plan sheet");
  const hdr=rows[0].map(h=>String(h||"").trim());
  // col() tries exact match then case-insensitive match
  const col=n=>{
    let i=hdr.indexOf(n);
    if(i>=0)return i;
    const nl=n.toLowerCase();
    i=hdr.findIndex(h=>h.toLowerCase()===nl);
    return i;// -1 if not found
  };

  // colAny() tries multiple alternate names
  const colAny=(...names)=>{for(const n of names){const i=col(n);if(i>=0)return i;}return -1;};
  const C={
    facLine:col("Fac/Line"),acc:col("ACC"),styleNo:col("STYLE-NO"),
    styleOpt:col("Style# Optional"),gmtType:col("GMT TYPE"),
    ordQty:col("Ord Qty"),prdDys:col("PRD DYS"),plnQty:col("PLN QTY"),
    eff:col("Eff %"),tgt:col("TGT"),th:colAny("TH","T/H","T.H"),
    tgtCut:colAny("TGT CUT","TGT_CUT","TGTCUT","Tgt Cut","TARGET CUT","TGT cut"),
    st:col("ST"),fi:col("FI"),delDate:colAny("Del Date","DEL DATE","Del date","Delivery Date"),
    merchant:col("Merchant"),
    mergeGroup:col("SGL_MergeGroup"),// optional merge tag column
    prodStartTime:colAny("Production start time","Production Start Time","PRODUCTION START TIME","Prod Start Time","Production Start"),
    prodEndTime:colAny("Production end time","Production End Time","PRODUCTION END TIME","Prod End Time","Production End","Prod Finish Time","Production Finish Time")
  };
  const hasTimeCols=C.prodStartTime>=0&&C.prodEndTime>=0;

  // Group consecutive rows by STYLE-NO — v2 per-line gap detection
  const groups=[];
  let cur=null;
  let lastKeyByLine={};
  for(let i=1;i<rows.length;i++){
    const row=rows[i];
    const styleNo=String(row[C.styleNo]||"").trim();
    if(!styleNo||styleNo==="-")continue;
    const facLine=String(row[C.facLine]||"").trim();
    if(!facLine)continue;
    const key=facLine+"||"+styleNo;
    const acc=String(row[C.acc]||"").trim();
    const styleOpt=String(row[C.styleOpt]||"").trim();
    const isSummaryRow=!acc&&!styleOpt;
    // Use per-line lastKey tracking — global lastKey fails when lines interleave
    const lineLastKey=lastKeyByLine[facLine]||null;
    const isGap=!isSummaryRow&&cur&&cur.key===key&&lineLastKey!==null&&lineLastKey!==key;
    if(!cur||cur.key!==key||isGap){
      if(cur)groups.push(cur);
      const mg=C.mergeGroup>=0?String(row[C.mergeGroup]||"").trim():"";
      cur={key,facLine,styleNo,rows:[],summaryRow:null,mergeGroup:mg||null};
    }
    if(!isSummaryRow)lastKeyByLine[facLine]=key;
    if(isSummaryRow){cur.summaryRow=row;}else{cur.rows.push(row);}
  }
  if(cur)groups.push(cur);

  const styleColorMap={};let colorIdx=0;

  const styles=groups.map(g=>{
    const isSingleEntry=g.rows.length===0;
    const summaryRow=g.summaryRow||(isSingleEntry?g.rows[0]||null:null);
    const detailRows=isSingleEntry?[]:g.rows;

    // If no summary row but has detail rows, use last detail row as summary
    const sRow=summaryRow||(detailRows.length?detailRows[detailRows.length-1]:null);
    if(!sRow)return null;

    // Line number from Fac/Line
    const facLine=g.facLine;
    const lineNum=parseInt(facLine.replace(/\D/g,""))||1;

    // Style name from first detail row's Style# Optional, or single row
    const firstRow=isSingleEntry?(g.rows[0]||sRow):detailRows[0];
    // Last detail row (the one immediately above the summary row) supplies the end time
    const lastRow=isSingleEntry?(g.rows[0]||sRow):detailRows[detailRows.length-1];
    const styleOptName=firstRow?String(firstRow[C.styleOpt]||"").trim():"";
    const styleDisplayName=styleOptName||g.styleNo;

    // PRD DYS: sum detail rows (or single row's value)
    let prdDysSum=0;
    if(isSingleEntry){
      prdDysSum=parseFloat(sRow[C.prdDys])||0;
    }else{
      detailRows.forEach(r=>{prdDysSum+=parseFloat(r[C.prdDys])||0;});
    }
    const prodDays=Math.max(1,roundPrdDys(prdDysSum));

    // From summary row (dates, quantities)
    const plnQty=parseFloat(sRow[C.plnQty])||0;
    const ordQty=parseFloat(sRow[C.ordQty])||0;
    const eff=parseFloat(sRow[C.eff])||0;
    const tgt=parseFloat(sRow[C.tgt])||0;
    const th=parseFloat(sRow[C.th])||0;
    // GMT TYPE: summary row has it blank — read from first detail row (or single row)
    const gmtSourceRow=firstRow||sRow;
    const gmtType=String(gmtSourceRow[C.gmtType]||sRow[C.gmtType]||"").trim();
    const merchant=String(sRow[C.merchant]||"").trim();

    // Time-precise boundaries: date comes from the summary row's ST/FI,
    // the clock time comes from the first detail row (start) / last detail row (end).
    // Falls back to a full 7:00–18:30 working day when time columns are absent (e.g. old-format files,
    // or single-entry styles with no detail rows).
    const stDateOnly=excelSerialToDate(sRow[C.st]);
    const fiDateOnly=excelSerialToDate(sRow[C.fi]);
    const startTimeMin=hasTimeCols&&firstRow?parseTimeOfDay(firstRow[C.prodStartTime]):null;
    const endTimeMin=hasTimeCols&&lastRow?parseTimeOfDay(lastRow[C.prodEndTime]):null;
    const startDate=combineDateAndTime(stDateOnly,startTimeMin,WORK_START_MIN);
    const endDate=combineDateAndTime(fiDateOnly,endTimeMin,WORK_END_MIN);
    const delDate=excelSerialToDate(sRow[C.delDate]);
    const _rawTgtCut=sRow[C.tgtCut];
    const tgtCutDate=excelSerialToDate(_rawTgtCut);


    const dailyQty=prodDays>0?r2(plnQty/prodDays):0;

    // Keep the real per-row quantity + time-window "chunks" that make up this style (before
    // they get combined into the single total above) — this is what lets the Dashboard tab
    // show a truthful day-by-day quantity spread instead of an invented smooth average.
    // When a row's own ST/FI + time are usable, that's its real window; otherwise it chains
    // on from the previous chunk's end, sized by its own PRD DYS (or a proportional fallback).
    const chunks=[];
    if(isSingleEntry){
      chunks.push({qty:plnQty,startDate,endDate});
    }else{
      let cursor=new Date(startDate);
      detailRows.forEach(row=>{
        const rowQty=parseFloat(row[C.plnQty])||0;
        const ownSTdate=excelSerialToDate(row[C.st]);
        const ownFIdate=excelSerialToDate(row[C.fi]);
        const ownStartMin=hasTimeCols?parseTimeOfDay(row[C.prodStartTime]):null;
        const ownEndMin=hasTimeCols?parseTimeOfDay(row[C.prodEndTime]):null;
        let cStart=(ownSTdate&&ownStartMin!=null)?combineDateAndTime(ownSTdate,ownStartMin,WORK_START_MIN):new Date(cursor);
        let cEnd=(ownFIdate&&ownEndMin!=null)?combineDateAndTime(ownFIdate,ownEndMin,WORK_END_MIN):null;
        if(!cEnd||cEnd<=cStart){
          const ownDys=parseFloat(row[C.prdDys])||0;
          const durMin=ownDys>0?ownDys*WORK_SPAN_MIN:Math.max(1,WORK_SPAN_MIN*(plnQty>0?rowQty/plnQty:1/detailRows.length));
          cEnd=addWorkMinutes(cStart,Math.max(1,durMin));
        }
        chunks.push({qty:rowQty,startDate:cStart,endDate:cEnd});
        cursor=new Date(cEnd.getTime()+60000);
        if(cursor.getHours()*60+cursor.getMinutes()>WORK_END_MIN){cursor=nextWorkDay(cursor);cursor.setHours(7,0,0,0);}
      });
    }

    if(!styleColorMap[styleDisplayName]){
      styleColorMap[styleDisplayName]=STYLE_COLORS[colorIdx%STYLE_COLORS.length];
      colorIdx++;
    }

    return{
      id:uid(),
      styleNo:g.styleNo,
      styleName:styleDisplayName,
      gmtType,
      line:lineNum,
      startDate,
      endDate,
      delDate,
      tgtCutDate,
      plnQty,
      ordQty,
      eff,
      tgt,
      th,
      prodDays,
      prdDysSum:r2(prdDysSum),
      dailyQty,
      chunks,// real per-row quantity+time windows, for the Dashboard's day-by-day breakdown
      merchant,
      styleColor:styleColorMap[styleDisplayName],
      isSingleEntry,
      mergeGroup:g.mergeGroup||null,// SGL_MergeGroup tag from Excel
      // for canvas editing
      locked:false,
      notes:"",
      operations:[],
      operationsConfirmed:false,
      isNew:false,
    };
  }).filter(Boolean);

  // Attach raw data to each style for faithful GitHub save
  const styleIdToGroupIdx={};
  styles.forEach((s,i)=>{if(s)styleIdToGroupIdx[s.id]=i;});

  // Deduplicate by styleNo+line
  const seen=new Set();
  const dedupedStyles=styles.filter(s=>{
    // Use styleNo + line + startDate so same style appearing twice on same line
    // with different dates are kept as separate blocks (not deduped)
    const key=s.styleNo+"||"+s.line+"||"+(s.startDate?s.startDate.getTime():0);
    if(seen.has(key))return false;
    seen.add(key);return true;
  });

  // Auto-merge: group styles that share same SGL_MergeGroup tag
  const mergeTagged=dedupedStyles.filter(s=>s.mergeGroup);
  const untagged=dedupedStyles.filter(s=>!s.mergeGroup);
  const mergeGroups={};
  mergeTagged.forEach(s=>{
    if(!mergeGroups[s.mergeGroup])mergeGroups[s.mergeGroup]=[];
    mergeGroups[s.mergeGroup].push(s);
  });
  const autoMerged=Object.entries(mergeGroups).map(([mgId,subs])=>{
    const sorted=[...subs].sort((a,b)=>a.startDate-b.startDate);
    const mergedId=uid();
    return{
      id:mergedId,
      styleName:sorted.map(s=>s.styleName).join(" + "),
      gmtType:sorted[0].gmtType,
      line:sorted[0].line,
      startDate:new Date(sorted[0].startDate),
      endDate:new Date(sorted[sorted.length-1].endDate),
      delDate:sorted[0].delDate,
      tgtCutDate:sorted[0].tgtCutDate,
      plnQty:sorted.reduce((a,s)=>a+(s.plnQty||0),0),
      ordQty:sorted.reduce((a,s)=>a+(s.ordQty||0),0),
      eff:Math.round(sorted.reduce((a,s)=>a+(s.eff||0),0)/sorted.length),
      tgt:sorted.reduce((a,s)=>a+(s.tgt||0),0),th:sorted[0].th||0,
      prodDays:sorted.reduce((a,s)=>a+(s.prodDays||0),0),
      dailyQty:0,merchant:sorted[0].merchant,
      styleColor:sorted[0].styleColor,
      isMerged:true,mergeGroup:mgId,
      subStyles:sorted.map(s=>({...s})),
      locked:false,notes:"",operations:[],operationsConfirmed:false,isNew:false,isSingleEntry:false,
    };
  });
  autoMerged.forEach(m=>{m.dailyQty=r2(m.plnQty/Math.max(1,m.prodDays));});

  const finalStyles=[...untagged,...autoMerged];

  // Time-precision buffer: if one style's block ends at the exact same instant the
  // next style on the same line starts, nudge the next style's start forward 1 minute
  // so the two blocks don't visually collide at the boundary.
  if(hasTimeCols){
    const byLineArr={};
    finalStyles.forEach(s=>{if(!byLineArr[s.line])byLineArr[s.line]=[];byLineArr[s.line].push(s);});
    Object.values(byLineArr).forEach(arr=>{
      arr.sort((a,b)=>a.startDate-b.startDate);
      for(let i=0;i<arr.length-1;i++){
        const a=arr[i],b=arr[i+1];
        if(a.endDate&&b.startDate&&a.endDate.getTime()===b.startDate.getTime()){
          b.startDate=new Date(a.endDate.getTime()+60*1000);
        }
      }
    });
  }

  return {styles:finalStyles, rawRows:rows, rawHdr:hdr, colIndices:C, groups};
}

// ─── Parse OB file ────────────────────────────────────────────────────────────
function PlanningBoardView({styles,colorMode,onEdit,selectMode,selectedId,onSelectStyle,
  simMode=false,simFilters={description:true},obMap={},highlightId=null,
  lineSimMode=false,lineSimFilters={description:true},lineSimThreshold=80,
  lineSimSelectedId=null,onLineSimSelect=null,alwaysSimFilters={description:true,mcCode:false,gmtType:false},
  simGroups=null,boardZoom=1,setBoardZoom=null,dateRangeOverride=null,gmtFocus=null}){
  // Build similarity data if sim mode is on
  const simData=useMemo(()=>(simMode&&typeof buildLineSimilarities==="function")?buildLineSimilarities(styles,obMap,simFilters):{},[simMode,styles,obMap,simFilters]);
  // Always-on consecutive similarity data (no color, just labels) — disabled in this app since
  // it depends on an OB-data comparison function that isn't available/compatible here; every
  // other Planning Board feature (time precision, zoom, legend, tiers, etc.) is unaffected.
  const alwaysSimData=useMemo(()=>({}),[]);

  const lineSimData=useMemo(()=>{
    if(!lineSimMode||!lineSimSelectedId||typeof buildLineSimilarityForStyle!=="function")return{};
    const sel=styles.find(s=>s.id===lineSimSelectedId);
    if(!sel)return{};
    const res=buildLineSimilarityForStyle(sel,styles,obMap,lineSimFilters);
    const vals=Object.values(res).filter(v=>!v.isSelf&&v.pct!==null).map(v=>v.pct).sort((a,b)=>b-a);
    console.log('[LineSim] selected:',sel.styleName,'results:',vals.slice(0,10),'threshold:',lineSimThreshold);
    return res;
  },[lineSimMode,lineSimSelectedId,styles,obMap,lineSimFilters]);
  const {show,hide,move,Tooltip}=useTooltip();
  // Zoom scales actual pixel dimensions (not CSS transform) so sticky headers/labels keep working.
  const zColW=COL_W*boardZoom, zRowH=ROW_H*boardZoom, zLblW=LBL_W*boardZoom;
  // Extra header row height reserved for sub-hour time ticks at higher zoom (see TICK_STEP_MIN below).
  const baseHdrH=HDR_H*boardZoom;
  const tickRowH=boardZoom>=1.25?18:0;
  const zHdrH=baseHdrH+tickRowH;
  // Scale block-content font sizes/padding with zoom too, so text never gets clipped
  // by the shrinking row height at low zoom — everything shrinks together, in proportion.
  const fz=n=>Math.max(5,Math.round(n*boardZoom*10)/10);
  const pd=n=>Math.round(n*boardZoom*10)/10;
  // Scroll container ref + focused-block popover state (for cursor-anchored zoom & click-to-focus)
  const scrollRef=useRef(null);
  const [focusPopover,setFocusPopover]=useState(null); // {id, x, y} — click-to-focus detail popover for small/medium blocks

  // ── Two independent, non-interfering zoom mechanisms ────────────────────────
  // 1) Ctrl/Cmd + mouse-wheel — anchors to the exact point under the cursor (Premiere-style).
  //    It resolves its own scroll position immediately, and flags wheelTriggeredRef so the
  //    button/reset effect below knows to leave it alone.
  // 2) Toolbar +/− and Reset buttons — anchor to the center of the current viewport instead,
  //    since there's no cursor position associated with a button click. Handled entirely by
  //    the useEffect below, independently of the wheel shortcut.
  const wheelTriggeredRef=useRef(false);
  const prevZoomRef=useRef(boardZoom);

  const handleWheelZoom=useCallback(e=>{
    if(!(e.ctrlKey||e.metaKey)||!setBoardZoom)return;
    e.preventDefault();
    const el2=scrollRef.current;if(!el2)return;
    const rect=el2.getBoundingClientRect();
    const cursorX=e.clientX-rect.left; // px from left edge of the visible scroll viewport
    const contentX=el2.scrollLeft+cursorX-zLblW; // px from timeline origin (after the sticky label column)
    const timeUnits=contentX/zColW; // fractional day-index under the cursor, independent of zoom
    const dir=e.deltaY<0?1.12:1/1.12;
    wheelTriggeredRef.current=true;
    setBoardZoom(z=>{
      const nz=Math.max(.25,Math.min(8,+(z*dir).toFixed(4)));
      // After React re-renders at the new zoom, restore the same time-under-cursor position.
      requestAnimationFrame(()=>{
        const el3=scrollRef.current;if(!el3)return;
        const newColW=COL_W*nz;
        el3.scrollLeft=Math.max(0,timeUnits*newColW-cursorX+LBL_W*nz);
      });
      return nz;
    });
  },[setBoardZoom,zColW,zLblW]);

  // Button/reset-triggered zoom: anchor to the center of the current viewport.
  // Skipped entirely when the change came from the wheel shortcut above (that already
  // handled its own, more precise cursor-anchored scroll adjustment) — so the two
  // mechanisms never fight over scrollLeft.
  useEffect(()=>{
    const el2=scrollRef.current;
    const oldZoom=prevZoomRef.current;
    if(el2&&oldZoom!==boardZoom){
      if(!wheelTriggeredRef.current){
        const rect=el2.getBoundingClientRect();
        const centerX=rect.width/2;
        const oldColW=COL_W*oldZoom,oldLblW=LBL_W*oldZoom;
        const contentX=el2.scrollLeft+centerX-oldLblW;
        const timeUnits=contentX/oldColW;
        const newColW=COL_W*boardZoom,newLblW=LBL_W*boardZoom;
        el2.scrollLeft=Math.max(0,timeUnits*newColW-centerX+newLblW);
      }
      wheelTriggeredRef.current=false;
    }
    prevZoomRef.current=boardZoom;
  },[boardZoom]);

  if(!styles.length)return el(NoData,{});

  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  let minDate=null,maxDate=null;
  if(dateRangeOverride&&dateRangeOverride.start&&dateRangeOverride.end){
    // Clip the visible date range to exactly what was requested (e.g. a Compact View filter),
    // instead of stretching to fit every style's full extent — a style overlapping the edge of
    // the requested window can otherwise run far beyond it and make the whole board unnecessarily wide.
    minDate=dateRangeOverride.start;maxDate=dateRangeOverride.end;
  }else{
    styles.forEach(s=>{
      if(s.startDate&&(!minDate||s.startDate<minDate))minDate=s.startDate;
      if(s.endDate&&(!maxDate||s.endDate>maxDate))maxDate=s.endDate;
      if(s.delDate&&(!maxDate||s.delDate>maxDate))maxDate=s.delDate;
    });
  }
  if(!minDate||!maxDate)return el(NoData,{});
  // Build working dates: Mon–Sat only (exclude Sundays)
  const allDates=[];
  let cur=new Date(minDate);cur.setHours(0,0,0,0);
  const eod=new Date(maxDate);eod.setHours(0,0,0,0);
  while(cur<=eod){
    if(cur.getDay()!==0)allDates.push(new Date(cur)); // skip Sunday
    cur.setDate(cur.getDate()+1);
  }

  const dateIndex={};allDates.forEach((d,i)=>{dateIndex[ds(d)]=i;});

  function getColor(s){
    if(colorMode==="garment")return getGmtColor(s.gmtType);
    if(colorMode==="simgroup"&&simGroups)return simGroups.colorMap[s.id]||"#4B5563";
    return s.styleColor;
  }

  // Note: with time-precise start/end (Phase 1), blocks are positioned by exact
  // fractional time-of-day rather than whole days, and the 1-minute buffer applied
  // at import time already keeps touching blocks from visually colliding — so the
  // old whole-day computeVisualDates nudging is no longer needed here.

  // Month groups for header
  const monthGroups=[];
  allDates.forEach((d,i)=>{
    const label=MONS[d.getMonth()]+" "+d.getFullYear();
    if(!monthGroups.length||monthGroups[monthGroups.length-1].label!==label)
      monthGroups.push({label,count:0,idx:i});
    monthGroups[monthGroups.length-1].count++;
  });

  const totalW=zLblW+allDates.length*zColW;

  // Delivery date line for selected style in select mode
  const selectedStyle=selectedId?styles.find(s=>s.id===selectedId):null;
  let delLineX=null;
  if(selectMode&&selectedStyle&&selectedStyle.delDate){
    const di=dateIndex[ds(selectedStyle.delDate)];
    if(di!=null)delLineX=zLblW+di*zColW+zColW/2;
  }

  return el("div",{style:{position:"relative",height:"100%",display:"flex",flexDirection:"column"}},
    Tooltip,
    el("div",{ref:scrollRef,onWheel:handleWheelZoom,className:"board-scroll",
      style:{flex:1,overflowX:"auto",overflowY:"auto",border:"none",background:"#fff"}},
      el("div",{style:{width:totalW,position:"relative"}},

        // Month header
        el("div",{style:{position:"sticky",top:0,zIndex:30,height:baseHdrH/2,display:"flex",background:NAVY,marginLeft:zLblW}},
          monthGroups.map((m,i)=>el("div",{key:i,style:{width:m.count*zColW,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",borderRight:"1px solid rgba(255,255,255,.1)"}},
            el("span",{style:{color:"rgba(255,255,255,.9)",fontSize:11,fontWeight:600,fontFamily:"'DM Mono',monospace"}},m.label)
          ))
        ),

        // Day header
        el("div",{style:{position:"sticky",top:baseHdrH/2,zIndex:30,height:baseHdrH/2,display:"flex",background:"#132f4c",marginLeft:zLblW}},
          allDates.map((d,i)=>el("div",{key:i,style:{width:zColW,flexShrink:0,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",borderRight:"1px solid rgba(255,255,255,.07)",
            background:d.getDay()===6?"rgba(0,0,0,.18)":"transparent"}},
            el("span",{style:{color:d.getDay()===6?"rgba(255,255,255,.5)":"rgba(255,255,255,.9)",fontSize:11,fontWeight:600}},d.getDate()),
            el("span",{style:{color:d.getDay()===6?"rgba(255,255,255,.4)":"rgba(255,255,255,.45)",fontSize:9,fontFamily:"'DM Mono',monospace"}},DAYS[d.getDay()])
          ))
        ),

        // Sub-hour time ticks (Premiere-style): shown once zoomed in enough to be legible,
        // and keep subdividing further the more you zoom in — hourly → 15 min → 5 min.
        tickRowH>0&&el("div",{style:{position:"sticky",top:baseHdrH,zIndex:29,height:tickRowH,
          background:"#0c2540",marginLeft:zLblW,borderBottom:"1px solid rgba(255,255,255,.12)",overflow:"hidden"}},
          (()=>{
            const stepMin=boardZoom<1.5?60:(boardZoom<5?15:5);
            // Hour marks (07:00, 08:00...) are always spaced a full 60 minutes apart regardless of
            // how fine the sub-ticks below them get, so they get their own — always roomier — label
            // visibility check. Only the finer sub-ticks (15/5-min) hide their labels when cramped,
            // while still drawing the tick line so the ruler stays continuous.
            const pxPerHour=60/WORK_SPAN_MIN*zColW;
            const pxPerTick=stepMin/WORK_SPAN_MIN*zColW;
            const showHourLabel=pxPerHour>=20;
            const showSubLabel=pxPerTick>=20;
            const ticks=[];
            allDates.forEach((d,di)=>{
              for(let m=WORK_START_MIN;m<=WORK_END_MIN;m+=stepMin){
                const frac=(m-WORK_START_MIN)/WORK_SPAN_MIN;
                const left=di*zColW+frac*zColW;
                const hh=Math.floor(m/60),mm=m%60;
                const isHourMark=mm===0;
                const showLabel=isHourMark?showHourLabel:showSubLabel;
                ticks.push(el("div",{key:di+"-"+m,style:{position:"absolute",left,top:0,bottom:0,
                  display:"flex",alignItems:"center",paddingLeft:2,
                  borderLeft:"1px solid rgba(255,255,255,"+(isHourMark?".28":".15")+")"}},
                  showLabel&&el("span",{style:{fontSize:7,fontWeight:isHourMark?600:400,
                    color:"rgba(255,255,255,"+(isHourMark?".8":".5")+")",fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}},
                    String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"))
                ));
              }
            });
            return el("div",{style:{position:"relative",width:allDates.length*zColW,height:"100%"}},ticks);
          })()
        ),

        // Delivery date line (red vertical line for selected style)
        delLineX!=null&&el("div",{style:{position:"absolute",top:zHdrH,bottom:0,left:delLineX,width:2,
          background:"#ef4444",zIndex:25,pointerEvents:"none"},
          title:"Delivery: "+fmtDate(selectedStyle.delDate)},
          el("div",{style:{position:"sticky",top:zHdrH+4,background:"#ef4444",color:"#fff",
            fontSize:9,padding:"2px 4px",borderRadius:3,whiteSpace:"nowrap",fontWeight:600,
            fontFamily:"'DM Mono',monospace",width:"fit-content",transform:"translateX(-50%)"}},
            "DEL "+fmtDateShort(selectedStyle.delDate))
        ),

        // Lines
        allLines.map((line,li)=>{
          const lineStyles=styles.filter(s=>s.line===line).sort((a,b)=>a.startDate-b.startDate);

          return el("div",{key:line,style:{display:"flex",borderBottom:"1.5px solid rgba(0,0,0,.32)",minHeight:zRowH}},
            // Line label

// ─── Canvas Editor ────────────────────────────────────────────────────────────
// ── Auto-Shift helpers ─────────────────────────────────────────────────────

// Next working day after date d (skips Sunday — Mon-Sat are working days)
function nextWorkDay(d){
  const n=new Date(d);n.setHours(0,0,0,0);
  n.setDate(n.getDate()+1);
  if(n.getDay()===0)n.setDate(n.getDate()+1);
  return n;
}

// Duration in calendar days (inclusive) preserving original prodDays
function getDur(s){
  if(s.prodDays&&s.prodDays>0)return s.prodDays;
  if(s.startDate&&s.endDate){
    const ms=new Date(s.endDate)-new Date(s.startDate);
    return Math.max(1,Math.round(ms/86400000)+1);
  }
  return 1;
}

// Add N working days to start → returns end date (start = day 1)
function addWorkDays(start,days){
  let cur=new Date(start);cur.setHours(0,0,0,0);
  let added=1;
  while(added<days){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)added++;
  }
  return cur;
}

// Repack all blocks on a line in chronological order, no gaps, preserving durations
// startFrom: the date the first block in the sorted list should start from
// Only repacks blocks whose startDate >= fromDate (blocks before are left alone)
function repackLine(allStyles,line,fromDate){
  const all=allStyles.filter(s=>s.line===line)
    .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
  if(all.length===0)return allStyles;

  // Split into "before" (untouched) and "after" (to repack)
  const fd=new Date(fromDate);fd.setHours(0,0,0,0);
  const before=all.filter(s=>new Date(s.startDate)<fd);
  const after=all.filter(s=>new Date(s.startDate)>=fd);

  // Cursor starts: day after last "before" block ends, or fromDate
  let cursor;
  if(before.length>0){
    cursor=nextWorkDay(before[before.length-1].endDate);
  }else{
    cursor=new Date(fd);
  }

  const repacked=after.map(s=>{
    const dur=getDur(s);
    const ns=new Date(cursor);ns.setHours(0,0,0,0);
    const ne=addWorkDays(ns,dur);
    cursor=nextWorkDay(ne);
    return{...s,startDate:ns,endDate:ne,prodDays:dur,dailyQty:r2(s.plnQty/dur)};
  });

  const updMap=new Map(repacked.map(s=>[s.id,s]));
  return allStyles.map(s=>updMap.has(s.id)?updMap.get(s.id):s);
}

// After removing a block from a line, repack from the gap position
function autoShiftAfterRemove(allStyles,line,removedStartDate){
  return repackLine(allStyles,line,removedStartDate);
}

// After placing/moving a block onto a line, repack from its start date
function autoShiftLine(allStyles,line,anchorId,anchorStart){
  // Ensure anchor block has correct start date first
  const withAnchor=allStyles.map(s=>{
    if(s.id!==anchorId)return s;
    const ns=new Date(anchorStart);ns.setHours(0,0,0,0);
    const dur=getDur(s);
    const ne=addWorkDays(ns,dur);
    return{...s,startDate:ns,endDate:ne,prodDays:dur,dailyQty:r2(s.plnQty/dur)};
  });
  return repackLine(withAnchor,line,anchorStart);
}

// ─── Time-precise duration & auto-shift helpers (Canvas Editor Phase 2) ─────
// Total working-minutes between two datetimes, walking day by day through the
// 7:00 AM–6:30 PM window and skipping Sundays — the time-aware equivalent of getDur().
function durationWorkMinutes(startDate,endDate){
  if(!startDate||!endDate)return WORK_SPAN_MIN;
  let cur=new Date(startDate);
  let total=0;
  let guard=0;
  while(guard++<400){
    if(ds(cur)===ds(endDate)){
      const curMin=cur.getHours()*60+cur.getMinutes();
      const endMin=endDate.getHours()*60+endDate.getMinutes();
      total+=Math.max(0,endMin-curMin);
      break;
    }
    const curMin=cur.getHours()*60+cur.getMinutes();
    total+=Math.max(0,WORK_END_MIN-curMin);
    cur=nextWorkDay(cur);cur.setHours(7,0,0,0);
  }
  return Math.max(1,total);
}
// Add N working-minutes to a start datetime, rolling over to 7:00 AM the next
// working day (skipping Sunday) whenever it would pass 6:30 PM — the time-aware
// equivalent of addWorkDays().
function addWorkMinutes(start,minutes){
  let cur=new Date(start);
  let remaining=minutes;
  let guard=0;
  while(remaining>0&&guard++<400){
    const curMin=cur.getHours()*60+cur.getMinutes();
    const availToday=WORK_END_MIN-curMin;
    if(remaining<=availToday){
      const target=curMin+remaining;
      cur.setHours(Math.floor(target/60),target%60,0,0);
      remaining=0;
    }else{
      remaining-=availToday;
      cur=nextWorkDay(cur);cur.setHours(7,0,0,0);
    }
  }
  return cur;
}
// Repack all blocks on a line in chronological order with a strict 1-minute gap,
// preserving each block's real duration — the time-aware equivalent of repackLine().
// Only blocks starting at/after fromDateTime get shifted; earlier blocks are untouched.
function repackLineTime(allStyles,line,fromDateTime){
  const all=allStyles.filter(s=>s.line===line)
    .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
  if(all.length===0)return allStyles;
  const fd=new Date(fromDateTime);
  const before=all.filter(s=>new Date(s.startDate)<fd);
  const after=all.filter(s=>new Date(s.startDate)>=fd);
  let cursor=before.length>0
    ? new Date(before[before.length-1].endDate.getTime()+60000) // +1 min gap after last "before" block
    : new Date(fd);
  // Clamp cursor into the working window in case it starts right at/after 6:30 PM
  if(cursor.getHours()*60+cursor.getMinutes()>WORK_END_MIN){cursor=nextWorkDay(cursor);cursor.setHours(7,0,0,0);}
  const repacked=after.map(s=>{
    const durMin=durationWorkMinutes(s.startDate,s.endDate);
    const ns=new Date(cursor);
    const ne=addWorkMinutes(ns,durMin);
    cursor=new Date(ne.getTime()+60000); // 1-minute gap before the next block
    if(cursor.getHours()*60+cursor.getMinutes()>WORK_END_MIN){cursor=nextWorkDay(cursor);cursor.setHours(7,0,0,0);}
    const days=Math.max(1,Math.round((ne-ns)/86400000)+1);
    return{...s,startDate:ns,endDate:ne,prodDays:days,dailyQty:r2(s.plnQty/Math.max(durMin/WORK_SPAN_MIN,1/24))};
  });
  const updMap=new Map(repacked.map(s=>[s.id,s]));
  return allStyles.map(s=>updMap.has(s.id)?updMap.get(s.id):s);
}
// After placing/moving a block onto a line at an exact time, repack everything
// on that line that comes after it — the time-aware equivalent of autoShiftLine().
function autoShiftLineTime(allStyles,line,anchorId,anchorStart){
  return repackLineTime(allStyles,line,anchorStart);
}
// After removing/moving a block away from a line, close the gap — the time-aware
// equivalent of autoShiftAfterRemove().
function autoShiftAfterRemoveTime(allStyles,line,removedStartDate){
  return repackLineTime(allStyles,line,removedStartDate);
}

// Spread a style's real chunks (see parseFRPlan) across calendar days — when a single chunk
// crosses midnight (like a batch running from 5pm one day to 10am the next), its quantity is
// split between the two days proportional to the working hours it actually occupies on each.
// Also tracks the earliest/latest clock time actually worked on each day, for display.
function dayByDayFromChunks(chunks){
  const byDay={}; // "YYYY-M-D" -> {qty, from:Date, to:Date}
  (chunks||[]).forEach(ch=>{
    if(!ch.startDate||!ch.endDate||!ch.qty)return;
    const totalMin=durationWorkMinutes(ch.startDate,ch.endDate);
    if(totalMin<=0)return;
    let cur=new Date(ch.startDate);
    let guard=0;
    while(cur<ch.endDate&&guard++<60){
      const dayKey=ds(cur);
      const dayEnd=new Date(cur);dayEnd.setHours(18,30,0,0);
      const segEnd=ch.endDate<dayEnd?ch.endDate:dayEnd;
      const segMin=Math.max(0,(segEnd-cur)/60000);
      const segQty=r2(ch.qty*(segMin/totalMin));
      if(!byDay[dayKey])byDay[dayKey]={qty:0,from:new Date(cur),to:new Date(segEnd)};
      byDay[dayKey].qty+=segQty;
      if(cur<byDay[dayKey].from)byDay[dayKey].from=new Date(cur);
      if(segEnd>byDay[dayKey].to)byDay[dayKey].to=new Date(segEnd);
      cur=nextWorkDay(segEnd);cur.setHours(7,0,0,0);
      if(segEnd>=ch.endDate)break;
    }
  });
  return byDay;
}
function SettingsTab({smvConfig,setSmvConfig,settings,setSettings}){

  const [newMcInputs,setNewMcInputs]=useState({});
  function addSmvType(){
    const n=newTypeName.trim().toUpperCase();
    if(!n||smvConfig.find(s=>s.name===n))return;
    const color=SMV_COLORS[smvConfig.length%SMV_COLORS.length];
    const ns=[...smvConfig,{id:uid(),name:n,color,departments:[]}];
    setSmvConfig(ns);saveLS(LS_SMV,ns);setNewTypeName("");
  }
  function removeSmvType(id){const ns=smvConfig.filter(s=>s.id!==id);setSmvConfig(ns);saveLS(LS_SMV,ns);}
  function addDept(stId){
    const val=(newDeptInputs[stId]||"").trim().toUpperCase();if(!val)return;
    const ns=smvConfig.map(s=>s.id!==stId?s:{...s,departments:[...s.departments,{id:uid(),name:val,mcCodes:[]}]});

  function removeDept(stId,dId){const ns=smvConfig.map(s=>s.id!==stId?s:{...s,departments:s.departments.filter(d=>d.id!==dId)});setSmvConfig(ns);saveLS(LS_SMV,ns);}
  function addMc(stId,dId){
    const key=stId+"_"+dId;const val=(newMcInputs[key]||"").trim().toUpperCase();if(!val)return;
    const ns=smvConfig.map(s=>s.id!==stId?s:{...s,departments:s.departments.map(d=>d.id!==dId?d:{...d,mcCodes:[...d.mcCodes,val]})});

              el("span",{style:{fontSize:13,color:"#94a3b8"}},unit)

// ── Style Manager Tab ─────────────────────────────────────────────────────────
function StyleManagerTab({styles,obMap,smvConfig,opSelections,setOpSelections}){
  const [styleSearch,setStyleSearch]=useState("");
  const [gmtFilter,setGmtFilter]=useState("All");
  const [lineFilter,setLineFilter]=useState("All");
  const [opsFilter,setOpsFilter]=useState("all");
  const [dateFrom,setDateFrom]=useState("");
  const [dateTo,setDateTo]=useState("");
  const [showSuggestions,setShowSuggestions]=useState(false);
  const [expanded,setExpanded]=useState({});

  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);

  // Build MC code -> SMV type map from smvConfig
  const mcToSmv=useMemo(()=>{
    const map={};
    smvConfig.forEach(st=>st.departments.forEach(d=>d.mcCodes.forEach(mc=>{map[mc]=st.name;})));
    return map;
  },[smvConfig]);

  // When smvConfig changes, drop auto-assigned selections so getOpSel re-derives from fresh mcToSmv
  // Also clear user-overridden ops whose smvType no longer exists in smvConfig
  useEffect(()=>{
    const validSmvTypes=new Set(smvConfig.map(st=>st.name));
    setOpSelections(prev=>{
      const updated={};
      Object.entries(prev).forEach(([styleId,sel])=>{
        const kept={};
        Object.entries(sel).forEach(([i,opSel])=>{
          if(opSel._userOverride&&validSmvTypes.has(opSel.smvType)){
            kept[i]=opSel;// keep only if SMV type still exists
          }
          // auto-assigned and overrides with deleted type are dropped
        });
        if(Object.keys(kept).length>0)updated[styleId]=kept;
      });
      return updated;
    });
  },[mcToSmv,smvConfig]);

  function hasObs(s){const ob=obMap[s.styleName];return ob&&ob.ops&&ob.ops.length>0;}

  // Get or init operation selections for a style
  function getOpSel(s){
    if(opSelections[s.id])return opSelections[s.id];
    const ob=obMap[s.styleName];
    if(!ob||!ob.ops)return{};
    const sel={};
    ob.ops.forEach((op,i)=>{
      const smvType=mcToSmv[op.mcCode]||null;
      sel[i]={included:!!smvType,smvType:smvType||"",op};
    });
    return sel;
  }

  const filtered=styles.filter(s=>{
    if(lineFilter!=="All"&&String(s.line)!==String(lineFilter))return false;
    if(opsFilter==="has"&&!hasObs(s))return false;
    if(opsFilter==="missing"&&hasObs(s))return false;
    if(styleSearch&&!s.styleName.toLowerCase().includes(styleSearch.toLowerCase()))return false;
    if(gmtFilter!=="All"&&s.gmtType!==gmtFilter)return false;
    if(dateFrom){const df=new Date(dateFrom);if(s.endDate&&s.endDate<df)return false;}
    if(dateTo){const dt=new Date(dateTo);if(s.startDate&&s.startDate>dt)return false;}
    return true;
  });

  const allGmtTypes=["All",...new Set(styles.map(s=>s.gmtType).filter(Boolean))].sort();
  const suggestions=styleSearch.length>=1
    ?styles.map(s=>s.styleName).filter((n,i,a)=>a.indexOf(n)===i&&n.toLowerCase().includes(styleSearch.toLowerCase())).slice(0,8)
    :[];
  return el("div",{style:{display:"flex",flexDirection:"column",gap:14}},
    // Summary stats
    el("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}},
      [
        {label:"Total Styles",value:styles.length,icon:"ti-shirt",color:NAVY,bg:"#EEF2F8"},
        {label:"Have OB Data",value:styles.filter(hasObs).length,icon:"ti-clipboard-check",color:"#0369a1",bg:"#f0f9ff"},
        {label:"Missing OB Data",value:styles.filter(s=>!hasObs(s)).length,icon:"ti-alert-circle",color:"#dc2626",bg:"#fef2f2"},
        {label:"Lines",value:allLines.length,icon:"ti-layout-rows",color:"#16a34a",bg:"#f0fdf4"},
      ].map(({label,value,icon,color,bg})=>
        el("div",{key:label,style:{background:"#fff",border:"0.5px solid #e2e8f0",borderRadius:12,padding:"16px 18px",display:"flex",alignItems:"center",gap:14}},
          el("div",{style:{width:40,height:40,borderRadius:10,background:bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
            el("i",{className:"ti "+icon,style:{fontSize:20,color}})),
          el("div",{},
            el("div",{style:{fontSize:22,fontWeight:800,color:"#0f172a",lineHeight:1}},value),
            el("div",{style:{fontSize:12,color:"#64748b",marginTop:3}},label)
          )
        )
      )
    ),
    el(Card,{style:{padding:0,overflow:"hidden"}},
      // Enhanced filter bar
      el("div",{style:{padding:"14px 18px",background:"#fafafa",borderBottom:"1px solid #f1f5f9",display:"flex",flexDirection:"column",gap:10}},
        // Row 1: Style Name autocomplete + GMT Type + Line + OB filter
        el("div",{style:{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-start"}},
          // Style Name with autocomplete
          el("div",{style:{flex:"2",minWidth:220,position:"relative"}},
            el("div",{style:{position:"relative"}},
              el("i",{className:"ti ti-search",style:{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#94a3b8",fontSize:13,pointerEvents:"none"}}),
              el("input",{placeholder:"Search style name...",value:styleSearch,
                onChange:e=>{setStyleSearch(e.target.value);setShowSuggestions(true);},
                onFocus:()=>setShowSuggestions(true),
                onBlur:()=>setTimeout(()=>setShowSuggestions(false),150),
                style:{width:"100%",padding:"8px 12px 8px 32px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:13,boxSizing:"border-box"}}),
              styleSearch&&el("button",{onClick:()=>{setStyleSearch("");setShowSuggestions(false);},
                style:{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",
                  background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:16,lineHeight:1}},"×")
            ),
            showSuggestions&&suggestions.length>0&&el("div",{style:{
              position:"absolute",top:"100%",left:0,right:0,zIndex:100,
              background:"#fff",border:"0.5px solid #cbd5e1",borderRadius:7,
              boxShadow:"0 4px 16px rgba(0,0,0,.12)",maxHeight:220,overflowY:"auto",marginTop:2}},
              suggestions.map(name=>{
                const lo=name.toLowerCase(),sl=styleSearch.toLowerCase(),idx=lo.indexOf(sl);
                return el("div",{key:name,
                  onMouseDown:()=>{setStyleSearch(name);setShowSuggestions(false);},
                  style:{padding:"8px 14px",cursor:"pointer",fontSize:13,color:"#0f172a",
                    borderBottom:"0.5px solid #f1f5f9",background:"#fff"},
                  onMouseEnter:e=>e.currentTarget.style.background="#f0f9ff",
                  onMouseLeave:e=>e.currentTarget.style.background="#fff"},
                  el("span",{},name.substring(0,idx)),
                  el("span",{style:{background:"#bfdbfe",borderRadius:2}},name.substring(idx,idx+styleSearch.length)),
                  el("span",{},name.substring(idx+styleSearch.length))
                );
              })
            )
          ),
          // GMT Type
          el("select",{value:gmtFilter,onChange:e=>setGmtFilter(e.target.value),
            style:{flex:"1",minWidth:150,padding:"8px 12px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:13,background:"#fff",color:gmtFilter==="All"?"#94a3b8":"#0f172a"}},
            allGmtTypes.map(g=>el("option",{key:g,value:g},g==="All"?"All Garment Types":g))
          ),
          // Line
          el("select",{value:lineFilter,onChange:e=>setLineFilter(e.target.value),
            style:{flex:"1",minWidth:120,padding:"8px 12px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:13,background:"#fff",color:lineFilter==="All"?"#94a3b8":"#0f172a"}},
            el("option",{value:"All"},"All Lines"),
            allLines.map(l=>el("option",{key:l,value:l},"Line "+l))
          ),
          // OB filter
          el("div",{style:{display:"flex",gap:0,borderRadius:7,overflow:"hidden",border:"0.5px solid #cbd5e1",flexShrink:0}},
            [["all","All"],["has","\u2705 Has Ops"],["missing","\u26a0 Missing"]].map(([v,label])=>
              el("button",{key:v,onClick:()=>setOpsFilter(v),style:{
                padding:"8px 12px",border:"none",fontSize:12,fontWeight:600,cursor:"pointer",
                background:opsFilter===v?NAVY:"#fff",color:opsFilter===v?"#fff":"#64748b",
                borderRight:v!=="missing"?"0.5px solid #cbd5e1":"none"}},label)
            )
          )
        ),
        // Row 2: Date range
        el("div",{style:{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}},
          el("span",{style:{fontSize:11,fontWeight:600,color:"#94a3b8",flexShrink:0}},"Date Range (optional):"),
          el("div",{style:{display:"flex",alignItems:"center",gap:6}},
            el("span",{style:{fontSize:12,color:"#94a3b8"}},"From"),
            el("input",{type:"date",value:dateFrom,onChange:e=>setDateFrom(e.target.value),
              style:{padding:"6px 10px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:12}})
          ),
          el("div",{style:{display:"flex",alignItems:"center",gap:6}},
            el("span",{style:{fontSize:12,color:"#94a3b8"}},"To"),
            el("input",{type:"date",value:dateTo,onChange:e=>setDateTo(e.target.value),
              style:{padding:"6px 10px",border:"0.5px solid #cbd5e1",borderRadius:7,fontSize:12}})

          el("span",{style:{fontSize:11,color:"#94a3b8",marginLeft:"auto"}},filtered.length+" / "+styles.length+" styles")
        )

      el("div",{style:{padding:0}},

          return el("div",{key:s.id,style:{borderBottom:"0.5px solid #f1f5f9"}},
            // Style row header
            el("div",{onClick:()=>setExpanded(p=>({...p,[s.id]:!p[s.id]})),
              style:{padding:"12px 18px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",
                background:isExp?"#f0f9ff":"#fff"}},
              el("div",{style:{width:10,height:10,borderRadius:"50%",background:s.styleColor||"#4B5563",flexShrink:0}}),
              el("div",{style:{flex:1,minWidth:0}},
                el("div",{style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}},
                  el("span",{style:{fontWeight:700,fontSize:13,color:"#0f172a"}},s.styleName),
                  !hasOp&&el("span",{style:{fontSize:10,color:"#92400e",background:"#fef3c7",padding:"2px 7px",borderRadius:20,border:"0.5px solid #fde68a"}},"No operations"),
                ),
                el("div",{style:{display:"flex",gap:12,fontSize:11,color:"#64748b",flexWrap:"wrap"}},
                  el("span",{},"Line "+s.line),
                  el("span",{},s.gmtType),
                  el("span",{},(s.plnQty||0).toLocaleString()+" pcs"),
                  el("span",{},fmtDate(s.startDate)+" → "+fmtDate(s.endDate)),
                  s.delDate&&el("span",{style:{color:"#dc2626",fontWeight:500}},"Del: "+fmtDate(s.delDate))
                )
              ),
              hasOp&&el("span",{style:{fontSize:11,fontWeight:600,color:NAVY,flexShrink:0}},ob.ops.length+" ops"),
              el("div",{style:{width:24,height:24,borderRadius:"50%",background:isExp?NAVY:"#f1f5f9",
                display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
                el("i",{className:"ti "+(isExp?"ti-chevron-up":"ti-chevron-down"),style:{fontSize:12,color:isExp?"#fff":"#64748b"}})
              )
            ),
            // Expanded ops panel
            isExp&&el(OpPanel,{s,ob,hasOp,sel,mcToSmv,smvConfig,setOpSelections,obMap})
          );
        })
      )
    )
  );
}

// Separate component so each style has its own filter state
function OpPanel({s,ob,hasOp,sel,mcToSmv,smvConfig,setOpSelections,obMap}){
  const [deptF,setDeptF]=useState("All");
  const [smvF,setSmvF]=useState("All");
  const [mcF,setMcF]=useState("");

  if(!hasOp)return el("div",{style:{background:"#f8fafc",borderTop:"0.5px solid #e2e8f0",
    padding:"16px 18px",color:"#92400e",fontSize:13,display:"flex",alignItems:"center",gap:8}},
    el("i",{className:"ti ti-alert-circle",style:{fontSize:16}}),
    "No operations data for this style. Upload OB file and save to GitHub.");

  const allDepts=[...new Set(ob.ops.map(o=>o.department).filter(Boolean))].sort();
  const allSmvTypes=[...new Set(ob.ops.map(o=>mcToSmv[o.mcCode]).filter(Boolean))].sort();

  const filteredOps=ob.ops.filter((op,i)=>{
    if(deptF!=="All"&&op.department!==deptF)return false;
    if(smvF!=="All"&&mcToSmv[op.mcCode]!==smvF)return false;
    if(mcF&&!op.mcCode.toLowerCase().includes(mcF.toLowerCase()))return false;
    return true;
  });

  // Compute live SMV totals per type from current selections
  const smvTotals=useMemo(()=>{
    const totals={};
    smvConfig.forEach(st=>{totals[st.name]={total:0,color:st.color,ops:0};});
    ob.ops.forEach((op,i)=>{
      const opSel=sel[i]||{included:!!mcToSmv[op.mcCode],smvType:mcToSmv[op.mcCode]||""};
      if(opSel.included&&opSel.smvType&&opSel.smvType!==""&&totals[opSel.smvType]!==undefined){
        totals[opSel.smvType].total+=op.gsdsmv||0;
        totals[opSel.smvType].ops++;
      }
    });
    return totals;
  },[sel,ob,smvConfig,mcToSmv]);

  return el("div",{style:{background:"#f8fafc",borderTop:"0.5px solid #e2e8f0"}},
    // SMV KPI cards — live totals per type
    el("div",{style:{display:"flex",gap:10,padding:"12px 18px",background:"#fff",
      borderBottom:"0.5px solid #f1f5f9",flexWrap:"wrap"}},
      smvConfig.map(st=>{
        const tot=smvTotals[st.name]||{total:0,ops:0,color:st.color};
        return el("div",{key:st.name,style:{
          display:"flex",alignItems:"center",gap:10,padding:"8px 14px",
          borderRadius:9,border:"1.5px solid "+st.color+"30",
          background:st.color+"08",flex:"1 1 120px",minWidth:100}},
          el("div",{style:{width:10,height:10,borderRadius:"50%",background:st.color,flexShrink:0}}),
          el("div",{},
            el("div",{style:{fontSize:18,fontWeight:800,color:st.color,lineHeight:1,fontFamily:"monospace"}},
              tot.total.toFixed(3)),
            el("div",{style:{fontSize:10,fontWeight:600,color:"#64748b",marginTop:2}},
              st.name+" GSD SMV"),
            el("div",{style:{fontSize:9,color:"#94a3b8"}},
              tot.ops+" ops included")
          )
        );
      })
    ),
    // Op filters bar
    el("div",{style:{display:"flex",gap:8,padding:"10px 18px",background:"#f1f5f9",
      borderBottom:"0.5px solid #e2e8f0",flexWrap:"wrap",alignItems:"center"}},
      el("span",{style:{fontSize:11,fontWeight:600,color:"#64748b"}},"Filter:"),
      el("select",{value:deptF,onChange:e=>setDeptF(e.target.value),
        style:{padding:"4px 8px",border:"0.5px solid #cbd5e1",borderRadius:5,fontSize:11,background:"#fff",color:"#374151"}},
        el("option",{value:"All"},"All Depts"),
        allDepts.map(d=>el("option",{key:d,value:d},d))
      ),
      el("select",{value:smvF,onChange:e=>setSmvF(e.target.value),
        style:{padding:"4px 8px",border:"0.5px solid #cbd5e1",borderRadius:5,fontSize:11,background:"#fff",color:"#374151"}},
        el("option",{value:"All"},"All SMV Types"),
        allSmvTypes.map(t=>el("option",{key:t,value:t},t))
      ),
      el("input",{value:mcF,onChange:e=>setMcF(e.target.value),placeholder:"MC Code...",
        style:{padding:"4px 8px",border:"0.5px solid #cbd5e1",borderRadius:5,fontSize:11,
          background:"#fff",color:"#374151",width:90}}),
      el("span",{style:{fontSize:11,color:"#94a3b8"}},filteredOps.length+" / "+ob.ops.length+" ops")
    ),
    // Ops table header
    el("div",{style:{display:"grid",gridTemplateColumns:"40px 1fr 80px 80px 70px 100px",
      padding:"6px 18px",background:"#f1f5f9",fontSize:10,fontWeight:700,color:"#94a3b8",
      textTransform:"uppercase",letterSpacing:.5,gap:8}},
      ["Use","Description","MC Code","Dept","GSD SMV","SMV Type"].map(h=>el("span",{key:h},h))
    ),
    el("div",{style:{maxHeight:300,overflowY:"auto"}},
      filteredOps.map((op)=>{
        const i=ob.ops.indexOf(op);
        const opSel=sel[i]||{included:!!mcToSmv[op.mcCode],smvType:mcToSmv[op.mcCode]||"",op};
        return el("div",{key:i,style:{display:"grid",gridTemplateColumns:"40px 1fr 80px 80px 70px 100px",
          padding:"7px 18px",borderBottom:"0.5px solid #f1f5f9",
          background:opSel.included?"#f0f9ff":"#fff",alignItems:"center",gap:8}},
          el("input",{type:"checkbox",checked:opSel.included,
            onChange:e=>{const ns={...sel,[i]:{...opSel,included:e.target.checked,_userOverride:true}};setOpSelections(p=>({...p,[s.id]:ns}));},
            style:{cursor:"pointer"}}),
          el("span",{style:{fontSize:12,color:"#0f172a"}},op.description||"—"),
          el("span",{style:{fontSize:11,color:"#475569",fontFamily:"monospace"}},op.mcCode||"—"),
          el("span",{style:{fontSize:10,padding:"2px 6px",borderRadius:20,
            background:op.department==="FIN"?"#dcfce7":op.department==="SEW"?"#dbeafe":op.department==="PCK"?"#fef3c7":"#f3e8ff",
            color:op.department==="FIN"?"#15803d":op.department==="SEW"?"#1d4ed8":op.department==="PCK"?"#92400e":"#6d28d9",
            width:"fit-content"}},op.department||"—"),
          el("span",{style:{fontSize:11,color:"#475569",fontFamily:"monospace",textAlign:"right"}},(op.gsdsmv||0).toFixed(3)),
          el("select",{value:opSel.smvType,
            onChange:e=>{const ns={...sel,[i]:{...opSel,smvType:e.target.value,_userOverride:true}};setOpSelections(p=>({...p,[s.id]:ns}));},
            style:{padding:"3px 6px",border:"0.5px solid "+(opSel.smvType?"#cbd5e1":"#f59e0b"),
              borderRadius:5,fontSize:11,
              background:opSel.smvType?"#fff":"#fffbeb",
              color:opSel.smvType?"#374151":"#92400e"}},
            el("option",{value:""},"— none —"),
            smvConfig.map(st=>el("option",{key:st.name,value:st.name},st.name))
          )
        );
      })
    )
  );

}


// ── Calculate Tab ─────────────────────────────────────────────────────────────
// ── Manpower Dashboard Component ─────────────────────────────────────────────
function ManpowerDashboard({results,allLines,settings,activeStyles,fromDate,toDate,ds,r2,NAVY,ORANGE}){
  const LINE_COLORS=["#2563EB","#7C3AED","#DB2777","#0D9488","#D97706","#DC2626","#4F46E5","#059669","#EA580C"];
  const cadre=settings.actualCadre||80;
  const [selectedLines,setSelectedLines]=useState(()=>new Set(allLines.map(String)));

  // Build daily totals
  const dates=results.dates;
  const dailyData=dates.map(d=>{
    const dStr=ds(d);
    const spmOnly=r2(allLines.reduce((a,l)=>{const r=results.lineRes[l]?.[dStr];return a+(r?r.spmTotal:0);},0));
    const helpOnly=r2(allLines.reduce((a,l)=>{const r=results.lineRes[l]?.[dStr];return a+(r?r.helpTotal:0);},0));
    const spm=r2(allLines.reduce((a,l)=>{const r=results.lineRes[l]?.[dStr];return a+(r?r.total:0);},0));
    const absent=r2(allLines.reduce((a,l)=>{const r=results.lineRes[l]?.[dStr];return a+(r?r.totalWithAbsent:0);},0));
    const qc=r2(allLines.reduce((a,l)=>{const r=results.lineRes[l]?.[dStr];return a+(r?r.qcTotal:0);},0));
    return{date:d,dStr,spmOnly,helpOnly,spm,absent,qc};
  });

  // Peak shortage/surplus
  const peakShortage=Math.min(...dailyData.filter(d=>d.absent>0).map(d=>r2(cadre-d.absent)));
  const avgDemand=r2(dailyData.filter(d=>d.absent>0).reduce((a,d)=>a+d.absent,0)/Math.max(1,dailyData.filter(d=>d.absent>0).length));
  const criticalDays=dailyData.filter(d=>d.absent>cadre).length;

  // SMV type totals across period
  const totalSpm=r2(dailyData.reduce((a,d)=>a+d.spm,0)/Math.max(1,dailyData.length));
  const totalQc=r2(dailyData.reduce((a,d)=>a+d.qc,0)/Math.max(1,dailyData.length));

  const fmtD=d=>d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  const labels=dates.map(d=>fmtD(d));

  // Chart refs
  const trendRef=useRef(),stackRef=useRef(),donutRef=useRef(),cadreRef=useRef();
  const trendChart=useRef(),stackChart=useRef(),donutChart=useRef(),cadreChart=useRef();

  useEffect(()=>{
    // Destroy existing charts
    [trendChart,stackChart,donutChart,cadreChart].forEach(r=>{if(r.current){r.current.destroy();r.current=null;}});

    // Chart 1: Daily Trend
    if(trendRef.current){
      trendChart.current=new Chart(trendRef.current,{
        type:"line",
        data:{labels,datasets:[
          {label:"SPM M/P",data:dailyData.map(d=>d.spmOnly),
            borderColor:"#2563eb",backgroundColor:"rgba(37,99,235,.06)",tension:.3,fill:true,pointRadius:2,borderWidth:2},
          {label:"HELP M/P",data:dailyData.map(d=>d.helpOnly),
            borderColor:"#7c3aed",backgroundColor:"rgba(124,58,237,.06)",tension:.3,fill:true,pointRadius:2,borderWidth:2},
          {label:"QC M/P",data:dailyData.map(d=>d.qc),
            borderColor:"#059669",backgroundColor:"transparent",tension:.3,fill:false,
            borderWidth:2,pointRadius:2},
          {label:"Actual Cadre",data:dates.map(()=>cadre),
            borderColor:"#dc2626",borderDash:[6,3],borderWidth:2,
            pointRadius:0,fill:false},
        ]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{position:"top",labels:{font:{size:11},boxWidth:12}},
            title:{display:true,text:"Daily Manpower Trend",font:{size:13,weight:"bold"}}},
          scales:{y:{beginAtZero:true,grid:{color:"rgba(0,0,0,.05)"},ticks:{font:{size:10}}},
            x:{grid:{display:false},ticks:{font:{size:9},maxRotation:45}}}}
      });
    }

    // Chart 2: Stacked by line (filtered)
    const visibleLines=allLines.filter(l=>selectedLines.has(String(l)));
    if(stackRef.current){
      stackChart.current=new Chart(stackRef.current,{
        type:"bar",
        data:{labels,datasets:visibleLines.map((l,i)=>({
          label:"L-"+String(l).padStart(2,"0"),
          data:dates.map(d=>{const r=results.lineRes[l]?.[ds(d)];return r?r2(r.totalWithAbsent):0;}),
          backgroundColor:LINE_COLORS[allLines.indexOf(l)%LINE_COLORS.length]+"cc",
          borderColor:LINE_COLORS[allLines.indexOf(l)%LINE_COLORS.length],borderWidth:0.5,stack:"lines"
        }))},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{position:"top",labels:{font:{size:10},boxWidth:10}},
            title:{display:true,text:"Manpower by Line (incl. absenteeism)",font:{size:13,weight:"bold"}}},
          scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:9},maxRotation:45}},
            y:{stacked:true,beginAtZero:true,grid:{color:"rgba(0,0,0,.05)"},ticks:{font:{size:10}}}}}
      });
    }

    // Chart 3: Donut SMV split
    if(donutRef.current){
      const avgSpm=r2(dailyData.filter(d=>d.spmOnly>0).reduce((a,d)=>a+d.spmOnly,0)/Math.max(1,dailyData.filter(d=>d.spmOnly>0).length));
      const avgHelp=r2(dailyData.filter(d=>d.helpOnly>0).reduce((a,d)=>a+d.helpOnly,0)/Math.max(1,dailyData.filter(d=>d.helpOnly>0).length));
      donutChart.current=new Chart(donutRef.current,{
        type:"doughnut",
        data:{labels:["SPM M/P","HELP M/P","QC M/P"],
          datasets:[{data:[avgSpm,avgHelp,totalQc],
            backgroundColor:["#2563eb","#7c3aed","#059669"],
            borderWidth:0,hoverOffset:4}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"65%",
          plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12}},
            title:{display:true,text:"Avg Daily SMV Mix",font:{size:13,weight:"bold"}}}}
      });
    }

    // Chart 4: Cadre vs Demand
    if(cadreRef.current){
      cadreChart.current=new Chart(cadreRef.current,{
        type:"bar",
        data:{labels,datasets:[
          {label:"Demand (incl. absent.)",
            data:dailyData.map(d=>d.absent),
            backgroundColor:dailyData.map(d=>d.absent>cadre?"rgba(220,38,38,.7)":"rgba(16,185,129,.7)"),
            borderColor:dailyData.map(d=>d.absent>cadre?"#dc2626":"#059669"),
            borderWidth:1},
          {label:"Actual Cadre",type:"line",
            data:dates.map(()=>cadre),
            borderColor:"#dc2626",borderDash:[6,3],borderWidth:2,
            pointRadius:0,fill:false,order:0}
        ]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{position:"top",labels:{font:{size:11},boxWidth:12}},
            title:{display:true,text:"Cadre vs Demand (green=OK, red=shortage)",font:{size:13,weight:"bold"}}},
          scales:{x:{grid:{display:false},ticks:{font:{size:9},maxRotation:45}},
            y:{beginAtZero:true,grid:{color:"rgba(0,0,0,.05)"},ticks:{font:{size:10}}}}}
      });
    }

    return()=>{[trendChart,stackChart,donutChart,cadreChart].forEach(r=>{if(r.current){r.current.destroy();r.current=null;}});};
  },[results,allLines,settings,selectedLines]);

  const KPIs=[
    {label:"Active Styles",value:activeStyles.length,icon:"ti-shirt",color:"#2563eb",bg:"#eff6ff"},
    {label:"Peak Shortage/Surplus",value:(peakShortage>=0?"▲ +":"")+peakShortage+" workers",
      icon:"ti-alert-triangle",color:peakShortage<0?"#dc2626":"#16a34a",
      bg:peakShortage<0?"#fef2f2":"#f0fdf4"},
    {label:"Avg Daily (incl. absent)",value:avgDemand+" workers",icon:"ti-users",color:"#0d9488",bg:"#f0fdf4"},
    {label:"Avg Daily QC M/P",value:totalQc+" workers",icon:"ti-shield-check",color:"#059669",bg:"#ecfdf5"},
    {label:"Critical Days (>Cadre)",value:criticalDays+" days",icon:"ti-calendar-exclamation",
      color:criticalDays>0?"#dc2626":"#16a34a",bg:criticalDays>0?"#fef2f2":"#f0fdf4"},
    {label:"Actual Cadre",value:cadre+" workers",icon:"ti-building-factory",color:"#7c3aed",bg:"#faf5ff"},
  ];

  return el("div",{id:"mp-dashboard",style:{display:"flex",flexDirection:"column",gap:16}},
    // KPI Cards
    el("div",{style:{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10}},
      KPIs.map(k=>el("div",{key:k.label,style:{background:"#fff",border:"0.5px solid #e2e8f0",
        borderRadius:12,padding:"14px 16px",display:"flex",flexDirection:"column",gap:6}},
        el("div",{style:{display:"flex",alignItems:"center",gap:8}},
          el("div",{style:{width:34,height:34,borderRadius:8,background:k.bg,
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
            el("i",{className:"ti "+k.icon,style:{fontSize:16,color:k.color}})),
          el("p",{style:{margin:0,fontSize:9,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".05em",lineHeight:1.3}},k.label)
        ),
        el("p",{style:{margin:0,fontSize:17,fontWeight:700,color:k.color,lineHeight:1}},k.value)
      ))
    ),
    // Charts row 1: Trend (wide) + Donut (narrow)
    el("div",{style:{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}},
      el("div",{style:{background:"#fff",borderRadius:12,padding:"18px",border:"0.5px solid #e2e8f0",height:280}},
        el("canvas",{ref:trendRef})),
      el("div",{style:{background:"#fff",borderRadius:12,padding:"18px",border:"0.5px solid #e2e8f0",height:280}},
        el("canvas",{ref:donutRef}))
    ),
    // Charts row 2: Stacked (wide) + Cadre (wide)
    el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}},
      el("div",{style:{background:"#fff",borderRadius:12,padding:"18px",border:"0.5px solid #e2e8f0"}},
        // Line filter bar
        el("div",{style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}},
          el("span",{style:{fontSize:11,fontWeight:600,color:"#64748b",flexShrink:0}},"Filter Lines:"),
          el("button",{onClick:()=>setSelectedLines(new Set(allLines.map(String))),
            style:{fontSize:10,padding:"3px 8px",border:"0.5px solid #e2e8f0",borderRadius:5,
              background:"#f8fafc",color:"#64748b",cursor:"pointer"}},"All"),
          el("button",{onClick:()=>setSelectedLines(new Set()),
            style:{fontSize:10,padding:"3px 8px",border:"0.5px solid #e2e8f0",borderRadius:5,
              background:"#f8fafc",color:"#64748b",cursor:"pointer"}},"None"),
          allLines.map((l,i)=>{
            const lStr=String(l);
            const active=selectedLines.has(lStr);
            return el("label",{key:l,style:{display:"flex",alignItems:"center",gap:4,cursor:"pointer",
              padding:"3px 8px",borderRadius:5,border:"0.5px solid "+(active?LINE_COLORS[i%LINE_COLORS.length]:"#e2e8f0"),
              background:active?LINE_COLORS[i%LINE_COLORS.length]+"18":"#fff"}},
              el("input",{type:"checkbox",checked:active,
                onChange:()=>setSelectedLines(prev=>{
                  const next=new Set(prev);
                  if(next.has(lStr))next.delete(lStr);else next.add(lStr);
                  return next;
                }),style:{width:12,height:12,accentColor:LINE_COLORS[i%LINE_COLORS.length],cursor:"pointer"}}),
              el("span",{style:{fontSize:10,fontWeight:500,color:active?LINE_COLORS[i%LINE_COLORS.length]:"#94a3b8"}},
                "L-"+String(l).padStart(2,"0"))
            );
          })
        ),
        el("div",{style:{height:260}},el("canvas",{ref:stackRef}))),
      el("div",{style:{background:"#fff",borderRadius:12,padding:"18px",border:"0.5px solid #e2e8f0",height:280}},
        el("canvas",{ref:cadreRef}))
    ),
    // Footer
    el("div",{style:{fontSize:10,color:"#94a3b8",textAlign:"right"}},
      "Manpower Calculator — Period: "+fromDate+" → "+toDate+" — Absenteeism: "+settings.absenteeism+"% — Cadre: "+cadre)
  );
}

function CalculateTab({styles,obMap,smvConfig,opSelections,settings,
  calcFromDate,setCalcFromDate,calcToDate,setCalcToDate,
  calcActiveStyles,setCalcActiveStyles,calcOverrides,setCalcOverrides,
  calcResults,setCalcResults,calcCalcState,setCalcCalcState,
  calcResultView,setCalcResultView,calcExpandedOps,setCalcExpandedOps,
  calcUseDefaultEff,setCalcUseDefaultEff}){
  // Use lifted state from App so it persists across tab navigation
  const fromDate=calcFromDate,setFromDate=setCalcFromDate;
  const toDate=calcToDate,setToDate=setCalcToDate;
  const activeStyles=calcActiveStyles,setActiveStyles=setCalcActiveStyles;
  const overrides=calcOverrides,setOverrides=setCalcOverrides;
  const useDefaultEff=calcUseDefaultEff,setUseDefaultEff=setCalcUseDefaultEff;
  const expandedOps=calcExpandedOps,setExpandedOps=setCalcExpandedOps;
  const results=calcResults,setResults=setCalcResults;
  const calcState=calcCalcState,setCalcState=setCalcCalcState;
  const resultView=calcResultView,setResultView=setCalcResultView;
  const resultsRef=useRef();

  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  const SMV_TYPES=smvConfig.map(s=>s.name);

  // Build MC->SMV map
  const mcToSmv=useMemo(()=>{
    const map={};
    smvConfig.forEach(st=>st.departments.forEach(d=>d.mcCodes.forEach(mc=>{map[mc]=st.name;})));
    return map;
  },[smvConfig]);

  function findStyles(){
    if(!fromDate||!toDate)return;
    const from=localDate(fromDate),to=localDate(toDate);
    const active=styles.filter(s=>s.startDate&&s.endDate&&s.startDate<=to&&s.endDate>=from);
    active.sort((a,b)=>a.line-b.line||a.startDate-b.startDate);
    setActiveStyles(active);
    const ov={};active.forEach(s=>{ov[s.id]={hours:settings.hours,efficiency:s.eff||settings.efficiency};});

  function calculate(){
    const from=localDate(fromDate),to=localDate(toDate);
    const dates=getDates(from,to);

    // Build style data with SMV by type
    const styleData={};
    activeStyles.forEach(s=>{
      const ov=overrides[s.id]||{hours:settings.hours,efficiency:s.eff||settings.efficiency};
      const ob=obMap[s.styleName];
      const userSel=opSelections[s.id];
      const smvByType={};SMV_TYPES.forEach(t=>{smvByType[t]=0;});
      // Per dept breakdown: {smvType: {deptName: smvTotal}}
      const smvByDept={};SMV_TYPES.forEach(t=>{smvByDept[t]={};});
      let hasData=false;
      if(ob&&ob.ops){
        hasData=true;
        ob.ops.forEach((op,i)=>{
          const opSel=userSel?userSel[i]:null;
          const included=opSel?opSel.included:!!mcToSmv[op.mcCode];
          const smvType=opSel?opSel.smvType:(mcToSmv[op.mcCode]||null);
          if(included&&smvType&&smvByType.hasOwnProperty(smvType)){
            smvByType[smvType]+=op.gsdsmv;
            // Track which dept this MC code belongs to
            let deptName="";
            smvConfig.forEach(st=>{
              if(st.name===smvType){
                st.departments.forEach(d=>{
                  if(d.mcCodes.includes(op.mcCode))deptName=d.name;
                });
              }
            });
            if(deptName){
              if(!smvByDept[smvType][deptName])smvByDept[smvType][deptName]=0;
              smvByDept[smvType][deptName]+=op.gsdsmv;
            }
          }
        });
      }
      styleData[s.id]={
        ...s,smvByType,smvByDept,hasData,
        dailyQty:s.dailyQty||0,
        hours:parseFloat(ov.hours)||settings.hours,
        eff:parseFloat(ov.efficiency||ov.eff)/100,
      };
    });

    // Calculate per line per day — conflict rule: new style (later start) has priority
    const lineRes={};
    allLines.forEach(line=>{
      lineRes[line]={};
      const lineStyles=activeStyles.filter(s=>s.line===line);
      dates.forEach(date=>{
        const dStr=ds(date);
        const d=new Date(date);d.setHours(0,0,0,0);
        // Find active styles for this line+date
        const active=lineStyles.filter(s=>s.startDate&&s.endDate&&s.startDate<=d&&s.endDate>=d);
        if(!active.length){lineRes[line][dStr]=null;return;}
        // Conflict rule: if multiple active, prioritize the one that STARTS on this date (new style)
        // Otherwise prioritize most recently started
        let chosen=active[0];
        const startingToday=active.filter(s=>ds(s.startDate)===dStr);
        if(startingToday.length>0){
          chosen=startingToday[0];
          // Mark others as "ended yesterday" for notation
        }else{
          // Take the one with latest start date
          chosen=active.reduce((a,b)=>a.startDate>=b.startDate?a:b);
        }
        const sd=styleData[chosen.id];
        if(!sd){lineRes[line][dStr]=null;return;}
        const denom=sd.hours*60*sd.eff;
        const mp={};let spmTotal=0;let helpTotal=0;let qcTotal=0;
        const deptSmv={};
        SMV_TYPES.forEach(t=>{
          const v=denom>0&&sd.dailyQty>0?(sd.smvByType[t]*sd.dailyQty)/denom:0;
          mp[t]=v;
          if(t==="QC")qcTotal+=v;
          else if(t==="SPM")spmTotal+=v;
          else if(t==="HELP")helpTotal+=v;
          // Per dept breakdown
          deptSmv[t]={};
          if(sd.smvByDept&&sd.smvByDept[t]){
            Object.entries(sd.smvByDept[t]).forEach(([dept,smv])=>{
              deptSmv[t][dept]=denom>0&&sd.dailyQty>0?(smv*sd.dailyQty)/denom:0;
            });
          }
        });
        // Find styles that conflict (ended on this date but another started)
        const conflictNote=active.length>1&&startingToday.length>0?
          active.filter(s=>s.id!==chosen.id).map(s=>s.styleName).join(", "):null;
        const total=spmTotal+helpTotal;
        lineRes[line][dStr]={
          styleId:chosen.id,style:chosen.styleName,hasData:sd.hasData,
          ...mp,total,deptSmv,conflictNote,
          spmTotal,helpTotal,qcTotal,
          totalWithAbsent:total*(1+(settings.absenteeism/100)),
          spmWithAbsent:spmTotal*(1+(settings.absenteeism/100)),
        };
      });
    });

    // KPIs
    // KPIs
    let peakDay=null,peakVal=0,sumAll=0,sumDays=0;
    let minTotal=Infinity,maxTotal=0;
    dates.forEach(date=>{
      const dStr=ds(date);
      const dayTotal=allLines.reduce((s,l)=>{const d=lineRes[l]?.[dStr];return s+(d?d.totalWithAbsent:0);},0);
      const dayBefore=allLines.reduce((s,l)=>{const d=lineRes[l]?.[dStr];return s+(d?d.total:0);},0);
      if(dayTotal>peakVal){peakVal=dayTotal;peakDay=fmtDate(date);}
      if(dayTotal>0){sumAll+=dayTotal;sumDays++;}
      if(dayBefore>0&&dayBefore<minTotal)minTotal=dayBefore;
      if(dayBefore>maxTotal)maxTotal=dayBefore;
    });
    const minT=minTotal===Infinity?0:r2(minTotal);
    const maxT=r2(maxTotal);
    setResults({dates,lineRes,peakDay,peakVal:r2(peakVal),
      avgTotal:r2(sumDays>0?sumAll/sumDays:0),
      minTotal:minT,maxTotal:maxT});
    setCalcState("results");
    setTimeout(()=>resultsRef.current?.scrollIntoView({behavior:"smooth",block:"start"}),100);
  }

    const wsData=[["Star Garments — Finishing Manpower Calculation"],[`Period: ${fromDate} to ${toDate}`],[],

    allLines.forEach(line=>{

        ...dates.map(d=>{const r=lineRes[line]?.[ds(d)];return r?r2(r[t]):"";})

      wsData.push([""," TOTAL (with absent)",...dates.map(d=>{const r=lineRes[line]?.[ds(d)];return r?r2(r.totalWithAbsent):"";})]);
      wsData.push([]);
    });
    wsData.push(["ALL LINES","GRAND TOTAL",...dates.map(d=>{
      const s=ds(d);return r2(allLines.reduce((acc,l)=>{const r=lineRes[l]?.[s];return acc+(r?r.totalWithAbsent:0);},0));
    })]);
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    const wb_=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb_,ws,"Manpower");
    XLSX.writeFile(wb_,`FinishingMP_${fromDate}_to_${toDate}.xlsx`);

                  return rows.map((row,ri)=>{

        calcState==="results"&&results&&el("div",{style:{background:"#fff",border:"0.5px solid #e2e8f0",

              el("thead",{},el("tr",{style:{background:"#f8fafc"}},

              )),

                      position:"sticky",left:0,background:isBefore?"#fff":"#f8fafc",borderRight:"1px solid #e2e8f0"}},
                      isBefore?"Planned (before absenteeism) vs Cadre":"Planned (incl. absenteeism) vs Cadre"),
                    results.dates.map(d=>{
                      const dStr=ds(d);
                      const val=r2(allLines.reduce((acc,l)=>{const r=results.lineRes[l]?.[dStr];return acc+(r?(isBefore?r.total:r.totalWithAbsent):0);},0));
                      const cadre=settings.actualCadre||80;
                      const diff=r2(cadre-val);
                      const isShort=diff<0;
                      return el("td",{key:dStr,style:{padding:"9px 10px",textAlign:"center"}},
                        val>0?el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:2}},
                          el("span",{style:{fontSize:10,color:"#94a3b8"}},"Plan: "+val),
                          el("span",{style:{fontSize:12,fontWeight:700,
                            color:isShort?"#dc2626":"#16a34a",
                            background:isShort?"#fef2f2":"#f0fdf4",
                            padding:"2px 8px",borderRadius:20,
                            border:"1px solid "+(isShort?"#fca5a5":"#bbf7d0")}},
                            (isShort?"▼ ":"▲ ")+Math.abs(diff))
                        ):"—"
                      );
                    })
                  );
                })
              )
            )
          )
        )
      )
    );
}
