    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:false,raw:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const{styles:parsed}=parseFRPlan(ws);
        const lines=[...new Set(parsed.map(s=>s.line))].sort((a,b)=>a-b);
        setStyles(parsed);setOpSelections({});
        setFrInfo({file:file.name,count:parsed.length,lines:lines.length,linesList:lines});
      }catch(err){setFrInfo({error:err.message});}
    };
    reader.readAsArrayBuffer(file);
  }

  function loadOBFile(bytes){
    try{
      const wb=XLSX.read(bytes,{type:"array",cellDates:false,raw:true});
      const ws=wb.Sheets[wb.SheetNames[0]];

      setObMap(map);
      setObRawBytes(bytesToBase64(bytes));
      setObInfo({file:"OB file",count:Object.keys(map).length,note:"(styles in OB file — matched count shown in Style Manager)"});
    }catch(err){setObInfo({error:err.message});}
  }

  async function loadFRFromGitHub(){
    try{
      setGhFrLoading(true);setGhFrErr(null);
      const res=await fetch(GH_FR_URL,{headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}});
      if(!res.ok){if(res.status===404)throw new Error("No FR Plan saved yet.");throw new Error("GitHub error "+res.status);}
      const data=await res.json();
      // Use module-level variable — immune to React closure staleness
      const hasChanged=!!(_ghShas.fr&&data.sha&&_ghShas.fr!==data.sha);
      console.log("[FR SHA] stored=",_ghShas.fr,"new=",data.sha,"changed=",hasChanged);
      _ghShas.fr=data.sha||"";
      try{localStorage.setItem("sgl_fr_sha",_ghShas.fr);}catch(e){}
      setFrChanged(hasChanged);
      const b64=data.content.replace(/[\n\r]/g,"");
      const bin=atob(b64);const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      loadFRFile(new File([bytes],"Production_Plan.xlsx"));
      setGhFrLoading(false);
    }catch(e){setGhFrErr(e.message);setGhFrLoading(false);}
  }

  async function loadOBFromGitHub(){
    try{
      setObGhLoading(true);setObGhStatus("loading");
      const metaRes=await fetch(GH_OB_URL,{headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}});
      if(!metaRes.ok){
        if(metaRes.status===404)throw new Error("No OB file saved yet. Upload and save from Planning Board Editor first.");
        throw new Error("GitHub error "+metaRes.status);
      }
      const meta=await metaRes.json();
      // Use module-level variable — immune to React closure staleness
      const obHasChanged=!!(_ghShas.ob&&meta.sha&&_ghShas.ob!==meta.sha);
      console.log("[OB SHA] stored=",_ghShas.ob,"new=",meta.sha,"changed=",obHasChanged);
      _ghShas.ob=meta.sha||"";
      try{localStorage.setItem("sgl_ob_sha",_ghShas.ob);}catch(e){}
      setObChanged(obHasChanged);
      let bytes;
      if(meta.content&&meta.content.replace(/[\n\r]/g,"").length>0){
        const b64=meta.content.replace(/[\n\r]/g,"");
        const bin=atob(b64);bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      }else{
        // Large file — use blob API
        const blobRes=await fetch("https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/git/blobs/"+meta.sha,
          {headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}});
        if(!blobRes.ok)throw new Error("Blob fetch failed: "+blobRes.status);
        const blobData=await blobRes.json();
        const b64=blobData.content.replace(/[\n\r]/g,"");
        const bin=atob(b64);bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      }
      loadOBFile(bytes);
      setObGhStatus("loaded");
      setTimeout(()=>setObGhStatus(null),3000);
    }catch(e){

        style:{background:page===t.id?ORANGE:"transparent",border:"none",
          color:page===t.id?"#fff":"rgba(255,255,255,.55)",padding:"10px 16px",cursor:"pointer",
          display:"flex",alignItems:"center",gap:7,fontSize:13,fontWeight:page===t.id?600:400,
          borderRadius:"4px 4px 0 0"}},
        el("i",{className:"ti "+t.icon,style:{fontSize:15}}),t.label
      ))
    ),

    // ── PAGE CONTENT ──────────────────────────────────────────────────────────
    page!=="landing"&&el("div",{style:{padding:22,flex:1,maxWidth:1600,margin:"0 auto",width:"100%"}},

      // UPLOAD
      page==="upload"&&el("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        // FR Plan card
        el(Card,{},
          el("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:16}},
            el("div",{style:{width:36,height:36,borderRadius:9,background:"#EEF2F8",display:"flex",alignItems:"center",justifyContent:"center"}},
              el("i",{className:"ti ti-table",style:{fontSize:18,color:NAVY}})),
            el("div",{},
              el("p",{style:{fontWeight:700,fontSize:14,color:"#0f172a",margin:0}},"SGL FR Plan"),
              el("p",{style:{fontSize:12,color:"#64748b",margin:0}},"Main planning file — drives the calculation")
            )
          ),
          el("button",{onClick:loadFRFromGitHub,disabled:ghFrLoading,
            style:{width:"100%",padding:"12px",marginBottom:14,borderRadius:9,
              border:"2px solid "+ORANGE,background:ghFrLoading?"#fff7ed":"#fff4ec",
              cursor:ghFrLoading?"not-allowed":"pointer",display:"flex",alignItems:"center",
              justifyContent:"center",gap:8,fontSize:13,fontWeight:700,color:ORANGE}},
            el("i",{className:"ti "+(ghFrLoading?"ti-loader ti-spin":"ti-brand-github"),style:{fontSize:16}}),
            ghFrLoading?"Loading from GitHub...":"Load Latest FR Plan from GitHub"
          ),
          ghFrErr&&el("div",{style:{background:"#fef2f2",border:"0.5px solid #fca5a5",borderRadius:7,padding:"9px 12px",marginBottom:10,fontSize:12,color:"#dc2626"}},
            el("i",{className:"ti ti-alert-circle",style:{marginRight:6}}),ghFrErr),
          frChanged&&el("div",{style:{
            marginBottom:12,borderRadius:9,overflow:"hidden",
            background:"linear-gradient(135deg,#e0f2fe,#bae6fd)",
            border:"1px solid #7dd3fc",
            display:"flex",alignItems:"center",gap:12,padding:"11px 16px"}},
            el("div",{style:{width:32,height:32,borderRadius:8,background:"#0284c7",
              display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
              el("i",{className:"ti ti-refresh",style:{fontSize:16,color:"#fff"}})
            ),
            el("div",{style:{flex:1}},
              el("p",{style:{margin:"0 0 2px",fontWeight:700,fontSize:13,color:"#0c4a6e"}},"FR Plan has a new version"),
              el("p",{style:{margin:0,fontSize:11,color:"#075985"}},"Updated on GitHub — latest version loaded successfully")
            ),
            el("button",{onClick:()=>setFrChanged(false),
              style:{background:"none",border:"none",color:"#0284c7",cursor:"pointer",
                fontSize:18,lineHeight:1,padding:"0 4px",flexShrink:0}},
              "×")
          ),
          el("p",{style:{textAlign:"center",fontSize:12,color:"#94a3b8",marginBottom:10}},"— or upload manually —"),
          el("div",{onDragOver:ev=>{ev.preventDefault();setFrDragging(true);},onDragLeave:()=>setFrDragging(false),
            onDrop:ev=>{ev.preventDefault();setFrDragging(false);const f=ev.dataTransfer.files[0];if(f)loadFRFile(f);},
            onClick:()=>frRef.current.click(),
            style:{border:"2px dashed "+(frDragging?ORANGE:"#cbd5e1"),borderRadius:10,padding:"32px 24px",
              textAlign:"center",cursor:"pointer",background:frDragging?"rgba(224,123,57,.04)":"#f8fafc",transition:"all .15s"}},
            el("i",{className:"ti ti-file-spreadsheet",style:{fontSize:36,color:frDragging?ORANGE:"#94a3b8",display:"block",marginBottom:10}}),
            el("p",{style:{margin:"0 0 4px",fontWeight:600,fontSize:13,color:"#334155"}},"Drop SGL_FR_Plan.xlsx here"),
            el("p",{style:{margin:0,fontSize:12,color:"#94a3b8"}},"or click to browse"),
            el("input",{ref:frRef,type:"file",accept:".xlsx,.xls",style:{display:"none"},onChange:e=>e.target.files[0]&&loadFRFile(e.target.files[0])})
          ),
          frInfo&&!frInfo.error&&el("div",{style:{marginTop:14,background:"#f0fdf4",border:"0.5px solid #bbf7d0",borderRadius:8,padding:"12px 16px",display:"flex",alignItems:"center",gap:10}},
            el("i",{className:"ti ti-circle-check",style:{fontSize:20,color:"#16a34a"}}),
            el("div",{},
              el("p",{style:{margin:"0 0 2px",fontWeight:600,fontSize:13,color:"#166534"}},frInfo.file+" loaded"),
              el("p",{style:{margin:0,fontSize:12,color:"#166534"}},frInfo.count+" styles · "+frInfo.lines+" lines: "+frInfo.linesList?.join(", "))
            )
          ),
          frInfo?.error&&el("div",{style:{marginTop:14,background:"#fef2f2",border:"0.5px solid #fca5a5",borderRadius:8,padding:12,color:"#dc2626",fontSize:12}},
            el("i",{className:"ti ti-alert-circle",style:{marginRight:6}}),frInfo.error)
        ),
        // OB Data card
        el(Card,{},
          el("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:16}},
            el("div",{style:{width:36,height:36,borderRadius:9,background:"#374151",display:"flex",alignItems:"center",justifyContent:"center"}},
              el("i",{className:"ti ti-clipboard-list",style:{fontSize:18,color:"#fff"}})),
            el("div",{},
              el("p",{style:{fontWeight:700,fontSize:14,color:"#0f172a",margin:0}},"Operation Breakdown (OB)"),
              el("p",{style:{fontSize:12,color:"#64748b",margin:0}},"Maps operations & SMV to styles")
            )
          ),
          el("button",{onClick:loadOBFromGitHub,disabled:obGhLoading,
            style:{width:"100%",padding:"12px",marginBottom:14,borderRadius:9,
              border:"2px solid "+(obGhStatus==="loaded"?"#16a34a":obGhStatus?.startsWith("error")?"#dc2626":"#374151"),
              background:obGhLoading?"#f9f9f9":obGhStatus==="loaded"?"#f0fdf4":obGhStatus?.startsWith("error")?"#fef2f2":"#f8fafc",
              cursor:obGhLoading?"not-allowed":"pointer",display:"flex",alignItems:"center",
              justifyContent:"center",gap:8,fontSize:13,fontWeight:700,
              color:obGhStatus==="loaded"?"#16a34a":obGhStatus?.startsWith("error")?"#dc2626":"#374151"}},
            el("i",{className:"ti "+(obGhLoading?"ti-loader ti-spin":obGhStatus==="loaded"?"ti-circle-check":obGhStatus?.startsWith("error")?"ti-alert-circle":"ti-brand-github"),style:{fontSize:16}}),
            obGhLoading?"Loading OB from GitHub...":obGhStatus==="loaded"?"OB Data Loaded ✓":"Load Latest OB Data from GitHub"
          ),
          obChanged&&el("div",{style:{
            marginBottom:12,borderRadius:9,overflow:"hidden",
            background:"linear-gradient(135deg,#e0f2fe,#bae6fd)",
            border:"1px solid #7dd3fc",
            display:"flex",alignItems:"center",gap:12,padding:"11px 16px"}},
            el("div",{style:{width:32,height:32,borderRadius:8,background:"#0284c7",
              display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
              el("i",{className:"ti ti-refresh",style:{fontSize:16,color:"#fff"}})
            ),
            el("div",{style:{flex:1}},
              el("p",{style:{margin:"0 0 2px",fontWeight:700,fontSize:13,color:"#0c4a6e"}},"OB Data has a new version"),
              el("p",{style:{margin:0,fontSize:11,color:"#075985"}},"Updated on GitHub — latest version loaded successfully")
            ),
            el("button",{onClick:()=>setObChanged(false),
              style:{background:"none",border:"none",color:"#0284c7",cursor:"pointer",
                fontSize:18,lineHeight:1,padding:"0 4px",flexShrink:0}},
              "×")
          ),
          el("p",{style:{textAlign:"center",fontSize:12,color:"#94a3b8",marginBottom:10}},"— or upload manually —"),
          el("div",{onDragOver:ev=>{ev.preventDefault();setObDragging(true);},onDragLeave:()=>setObDragging(false),
            onDrop:ev=>{ev.preventDefault();setObDragging(false);
              const f=ev.dataTransfer.files[0];
              if(f){const reader=new FileReader();reader.onload=e2=>loadOBFile(new Uint8Array(e2.target.result));reader.readAsArrayBuffer(f);}
            },
            onClick:()=>obRef.current.click(),
            style:{border:"2px dashed "+(obDragging?"#60a5fa":"#cbd5e1"),borderRadius:10,padding:"28px 24px",
              textAlign:"center",cursor:"pointer",background:obDragging?"rgba(96,165,250,.04)":"#f8fafc",transition:"all .15s"}},
            el("i",{className:"ti ti-clipboard-list",style:{fontSize:36,color:obDragging?"#60a5fa":"#94a3b8",display:"block",marginBottom:10}}),
            el("p",{style:{margin:"0 0 4px",fontWeight:600,fontSize:13,color:"#334155"}},"Drop OB file here (.xlsx or .xls)"),
            el("p",{style:{margin:0,fontSize:12,color:"#94a3b8"}},"or click to browse"),
            el("input",{ref:obRef,type:"file",accept:".xlsx,.xls",style:{display:"none"},
              onChange:e=>{if(e.target.files[0]){const f=e.target.files[0];const reader=new FileReader();reader.onload=e2=>loadOBFile(new Uint8Array(e2.target.result));reader.readAsArrayBuffer(f);}}})
          ),
          obInfo&&!obInfo.error&&el("div",{style:{marginTop:obChanged?8:14,background:"#f0fdf4",border:"0.5px solid #bbf7d0",borderRadius:8,padding:"12px 16px",display:"flex",alignItems:"center",gap:10}},
            el("i",{className:"ti ti-circle-check",style:{fontSize:20,color:"#16a34a"}}),
            el("div",{},
              el("p",{style:{margin:"0 0 2px",fontWeight:600,fontSize:13,color:"#166534"}},
                "Loaded: "+obInfo.file+" — "+obInfo.count+" styles in OB file"),
              el("p",{style:{margin:0,fontSize:11,color:"#15803d"}},
                "Styles matched to FR Plan shown in Style Manager → Have OB Data")
            )
          ),
          obInfo?.error&&el("div",{style:{marginTop:14,background:"#fef2f2",border:"0.5px solid #fca5a5",borderRadius:8,padding:12,color:"#dc2626",fontSize:12}},
            el("i",{className:"ti ti-alert-circle",style:{marginRight:6}}),obInfo.error)
        ),
        // Navigation buttons
        (styles.length>0)&&el("div",{style:{display:"flex",gap:12,flexWrap:"wrap"}},
          el(Btn,{onClick:()=>setPage("stylemanager"),style:{background:NAVY,color:"#fff",padding:"10px 20px"}},
            el("i",{className:"ti ti-shirt",style:{marginRight:7}}),"Style Manager"),
          el(Btn,{onClick:()=>setPage("planningboard"),style:{background:"#4338CA",color:"#fff",padding:"10px 20px"}},
            el("i",{className:"ti ti-layout-kanban",style:{marginRight:7}}),"Planning Board"),
          el(Btn,{onClick:()=>setPage("calculate"),style:{background:ORANGE,color:"#fff",padding:"10px 20px",fontWeight:700}},
            el("i",{className:"ti ti-calculator",style:{marginRight:7}}),"Calculate Manpower",el("i",{className:"ti ti-arrow-right",style:{marginLeft:7}}))
        )
      ),

      // STYLE MANAGER
      page==="stylemanager"&&(styles.length===0?el(NoData,{}):
        el(StyleManagerTab,{styles,obMap,smvConfig,opSelections,setOpSelections})),

      // PLANNING BOARD (view only)
      page==="planningboard"&&el("div",{style:{display:"flex",flexDirection:"column",gap:14}},
        styles.length===0?el(NoData,{}):el("div",{},
          el("div",{style:{display:"flex",gap:10,marginBottom:14,alignItems:"center",flexWrap:"wrap"}},
            el("span",{style:{fontSize:13,fontWeight:600,color:"#374151"}},"Color by:"),
            [["style","By Style"],["garment","By Garment"]].map(([v,label])=>
              el("button",{key:v,onClick:()=>{setColorMode(v);setPbSelectMode(false);setPbSelectedId(null);},
                style:{padding:"6px 16px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:500,
                  border:colorMode===v&&!pbSelectMode?"2px solid "+NAVY:"1px solid #e2e8f0",
                  background:colorMode===v&&!pbSelectMode?"#EEF2F8":"#fff",
                  color:colorMode===v&&!pbSelectMode?NAVY:"#64748b"}},label)
            ),
            el("div",{style:{width:1,height:20,background:"#e2e8f0"}}),
            el("button",{onClick:()=>{setPbSelectMode(m=>!m);setPbSelectedId(null);},
              style:{padding:"6px 16px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:500,
                display:"flex",alignItems:"center",gap:6,
                border:pbSelectMode?"2px solid #dc2626":"1px solid #e2e8f0",
                background:pbSelectMode?"#fef2f2":"#fff",color:pbSelectMode?"#dc2626":"#64748b"}},
              el("i",{className:"ti ti-calendar-due",style:{fontSize:13}}),
              "Del. Date View"
            ),
            el("div",{style:{width:1,height:20,background:"#e2e8f0"}}),
            el("div",{style:{display:"flex",alignItems:"center",gap:2,
              border:"1px solid #e2e8f0",borderRadius:8,overflow:"hidden",marginLeft:"auto"}},
              el("button",{onClick:()=>setBoardZoom(z=>Math.max(.25,+(z/1.25).toFixed(3))),
                title:"Zoom out",
                style:{padding:"5px 10px",border:"none",background:"transparent",
                  color:"#64748b",fontSize:15,cursor:"pointer",fontWeight:700,lineHeight:1}},"−"),
              el("span",{style:{fontSize:11,color:"#64748b",padding:"0 4px",
                minWidth:36,textAlign:"center",fontWeight:500}},Math.round(boardZoom*100)+"%"),
              el("button",{onClick:()=>setBoardZoom(z=>Math.min(8,+(z*1.25).toFixed(3))),
                title:"Zoom in",
                style:{padding:"5px 10px",border:"none",background:"transparent",
                  color:"#64748b",fontSize:15,cursor:"pointer",fontWeight:700,lineHeight:1}},"+"),
              el("button",{onClick:()=>setBoardZoom(1),
                title:"Reset zoom to 100%",
                style:{padding:"5px 8px",border:"none",borderLeft:"1px solid #e2e8f0",background:"transparent",
                  color:"#94a3b8",fontSize:11,cursor:"pointer",fontWeight:500,lineHeight:1}},
                el("i",{className:"ti ti-refresh",style:{fontSize:12}}))
            )
          ),
          // Garment legend — click any type to focus matching styles, dim everything else
          colorMode==="garment"&&styles.length>0&&(()=>{
            const usedTypes=[...new Set(styles.map(s=>s.gmtType).filter(Boolean))].sort();
            return el("div",{style:{background:"#1e293b",padding:"6px 16px",display:"flex",alignItems:"center",
              gap:4,flexWrap:"wrap",borderRadius:8,marginBottom:10}},
              el("span",{style:{color:"rgba(255,255,255,.4)",fontSize:10,fontWeight:600,
                textTransform:"uppercase",letterSpacing:.8,marginRight:6,fontFamily:"'DM Mono',monospace"}},"Legend:"),
              usedTypes.map(t=>{
                const active=gmtFocus===t;
                return el("div",{key:t,onClick:()=>setGmtFocus(f=>f===t?null:t),
                  title:active?"Click to clear focus":"Click to focus this garment type",
                  style:{display:"flex",alignItems:"center",gap:4,cursor:"pointer",
                  padding:"3px 9px",borderRadius:20,
                  background:active?"rgba(255,255,255,.18)":"rgba(255,255,255,.06)",
                  border:"0.5px solid "+(active?"rgba(255,255,255,.5)":"rgba(255,255,255,.1)")}},
                  el("div",{style:{width:9,height:9,borderRadius:"50%",background:getGmtColor(t),flexShrink:0}}),
                  el("span",{style:{fontSize:10.5,color:active?"#fff":"rgba(255,255,255,.8)",
                    fontWeight:active?700:400,whiteSpace:"nowrap"}},t)
                );
              }),
              gmtFocus&&el("button",{onClick:()=>setGmtFocus(null),
                style:{marginLeft:6,padding:"3px 10px",borderRadius:20,border:"0.5px solid rgba(255,255,255,.2)",
                  background:"transparent",color:"rgba(255,255,255,.5)",fontSize:10,cursor:"pointer",
                  display:"flex",alignItems:"center",gap:4}},
                el("i",{className:"ti ti-x",style:{fontSize:11}}),"Clear focus")
            );
          })(),
          el(Card,{style:{padding:0,overflow:"hidden",height:640}},
            el(ErrorBoundary,{},
              el(PlanningBoardView,{styles,colorMode,onEdit:null,
                selectMode:pbSelectMode,selectedId:pbSelectedId,
                onSelectStyle:id=>setPbSelectedId(p=>p===id?null:id),
                simMode:false,simFilters:{description:true},obMap,highlightId:null,
                lineSimMode:false,lineSimFilters:{description:true},lineSimThreshold:80,
                lineSimSelectedId:null,onLineSimSelect:null,
                alwaysSimFilters:{description:true,mcCode:false,gmtType:false},
                simGroups:null,boardZoom,setBoardZoom,dateRangeOverride:null,gmtFocus})
            )
          )
        )
      ),

      // CALCULATE
      page==="calculate"&&el(CalculateTab,{styles,obMap,smvConfig,opSelections,settings,
        calcFromDate,setCalcFromDate,calcToDate,setCalcToDate,
        calcActiveStyles,setCalcActiveStyles,calcOverrides,setCalcOverrides,
        calcResults,setCalcResults,calcCalcState,setCalcCalcState,
        calcResultView,setCalcResultView,calcExpandedOps,setCalcExpandedOps,
        calcUseDefaultEff,setCalcUseDefaultEff}),

      // SETTINGS
      page==="settings"&&el(SettingsTab,{smvConfig,setSmvConfig,settings,setSettings})
    )
  );
}

ReactDOM.render(el("div",{},el(App,{})),document.getElementById("root"));
</script>
</body>
</html>
