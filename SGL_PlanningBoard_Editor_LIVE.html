window.onerror=function(msg,src,line,col,err){console.error("GLOBAL ERROR:",msg,"\nFile:",src,"Line:",line,"\nError:",err);return false;};
window.onunhandledrejection=function(e){console.error("UNHANDLED PROMISE:",e.reason);};

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  componentDidCatch(e,info){console.error("REACT ERROR BOUNDARY:",e,info.componentStack);}
  render(){
    if(this.state.error)return React.createElement("div",{style:{padding:20,background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,margin:16}},
      React.createElement("p",{style:{fontWeight:600,color:"#dc2626",marginBottom:8}},"Rendering Error — check console (F12)"),
      React.createElement("pre",{style:{fontSize:11,color:"#7f1d1d",whiteSpace:"pre-wrap"}},this.state.error.message));
    return this.props.children;
  }
}

const {useState,useRef,useEffect,useCallback,useMemo}=React;
const el=React.createElement;
const NAVY="#0B2A4A",ORANGE="#E07B39";
const COL_W=220,ROW_H=160,HDR_H=72,LBL_W=92;
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ─── Colour palettes ────────────────────────────────────────────────────────
const STYLE_COLORS=["#1D4ED8","#6D28D9","#BE185D","#0F766E","#B45309","#B91C1C",
  "#4338CA","#047857","#C2410C","#0369A1","#4D7C0F","#7E22CE","#9D174D","#065F46",
  "#92400E","#0E7490","#1E40AF","#5B21B6","#166534","#1E3A5F"];
// GMT_COLORS_MAP: ordered list of [exact-or-substring-match, color]
// Exact GMT TYPE values from SGL_FR_Plan: BLAZER, BLOUSE, CASUAL JACKET, DRESS (GOWN),
// FORMAL JACKET, LADIES SHIRT, MENS SHIRT, OUTER WEAR COAT, PANT (TROUSER), SHORT, SPECIAL JACKET, VEST
const GMT_COLORS_MAP=[
  ["OUTER WEAR COAT","#065F46"],  // dark teal
  ["FORMAL JACKET",  "#9D174D"],  // rose
  ["SPECIAL JACKET", "#C2410C"],  // burnt orange
  ["CASUAL JACKET",  "#B91C1C"],  // red
  ["LADIES SHIRT",   "#0369A1"],  // ocean blue
  ["MENS SHIRT",     "#0F766E"],  // teal
  ["BLAZER",         "#4338CA"],  // indigo
  ["BLOUSE",         "#1D4ED8"],  // blue
  ["PANT (TROUSER)", "#6D28D9"],  // purple
  ["TROUSER",        "#6D28D9"],  // purple (fallback substring)
  ["PANT",           "#5B21B6"],  // purple-dark
  ["DRESS (GOWN)",   "#7E22CE"],  // violet
  ["GOWN",           "#7E22CE"],  // violet (fallback substring)
  ["DRESS",          "#BE185D"],  // pink
  ["SHORT",          "#4D7C0F"],  // olive green
  ["VEST",           "#92400E"],  // amber brown
  ["JACKET",         "#B91C1C"],  // red (generic jacket fallback)
  ["SHIRT",          "#047857"],  // green (generic shirt fallback)
];
function getGmtColor(gmtType){
  if(!gmtType)return"#374151";
  const u=gmtType.toUpperCase().trim();
  for(const[k,c]of GMT_COLORS_MAP){if(u===k||u.includes(k))return c;}
  return"#374151";
}
const LINE_COLORS=["#2563EB","#7C3AED","#DB2777","#0D9488","#D97706","#DC2626","#4F46E5","#059669","#EA580C"];

// ─── Date helpers ────────────────────────────────────────────────────────────
function excelSerialToDate(serial){
  if(!serial&&serial!==0)return null;
  if(serial instanceof Date){const d=new Date(serial);d.setHours(0,0,0,0);return d;}
  if(typeof serial==="string"){
    const n=parseFloat(serial);
    if(!isNaN(n)&&n>40000)serial=n;
    else{const d=new Date(serial);d.setHours(0,0,0,0);return isNaN(d)?null:d;}
  }
  if(typeof serial==="number"&&serial>40000){
    // Convert Excel serial to local midnight date (avoid UTC offset issues)
    const utcMs=Math.round((serial-25569)*86400*1000);
    const utcDate=new Date(utcMs);
    // Use local date parts to create a local midnight date
    const d=new Date(utcDate.getUTCFullYear(),utcDate.getUTCMonth(),utcDate.getUTCDate());
    d.setHours(0,0,0,0);return d;
  }
  return null;
}
// ─── Working-hours time helpers (Phase 1: time-precise blocks) ──────────────
const WORK_START_MIN=7*60;      // 7:00 AM
const WORK_END_MIN=18*60+30;    // 6:30 PM
const WORK_SPAN_MIN=WORK_END_MIN-WORK_START_MIN;
// Parse a "time of day" cell (Excel time serial fraction, JS Date, or string) into minutes since midnight.
// Returns null if blank/dash/unparseable.
function parseTimeOfDay(val){
  if(val===null||val===undefined||val==="")return null;
  if(val instanceof Date){
    return val.getHours()*60+val.getMinutes();
  }
  if(typeof val==="number"){
    // Excel time-only cells come through as a fraction of a day (0..1)
    if(val>=0&&val<1)return Math.round(val*1440);
    // Full datetime serial (has both date+time) — extract the fractional part
    if(val>1){
      const frac=val-Math.floor(val);
      return Math.round(frac*1440);
    }
    return 0;
  }
  if(typeof val==="string"){
    const s=val.trim();
    if(!s||s==="-")return null;
    // Try "H:MM AM/PM" or "HH:MM" formats
    const m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?$/);
    if(m){
      let h=parseInt(m[1],10);const min=parseInt(m[2],10);
      const ap=m[3]?m[3].toUpperCase():null;
      if(ap==="PM"&&h!==12)h+=12;
      if(ap==="AM"&&h===12)h=0;
      return h*60+min;
    }
    const d=new Date(s);
    if(!isNaN(d))return d.getHours()*60+d.getMinutes();
    return null;
  }
  return null;
}
// Combine a date-only value (from excelSerialToDate, local midnight) with a time-of-day
// (minutes since midnight, from parseTimeOfDay). Falls back to fallbackMin if time is missing.
// Result is clamped into the working window [WORK_START_MIN, WORK_END_MIN].
function combineDateAndTime(dateOnly,timeMinutes,fallbackMin){
  if(!dateOnly)return null;
  let mins=(timeMinutes==null)?fallbackMin:timeMinutes;
  mins=Math.max(WORK_START_MIN,Math.min(WORK_END_MIN,mins));
  const d=new Date(dateOnly);
  d.setHours(Math.floor(mins/60),mins%60,0,0);
  return d;
}
// Fractional day-index for a time-precise datetime, given a map of "YYYY-MM-DD" -> integer day index.
// e.g. 10:32 AM on a day whose index is 3 → 3 + (10:32-7:00)/(18:30-7:00)
function dateTimeToFracIndex(dt,dateIndexMap){
  if(!dt)return null;
  const dayIdx=dateIndexMap[ds(dt)];
  if(dayIdx==null)return null;
  const mins=dt.getHours()*60+dt.getMinutes();
  const clamped=Math.max(WORK_START_MIN,Math.min(WORK_END_MIN,mins));
  const frac=(clamped-WORK_START_MIN)/WORK_SPAN_MIN;
  return dayIdx+frac;
}
function ds(d){if(!d)return"";return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
// Parse a date string "YYYY-MM-DD" as LOCAL midnight to avoid UTC timezone offset bugs
function localDate(str){
  if(!str)return null;
  const[y,m,d]=str.split("-").map(Number);
  const dt=new Date(y,m-1,d);dt.setHours(0,0,0,0);return dt;
}
function fmtDate(d){if(!d)return"—";return d.getDate()+" "+MONS[d.getMonth()]+" "+d.getFullYear();}
function fmtDateShort(d){if(!d)return"—";return d.getDate()+" "+MONS[d.getMonth()];}
function fmtTimeOfDay(d){
  if(!d)return"";
  let h=d.getHours(),m=d.getMinutes();
  const ap=h>=12?"PM":"AM";
  h=h%12;if(h===0)h=12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;
}
function fmtDateTime(d){if(!d)return"—";return fmtDate(d)+", "+fmtTimeOfDay(d);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function diffDays(a,b){return Math.round((b-a)/(86400*1000));}
// Add N working days (Mon-Sat) to a date
function addWorkingDays(startDate,n){
  let cur=new Date(startDate);cur.setHours(0,0,0,0);
  let added=0;
  while(added<n){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)added++;// skip Sunday
  }
  return cur;
}
// Get the date that is exactly N working days after startDate (inclusive of start = day 1)
function workingDayEnd(startDate,prodDays){
  // Start date is day 1. We need to go prodDays-1 more working days forward.
  let cur=new Date(startDate);cur.setHours(0,0,0,0);
  let count=1;
  while(count<prodDays){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)count++;
  }
  return cur;
}
// Get next working day after a date
function nextWorkingDay(d){
  let cur=new Date(d);cur.setHours(0,0,0,0);
  do{cur.setDate(cur.getDate()+1);}while(cur.getDay()===0);
  return cur;
}
// Split merged block sub-styles proportionally from a new start date on a new line
function splitMergedProportional(subStyles,newStart,newLine){
  let cursor=new Date(newStart);cursor.setHours(0,0,0,0);
  // Skip if cursor is Sunday
  while(cursor.getDay()===0)cursor.setDate(cursor.getDate()+1);
  return subStyles.map((sub,i)=>{
    const days=Math.max(1,sub.prodDays||1);
    const subStart=new Date(cursor);
    const subEnd=workingDayEnd(subStart,days);
    const updated={...sub,
      line:newLine,
      startDate:new Date(subStart),
      endDate:new Date(subEnd),
      dailyQty:r2((sub.plnQty||0)/days),
    };
    // Move cursor to next working day after subEnd
    cursor=nextWorkingDay(subEnd);
    return updated;
  });
}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function r2(n){return Math.round(n*100)/100;}
function roundPrdDys(sum){const fl=Math.floor(sum);return(sum-fl)>=0.5?fl+1:fl;}

// ─── Fallbacks ───────────────────────────────────────────────────────────────
const FALLBACK_FACTORY="STAR GARMENTS (PVT) LIMITED-SGL";
const FALLBACK_ACCOUNT="00212";
const FALLBACK_CREATED_BY="admin";

// ─── Parse SGL_FR_Plan.xlsx ──────────────────────────────────────────────────
function parseFRPlan(sheet){
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
  if(!rows.length)throw new Error("Empty FR Plan sheet");
  const hdr=rows[0].map(h=>String(h||"").trim());
  // col() tries exact match then case-insensitive match
  const col=n=>{
    let i=hdr.indexOf(n);
    if(i>=0)return i;
    const nl=n.toLowerCase();
    i=hdr.findIndex(h=>h.toLowerCase()===nl);
    return i;// -1 if not found
  };

  // colAny() tries multiple alternate names
  const colAny=(...names)=>{for(const n of names){const i=col(n);if(i>=0)return i;}return -1;};
  const C={
    facLine:col("Fac/Line"),acc:col("ACC"),styleNo:col("STYLE-NO"),
    styleOpt:col("Style# Optional"),gmtType:col("GMT TYPE"),
    ordQty:col("Ord Qty"),prdDys:col("PRD DYS"),plnQty:col("PLN QTY"),
    eff:col("Eff %"),tgt:col("TGT"),th:colAny("TH","T/H","T.H"),
    tgtCut:colAny("TGT CUT","TGT_CUT","TGTCUT","Tgt Cut","TARGET CUT","TGT cut"),
    st:col("ST"),fi:col("FI"),delDate:colAny("Del Date","DEL DATE","Del date","Delivery Date"),
    merchant:col("Merchant"),
    mergeGroup:col("SGL_MergeGroup"),// optional merge tag column
    prodStartTime:colAny("Production start time","Production Start Time","PRODUCTION START TIME","Prod Start Time","Production Start"),
    prodEndTime:colAny("Production end time","Production End Time","PRODUCTION END TIME","Prod End Time","Production End")
  };
  const hasTimeCols=C.prodStartTime>=0&&C.prodEndTime>=0;

  // Group consecutive rows by STYLE-NO — v2 per-line gap detection
  const groups=[];
  let cur=null;
  let lastKeyByLine={};
  for(let i=1;i<rows.length;i++){
    const row=rows[i];
    const styleNo=String(row[C.styleNo]||"").trim();
    if(!styleNo||styleNo==="-")continue;
    const facLine=String(row[C.facLine]||"").trim();
    if(!facLine)continue;
    const key=facLine+"||"+styleNo;
    const acc=String(row[C.acc]||"").trim();
    const styleOpt=String(row[C.styleOpt]||"").trim();
    const isSummaryRow=!acc&&!styleOpt;
    // Use per-line lastKey tracking — global lastKey fails when lines interleave
    const lineLastKey=lastKeyByLine[facLine]||null;
    const isGap=!isSummaryRow&&cur&&cur.key===key&&lineLastKey!==null&&lineLastKey!==key;
    if(!cur||cur.key!==key||isGap){
      if(cur)groups.push(cur);
      const mg=C.mergeGroup>=0?String(row[C.mergeGroup]||"").trim():"";
      cur={key,facLine,styleNo,rows:[],summaryRow:null,mergeGroup:mg||null};
    }
    if(!isSummaryRow)lastKeyByLine[facLine]=key;
    if(isSummaryRow){cur.summaryRow=row;}else{cur.rows.push(row);}
  }
  if(cur)groups.push(cur);

  const styleColorMap={};let colorIdx=0;

  const styles=groups.map(g=>{
    const isSingleEntry=g.rows.length===0;
    const summaryRow=g.summaryRow||(isSingleEntry?g.rows[0]||null:null);
    const detailRows=isSingleEntry?[]:g.rows;

    // If no summary row but has detail rows, use last detail row as summary
    const sRow=summaryRow||(detailRows.length?detailRows[detailRows.length-1]:null);
    if(!sRow)return null;

    // Line number from Fac/Line
    const facLine=g.facLine;
    const lineNum=parseInt(facLine.replace(/\D/g,""))||1;

    // Style name from first detail row's Style# Optional, or single row
    const firstRow=isSingleEntry?(g.rows[0]||sRow):detailRows[0];
    // Last detail row (the one immediately above the summary row) supplies the end time
    const lastRow=isSingleEntry?(g.rows[0]||sRow):detailRows[detailRows.length-1];
    const styleOptName=firstRow?String(firstRow[C.styleOpt]||"").trim():"";
    const styleDisplayName=styleOptName||g.styleNo;

    // PRD DYS: sum detail rows (or single row's value)
    let prdDysSum=0;
    if(isSingleEntry){
      prdDysSum=parseFloat(sRow[C.prdDys])||0;
    }else{
      detailRows.forEach(r=>{prdDysSum+=parseFloat(r[C.prdDys])||0;});
    }
    const prodDays=Math.max(1,roundPrdDys(prdDysSum));

    // From summary row (dates, quantities)
    const plnQty=parseFloat(sRow[C.plnQty])||0;
    const ordQty=parseFloat(sRow[C.ordQty])||0;
    const eff=parseFloat(sRow[C.eff])||0;
    const tgt=parseFloat(sRow[C.tgt])||0;
    const th=parseFloat(sRow[C.th])||0;
    // GMT TYPE: summary row has it blank — read from first detail row (or single row)
    const gmtSourceRow=firstRow||sRow;
    const gmtType=String(gmtSourceRow[C.gmtType]||sRow[C.gmtType]||"").trim();
    const merchant=String(sRow[C.merchant]||"").trim();

    // Time-precise boundaries: date comes from the summary row's ST/FI,
    // the clock time comes from the first detail row (start) / last detail row (end).
    // Falls back to a full 7:00–18:30 working day when time columns are absent (e.g. old-format files,
    // or single-entry styles with no detail rows).
    const stDateOnly=excelSerialToDate(sRow[C.st]);
    const fiDateOnly=excelSerialToDate(sRow[C.fi]);
    const startTimeMin=hasTimeCols&&firstRow?parseTimeOfDay(firstRow[C.prodStartTime]):null;
    const endTimeMin=hasTimeCols&&lastRow?parseTimeOfDay(lastRow[C.prodEndTime]):null;
    const startDate=combineDateAndTime(stDateOnly,startTimeMin,WORK_START_MIN);
    const endDate=combineDateAndTime(fiDateOnly,endTimeMin,WORK_END_MIN);
    const delDate=excelSerialToDate(sRow[C.delDate]);
    const _rawTgtCut=sRow[C.tgtCut];
    const tgtCutDate=excelSerialToDate(_rawTgtCut);


    const dailyQty=prodDays>0?r2(plnQty/prodDays):0;

    // Keep the real per-row quantity + time-window "chunks" that make up this style (before
    // they get combined into the single total above) — this is what lets the Dashboard tab
    // show a truthful day-by-day quantity spread instead of an invented smooth average.
    // When a row's own ST/FI + time are usable, that's its real window; otherwise it chains
    // on from the previous chunk's end, sized by its own PRD DYS (or a proportional fallback).
    const chunks=[];
    if(isSingleEntry){
      chunks.push({qty:plnQty,startDate,endDate});
    }else{
      let cursor=new Date(startDate);
      detailRows.forEach(row=>{
        const rowQty=parseFloat(row[C.plnQty])||0;
        const ownSTdate=excelSerialToDate(row[C.st]);
        const ownFIdate=excelSerialToDate(row[C.fi]);
        const ownStartMin=hasTimeCols?parseTimeOfDay(row[C.prodStartTime]):null;
        const ownEndMin=hasTimeCols?parseTimeOfDay(row[C.prodEndTime]):null;
        let cStart=(ownSTdate&&ownStartMin!=null)?combineDateAndTime(ownSTdate,ownStartMin,WORK_START_MIN):new Date(cursor);
        let cEnd=(ownFIdate&&ownEndMin!=null)?combineDateAndTime(ownFIdate,ownEndMin,WORK_END_MIN):null;
        if(!cEnd||cEnd<=cStart){
          const ownDys=parseFloat(row[C.prdDys])||0;
          const durMin=ownDys>0?ownDys*WORK_SPAN_MIN:Math.max(1,WORK_SPAN_MIN*(plnQty>0?rowQty/plnQty:1/detailRows.length));
          cEnd=addWorkMinutes(cStart,Math.max(1,durMin));
        }
        chunks.push({qty:rowQty,startDate:cStart,endDate:cEnd});
        cursor=new Date(cEnd.getTime()+60000);
        if(cursor.getHours()*60+cursor.getMinutes()>WORK_END_MIN){cursor=nextWorkDay(cursor);cursor.setHours(7,0,0,0);}
      });
    }

    if(!styleColorMap[styleDisplayName]){
      styleColorMap[styleDisplayName]=STYLE_COLORS[colorIdx%STYLE_COLORS.length];
      colorIdx++;
    }

    return{
      id:uid(),
      styleNo:g.styleNo,
      styleName:styleDisplayName,
      gmtType,
      line:lineNum,
      startDate,
      endDate,
      delDate,
      tgtCutDate,
      plnQty,
      ordQty,
      eff,
      tgt,
      th,
      prodDays,
      prdDysSum:r2(prdDysSum),
      dailyQty,
      chunks,// real per-row quantity+time windows, for the Dashboard's day-by-day breakdown
      merchant,
      styleColor:styleColorMap[styleDisplayName],
      isSingleEntry,
      mergeGroup:g.mergeGroup||null,// SGL_MergeGroup tag from Excel
      // for canvas editing
      locked:false,
      notes:"",
      operations:[],
      operationsConfirmed:false,
      isNew:false,
    };
  }).filter(Boolean);

  // Attach raw data to each style for faithful GitHub save
  const styleIdToGroupIdx={};
  styles.forEach((s,i)=>{if(s)styleIdToGroupIdx[s.id]=i;});

  // Deduplicate by styleNo+line
  const seen=new Set();
  const dedupedStyles=styles.filter(s=>{
    // Use styleNo + line + startDate so same style appearing twice on same line
    // with different dates are kept as separate blocks (not deduped)
    const key=s.styleNo+"||"+s.line+"||"+(s.startDate?s.startDate.getTime():0);
    if(seen.has(key))return false;
    seen.add(key);return true;
  });

  // Auto-merge: group styles that share same SGL_MergeGroup tag

  // Log visual positions for line 8
  const _l8=dedupedStyles.filter(s=>s.line===8);
  const {visualStart:_vs,visualEnd:_ve}=computeVisualDates(_l8);
  const mergeTagged=dedupedStyles.filter(s=>s.mergeGroup);
  const untagged=dedupedStyles.filter(s=>!s.mergeGroup);
  const mergeGroups={};
  mergeTagged.forEach(s=>{
    if(!mergeGroups[s.mergeGroup])mergeGroups[s.mergeGroup]=[];
    mergeGroups[s.mergeGroup].push(s);
  });
  const autoMerged=Object.entries(mergeGroups).map(([mgId,subs])=>{
    const sorted=[...subs].sort((a,b)=>a.startDate-b.startDate);
    const mergedId=uid();
    return{
      id:mergedId,
      styleName:sorted.map(s=>s.styleName).join(" + "),
      gmtType:sorted[0].gmtType,
      line:sorted[0].line,
      startDate:new Date(sorted[0].startDate),
      endDate:new Date(sorted[sorted.length-1].endDate),
      delDate:sorted[0].delDate,
      tgtCutDate:sorted[0].tgtCutDate,
      plnQty:sorted.reduce((a,s)=>a+(s.plnQty||0),0),
      ordQty:sorted.reduce((a,s)=>a+(s.ordQty||0),0),
      eff:Math.round(sorted.reduce((a,s)=>a+(s.eff||0),0)/sorted.length),
      tgt:sorted.reduce((a,s)=>a+(s.tgt||0),0),th:sorted[0].th||0,
      prodDays:sorted.reduce((a,s)=>a+(s.prodDays||0),0),
      dailyQty:0,merchant:sorted[0].merchant,
      styleColor:sorted[0].styleColor,
      isMerged:true,mergeGroup:mgId,
      subStyles:sorted.map(s=>({...s})),
      locked:false,notes:"",operations:[],operationsConfirmed:false,isNew:false,isSingleEntry:false,
    };
  });
  autoMerged.forEach(m=>{m.dailyQty=r2(m.plnQty/Math.max(1,m.prodDays));});

  const finalStyles=[...untagged,...autoMerged];

  // Time-precision buffer: if one style's block ends at the exact same instant the
  // next style on the same line starts, nudge the next style's start forward 1 minute
  // so the two blocks don't visually collide at the boundary.
  if(hasTimeCols){
    const byLineArr={};
    finalStyles.forEach(s=>{if(!byLineArr[s.line])byLineArr[s.line]=[];byLineArr[s.line].push(s);});
    Object.values(byLineArr).forEach(arr=>{
      arr.sort((a,b)=>a.startDate-b.startDate);
      for(let i=0;i<arr.length-1;i++){
        const a=arr[i],b=arr[i+1];
        if(a.endDate&&b.startDate&&a.endDate.getTime()===b.startDate.getTime()){
          b.startDate=new Date(a.endDate.getTime()+60*1000);
        }
      }
    });
  }

  return {styles:finalStyles, rawRows:rows, rawHdr:hdr, colIndices:C, groups};
}

// ─── Parse OB file ────────────────────────────────────────────────────────────
function parseOB(sheet){
  // Use header:1 to get raw rows, then do flexible column matching
  // This handles .xls files where column names may have extra spaces or different casing
  const rawRows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
  if(!rawRows.length)return{};
  const hdrRaw=rawRows[0].map(h=>String(h||"").trim());

  // Flexible column finder — case insensitive, trim spaces
  function findCol(candidates){
    for(const c of candidates){
      const idx=hdrRaw.findIndex(h=>h.toLowerCase()===c.toLowerCase());
      if(idx>=0)return idx;
    }
    // Partial match fallback
    for(const c of candidates){
      const idx=hdrRaw.findIndex(h=>h.toLowerCase().includes(c.toLowerCase()));
      if(idx>=0)return idx;
    }
    return -1;
  }

  const C={
    styleNo: findCol(["Style Number","StyleNumber","Style No","Style_Number"]),
    desc:    findCol(["Description","Desc","Operation"]),
    mcCode:  findCol(["Mc Code","MC Code","McCode","Machine Code","Mc_Code"]),
    dept:    findCol(["Department","Dept"]),
    smv:     findCol(["SMV","Smv"]),
    gsdsmv:  findCol(["GSDSMV","GSD SMV","GsdSmv","Gsd Smv"]),
  };

  const map={};
  for(let i=1;i<rawRows.length;i++){
    const row=rawRows[i];
    if(!row||!row.length)continue;
    const sn=C.styleNo>=0?String(row[C.styleNo]||"").trim():"";
    if(!sn||sn==="null"||sn==="undefined")continue;
    if(!map[sn])map[sn]={smv:0,ops:[],_keys:new Set()};
    const smvVal=C.smv>=0?parseFloat(row[C.smv])||0:0;
    if(smvVal>map[sn].smv)map[sn].smv=smvVal;// keep max SMV seen
    const desc=C.desc>=0?String(row[C.desc]||"").trim():"";
    if(desc){
      const op={
        description:desc,
        mcCode:C.mcCode>=0?String(row[C.mcCode]||"").trim():"",
        department:C.dept>=0?String(row[C.dept]||"").trim():"",
        gsdsmv:C.gsdsmv>=0?parseFloat(row[C.gsdsmv])||0:0,
      };
      const key=op.description+"||"+op.mcCode+"||"+op.department+"||"+op.gsdsmv;
      if(!map[sn]._keys.has(key)){
        map[sn]._keys.add(key);
        map[sn].ops.push(op);
      }
    }
  }
  return map;
}

function stylesToBase64(styles){
  const rows=[];
  [...styles].sort((a,b)=>a.line-b.line||(a.startDate-b.startDate)).forEach(s=>{
    rows.push({
      "Style Name":s.styleName,"Style No":s.styleNo,"GMT Type":s.gmtType,
      "Line":s.line,"Start Date":ds(s.startDate),"End Date":ds(s.endDate),
      "Del Date":ds(s.delDate),"PLN QTY":s.plnQty,"Ord Qty":s.ordQty,
      "Daily Qty":s.dailyQty,"Prod Days":s.prodDays,"EFF%":s.eff,"TGT":s.tgt,
      "TGT CUT":ds(s.tgtCutDate),"Merchant":s.merchant,
    });
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Production_Data");
  const bin=XLSX.write(wb,{type:"binary",bookType:"xlsx"});
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let b64="";const chunk=8192;
  for(let i=0;i<bytes.length;i+=chunk)b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(b64);
}

// Convert Uint8Array to base64
function bytesToBase64(bytes){
  let b64="";const chunk=8192;
  for(let i=0;i<bytes.length;i+=chunk)b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(b64);
}

// Build faithful FR Plan xlsx — same structure as original, only patching changed rows
function buildFRPlanBase64(styles,rawFRData){
  if(!rawFRData){
    return stylesToBase64(styles);
  }
  const{rawRows,colIndices:C}=rawFRData;
  // Rebuild groups from rawRows using fixed per-line gap detection
  // (avoids using stale groups that may have been built with old buggy parser)
  const groups=[];
  let _cur=null;const _lastKeyByLine={};
  for(let i=1;i<rawRows.length;i++){
    const _row=rawRows[i];
    const _sNo=String(_row[C.styleNo]||"").trim();
    if(!_sNo||_sNo==="-")continue;
    const _fLine=String(_row[C.facLine]||"").trim();
    if(!_fLine)continue;
    const _key=_fLine+"||"+_sNo;
    const _acc=String(_row[C.acc]||"").trim();
    const _sOpt=String(_row[C.styleOpt]||"").trim();
    const _isSumm=!_acc&&!_sOpt;
    const _lineLastKey=_lastKeyByLine[_fLine]||null;
    const _isGap=!_isSumm&&_cur&&_cur.key===_key&&_lineLastKey!==null&&_lineLastKey!==_key;
    if(!_cur||_cur.key!==_key||_isGap){
      if(_cur)groups.push(_cur);
      const _mg=C.mergeGroup>=0?String(_row[C.mergeGroup]||"").trim():"";
      _cur={key:_key,facLine:_fLine,styleNo:_sNo,rows:[],summaryRow:null,mergeGroup:_mg||null};
    }
    if(!_isSumm){_lastKeyByLine[_fLine]=_key;_cur.rows.push(_row);}
    else{_cur.summaryRow=_row;}
  }
  if(_cur)groups.push(_cur);

  // Date to Excel serial using LOCAL date parts (avoids timezone offset)
  function dateToSerial(d){
    if(!d)return null;
    const dt=new Date(d);
    const local=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());
    return Math.round((local.getTime()/86400000)+25569);
  }
  // Time-of-day to Excel's native time fraction (0..1) — same representation Excel itself
  // uses, so it displays correctly once the column's number format is (re)applied below.
  function timeToFraction(d){
    if(!d)return null;
    return(d.getHours()*60+d.getMinutes())/1440;
  }

  // Build lookup: originalFacLine+"||"+styleNo -> updated style
  // Key must match the group key so duplicate styleNos on different lines are handled correctly
  // We map each group's ORIGINAL key to the CURRENT canvas style that came from it
  // Since canvas styles store styleNo=g.styleNo but line may have changed,
  // we need to match by styleNo AND original line from the group

  // First build a reverse map: styleNo -> list of canvas styles with that styleNo
  const stylesByNo={};
  styles.forEach(s=>{
    if(!stylesByNo[s.styleNo])stylesByNo[s.styleNo]=[];
    stylesByNo[s.styleNo].push(s);
  });
  // Also handle merged blocks
  styles.forEach(s=>{
    if(s.isMerged&&s.subStyles){
      s.subStyles.forEach(sub=>{
        if(!stylesByNo[sub.styleNo])stylesByNo[sub.styleNo]=[];
        stylesByNo[sub.styleNo].push(sub);
      });
    }
  });

  // Build group key -> canvas style map
  // For each group, find the canvas style that matches by styleNo
  // If multiple canvas styles have same styleNo (was on multiple lines originally),
  // match by closest original line
  // Map by group INDEX so duplicate-key groups are handled independently
  const styleMapByIdx={};
  const usedStyleIds=new Set();
  // Sort group indices by startDate for earliest-first matching
  const sortedIdxs=[...groups.keys()].sort((ai,bi)=>{
    const a=groups[ai],b=groups[bi];
    const aDate=a.rows[0]?a.rows[0][C.st]:(a.summaryRow?a.summaryRow[C.st]:null);
    const bDate=b.rows[0]?b.rows[0][C.st]:(b.summaryRow?b.summaryRow[C.st]:null);
    return (aDate||0)>(bDate||0)?1:-1;
  });
  sortedIdxs.forEach(gIdx=>{
    const g=groups[gIdx];
    const candidates=(stylesByNo[g.styleNo]||[]).filter(s=>!usedStyleIds.has(s.id));
    if(candidates.length===0)return;
    const origLineNum=parseInt(g.facLine.replace(/\D/g,""))||0;
    const gStartRaw=g.rows[0]?g.rows[0][C.st]:(g.summaryRow?g.summaryRow[C.st]:null);
    const gStart=gStartRaw?new Date(gStartRaw).getTime():0;
    const lineMatch=candidates.filter(s=>s.line===origLineNum);
    const pool=lineMatch.length>0?lineMatch:candidates;
    let best=pool[0];
    if(pool.length>1&&gStart){
      best=pool.reduce((a,b)=>{
        const aDiff=Math.abs((a.startDate?new Date(a.startDate).getTime():0)-gStart);
        const bDiff=Math.abs((b.startDate?new Date(b.startDate).getTime():0)-gStart);
        return aDiff<=bDiff?a:b;
      });
    }
    styleMapByIdx[gIdx]=best;
    usedStyleIds.add(best.id);
  });

  // Build set of active group keys (groups that have a matching canvas style)
  const activeKeys=new Set(Object.keys(styleMapByIdx).map(i=>groups[parseInt(i)].key));

  // Build summary row identification: for each group, mark which row object is the summary
  const summaryRowSet=new Set();
  groups.forEach(g=>{ if(g.summaryRow)summaryRowSet.add(g.summaryRow); });

  const outRows=[rawRows[0]];// header row
  // Use group index as unique key to prevent skipping duplicate-named groups
  const writtenGroupIdxs=new Set();

  // Build mergeGroup column index — use existing if present, else append
  const totalCols=rawRows[0].length;
  let mgColIdx=C.mergeGroup>=0?C.mergeGroup:totalCols;// append if not present

  // Build map: styleNo -> mergeGroup tag (from merged styles on canvas)
  const mergeGroupMap={};// styleNo -> mgId
  styles.forEach(s=>{
    if(s.isMerged&&s.subStyles){
      // Generate stable merge group id from sorted sub-style IDs
      const mgId=s.mergeGroup||("MG-"+s.id.slice(0,6));
      s.subStyles.forEach(sub=>{mergeGroupMap[sub.styleNo]=mgId;});
    }
  });

  // Ensure header has SGL_MergeGroup column
  if(mgColIdx===totalCols){
    outRows[0]=[...rawRows[0],"SGL_MergeGroup"];
  }

  // Iterate groups — use index to handle duplicate keys (same styleNo twice on same line)
  groups.forEach((g,gIdx)=>{
    const styleNo=g.styleNo;
    if(writtenGroupIdxs.has(gIdx))return;
    if(!styleMapByIdx[gIdx])return;
    writtenGroupIdxs.add(gIdx);

    const updated=styleMapByIdx[gIdx];
    const mgTag=mergeGroupMap[styleNo]||"";

    // Get sub-style dates if this style is part of a merge
    let subStyle=null;
    if(updated&&updated.isMerged&&updated.subStyles){
      subStyle=updated.subStyles.find(sub=>sub.styleNo===styleNo);
    }
    const stDate=subStyle?subStyle.startDate:(updated?updated.startDate:null);
    const fiDate=subStyle?subStyle.endDate:(updated?updated.endDate:null);
    // First/last detail rows are where Production start/end time live (the summary row
    // leaves them blank) — same convention the importer expects, so exported files
    // re-import correctly with full time precision preserved.
    const firstDetailRow=g.rows[0]||null;
    const lastDetailRow=g.rows.length>0?g.rows[g.rows.length-1]:null;
    const hasTimeCols=C.prodStartTime>=0&&C.prodEndTime>=0;

    const allGroupRows=[...g.rows];
    if(g.summaryRow)allGroupRows.push(g.summaryRow);

    allGroupRows.forEach(row=>{
      const newRow=[...row];
      // Extend row to include merge group column
      while(newRow.length<=mgColIdx)newRow.push(null);
      newRow[mgColIdx]=mgTag||null;

      const isSummary=summaryRowSet.has(row);
      if(updated){
        const lineStr="SGL "+String(updated.line).padStart(2,"0");
        if(C.facLine>=0)newRow[C.facLine]=lineStr;
        if(isSummary){
          if(C.st>=0)newRow[C.st]=dateToSerial(stDate);
          if(C.fi>=0)newRow[C.fi]=dateToSerial(fiDate);
          // Delivery Date and Target Cut Date were previously never written back here —
          // edits made in the Reports > Delivery Date Editor (or anywhere else) were
          // silently lost on export/GitHub save. Now they're kept in sync too.
          if(C.delDate>=0)newRow[C.delDate]=updated.delDate?dateToSerial(updated.delDate):null;
          if(C.tgtCut>=0)newRow[C.tgtCut]=updated.tgtCutDate?dateToSerial(updated.tgtCutDate):null;
        }
        if(hasTimeCols){
          if(row===firstDetailRow&&stDate)newRow[C.prodStartTime]=timeToFraction(stDate);
          if(row===lastDetailRow&&fiDate)newRow[C.prodEndTime]=timeToFraction(fiDate);
        }
      }
      outRows.push(newRow);
    });
  });

  // Any style not matched to an original Excel row (brand-new, added via "Add Style" in the
  // canvas) would otherwise be silently dropped from the export — append a row for each one,
  // written as a self-contained "summary-only" row (matches the parser's single-entry fallback).
  const rowWidth=outRows[0].length;
  const flatAllStyles=[];
  styles.forEach(s=>{
    if(s.isMerged&&s.subStyles)s.subStyles.forEach(sub=>flatAllStyles.push(sub));
    else flatAllStyles.push(s);
  });
  flatAllStyles.forEach(s=>{
    if(usedStyleIds.has(s.id))return; // already written above via its original group
    const row=new Array(rowWidth).fill(null);
    if(C.facLine>=0)row[C.facLine]="SGL "+String(s.line).padStart(2,"0");
    if(C.styleNo>=0)row[C.styleNo]=s.styleNo||s.styleName;
    if(C.gmtType>=0)row[C.gmtType]=s.gmtType||"";
    if(C.plnQty>=0)row[C.plnQty]=s.plnQty||0;
    if(C.ordQty>=0)row[C.ordQty]=s.ordQty||0;
    if(C.eff>=0)row[C.eff]=s.eff||0;
    if(C.tgt>=0)row[C.tgt]=s.tgt||0;
    if(C.th>=0)row[C.th]=s.th||0;
    if(C.st>=0)row[C.st]=dateToSerial(s.startDate);
    if(C.fi>=0)row[C.fi]=dateToSerial(s.endDate);
    if(C.delDate>=0&&s.delDate)row[C.delDate]=dateToSerial(s.delDate);
    if(C.tgtCut>=0&&s.tgtCutDate)row[C.tgtCut]=dateToSerial(s.tgtCutDate);
    if(C.merchant>=0)row[C.merchant]=s.merchant||"";
    row[mgColIdx]=null;
    outRows.push(row);
  });

  const ws=XLSX.utils.aoa_to_sheet(outRows);
  // Rebuilding the sheet from a plain array loses each cell's original Excel number format
  // (dates/times would otherwise show as raw numbers like 46237 or 0.569444). Reapply the
  // correct format to every cell in these columns — including ones this export didn't touch —
  // so the whole column displays consistently as dates/times, not a mix of text and numbers.
  const dateCols=[C.st,C.fi,C.delDate,C.tgtCut].filter(c=>c>=0);
  const timeCols=[C.prodStartTime,C.prodEndTime].filter(c=>c>=0);
  for(let r=1;r<outRows.length;r++){
    dateCols.forEach(c=>{
      const addr=XLSX.utils.encode_cell({r,c});
      const cell=ws[addr];
      if(cell&&typeof cell.v==="number"){cell.t="n";cell.z="m/d/yyyy";}
    });
    timeCols.forEach(c=>{
      const addr=XLSX.utils.encode_cell({r,c});
      const cell=ws[addr];
      if(cell&&typeof cell.v==="number"){cell.t="n";cell.z="h:mm AM/PM";}
    });
  }
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  const bin=XLSX.write(wb,{type:"binary",bookType:"xlsx"});
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytesToBase64(bytes);
}

// Generic GitHub file push
async function ghPushFile(url,content,message,token,branch){
  let sha=null;
  const chk=await fetch(url,{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});
  if(chk.ok){const d=await chk.json();sha=d.sha;}
  const body={message,content};
  if(sha)body.sha=sha;
  if(branch)body.branch=branch;// explicit — without this GitHub would default to the repo's main branch
  const res=await fetch(url,{method:"PUT",
    headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},
    body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json();throw new Error(e.message||"GitHub push failed");}
  return true;
}

const GH_OB_FILE="OB_Data.xlsx";
const GH_OB_URL="https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+GH_OB_FILE+"?ref="+GH_BRANCH;

async function pushToGitHub(styles,rawFRData,obRawBytes,what,onStatus){
  // what: "fr" | "ob" | "both"
  try{
    onStatus("saving");
    const now=new Date();
    const stamp=now.toLocaleDateString("en-GB")+" "+now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    if(what==="fr"||what==="both"){
      const content=buildFRPlanBase64(styles,rawFRData);
      await ghPushFile(GH_URL,content,"SGL FR Plan — "+stamp,GH_TOKEN,GH_BRANCH);
    }
    if((what==="ob"||what==="both")&&obRawBytes){
      // obRawBytes is already a base64 string — push directly
      await ghPushFile(GH_OB_URL,obRawBytes,"SGL OB Data — "+stamp,GH_TOKEN,GH_BRANCH);
    }else if((what==="ob"||what==="both")&&!obRawBytes){
      throw new Error("No OB file loaded. Please upload the OB file on the Upload page first.");
    }
    onStatus("saved");setTimeout(()=>onStatus(null),3500);
  }catch(e){onStatus("error:"+e.message);}
}

function useTooltip(){
  const [tip,setTip]=useState(null);
  const show=useCallback((e,content)=>{setTip({x:e.clientX+14,y:e.clientY-10,content});},[]);
  const hide=useCallback(()=>setTip(null),[]);
  const move=useCallback((e)=>{if(tip)setTip(t=>({...t,x:e.clientX+14,y:e.clientY-10}));},[tip]);
  const Tooltip=tip?el("div",{className:"tooltip",style:{left:tip.x,top:tip.y}},tip.content):null;
  return{show,hide,move,Tooltip};
}

// ─── computeVisualDates ──────────────────────────────────────────────────────
// Computes display-only start/end adjustments so blocks never visually overlap.
// Rule: rawOverlap = diffDays(b.startDate, a.endDate)
//   rawOverlap <= 0  → gap or no touch → nothing to do
//   rawOverlap == 1  → a ends same day as b starts (or 1-day raw overlap from undo/redo)
//     → if A is single-day: push B visual start +1 day
//     → otherwise: shrink A visual end by 1 day
//   rawOverlap >= 2  → genuine conflict that user must fix manually
//                      no visual adjustment; detectConflicts will flag it
function computeVisualDates(styles){
  const byLine={};
  styles.forEach(s=>{if(!byLine[s.line])byLine[s.line]=[];byLine[s.line].push(s);});
  const visualEnd={};
  const visualStart={};
  Object.values(byLine).forEach(lineStyles=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    for(let i=0;i<sorted.length-1;i++){
      const a=sorted[i],b=sorted[i+1];
      if(!a.startDate||!a.endDate||!b.startDate)continue;
      // rawOverlap: how many days does A's end extend past B's start
      // 0 = same day (touch), 1 = 1 day past, negative = gap
      const rawOverlap=Math.round((a.endDate-b.startDate)/(86400*1000));
      if(rawOverlap===0||rawOverlap===1){
        const aIsSingleDay=ds(a.startDate)===ds(a.endDate);
        if(aIsSingleDay){
          // Push B forward 1 day — if that lands on Sunday (not a working day), push to Monday
          let newBStart=addDays(b.startDate,1);
          if(newBStart.getDay()===0)newBStart=addDays(newBStart,1);
          visualStart[b.id]=newBStart;
        }else{
          // Shrink A back 1 day — if that lands on Sunday (not a working day), go back to Saturday
          let newAEnd=addDays(a.endDate,-1);
          if(newAEnd.getDay()===0)newAEnd=addDays(newAEnd,-1);
          visualEnd[a.id]=newAEnd;
        }
      }
      // rawOverlap >= 2: real conflict, no adjustment here
    }
  });
  return{visualEnd,visualStart};
}

// ─── detectConflicts ─────────────────────────────────────────────────────────
// Only flags genuine conflicts: raw overlap >= 2 days.
// rawOverlap of 0 or 1 are handled purely visually by computeVisualDates above.
function detectConflicts(styles){
  const byLine={};
  styles.forEach(s=>{
    if(!byLine[s.line])byLine[s.line]=[];
    byLine[s.line].push(s);
  });
  const conflicts=[];
  Object.values(byLine).forEach(lineStyles=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    for(let i=0;i<sorted.length-1;i++){
      const a=sorted[i],b=sorted[i+1];
      if(!a.endDate||!b.startDate)continue;
      const rawOverlap=Math.round((a.endDate-b.startDate)/(86400*1000));
      if(rawOverlap>=2){
        conflicts.push({styleA:a.styleName,styleB:b.styleName,line:a.line,overlapDays:rawOverlap});
      }
    }
  });
  return conflicts;
}

// ─── Similarity Engine ────────────────────────────────────────────────────────
function getStyleOps(s,obMap){
  // For merged blocks use first sub-style
  const name=s.isMerged&&s.subStyles&&s.subStyles.length>0?s.subStyles[0].styleName:s.styleName;
  const ob=obMap&&obMap[name];
  return ob&&ob.ops?ob.ops:null;
}

function calcSimilarity(opsA,opsB,filters){
  // opsA = previous style ops, opsB = new style ops (denominator)
  if(!opsA||!opsB||opsB.length===0)return null;
  let matched=0;
  opsB.forEach(opB=>{
    const found=opsA.some(opA=>{
      let match=true;
      if(filters.description){
        match=match&&(opA.description||"").toLowerCase().trim()===(opB.description||"").toLowerCase().trim();
      }
      if(filters.mcCode){
        match=match&&(opA.mcCode||"").toLowerCase().trim()===(opB.mcCode||"").toLowerCase().trim();
      }
      // gmtType is style-level, not operation-level — handled separately in callers
      return match;
    });
    if(found)matched++;
  });
  return Math.round((matched/opsB.length)*100);
}

function buildLineSimilarities(styles,obMap,filters){
  // Group by line, sort by start date
  const byLine={};
  styles.forEach(s=>{if(!byLine[s.line])byLine[s.line]=[];byLine[s.line].push(s);});
  const result={};// styleId -> {pct, prevStyleName, hasOps}
  Object.entries(byLine).forEach(([line,lineStyles])=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    sorted.forEach((s,i)=>{
      if(i===0){result[s.id]={pct:null,first:true,hasOps:!!getStyleOps(s,obMap)};return;}
      const prev=sorted[i-1];
      const opsA=getStyleOps(prev,obMap);
      const opsB=getStyleOps(s,obMap);
      if(!opsA||!opsB){
        result[s.id]={pct:null,first:false,hasOps:!!opsB,prevHasOps:!!opsA};
      }else{
        // If gmtType filter is on and styles have different garment types → 0% similarity
        if(filters.gmtType&&(prev.gmtType||"").toLowerCase().trim()!==(s.gmtType||"").toLowerCase().trim()){
          result[s.id]={pct:0,first:false,hasOps:true,prevStyleName:prev.styleName};
        }else{
          const pct=calcSimilarity(opsA,opsB,filters);
          result[s.id]={pct,first:false,hasOps:true,prevStyleName:prev.styleName};
        }
      }
    });
  });
  return result;
}

function simColor(pct){
  if(pct===null)return null;
  if(pct>=80)return"#16a34a";
  if(pct>=60)return"#2563eb";
  if(pct>=40)return"#ca8a04";
  if(pct>=20)return"#dc2626";
  return"#6b7280";
}

function buildLineSimilarityForStyle(selectedStyle,allStyles,obMap,filters){
  const refOps=getStyleOps(selectedStyle,obMap);
  const result={};
  allStyles.forEach(s=>{
    if(s.id===selectedStyle.id){result[s.id]={pct:null,isSelf:true,hasOps:!!refOps};return;}
    const sOps=getStyleOps(s,obMap);
    if(!refOps||!sOps){result[s.id]={pct:null,hasOps:!!sOps,isSelf:false};return;}
    let pct;
    if(filters.gmtType&&(selectedStyle.gmtType||'').toLowerCase().trim()!==(s.gmtType||'').toLowerCase().trim()){
      pct=0;
    }else{
      pct=calcSimilarity(refOps,sOps,filters);
    }
    result[s.id]={pct,hasOps:true,isSelf:false};
  });
  return result;
}

// Build similarity groups: cluster styles with >=90% op name similarity
function buildSimGroups(styles,obMap){
  const palette=["#0891b2","#059669","#7c3aed","#b45309","#0369a1","#be185d",
    "#4338ca","#15803d","#9d174d","#c2410c","#0f766e","#6d28d9","#065f46","#92400e"];
  // Pre-build op description sets per style O(n)
  const opSets={};
  styles.forEach(s=>{
    const ops=getStyleOps(s,obMap);
    if(ops&&ops.length)opSets[s.id]=new Set(ops.map(o=>(o.description||"").toLowerCase().trim()));
  });
  // Bidirectional similarity — max of A→B and B→A
  function fastSim(idA,idB){
    const a=opSets[idA],b=opSets[idB];
    if(!a||!b||!a.size||!b.size)return 0;
    let ab=0;b.forEach(op=>{if(a.has(op))ab++;});
    let ba=0;a.forEach(op=>{if(b.has(op))ba++;});
    return Math.round(Math.max(ab/b.size,ba/a.size)*100);
  }
  // Union-Find so already-assigned styles are still considered
  const ids=styles.map(s=>s.id).filter(id=>opSets[id]);
  const par={};ids.forEach(id=>{par[id]=id;});
  function find(x){while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;}
  // Compare all pairs and union if >=90%
  for(let i=0;i<ids.length;i++)
    for(let j=i+1;j<ids.length;j++)
      if(fastSim(ids[i],ids[j])>=90)par[find(ids[i])]=find(ids[j]);
  // Cluster by root
  const clusters={};
  ids.forEach(id=>{const r=find(id);(clusters[r]=clusters[r]||[]).push(id);});
  const groups=[];let ci=0;
  Object.values(clusters).forEach(c=>{
    if(c.length<2)return;
    groups.push({color:palette[ci++%palette.length],styleIds:c});
  });
  const colorMap={};
  groups.forEach(g=>g.styleIds.forEach(id=>{colorMap[id]=g.color;}));
  return{colorMap,groups};
}

function buildRefIds(styles){
  // line -> sorted styles -> refId like "1-A", "1-B"
  const byLine={};
  styles.forEach(s=>{if(!byLine[s.line])byLine[s.line]=[];byLine[s.line].push(s);});
  const refMap={};// styleId -> refId
  Object.entries(byLine).forEach(([line,lineStyles])=>{
    const sorted=[...lineStyles].sort((a,b)=>a.startDate-b.startDate);
    sorted.forEach((s,i)=>{
      const letter=String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):"");
      refMap[s.id]=`${line}-${letter}`;
    });
  });
  return refMap;
}


// ─── PlanningBoardView ────────────────────────────────────────────────────────
function PlanningBoardView({styles,colorMode,onEdit,selectMode,selectedId,onSelectStyle,
  simMode=false,simFilters={description:true},obMap={},highlightId=null,
  lineSimMode=false,lineSimFilters={description:true},lineSimThreshold=80,
  lineSimSelectedId=null,onLineSimSelect=null,alwaysSimFilters={description:true,mcCode:false,gmtType:false},
  simGroups=null,boardZoom=1,setBoardZoom=null,dateRangeOverride=null,gmtFocus=null}){
  // Build similarity data if sim mode is on
  const simData=useMemo(()=>simMode?buildLineSimilarities(styles,obMap,simFilters):{},[simMode,styles,obMap,simFilters]);
  // Always-on consecutive similarity data (no color, just labels)
  const alwaysSimData=useMemo(()=>buildLineSimilarities(styles,obMap,alwaysSimFilters),
    [styles,obMap,alwaysSimFilters]);

  const lineSimData=useMemo(()=>{
    if(!lineSimMode||!lineSimSelectedId)return{};
    const sel=styles.find(s=>s.id===lineSimSelectedId);
    if(!sel)return{};
    const res=buildLineSimilarityForStyle(sel,styles,obMap,lineSimFilters);
    const vals=Object.values(res).filter(v=>!v.isSelf&&v.pct!==null).map(v=>v.pct).sort((a,b)=>b-a);
    console.log('[LineSim] selected:',sel.styleName,'results:',vals.slice(0,10),'threshold:',lineSimThreshold);
    return res;
  },[lineSimMode,lineSimSelectedId,styles,obMap,lineSimFilters]);
  const {show,hide,move,Tooltip}=useTooltip();
  // Zoom scales actual pixel dimensions (not CSS transform) so sticky headers/labels keep working.
  const zColW=COL_W*boardZoom, zRowH=ROW_H*boardZoom, zLblW=LBL_W*boardZoom;
  // Extra header row height reserved for sub-hour time ticks at higher zoom (see TICK_STEP_MIN below).
  const baseHdrH=HDR_H*boardZoom;
  const tickRowH=boardZoom>=1.25?18:0;
  const zHdrH=baseHdrH+tickRowH;
  // Scale block-content font sizes/padding with zoom too, so text never gets clipped
  // by the shrinking row height at low zoom — everything shrinks together, in proportion.
  const fz=n=>Math.max(5,Math.round(n*boardZoom*10)/10);
  const pd=n=>Math.round(n*boardZoom*10)/10;
  // Scroll container ref + focused-block popover state (for cursor-anchored zoom & click-to-focus)
  const scrollRef=useRef(null);
  const [focusPopover,setFocusPopover]=useState(null); // {id, x, y} — click-to-focus detail popover for small/medium blocks

  // ── Two independent, non-interfering zoom mechanisms ────────────────────────
  // 1) Ctrl/Cmd + mouse-wheel — anchors to the exact point under the cursor (Premiere-style).
  //    It resolves its own scroll position immediately, and flags wheelTriggeredRef so the
  //    button/reset effect below knows to leave it alone.
  // 2) Toolbar +/− and Reset buttons — anchor to the center of the current viewport instead,
  //    since there's no cursor position associated with a button click. Handled entirely by
  //    the useEffect below, independently of the wheel shortcut.
  const wheelTriggeredRef=useRef(false);
  const prevZoomRef=useRef(boardZoom);

  const handleWheelZoom=useCallback(e=>{
    if(!(e.ctrlKey||e.metaKey)||!setBoardZoom)return;
    e.preventDefault();
    const el2=scrollRef.current;if(!el2)return;
    const rect=el2.getBoundingClientRect();
    const cursorX=e.clientX-rect.left; // px from left edge of the visible scroll viewport
    const contentX=el2.scrollLeft+cursorX-zLblW; // px from timeline origin (after the sticky label column)
    const timeUnits=contentX/zColW; // fractional day-index under the cursor, independent of zoom
    const dir=e.deltaY<0?1.12:1/1.12;
    wheelTriggeredRef.current=true;
    setBoardZoom(z=>{
      const nz=Math.max(.25,Math.min(8,+(z*dir).toFixed(4)));
      // After React re-renders at the new zoom, restore the same time-under-cursor position.
      requestAnimationFrame(()=>{
        const el3=scrollRef.current;if(!el3)return;
        const newColW=COL_W*nz;
        el3.scrollLeft=Math.max(0,timeUnits*newColW-cursorX+LBL_W*nz);
      });
      return nz;
    });
  },[setBoardZoom,zColW,zLblW]);

  // Button/reset-triggered zoom: anchor to the center of the current viewport.
  // Skipped entirely when the change came from the wheel shortcut above (that already
  // handled its own, more precise cursor-anchored scroll adjustment) — so the two
  // mechanisms never fight over scrollLeft.
  useEffect(()=>{
    const el2=scrollRef.current;
    const oldZoom=prevZoomRef.current;
    if(el2&&oldZoom!==boardZoom){
      if(!wheelTriggeredRef.current){
        const rect=el2.getBoundingClientRect();
        const centerX=rect.width/2;
        const oldColW=COL_W*oldZoom,oldLblW=LBL_W*oldZoom;
        const contentX=el2.scrollLeft+centerX-oldLblW;
        const timeUnits=contentX/oldColW;
        const newColW=COL_W*boardZoom,newLblW=LBL_W*boardZoom;
        el2.scrollLeft=Math.max(0,timeUnits*newColW-centerX+newLblW);
      }
      wheelTriggeredRef.current=false;
    }
    prevZoomRef.current=boardZoom;
  },[boardZoom]);

  if(!styles.length)return el(NoData,{});

  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  let minDate=null,maxDate=null;
  if(dateRangeOverride&&dateRangeOverride.start&&dateRangeOverride.end){
    // Clip the visible date range to exactly what was requested (e.g. a Compact View filter),
    // instead of stretching to fit every style's full extent — a style overlapping the edge of
    // the requested window can otherwise run far beyond it and make the whole board unnecessarily wide.
    minDate=dateRangeOverride.start;maxDate=dateRangeOverride.end;
  }else{
    styles.forEach(s=>{
      if(s.startDate&&(!minDate||s.startDate<minDate))minDate=s.startDate;
      if(s.endDate&&(!maxDate||s.endDate>maxDate))maxDate=s.endDate;
      if(s.delDate&&(!maxDate||s.delDate>maxDate))maxDate=s.delDate;
    });
  }
  if(!minDate||!maxDate)return el(NoData,{});
  // Build working dates: Mon–Sat only (exclude Sundays)
  const allDates=[];
  let cur=new Date(minDate);cur.setHours(0,0,0,0);
  const eod=new Date(maxDate);eod.setHours(0,0,0,0);
  while(cur<=eod){
    if(cur.getDay()!==0)allDates.push(new Date(cur)); // skip Sunday
    cur.setDate(cur.getDate()+1);
  }

  const dateIndex={};allDates.forEach((d,i)=>{dateIndex[ds(d)]=i;});

  function getColor(s){
    if(colorMode==="garment")return getGmtColor(s.gmtType);
    if(colorMode==="simgroup"&&simGroups)return simGroups.colorMap[s.id]||"#4B5563";
    return s.styleColor;
  }

  // Note: with time-precise start/end (Phase 1), blocks are positioned by exact
  // fractional time-of-day rather than whole days, and the 1-minute buffer applied
  // at import time already keeps touching blocks from visually colliding — so the
  // old whole-day computeVisualDates nudging is no longer needed here.

  // Month groups for header
  const monthGroups=[];
  allDates.forEach((d,i)=>{
    const label=MONS[d.getMonth()]+" "+d.getFullYear();
    if(!monthGroups.length||monthGroups[monthGroups.length-1].label!==label)
      monthGroups.push({label,count:0,idx:i});
    monthGroups[monthGroups.length-1].count++;
  });

  const totalW=zLblW+allDates.length*zColW;

  // Delivery date line for selected style in select mode
  const selectedStyle=selectedId?styles.find(s=>s.id===selectedId):null;
  let delLineX=null;
  if(selectMode&&selectedStyle&&selectedStyle.delDate){
    const di=dateIndex[ds(selectedStyle.delDate)];
    if(di!=null)delLineX=zLblW+di*zColW+zColW/2;
  }

  return el("div",{style:{position:"relative",height:"100%",display:"flex",flexDirection:"column"}},
    Tooltip,
    el("div",{ref:scrollRef,onWheel:handleWheelZoom,className:"board-scroll",
      style:{flex:1,overflowX:"auto",overflowY:"auto",border:"none",background:"#fff"}},
      el("div",{style:{width:totalW,position:"relative"}},

        // Month header
        el("div",{style:{position:"sticky",top:0,zIndex:30,height:baseHdrH/2,display:"flex",background:NAVY,marginLeft:zLblW}},
          monthGroups.map((m,i)=>el("div",{key:i,style:{width:m.count*zColW,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",borderRight:"1px solid rgba(255,255,255,.1)"}},
            el("span",{style:{color:"rgba(255,255,255,.9)",fontSize:11,fontWeight:600,fontFamily:"'DM Mono',monospace"}},m.label)
          ))
        ),

        // Day header
        el("div",{style:{position:"sticky",top:baseHdrH/2,zIndex:30,height:baseHdrH/2,display:"flex",background:"#132f4c",marginLeft:zLblW}},
          allDates.map((d,i)=>el("div",{key:i,style:{width:zColW,flexShrink:0,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",borderRight:"1px solid rgba(255,255,255,.07)",
            background:d.getDay()===6?"rgba(0,0,0,.18)":"transparent"}},
            el("span",{style:{color:d.getDay()===6?"rgba(255,255,255,.5)":"rgba(255,255,255,.9)",fontSize:11,fontWeight:600}},d.getDate()),
            el("span",{style:{color:d.getDay()===6?"rgba(255,255,255,.4)":"rgba(255,255,255,.45)",fontSize:9,fontFamily:"'DM Mono',monospace"}},DAYS[d.getDay()])
          ))
        ),

        // Sub-hour time ticks (Premiere-style): shown once zoomed in enough to be legible,
        // and keep subdividing further the more you zoom in — hourly → 15 min → 5 min.
        tickRowH>0&&el("div",{style:{position:"sticky",top:baseHdrH,zIndex:29,height:tickRowH,
          background:"#0c2540",marginLeft:zLblW,borderBottom:"1px solid rgba(255,255,255,.12)",overflow:"hidden"}},
          (()=>{
            const stepMin=boardZoom<1.5?60:(boardZoom<5?15:5);
            // Hour marks (07:00, 08:00...) are always spaced a full 60 minutes apart regardless of
            // how fine the sub-ticks below them get, so they get their own — always roomier — label
            // visibility check. Only the finer sub-ticks (15/5-min) hide their labels when cramped,
            // while still drawing the tick line so the ruler stays continuous.
            const pxPerHour=60/WORK_SPAN_MIN*zColW;
            const pxPerTick=stepMin/WORK_SPAN_MIN*zColW;
            const showHourLabel=pxPerHour>=20;
            const showSubLabel=pxPerTick>=20;
            const ticks=[];
            allDates.forEach((d,di)=>{
              for(let m=WORK_START_MIN;m<=WORK_END_MIN;m+=stepMin){
                const frac=(m-WORK_START_MIN)/WORK_SPAN_MIN;
                const left=di*zColW+frac*zColW;
                const hh=Math.floor(m/60),mm=m%60;
                const isHourMark=mm===0;
                const showLabel=isHourMark?showHourLabel:showSubLabel;
                ticks.push(el("div",{key:di+"-"+m,style:{position:"absolute",left,top:0,bottom:0,
                  display:"flex",alignItems:"center",paddingLeft:2,
                  borderLeft:"1px solid rgba(255,255,255,"+(isHourMark?".28":".15")+")"}},
                  showLabel&&el("span",{style:{fontSize:7,fontWeight:isHourMark?600:400,
                    color:"rgba(255,255,255,"+(isHourMark?".8":".5")+")",fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}},
                    String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0"))
                ));
              }
            });
            return el("div",{style:{position:"relative",width:allDates.length*zColW,height:"100%"}},ticks);
          })()
        ),

        // Delivery date line (red vertical line for selected style)
        delLineX!=null&&el("div",{style:{position:"absolute",top:zHdrH,bottom:0,left:delLineX,width:2,
          background:"#ef4444",zIndex:25,pointerEvents:"none"},
          title:"Delivery: "+fmtDate(selectedStyle.delDate)},
          el("div",{style:{position:"sticky",top:zHdrH+4,background:"#ef4444",color:"#fff",
            fontSize:9,padding:"2px 4px",borderRadius:3,whiteSpace:"nowrap",fontWeight:600,
            fontFamily:"'DM Mono',monospace",width:"fit-content",transform:"translateX(-50%)"}},
            "DEL "+fmtDateShort(selectedStyle.delDate))
        ),

        // Lines
        allLines.map((line,li)=>{
          const lineStyles=styles.filter(s=>s.line===line).sort((a,b)=>a.startDate-b.startDate);

          return el("div",{key:line,style:{display:"flex",borderBottom:"1.5px solid rgba(0,0,0,.32)",minHeight:zRowH}},
            // Line label
            el("div",{style:{position:"sticky",left:0,zIndex:20,width:zLblW,flexShrink:0,background:"#fff",
              borderRight:"1px solid #e8ecf2",display:"flex",alignItems:"center",justifyContent:"center",
              fontWeight:700,fontSize:13,color:LINE_COLORS[(line-1)%LINE_COLORS.length],
              fontFamily:"'DM Mono',monospace",boxShadow:"2px 0 8px rgba(0,0,0,.04)"}},
              "L-"+String(line).padStart(2,"0")
            ),

            // Grid area
            el("div",{style:{position:"relative",flex:1,minHeight:zRowH,background:li%2===0?"transparent":"rgba(0,0,0,.012)"}},
              // Grid lines
              allDates.map((d,di)=>el("div",{key:di,style:{position:"absolute",top:0,bottom:0,left:di*zColW,width:1,
                background:d.getDay()===6?"rgba(0,0,0,.55)":"rgba(0,0,0,.42)",pointerEvents:"none"}})),

              // Style blocks
              lineStyles.map(s=>{
                if(!s.startDate||!s.endDate)return null;
                // Clamp to the visible day range first — with a filtered/override date range
                // (Compact View), a style can genuinely start/end outside the window; it should
                // be visually truncated at the edge, not silently disappear.
                const visStart=allDates[0]?new Date(Math.max(s.startDate,new Date(allDates[0]).setHours(7,0,0,0))):s.startDate;
                const lastIdx=allDates.length-1;
                const visEnd=allDates[lastIdx]?new Date(Math.min(s.endDate,new Date(allDates[lastIdx]).setHours(18,30,0,0))):s.endDate;
                if(visEnd<=visStart)return null;
                // Fractional day-index positions the block by exact time-of-day within
                // its start/end day (7:00 AM–6:30 PM window), not just whole days.
                const siFrac=dateTimeToFracIndex(visStart,dateIndex);
                const eiFrac=dateTimeToFracIndex(visEnd,dateIndex);

// ─── Canvas Editor ────────────────────────────────────────────────────────────
// ── Auto-Shift helpers ─────────────────────────────────────────────────────

// Next working day after date d (skips Sunday — Mon-Sat are working days)
function nextWorkDay(d){
  const n=new Date(d);n.setHours(0,0,0,0);
  n.setDate(n.getDate()+1);
  if(n.getDay()===0)n.setDate(n.getDate()+1);
  return n;
}

// Duration in calendar days (inclusive) preserving original prodDays
function getDur(s){
  if(s.prodDays&&s.prodDays>0)return s.prodDays;
  if(s.startDate&&s.endDate){
    const ms=new Date(s.endDate)-new Date(s.startDate);
    return Math.max(1,Math.round(ms/86400000)+1);
  }
  return 1;
}

// Add N working days to start → returns end date (start = day 1)
function addWorkDays(start,days){
  let cur=new Date(start);cur.setHours(0,0,0,0);
  let added=1;
  while(added<days){
    cur.setDate(cur.getDate()+1);
    if(cur.getDay()!==0)added++;
  }
  return cur;
}

// Repack all blocks on a line in chronological order, no gaps, preserving durations
// startFrom: the date the first block in the sorted list should start from
// Only repacks blocks whose startDate >= fromDate (blocks before are left alone)
function repackLine(allStyles,line,fromDate){
  const all=allStyles.filter(s=>s.line===line)
    .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
  if(all.length===0)return allStyles;

  // Split into "before" (untouched) and "after" (to repack)
  const fd=new Date(fromDate);fd.setHours(0,0,0,0);
  const before=all.filter(s=>new Date(s.startDate)<fd);
  const after=all.filter(s=>new Date(s.startDate)>=fd);

  // Cursor starts: day after last "before" block ends, or fromDate
  let cursor;
  if(before.length>0){
    cursor=nextWorkDay(before[before.length-1].endDate);
  }else{
    cursor=new Date(fd);
  }

  const repacked=after.map(s=>{
    const dur=getDur(s);
    const ns=new Date(cursor);ns.setHours(0,0,0,0);
    const ne=addWorkDays(ns,dur);
    cursor=nextWorkDay(ne);
    return{...s,startDate:ns,endDate:ne,prodDays:dur,dailyQty:r2(s.plnQty/dur)};
  });

  const updMap=new Map(repacked.map(s=>[s.id,s]));
  return allStyles.map(s=>updMap.has(s.id)?updMap.get(s.id):s);
}

// After removing a block from a line, repack from the gap position
function autoShiftAfterRemove(allStyles,line,removedStartDate){
  return repackLine(allStyles,line,removedStartDate);
}

// After placing/moving a block onto a line, repack from its start date
function autoShiftLine(allStyles,line,anchorId,anchorStart){
  // Ensure anchor block has correct start date first
  const withAnchor=allStyles.map(s=>{
    if(s.id!==anchorId)return s;
    const ns=new Date(anchorStart);ns.setHours(0,0,0,0);
    const dur=getDur(s);
    const ne=addWorkDays(ns,dur);
    return{...s,startDate:ns,endDate:ne,prodDays:dur,dailyQty:r2(s.plnQty/dur)};
  });
  return repackLine(withAnchor,line,anchorStart);
}

// ─── Time-precise duration & auto-shift helpers (Canvas Editor Phase 2) ─────
// Total working-minutes between two datetimes, walking day by day through the
// 7:00 AM–6:30 PM window and skipping Sundays — the time-aware equivalent of getDur().
function durationWorkMinutes(startDate,endDate){
  if(!startDate||!endDate)return WORK_SPAN_MIN;
  let cur=new Date(startDate);
  let total=0;
  let guard=0;
  while(guard++<400){
    if(ds(cur)===ds(endDate)){
      const curMin=cur.getHours()*60+cur.getMinutes();
      const endMin=endDate.getHours()*60+endDate.getMinutes();
      total+=Math.max(0,endMin-curMin);
      break;
    }
    const curMin=cur.getHours()*60+cur.getMinutes();
    total+=Math.max(0,WORK_END_MIN-curMin);
    cur=nextWorkDay(cur);cur.setHours(7,0,0,0);
  }
  return Math.max(1,total);
}
// Add N working-minutes to a start datetime, rolling over to 7:00 AM the next
// working day (skipping Sunday) whenever it would pass 6:30 PM — the time-aware
// equivalent of addWorkDays().
function addWorkMinutes(start,minutes){
  let cur=new Date(start);
  let remaining=minutes;
  let guard=0;
  while(remaining>0&&guard++<400){
    const curMin=cur.getHours()*60+cur.getMinutes();
    const availToday=WORK_END_MIN-curMin;
    if(remaining<=availToday){
      const target=curMin+remaining;
      cur.setHours(Math.floor(target/60),target%60,0,0);
      remaining=0;
    }else{
      remaining-=availToday;
      cur=nextWorkDay(cur);cur.setHours(7,0,0,0);
    }
  }
  return cur;
}
// Repack all blocks on a line in chronological order with a strict 1-minute gap,
// preserving each block's real duration — the time-aware equivalent of repackLine().
// Only blocks starting at/after fromDateTime get shifted; earlier blocks are untouched.
function repackLineTime(allStyles,line,fromDateTime){
  const all=allStyles.filter(s=>s.line===line)
    .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
  if(all.length===0)return allStyles;
  const fd=new Date(fromDateTime);
  const before=all.filter(s=>new Date(s.startDate)<fd);
  const after=all.filter(s=>new Date(s.startDate)>=fd);
  let cursor=before.length>0
    ? new Date(before[before.length-1].endDate.getTime()+60000) // +1 min gap after last "before" block
    : new Date(fd);
  // Clamp cursor into the working window in case it starts right at/after 6:30 PM
  if(cursor.getHours()*60+cursor.getMinutes()>WORK_END_MIN){cursor=nextWorkDay(cursor);cursor.setHours(7,0,0,0);}
  const repacked=after.map(s=>{
    const durMin=durationWorkMinutes(s.startDate,s.endDate);
    const ns=new Date(cursor);
    const ne=addWorkMinutes(ns,durMin);
    cursor=new Date(ne.getTime()+60000); // 1-minute gap before the next block
    if(cursor.getHours()*60+cursor.getMinutes()>WORK_END_MIN){cursor=nextWorkDay(cursor);cursor.setHours(7,0,0,0);}

  return allStyles.map(s=>updMap.has(s.id)?updMap.get(s.id):s);

// Spread a style's real chunks (see parseFRPlan) across calendar days — when a single chunk
// crosses midnight (like a batch running from 5pm one day to 10am the next), its quantity is
// split between the two days proportional to the working hours it actually occupies on each.
// Also tracks the earliest/latest clock time actually worked on each day, for display.
function dayByDayFromChunks(chunks){
  const byDay={}; // "YYYY-M-D" -> {qty, from:Date, to:Date}
  (chunks||[]).forEach(ch=>{
    if(!ch.startDate||!ch.endDate||!ch.qty)return;
    const totalMin=durationWorkMinutes(ch.startDate,ch.endDate);
    if(totalMin<=0)return;
    let cur=new Date(ch.startDate);
    let guard=0;
    while(cur<ch.endDate&&guard++<60){
      const dayKey=ds(cur);
      const dayEnd=new Date(cur);dayEnd.setHours(18,30,0,0);
      const segEnd=ch.endDate<dayEnd?ch.endDate:dayEnd;
      const segMin=Math.max(0,(segEnd-cur)/60000);
      const segQty=r2(ch.qty*(segMin/totalMin));
      if(!byDay[dayKey])byDay[dayKey]={qty:0,from:new Date(cur),to:new Date(segEnd)};
      byDay[dayKey].qty+=segQty;
      if(cur<byDay[dayKey].from)byDay[dayKey].from=new Date(cur);
      if(segEnd>byDay[dayKey].to)byDay[dayKey].to=new Date(segEnd);
      cur=nextWorkDay(segEnd);cur.setHours(7,0,0,0);
      if(segEnd>=ch.endDate)break;
    }
  });
  return byDay;
}

    const durMin=durationWorkMinutes(s.startDate,pc.newEnd);
    const days=Math.max(1,Math.round((pc.newEnd-s.startDate)/86400000)+1);
    let updated={...s,endDate:pc.newEnd,prodDays:days,dailyQty:r2(s.plnQty/Math.max(durMin/WORK_SPAN_MIN,1/24))};
    if(s.isMerged&&s.subStyles&&s.subStyles.length>0){
      const subs=[...s.subStyles];
      subs[subs.length-1]={...subs[subs.length-1],endDate:new Date(pc.newEnd)};
      updated={...updated,subStyles:subs};
    }
    let ns=stylesRef.current.map(st=>st.id===s.id?updated:st);
    ns=autoShiftLineTime(ns,s.line,s.id,updated.startDate);
    addChange(`Resized "${s.styleName}" → end ${fmtDateTime(pc.newEnd)}`);
    applyAndCheck(ns,undefined,false,new Set([s.line]));
    setPendingResizeConfirm(null);
  }

  // Called when the user confirms their manual day-split for a merged block being moved/resized.
  // Lays sub-styles back-to-back (1-minute gap) starting at newStart, each sized by its chosen day count.
  function confirmSplit(){
    const pc=pendingSplitConfirm;if(!pc)return;
    const sum=pc.dayInputs.reduce((a,b)=>a+b,0);
    if(sum!==pc.totalDays)return; // safety — Confirm button is disabled in this case anyway
    let cursor=new Date(pc.newStart);
    const updatedSubs=pc.style.subStyles.map((sub,i)=>{
      const days=pc.dayInputs[i];
      const subStart=new Date(cursor);
      const subEnd=addWorkMinutes(subStart,days*WORK_SPAN_MIN);
      cursor=new Date(subEnd.getTime()+60000);
      if(cursor.getHours()*60+cursor.getMinutes()>WORK_END_MIN){cursor=nextWorkDay(cursor);cursor.setHours(7,0,0,0);}
      return{...sub,startDate:subStart,endDate:subEnd,prodDays:days,dailyQty:r2(sub.plnQty/days)};
    });
    const lastSub=updatedSubs[updatedSubs.length-1];
    const updated={...pc.style,line:pc.line,startDate:pc.newStart,endDate:lastSub.endDate,
      prodDays:pc.totalDays,dailyQty:r2(pc.style.plnQty/pc.totalDays),subStyles:updatedSubs};
    const curStyles=stylesRef.current;
    let ns=pc.fromParked
      ?[...curStyles.filter(s=>s.id!==pc.style.id),updated]
      :curStyles.map(s=>s.id===pc.style.id?updated:s);
    ns=autoShiftLineTime(ns,pc.line,updated.id,updated.startDate);
    if(!pc.fromParked&&pc.origLine!==pc.line){
      ns=autoShiftAfterRemoveTime(ns,pc.origLine,pc.style.endDate);
    }
    const np=pc.fromParked?parked.filter(x=>x.id!==pc.style.id):undefined;
    addChange(`${pc.fromParked?"Placed":"Moved/resized"} merged block "${pc.style.styleName}" → Line ${pc.line}, ${pc.totalDays} days split across ${updatedSubs.length} styles`);
    const affLines=new Set([pc.line]);if(!pc.fromParked&&pc.origLine!==pc.line)affLines.add(pc.origLine);
    applyAndCheck(ns,np,false,affLines);
    setPendingSplitConfirm(null);
  }
  function cancelSplit(){setPendingSplitConfirm(null);}
  // Builds the "before" and "after" block lists for the affected line(s) of a pending move —
  // used to draw the small visual preview strip in the confirm popup.
  function computeMoveLinesPreview(pc){
    const orig=pc.fromParked?pc.style:styles.find(s=>s.id===pc.styleId);
    if(!orig)return null;
    const updated={...orig,line:pc.line,startDate:pc.newStart,endDate:pc.newEnd};
    let ns=pc.fromParked?[...styles,updated]:styles.map(s=>s.id===pc.styleId?updated:s);
    ns=autoShiftLineTime(ns,pc.line,updated.id,updated.startDate);
    if(!pc.fromParked&&pc.origLine!=null&&pc.origLine!==pc.line)
      ns=autoShiftAfterRemoveTime(ns,pc.origLine,orig.endDate);
    const beforeLine=ln=>styles.filter(s=>s.line===ln).sort((a,b)=>a.startDate-b.startDate);
    const afterLine=ln=>ns.filter(s=>s.line===ln).sort((a,b)=>a.startDate-b.startDate);
    return{
      dest:{line:pc.line,before:beforeLine(pc.line),after:afterLine(pc.line)},
      origin:(!pc.fromParked&&pc.origLine!=null&&pc.origLine!==pc.line)?
        {line:pc.origLine,before:beforeLine(pc.origLine),after:afterLine(pc.origLine)}:null,
      movedId:pc.styleId
    };
  }
  // Renders one horizontal mini-timeline strip (a single line, before or after)
  // Renders one horizontal mini-timeline strip. Blocks that didn't change stay a plain muted
  // gray (so they fade into the background) — color is reserved only for what actually matters:
  // the block being moved (orange) and anything that gets pushed as a result (blue).
  function renderMiniStrip(label,blocksArr,minT,maxT,movedId,shiftMap,overallDir){
    return el("div",{style:{marginBottom:6}},
      el("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:3}},
        el("span",{style:{fontSize:9.5,color:"#94a3b8",fontWeight:600}},label),
        // One long, bold arrow for the whole row — everything moves together, so no need to
        // repeat a tiny arrow per block. Drawn as a thick line + arrowhead, not a text glyph,
        // so it reads clearly at a glance.
        overallDir&&el("div",{title:overallDir==="right"?"Shifted later":"Shifted earlier",
          style:{display:"flex",alignItems:"center",gap:3}},
          overallDir==="left"&&el("div",{style:{width:0,height:0,
            borderTop:"5px solid transparent",borderBottom:"5px solid transparent",
            borderRight:"7px solid #f59e0b"}}),
          el("div",{style:{width:34,height:3,borderRadius:2,
            background:overallDir==="right"?"#3b82f6":"#f59e0b"}}),
          overallDir==="right"&&el("div",{style:{width:0,height:0,
            borderTop:"5px solid transparent",borderBottom:"5px solid transparent",
            borderLeft:"7px solid #3b82f6"}}),
          el("span",{style:{fontSize:10.5,fontWeight:800,
            color:overallDir==="right"?"#3b82f6":"#f59e0b"}},
            overallDir==="right"?"Later":"Earlier")
        )
      ),
      el("div",{style:{position:"relative",height:26,background:"#f1f5f9",borderRadius:4,overflow:"visible"}},
        blocksArr.map(s=>{
          const leftPct=((s.startDate-minT)/(maxT-minT))*100;
          const widthPct=Math.max(1.5,((s.endDate-s.startDate)/(maxT-minT))*100);
          const isMoved=s.id===movedId;
          const isShifted=shiftMap&&shiftMap.has(s.id);
          const bg=isMoved?ORANGE:isShifted?"#3b82f6":"#cbd5e1";
          // Delivery/cut violations, checked against THIS block's real dates in this scenario —
          // a small red dot means it would now finish after its Delivery Date, yellow means it
          // would start before its Target Cut date.
          const delViolation=s.delDate&&s.endDate>s.delDate;
          const cutViolation=s.tgtCutDate&&s.startDate<s.tgtCutDate;
          return el("div",{key:s.id+"-"+s.startDate.getTime(),
            title:s.styleName+"\n"+fmtDateTime(s.startDate)+" → "+fmtDateTime(s.endDate)+
              (delViolation?"\n⚠ Past delivery date":"")+(cutViolation?"\n⚠ Before target cut date":""),
            style:{position:"absolute",left:leftPct+"%",width:widthPct+"%",top:2,bottom:2,
              background:bg,borderRadius:2,
              border:(isMoved||isShifted)?"1.5px solid #fff":"0.5px solid rgba(255,255,255,.6)",
              boxShadow:isMoved?"0 0 0 1.5px "+ORANGE:isShifted?"0 0 0 1.5px #3b82f6":"none",
              zIndex:(isMoved||isShifted)?2:1}},
            (delViolation||cutViolation)&&el("div",{style:{position:"absolute",top:1,right:1,
              display:"flex",gap:1}},
              delViolation&&el("span",{style:{width:5,height:5,borderRadius:"50%",background:"#dc2626",
                border:"0.5px solid #fff"}}),
              cutViolation&&el("span",{style:{width:5,height:5,borderRadius:"50%",background:"#facc15",
                border:"0.5px solid #fff"}})
            )
          );
        })
      )
    );

  // Full visual preview block for the move-confirm popup: shows the destination line (and the
  // origin line too, if it's changing) — before and after — so the shift is actually visible,
  // not just described in text. Only the moved block (orange) and pushed blocks (blue) get
  // color; everything unaffected stays muted gray so it doesn't compete for attention.
  function renderMovePreview(pc){
    const preview=computeMoveLinesPreview(pc);
    if(!preview)return null;
    const allBlocks=[...preview.dest.before,...preview.dest.after,
      ...(preview.origin?[...preview.origin.before,...preview.origin.after]:[])];
    if(allBlocks.length===0)return null;
    let minT=allBlocks[0].startDate,maxT=allBlocks[0].endDate;
    allBlocks.forEach(s=>{if(s.startDate<minT)minT=s.startDate;if(s.endDate>maxT)maxT=s.endDate;});
    if(maxT<=minT)return null;

    // A block counts as "shifted" if its start time differs between before and after.
    // Since a cascade always pushes everything the same way, we only need ONE overall
    // direction for the whole row's arrow, not one per block.
    function shiftedIdsFor(before,after){
      const beforeMap={};before.forEach(s=>{beforeMap[s.id]=s.startDate.getTime();});
      const map=new Map();let rightCount=0,leftCount=0;
      after.forEach(s=>{
        if(s.id===preview.movedId)return;
        const prevT=beforeMap[s.id];
        if(prevT!=null&&prevT!==s.startDate.getTime()){
          const dir=s.startDate.getTime()>prevT?"right":"left";
          map.set(s.id,dir);
          if(dir==="right")rightCount++;else leftCount++;
        }
      });
      const overallDir=map.size===0?null:(rightCount>=leftCount?"right":"left");
      return{map,overallDir};
    }
    const dest=shiftedIdsFor(preview.dest.before,preview.dest.after);
    const origin=preview.origin?shiftedIdsFor(preview.origin.before,preview.origin.after):null;

    return el("div",{style:{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,
      padding:"10px 12px",marginBottom:14}},
      el("div",{style:{display:"flex",gap:12,marginBottom:8,fontSize:9.5,flexWrap:"wrap"}},
        el("span",{style:{display:"flex",alignItems:"center",gap:4,color:"#64748b"}},
          el("span",{style:{width:10,height:10,borderRadius:2,background:ORANGE,display:"inline-block"}}),"Moved style"),
        el("span",{style:{display:"flex",alignItems:"center",gap:4,color:"#64748b"}},
          el("span",{style:{width:10,height:10,borderRadius:2,background:"#3b82f6",display:"inline-block"}}),"Pushed"),
        el("span",{style:{display:"flex",alignItems:"center",gap:4,color:"#64748b"}},
          el("span",{style:{width:10,height:10,borderRadius:2,background:"#cbd5e1",display:"inline-block"}}),"Unaffected"),
        el("span",{style:{display:"flex",alignItems:"center",gap:4,color:"#64748b"}},
          el("span",{style:{width:6,height:6,borderRadius:"50%",background:"#dc2626",display:"inline-block"}}),"Past delivery date"),
        el("span",{style:{display:"flex",alignItems:"center",gap:4,color:"#64748b"}},
          el("span",{style:{width:6,height:6,borderRadius:"50%",background:"#facc15",display:"inline-block"}}),"Before target cut")
      ),
      el("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8}},
        el("p",{style:{margin:0,fontSize:11,fontWeight:700,color:"#334155"}},
          "Line "+preview.dest.line+(preview.origin?" (destination)":"")),
        // Small date-range tab so it's clear what window this preview is showing
        el("span",{style:{fontSize:9.5,color:"#94a3b8",background:"#eef2f7",borderRadius:10,
          padding:"1px 8px",fontFamily:"'DM Mono',monospace"}},fmtDateShort(minT)+" – "+fmtDateShort(maxT))
      ),
      renderMiniStrip("Before",preview.dest.before,minT,maxT,null,null,null),
      renderMiniStrip("After",preview.dest.after,minT,maxT,preview.movedId,dest.map,dest.overallDir),
      preview.origin&&el("div",{style:{marginTop:10}},
        el("p",{style:{margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#334155"}},
          "Line "+preview.origin.line+" (where it's leaving)"),
        renderMiniStrip("Before",preview.origin.before,minT,maxT,null,null,null),
        renderMiniStrip("After",preview.origin.after,minT,maxT,null,origin.map,origin.overallDir)
      )
    );
  }
