  function doMerge(confirmed=false){
    if(mergeSelected.length<2){setMergeError("Select at least 2 blocks to merge");return;}
    const selected=styles.filter(s=>mergeSelected.includes(s.id));
    // Check same line
    const lines=[...new Set(selected.map(s=>s.line))];
    if(lines.length>1){setMergeError("All blocks must be on the same line to merge");return;}
    // Sort by start date
    const sorted=[...selected].sort((a,b)=>a.startDate-b.startDate);
    // Check consecutive — each block's end must touch/overlap next block's start (within 2 days)
    for(let i=0;i<sorted.length-1;i++){
      const gap=Math.round((sorted[i+1].startDate-sorted[i].endDate)/(86400*1000));
      if(gap>2){setMergeError("Blocks must be consecutive (no large gaps between them)");return;}
    }
    // Check delivery dates
    const delDates=[...new Set(sorted.map(s=>ds(s.delDate)).filter(Boolean))];
    if(delDates.length>1&&!confirmed){
      setMergeConfirmModal({sortedStyles:sorted,differentDel:true});
      return;
    }
    // Build merged block
    const mergedId=uid();
    const mgId="MG-"+uid().slice(0,6);// stable unique merge group ID
    const mergedStyle={
      id:mergedId,
      mergeGroup:mgId,// tag for Excel save/load
      styleName:sorted.map(s=>s.styleName).join(" + "),
      gmtType:sorted[0].gmtType,
      line:sorted[0].line,
      startDate:new Date(sorted[0].startDate),
      endDate:new Date(sorted[sorted.length-1].endDate),
      delDate:sorted[0].delDate,// use first; warned if different
      tgtCutDate:sorted[0].tgtCutDate,
      plnQty:sorted.reduce((s,x)=>s+(x.plnQty||0),0),
      ordQty:sorted.reduce((s,x)=>s+(x.ordQty||0),0),
      eff:Math.round(sorted.reduce((s,x)=>s+(x.eff||0),0)/sorted.length),
      tgt:sorted.reduce((s,x)=>s+(x.tgt||0),0),th:sorted[0].th||0,
      prodDays:sorted.reduce((s,x)=>s+(x.prodDays||0),0),
      dailyQty:0,
      merchant:sorted[0].merchant,
      styleColor:getMergedColor(sorted),
      isMerged:true,
      subStyles:sorted.map(s=>({...s,mergeGroup:mgId})),// tag each sub with group ID
      locked:false,notes:"",operations:[],operationsConfirmed:false,isNew:false,isSingleEntry:false,
    };
    mergedStyle.dailyQty=r2(mergedStyle.plnQty/Math.max(1,mergedStyle.prodDays));
    const ns=styles.filter(s=>!mergeSelected.includes(s.id));
    ns.push(mergedStyle);
    addChange(`Merged ${sorted.length} blocks: ${sorted.map(s=>s.styleName).join(", ")}`);
    applyAndCheck(ns,undefined,true);
    setMergeMode(false);setMergeSelected([]);setMergeError(null);setMergeConfirmModal(null);
  }

// ─── StyleManagerPage ─────────────────────────────────────────────────────────
function StyleManagerPage({styles,obMap,onExport,page:currentPage}){
  const [tab,setTab]=useState("all");
  // Per-tab state
  const [allSearch,setAllSearch]=useState("");
  const [allLine,setAllLine]=useState("all");
  const [allExpanded,setAllExpanded]=useState({});
  const [allShowFull,setAllShowFull]=useState({});

  const [todaySearch,setTodaySearch]=useState("");
  const [todayLine,setTodayLine]=useState("all");
  const [todayExpanded,setTodayExpanded]=useState({});
  const [todayShowFull,setTodayShowFull]=useState({});

  const [opsSearch,setOpsSearch]=useState("");
  const [opsFilter,setOpsFilter]=useState("all"); // "all"|"has"|"missing"
  const [opsExpanded,setOpsExpanded]=useState({});
  const [opsShowFull,setOpsShowFull]=useState({});

  const today=new Date();today.setHours(0,0,0,0);
  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  const obLoaded=obMap&&Object.keys(obMap).length>0;

  function isActive(s){
    if(!s.startDate||!s.endDate)return false;
    const st=new Date(s.startDate);st.setHours(0,0,0,0);
    const en=new Date(s.endDate);en.setHours(0,0,0,0);
    return st<=today&&en>=today;
  }
  function hasOps(s){
    const ob=obMap&&obMap[s.styleName];
    return ob&&ob.ops&&ob.ops.length>0;
  }
  function daysLeft(s){
    if(!s.endDate)return null;
    return Math.round((new Date(s.endDate)-today)/(86400*1000));
  }
  function workingDaysBetween(fromDate,toDate){
    // Count Mon-Sat days from fromDate up to and including toDate
    if(!fromDate||!toDate)return 0;
    let count=0;
    let cur=new Date(fromDate);cur.setHours(0,0,0,0);
    const end=new Date(toDate);end.setHours(0,0,0,0);
    while(cur<=end){
      if(cur.getDay()!==0)count++;
      cur.setDate(cur.getDate()+1);
    }
    return Math.max(0,count);
  }
  function daysElapsed(s){
    if(!s.startDate)return 0;
    return workingDaysBetween(s.startDate,today);
  }
  // Total working days based on actual start/end dates (more accurate than PRD DYS sum)
  function totalWorkingDays(s){
    if(!s.startDate||!s.endDate)return s.prodDays||1;
    return Math.max(1,workingDaysBetween(s.startDate,s.endDate));
  }
  function delCountdown(s){
    if(!s.delDate)return null;
    return Math.round((new Date(s.delDate)-today)/(86400*1000));
  }

  // Summary stats
  const totalStyles=styles.length;
  const runningToday=styles.filter(isActive).length;
  const haveOps=styles.filter(hasOps).length;
  const missingOps=totalStyles-haveOps;

  // Filtered lists per tab
  function applySearch(list,search,line){
    const q=search.toLowerCase();
    return list.filter(s=>{
      const matchQ=!q||s.styleName.toLowerCase().includes(q)||(s.gmtType||"").toLowerCase().includes(q)||String(s.line).includes(q);
      const matchL=line==="all"||String(s.line)===String(line);
      return matchQ&&matchL;
    });
  }
  const allFiltered=applySearch(styles,allSearch,allLine);
  const todayFiltered=applySearch(styles.filter(isActive),todaySearch,todayLine);
  const opsBase=opsFilter==="has"?styles.filter(hasOps):opsFilter==="missing"?styles.filter(s=>!hasOps(s)):styles;
  const opsFiltered=applySearch(opsBase,opsSearch,"all");

  function toggleExpand(id,expandState,setExpandState){
    setExpandState(p=>({...p,[id]:!p[id]}));
  }
  function toggleShowFull(id,state,setState){
    setState(p=>({...p,[id]:!p[id]}));
  }

  // ── Shared style card renderer ──────────────────────────────────────────────
  function StyleCard({s,expandedMap,setExpandedMap,showFullMap,setShowFullMap,showProgress=false,urgent=false}){
    const ob=obMap&&obMap[s.styleName];
    const sHasOps=ob&&ob.ops&&ob.ops.length>0;
    const isExpanded=!!expandedMap[s.id];
    const isShowFull=!!showFullMap[s.id];
    const active=isActive(s);
    const dl=daysLeft(s);
    const elapsed=daysElapsed(s);
    const dc=delCountdown(s);
    const dlColor=dl===null?"#94a3b8":dl<0?"#dc2626":dl<=2?"#d97706":"#16a34a";
    const dlLabel=dl===null?"—":dl<0?"Overdue by "+Math.abs(dl)+"d":dl===0?"Last day":dl+" days left";
    const dcLabel=dc===null?"—":dc<0?"Overdue by "+Math.abs(dc)+"d":dc===0?"Del today":"Del in "+dc+" days";
    const previewOps=sHasOps?ob.ops.slice(0,3):[];
    const allOps=sHasOps?ob.ops:[];

    return el("div",{style:{
      border:`1px solid ${urgent?"#fca5a5":active?"#bbf7d0":sHasOps?"#e2e8f0":"#e8e8e8"}`,
      borderRadius:12,overflow:"hidden",marginBottom:8,
      boxShadow:urgent?"0 2px 8px rgba(220,38,38,.12)":active?"0 1px 6px rgba(22,163,74,.08)":"none",
    }},
      // Main row
      el("div",{
        onClick:()=>toggleExpand(s.id,expandedMap,setExpandedMap),
        style:{padding:"12px 16px",
          background:urgent?"#fff5f5":active?"#f0fdf4":"#fff",
          display:"flex",alignItems:"center",gap:12,cursor:"pointer"}},

        // Color dot
        el("div",{style:{width:11,height:11,borderRadius:"50%",
          background:s.styleColor||getGmtColor(s.gmtType),flexShrink:0,
          boxShadow:"0 0 0 2px rgba(0,0,0,.08)"}}),

        // Info
        el("div",{style:{flex:1,minWidth:0}},
          // Name + badges row
          el("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:4}},
            el("span",{style:{fontWeight:700,fontSize:13,color:"#0f172a"}},s.styleName),

              el("i",{className:"ti ti-alert-triangle","aria-hidden":"true",style:{fontSize:9}}),"URGENT"),
            active&&!urgent&&el("span",{style:{fontSize:10,fontWeight:700,color:"#16a34a",background:"#dcfce7",
              padding:"2px 7px",borderRadius:20,border:"0.5px solid #bbf7d0",display:"flex",alignItems:"center",gap:3}},
              el("span",{style:{width:5,height:5,borderRadius:"50%",background:"#16a34a",display:"inline-block"}}),

              padding:"2px 7px",borderRadius:20,border:"0.5px solid #fde68a"}},"No operations"),
            s.isSingleEntry&&el("span",{style:{fontSize:10,color:"#6d28d9",background:"#f3e8ff",
              padding:"2px 7px",borderRadius:20,border:"0.5px solid #ddd6fe"}},"Single entry"),
          ),
          // Details row
          el("div",{style:{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}},
            el("span",{style:{fontSize:11,color:"#64748b"}},
              el("i",{className:"ti ti-layout-rows","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),"Line "+s.line),
            el("span",{style:{fontSize:11,color:"#64748b"}},s.gmtType),
            el("span",{style:{fontSize:11,color:"#64748b"}},
              el("i",{className:"ti ti-box","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),(s.plnQty||0).toLocaleString()+" pcs"),
            el("span",{style:{fontSize:11,color:"#64748b"}},
              el("i",{className:"ti ti-calendar","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),fmtDateShort(s.startDate)+" → "+fmtDateShort(s.endDate)),
            el("span",{style:{fontSize:11,color:"#dc2626",fontWeight:500}},
              el("i",{className:"ti ti-truck","aria-hidden":"true",style:{marginRight:3,fontSize:10}}),"Del: "+fmtDateShort(s.delDate)),
            active&&dc!==null&&el("span",{style:{fontSize:11,fontWeight:600,
              color:dc<0?"#dc2626":dc<=3?"#d97706":"#16a34a"}},dcLabel),
          ),

          // Progress bar (Running Today tab)
          showProgress&&active&&(()=>{
            const totalDays=totalWorkingDays(s);
            const pct=Math.min(100,Math.round((elapsed/totalDays)*100));
            const isOverrun=elapsed>totalDays;
            const barColor=isOverrun?"#dc2626":dl<=2?"#f59e0b":"#16a34a";

// ─── CompactView ──────────────────────────────────────────────────────────────
function CompactView({styles,colorMode}){
  const containerRef=useRef();const boardRef=useRef();
  const [scale,setScale]=useState(1);const [genPDF,setGenPDF]=useState(false);

  // Date filter state
  let globalMin=null,globalMax=null;
  styles.forEach(s=>{
    if(s.startDate&&(!globalMin||s.startDate<globalMin))globalMin=s.startDate;
    if(s.endDate&&(!globalMax||s.endDate>globalMax))globalMax=s.endDate;
  });
  const [filterFrom,setFilterFrom]=useState(globalMin?ds(globalMin):"");
  const [filterTo,setFilterTo]=useState(globalMax?ds(globalMax):"");

  // Filter styles to only those overlapping the selected range
  const fromDate=filterFrom?new Date(filterFrom):null;
  const toDate=filterTo?new Date(filterTo):null;
  const filteredStyles=styles.filter(s=>{
    if(!s.startDate||!s.endDate)return false;
    if(fromDate&&s.endDate<fromDate)return false;
    if(toDate&&s.startDate>toDate)return false;
    return true;
  });

  // recalcScale: waits 2 frames so the board DOM is fully painted at natural size
  function recalcScale(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(!containerRef.current||!boardRef.current)return;
      const cw=containerRef.current.clientWidth;
      const bW=boardRef.current.scrollWidth;
      // Fit to the available WIDTH only — with many production lines, height is almost always
      // the smaller ratio, and forcing a fit to both dimensions shrinks the board far more than
      // necessary just to avoid a bit of vertical scrolling.
      if(bW>0)setScale(Math.min(cw/bW,1));
    }));
  }

  // Mount + resize
  useEffect(()=>{
    recalcScale();
    window.addEventListener("resize",recalcScale);
    return()=>window.removeEventListener("resize",recalcScale);
  },[]);

  // When filter changes: reset scale → board renders at natural width → measure → fit
  useEffect(()=>{
    setScale(1);
    recalcScale();
  },[filterFrom,filterTo]);

  async function handlePDF(){
    if(!boardRef.current||genPDF)return;setGenPDF(true);
    try{
      const clone=boardRef.current.cloneNode(true);
      clone.style.transform="none";clone.style.position="fixed";clone.style.top="-99999px";
      clone.style.left="0";clone.style.width="auto";clone.style.height="auto";clone.style.zIndex="-1";
      document.body.appendChild(clone);
      const canvas=await window.html2canvas(clone,{scale:1.5,useCORS:true,backgroundColor:"#ffffff",logging:false});
      document.body.removeChild(clone);
      const{jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
      const pW=pdf.internal.pageSize.getWidth(),pH=pdf.internal.pageSize.getHeight();
      const margin=6,imgW=canvas.width/3.78,imgH=canvas.height/3.78;
      const ratio=Math.min((pW-margin*2)/imgW,(pH-margin*2-10)/imgH);
      const fW=imgW*ratio,fH=imgH*ratio,mx=(pW-fW)/2;
      pdf.setFontSize(11);pdf.setTextColor(11,42,74);pdf.setFont(undefined,"bold");
      pdf.text("SGL Production Plan",margin,margin+4);
      pdf.setFont(undefined,"normal");pdf.setFontSize(8);pdf.setTextColor(100,116,139);
      const rangeLabel=(filterFrom||"start")+" → "+(filterTo||"end");
      pdf.text("Range: "+rangeLabel,margin,margin+9);
      pdf.text("Generated: "+new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),pW-margin,margin+4,{align:"right"});
      pdf.addImage(canvas.toDataURL("image/jpeg",.92),"JPEG",mx,margin+12,fW,fH);
      pdf.save("SGL_Production_Plan_"+new Date().toISOString().slice(0,10)+".pdf");
    }catch(e){alert("PDF failed: "+e.message);}finally{setGenPDF(false);}
  }

  if(!styles.length)return el(NoData,{});
  return el("div",{style:{display:"flex",flexDirection:"column",height:"calc(100vh - 160px)"}},
    // Controls bar
    el("div",{style:{background:"#f1f5f9",border:"0.5px solid #e2e8f0",borderRadius:8,padding:"10px 14px",
      marginBottom:12,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}},
      el("i",{className:"ti ti-maximize","aria-hidden":"true",style:{color:NAVY}}),
      el("p",{style:{fontSize:12,color:"#64748b",marginRight:4}},"Date Range:"),
      // From
      el("div",{style:{display:"flex",alignItems:"center",gap:6}},
        el("label",{style:{fontSize:12,color:"#64748b"}},"From"),
        el("input",{type:"date",value:filterFrom,onChange:e=>setFilterFrom(e.target.value),
          style:{padding:"4px 8px",border:"0.5px solid #cbd5e1",borderRadius:6,fontSize:12,background:"#fff"}})
      ),
      el("div",{style:{display:"flex",alignItems:"center",gap:6}},
        el("label",{style:{fontSize:12,color:"#64748b"}},"To"),
        el("input",{type:"date",value:filterTo,onChange:e=>setFilterTo(e.target.value),
          style:{padding:"4px 8px",border:"0.5px solid #cbd5e1",borderRadius:6,fontSize:12,background:"#fff"}})
      ),
      el("button",{onClick:()=>{setFilterFrom(globalMin?ds(globalMin):"");setFilterTo(globalMax?ds(globalMax):"");},
        style:{padding:"4px 10px",border:"0.5px solid #cbd5e1",borderRadius:6,fontSize:11,background:"#fff",color:"#64748b",cursor:"pointer"}},
        "Reset"),
      el("span",{style:{fontSize:11,color:"#64748b",marginLeft:"auto"}},filteredStyles.length+" styles • Scale: "+Math.round(scale*100)+"%"),
      el("button",{onClick:handlePDF,disabled:genPDF||!filteredStyles.length,
        style:{padding:"6px 16px",borderRadius:6,border:"none",cursor:"pointer",
          fontSize:12,fontWeight:500,background:genPDF?"#94a3b8":NAVY,color:"#fff",
          display:"flex",alignItems:"center",gap:7,opacity:genPDF?0.7:1}},
        el("i",{className:"ti "+(genPDF?"ti-loader ti-spin":"ti-file-type-pdf"),"aria-hidden":"true",style:{fontSize:14}}),
        genPDF?"Generating...":"Download PDF")
    ),
    filteredStyles.length===0?el("div",{style:{textAlign:"center",padding:40,color:"#64748b",fontSize:13}},
      "No styles in the selected date range."):
    el("div",{ref:containerRef,style:{flex:1,overflowX:"hidden",overflowY:"auto",display:"flex",alignItems:"flex-start",justifyContent:"flex-start"}},
      el("div",{ref:boardRef,style:{transform:"scale("+scale+")",transformOrigin:"top left",pointerEvents:"none",transition:"transform .3s ease"}},
        el(PlanningBoardView,{styles:filteredStyles,colorMode,onEdit:null,selectMode:false,selectedId:null,onSelectStyle:()=>{},
          dateRangeOverride:(fromDate||toDate)?{start:fromDate||globalMin,end:toDate||globalMax}:null})
      )
    )
  );
}


// ─── ReportsPage ──────────────────────────────────────────────────────────────
function ReportsPage({styles,boardDateFilter,onUpdateDelDate,originalStyles=[]}){
  const [activeReport,setActiveReport]=useState("all");
  const [search,setSearch]=useState("");
  // Inline delivery-date editing — identified by the style's own unique id, so two styles
  // that share a name (e.g. same style number appearing twice on a line) are never confused —
  // each row edits exactly the one entry it belongs to.
  const [editingDelId,setEditingDelId]=useState(null);
  const [editingDelValue,setEditingDelValue]=useState("");

  // Respect the same month/date filter used on the Planning Board, so "September only"
  // carries through into these reports too.
  const filteredStyles=useMemo(()=>{
    if(!boardDateFilter)return styles;
    return styles.filter(s=>s.startDate&&s.endDate&&
      s.endDate>=boardDateFilter.from&&s.startDate<=boardDateFilter.to);
  },[styles,boardDateFilter]);

  const today=new Date();today.setHours(0,0,0,0);
  const daysBetween=(a,b)=>Math.round((a-b)/86400000);

  // Filters for the Delivery Risk report
  const [drNameFilter,setDrNameFilter]=useState("");
  const [drLineFilter,setDrLineFilter]=useState("all");
  const [drDelFrom,setDrDelFrom]=useState("");
  const [drDelTo,setDrDelTo]=useState("");
  const [drFinFrom,setDrFinFrom]=useState("");
  const [drFinTo,setDrFinTo]=useState("");

  // ── Report data builders ──────────────────────────────────────────────────
  // Every style the current plan schedules to finish after its Delivery Date.
  const deliveryPlanLate=useMemo(()=>filteredStyles
    .filter(s=>s.delDate&&s.endDate&&s.endDate>s.delDate)
    .map(s=>({...s,daysLate:daysBetween(s.endDate,s.delDate)}))
    .sort((a,b)=>b.daysLate-a.daysLate),[filteredStyles]);

  const deliveryPlanLateFiltered=useMemo(()=>{
    return deliveryPlanLate.filter(s=>{
      if(drNameFilter.trim()&&!s.styleName.toLowerCase().includes(drNameFilter.trim().toLowerCase()))return false;
      if(drLineFilter!=="all"&&String(s.line)!==drLineFilter)return false;
      if(drDelFrom&&s.delDate<new Date(drDelFrom))return false;
      if(drDelTo&&s.delDate>new Date(drDelTo+"T23:59:59"))return false;
      if(drFinFrom&&s.endDate<new Date(drFinFrom))return false;
      if(drFinTo&&s.endDate>new Date(drFinTo+"T23:59:59"))return false;
      return true;
    });
  },[deliveryPlanLate,drNameFilter,drLineFilter,drDelFrom,drDelTo,drFinFrom,drFinTo]);

  const deliveryRiskLines=useMemo(()=>[...new Set(deliveryPlanLate.map(s=>s.line))].sort((a,b)=>a-b),[deliveryPlanLate]);

  // ── Delivery Date Editor — its own dedicated tab, separate from the risk reports ──
  const [deName,setDeName]=useState("");
  const [deLine,setDeLine]=useState("all");
  const [deGmt,setDeGmt]=useState("all");
  const [deMerchant,setDeMerchant]=useState("all");
  const [deEndFrom,setDeEndFrom]=useState("");
  const [deEndTo,setDeEndTo]=useState("");
  const deLines=useMemo(()=>[...new Set(filteredStyles.map(s=>s.line))].sort((a,b)=>a-b),[filteredStyles]);
  // Delivery-date edits made in this tab, compared against the plan as it was originally
  // loaded — this is what "Export Delivery Date Changes" reports on.
  const delDateChanges=useMemo(()=>{
    const origMap={};originalStyles.forEach(s=>{origMap[s.id]=s;});
    return styles.map(s=>{
      const o=origMap[s.id];
      if(!o)return null;
      const oldD=o.delDate?o.delDate.getTime():null;
      const newD=s.delDate?s.delDate.getTime():null;
      if(oldD===newD)return null;
      return{...s,oldDelDate:o.delDate};
    }).filter(Boolean);
  },[styles,originalStyles]);
  const deGmts=useMemo(()=>[...new Set(filteredStyles.map(s=>s.gmtType).filter(Boolean))].sort(),[filteredStyles]);
  const deMerchants=useMemo(()=>[...new Set(filteredStyles.map(s=>s.merchant).filter(Boolean))].sort(),[filteredStyles]);
  const deFiltered=useMemo(()=>{
    return filteredStyles.filter(s=>{
      if(deName.trim()&&!s.styleName.toLowerCase().includes(deName.trim().toLowerCase()))return false;
      if(deLine!=="all"&&String(s.line)!==deLine)return false;
      if(deGmt!=="all"&&s.gmtType!==deGmt)return false;
      if(deMerchant!=="all"&&s.merchant!==deMerchant)return false;
      if(deEndFrom&&s.endDate<new Date(deEndFrom))return false;
      if(deEndTo&&s.endDate>new Date(deEndTo+"T23:59:59"))return false;
      return true;
    }).sort((a,b)=>a.startDate-b.startDate);
  },[filteredStyles,deName,deLine,deGmt,deMerchant,deEndFrom,deEndTo]);

  // At-Risk Styles: flags styles that are risky on MULTIPLE fronts at once — late per the
  // schedule AND running low efficiency — since a slow style with a tight deadline is a
  // bigger priority than either problem alone. Simple additive score: days-late points +
  // a bonus for low efficiency.
  const atRiskStyles=useMemo(()=>{
    const lateMap={};deliveryPlanLate.forEach(s=>{lateMap[s.id]=s.daysLate;});
    return filteredStyles.map(s=>{
      const daysLate=lateMap[s.id]||0;
      const effPenalty=(s.eff||0)<40?15:(s.eff||0)<60?7:0;
      const riskScore=daysLate*2+effPenalty;
      return{...s,daysLate,riskScore};
    }).filter(s=>s.riskScore>0).sort((a,b)=>b.riskScore-a.riskScore);
  },[filteredStyles,deliveryPlanLate]);

  const targetCutViolations=useMemo(()=>filteredStyles
    .filter(s=>s.tgtCutDate&&s.startDate&&s.startDate<s.tgtCutDate)
    .map(s=>({...s,daysEarly:daysBetween(s.tgtCutDate,s.startDate)}))
    .sort((a,b)=>b.daysEarly-a.daysEarly),[filteredStyles]);

  const lineWorkload=useMemo(()=>{
    const byLine={};
    filteredStyles.forEach(s=>{
      if(!byLine[s.line])byLine[s.line]={line:s.line,count:0,totalQty:0,effSum:0,minStart:null,maxEnd:null};
      const l=byLine[s.line];
      l.count++;l.totalQty+=s.plnQty||0;l.effSum+=s.eff||0;
      if(!l.minStart||s.startDate<l.minStart)l.minStart=s.startDate;
      if(!l.maxEnd||s.endDate>l.maxEnd)l.maxEnd=s.endDate;
    });
    return Object.values(byLine).map(l=>({...l,avgEff:l.count?r2(l.effSum/l.count):0}))
      .sort((a,b)=>a.line-b.line);
  },[filteredStyles]);

  const gmtBreakdown=useMemo(()=>{
    const byGmt={};
    filteredStyles.forEach(s=>{
      const k=s.gmtType||"—";
      if(!byGmt[k])byGmt[k]={gmtType:k,count:0,totalQty:0};
      byGmt[k].count++;byGmt[k].totalQty+=s.plnQty||0;
    });
    return Object.values(byGmt).sort((a,b)=>b.totalQty-a.totalQty);
  },[filteredStyles]);

  const efficiencySnapshot=useMemo(()=>[...filteredStyles]
    .sort((a,b)=>(a.eff||0)-(b.eff||0)),[filteredStyles]);

  const merchantBreakdown=useMemo(()=>{
    const byM={};
    filteredStyles.forEach(s=>{
      const k=s.merchant||"—";
      if(!byM[k])byM[k]={merchant:k,count:0,totalQty:0};
      byM[k].count++;byM[k].totalQty+=s.plnQty||0;
    });
    return Object.values(byM).sort((a,b)=>b.totalQty-a.totalQty);
  },[filteredStyles]);

  const allFiltered=useMemo(()=>{
    if(!search.trim())return filteredStyles;
    const q=search.trim().toLowerCase();
    return filteredStyles.filter(s=>(s.styleName||"").toLowerCase().includes(q)||
      (s.gmtType||"").toLowerCase().includes(q)||(s.merchant||"").toLowerCase().includes(q));
  },[filteredStyles,search]);

  function exportRows(filename,headers,rows){
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Report");
    XLSX.writeFile(wb,filename+"_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  const reportList=[
    {id:"all",label:"All Styles",icon:"ti-list"},
    {id:"deliveryRisk",label:"Delivery Risk",icon:"ti-alert-triangle",
      badge:deliveryPlanLate.length||null},
    {id:"atRisk",label:"At-Risk Styles",icon:"ti-flame",badge:atRiskStyles.length||null},
    {id:"delEdit",label:"Delivery Date Editor",icon:"ti-calendar-cog"},
    {id:"targetCut",label:"Target Cut Violations",icon:"ti-scissors",
      badge:targetCutViolations.length||null},
    {id:"lineWorkload",label:"Line Workload",icon:"ti-chart-bar"},
    {id:"gmtBreakdown",label:"Garment Type Breakdown",icon:"ti-shirt"},
    {id:"efficiency",label:"Efficiency Snapshot",icon:"ti-gauge"},
    {id:"merchant",label:"Merchant Breakdown",icon:"ti-building-store"},
  ];

  function Th(label){return el("th",{key:label,style:{textAlign:"left",padding:"8px 12px",
    fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:.3,
    borderBottom:"2px solid #e2e8f0",whiteSpace:"nowrap"}},label);}
  function Td(v,style={}){return el("td",{style:{padding:"7px 12px",fontSize:12.5,
    color:"#0f172a",borderBottom:"1px solid #f1f5f9",whiteSpace:"nowrap",...style}},v);}

  // Editable Delivery Date cell — identified by the style's own unique id (not its name), so
  // two blocks that happen to share a style name (e.g. the same style appearing on two separate
  // date ranges on the same line) are never confused with each other. Click to edit; only this
  // exact entry's delivery date changes.
  function TdDelDate(s){
    const isEditing=editingDelId===s.id;
    if(isEditing){
      return el("td",{style:{padding:"5px 8px",borderBottom:"1px solid #f1f5f9",whiteSpace:"nowrap"}},
        el("div",{style:{display:"flex",alignItems:"center",gap:4}},
          el("input",{type:"date",value:editingDelValue,onChange:e=>setEditingDelValue(e.target.value),
            style:{padding:"3px 6px",border:"1px solid #cbd5e1",borderRadius:4,fontSize:11.5}}),
          el("button",{onClick:()=>{
            if(editingDelValue&&onUpdateDelDate)onUpdateDelDate(s.id,localDate(editingDelValue));
            setEditingDelId(null);
          },style:{padding:"3px 7px",border:"none",borderRadius:4,background:"#16a34a",
            color:"#fff",fontSize:11,cursor:"pointer"}},
            el("i",{className:"ti ti-check",style:{fontSize:11}})),
          el("button",{onClick:()=>setEditingDelId(null),
            style:{padding:"3px 7px",border:"none",borderRadius:4,background:"#e2e8f0",
              color:"#64748b",fontSize:11,cursor:"pointer"}},
            el("i",{className:"ti ti-x",style:{fontSize:11}}))
        )
      );
    }
    return el("td",{style:{padding:"7px 12px",fontSize:12.5,color:"#0f172a",
      borderBottom:"1px solid #f1f5f9",whiteSpace:"nowrap",cursor:"pointer"},
      onClick:()=>{setEditingDelId(s.id);setEditingDelValue(s.delDate?ds(s.delDate):"");},
      title:"Click to edit this style's delivery date"},
      fmtDate(s.delDate),
      el("i",{className:"ti ti-pencil",style:{fontSize:10,color:"#cbd5e1",marginLeft:5}})
    );
  }

  function Table(cols,rows){
    return el("div",{style:{overflow:"auto",flex:1,border:"1px solid #e2e8f0",borderRadius:8}},
      el("table",{style:{width:"100%",borderCollapse:"collapse",background:"#fff"}},
        el("thead",{},el("tr",{},cols.map(c=>Th(c)))),
        el("tbody",{},rows.length===0
          ?el("tr",{},el("td",{colSpan:cols.length,style:{padding:20,textAlign:"center",color:"#94a3b8",fontSize:12.5}},"No data."))
          :rows)
      )
    );
  }

  if(!styles.length)return el(NoData,{});

  let header,content;
  if(activeReport==="all"){
    header="All Styles"+(boardDateFilter?" — "+boardDateFilter.label:"");
    content=Table(["Style Name","Line","Garment Type","PLN QTY","Ord Qty","Daily Qty","Start","End","Del Date","Tgt Cut","Eff%","Merchant"],
      allFiltered.map(s=>el("tr",{key:s.id},
        Td(s.styleName),Td("L-"+s.line),Td(s.gmtType||"—"),

        Td(fmtDateTime(s.startDate)),Td(fmtDateTime(s.endDate)),
        Td(fmtDate(s.delDate)),Td(fmtDate(s.tgtCutDate)),Td((s.eff||0)+"%"),Td(s.merchant||"—")
      )));
  }else if(activeReport==="deliveryRisk"){
    header="Delivery Risk — Plan Shows Late";
    content=el("div",{style:{display:"flex",flexDirection:"column",gap:12,flex:1,overflow:"hidden"}},
      // Filter bar
      el("div",{style:{display:"flex",alignItems:"flex-end",gap:10,flexWrap:"wrap",
        background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,padding:"10px 12px"}},
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Style Name"),
          el("input",{value:drNameFilter,onChange:e=>setDrNameFilter(e.target.value),placeholder:"Search...",
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12,width:150}})
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Line"),
          el("select",{value:drLineFilter,onChange:e=>setDrLineFilter(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}},
            el("option",{value:"all"},"All Lines"),
            deliveryRiskLines.map(l=>el("option",{key:l,value:String(l)},"L-"+l))
          )
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Delivery Date From"),
          el("input",{type:"date",value:drDelFrom,onChange:e=>setDrDelFrom(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}})
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Delivery Date To"),
          el("input",{type:"date",value:drDelTo,onChange:e=>setDrDelTo(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}})
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Scheduled Finish From"),
          el("input",{type:"date",value:drFinFrom,onChange:e=>setDrFinFrom(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}})
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Scheduled Finish To"),
          el("input",{type:"date",value:drFinTo,onChange:e=>setDrFinTo(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}})
        ),
        (drNameFilter||drLineFilter!=="all"||drDelFrom||drDelTo||drFinFrom||drFinTo)&&
          el("button",{onClick:()=>{setDrNameFilter("");setDrLineFilter("all");setDrDelFrom("");setDrDelTo("");setDrFinFrom("");setDrFinTo("");},
            style:{padding:"5px 12px",fontSize:11.5,border:"1px solid #cbd5e1",borderRadius:6,
              background:"#fff",color:"#64748b",cursor:"pointer"}},"Clear Filters"),
        el("span",{style:{marginLeft:"auto",fontSize:11.5,color:"#64748b"}},
          deliveryPlanLateFiltered.length+" of "+deliveryPlanLate.length+" shown")
      ),
      Table(["Style Name","Line","Delivery Date","Scheduled Finish","Days Late"],
        deliveryPlanLateFiltered.map(s=>el("tr",{key:s.id},
          Td(s.styleName),Td("L-"+s.line),Td(fmtDate(s.delDate)),Td(fmtDateTime(s.endDate)),
          Td(s.daysLate+" days",{color:"#d97706",fontWeight:700})
        )))
    );
  }else if(activeReport==="targetCut"){
    header="Target Cut Violations";
    content=Table(["Style Name","Line","Target Cut Date","Scheduled Start","Days Early"],
      targetCutViolations.map(s=>el("tr",{key:s.id},
        Td(s.styleName),Td("L-"+s.line),Td(fmtDate(s.tgtCutDate)),Td(fmtDateTime(s.startDate)),
        Td(s.daysEarly+" days",{color:"#d97706",fontWeight:700})
      )));
  }else if(activeReport==="lineWorkload"){
    header="Line Workload";
    content=Table(["Line","Style Count","Total PLN QTY","Avg Eff%","Earliest Start","Latest End"],
      lineWorkload.map(l=>el("tr",{key:l.line},
        Td("L-"+l.line),Td(l.count),Td(l.totalQty.toLocaleString()),Td(l.avgEff+"%"),
        Td(fmtDate(l.minStart)),Td(fmtDate(l.maxEnd))
      )));
  }else if(activeReport==="gmtBreakdown"){
    header="Garment Type Breakdown";
    content=Table(["Garment Type","Style Count","Total PLN QTY"],
      gmtBreakdown.map(g=>el("tr",{key:g.gmtType},
        Td(g.gmtType),Td(g.count),Td(g.totalQty.toLocaleString())
      )));
  }else if(activeReport==="efficiency"){
    header="Efficiency Snapshot (lowest first)";
    content=Table(["Style Name","Line","Eff%","TH","TGT","PLN QTY"],
      efficiencySnapshot.map(s=>el("tr",{key:s.id},
        Td(s.styleName),Td("L-"+s.line),
        Td((s.eff||0)+"%",{color:(s.eff||0)<40?"#dc2626":(s.eff||0)<60?"#d97706":"#16a34a",fontWeight:700}),
        Td(s.th||"—"),Td(s.tgt||"—"),Td((s.plnQty||0).toLocaleString())
      )));
  }else if(activeReport==="merchant"){
    header="Merchant Breakdown";
    content=Table(["Merchant","Style Count","Total PLN QTY"],
      merchantBreakdown.map(m=>el("tr",{key:m.merchant},
        Td(m.merchant),Td(m.count),Td(m.totalQty.toLocaleString())
      )));
  }else if(activeReport==="atRisk"){
    header="At-Risk Styles — late on schedule AND running low efficiency";
    content=Table(["Style Name","Line","Days Late","Eff%","Delivery Date","Risk Score"],
      atRiskStyles.map(s=>el("tr",{key:s.id},
        Td(s.styleName),Td("L-"+s.line),
        Td(s.daysLate>0?s.daysLate+" days":"—",{color:s.daysLate>0?"#dc2626":"#94a3b8"}),
        Td((s.eff||0)+"%",{color:(s.eff||0)<40?"#dc2626":(s.eff||0)<60?"#d97706":"#16a34a",fontWeight:600}),
        Td(fmtDate(s.delDate)),
        Td(s.riskScore,{fontWeight:700,color:s.riskScore>=20?"#dc2626":s.riskScore>=10?"#d97706":"#64748b"})
      )));
  }else if(activeReport==="delEdit"){
    header="Delivery Date Editor";
    content=el("div",{style:{display:"flex",flexDirection:"column",gap:12,flex:1,overflow:"hidden"}},
      el("div",{style:{display:"flex",alignItems:"flex-end",gap:10,flexWrap:"wrap",
        background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,padding:"10px 12px"}},
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Style Name"),
          el("input",{value:deName,onChange:e=>setDeName(e.target.value),placeholder:"Search...",
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12,width:150}})
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Line"),
          el("select",{value:deLine,onChange:e=>setDeLine(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}},
            el("option",{value:"all"},"All Lines"),deLines.map(l=>el("option",{key:l,value:String(l)},"L-"+l))
          )
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Garment Type"),
          el("select",{value:deGmt,onChange:e=>setDeGmt(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}},
            el("option",{value:"all"},"All Types"),deGmts.map(g=>el("option",{key:g,value:g},g))
          )
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"Merchant"),
          el("select",{value:deMerchant,onChange:e=>setDeMerchant(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}},
            el("option",{value:"all"},"All Merchants"),deMerchants.map(m=>el("option",{key:m,value:m},m))
          )
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"End Date From"),
          el("input",{type:"date",value:deEndFrom,onChange:e=>setDeEndFrom(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}})
        ),
        el("div",{},
          el("label",{style:{display:"block",fontSize:10.5,color:"#64748b",marginBottom:4}},"End Date To"),
          el("input",{type:"date",value:deEndTo,onChange:e=>setDeEndTo(e.target.value),
            style:{padding:"5px 9px",border:"1px solid #cbd5e1",borderRadius:6,fontSize:12}})
        ),
        (deName||deLine!=="all"||deGmt!=="all"||deMerchant!=="all"||deEndFrom||deEndTo)&&
          el("button",{onClick:()=>{setDeName("");setDeLine("all");setDeGmt("all");setDeMerchant("all");setDeEndFrom("");setDeEndTo("");},
            style:{padding:"5px 12px",fontSize:11.5,border:"1px solid #cbd5e1",borderRadius:6,
              background:"#fff",color:"#64748b",cursor:"pointer"}},"Clear Filters"),
        el("span",{style:{marginLeft:"auto",fontSize:11.5,color:"#64748b"}},
          deFiltered.length+" of "+filteredStyles.length+" shown")
      ),
      el("p",{style:{margin:0,fontSize:11.5,color:"#94a3b8"}},
        el("i",{className:"ti ti-info-circle",style:{marginRight:4}}),
        "Each row is a distinct style occurrence — the End Date column helps tell apart two entries that share the same style name. Click a Delivery Date to edit it."),
      delDateChanges.length>0&&el("div",{style:{display:"flex",alignItems:"center",gap:10,
        background:"#fef3c7",border:"1px solid #fde68a",borderRadius:8,padding:"8px 12px"}},
        el("i",{className:"ti ti-history",style:{color:"#d97706",fontSize:15}}),
        el("span",{style:{fontSize:12,color:"#92400e",fontWeight:600}},
          delDateChanges.length+" delivery date"+(delDateChanges.length===1?"":"s")+" changed since this plan was loaded"),
        el("button",{onClick:()=>exportRows("SGL_Delivery_Date_Changes",
          ["Style Name","Line","Production Start Date","Production End Date","Old Delivery Date","New Delivery Date","PLN QTY"],
          delDateChanges.map(s=>[s.styleName,"L-"+s.line,fmtDate(s.startDate),fmtDate(s.endDate),
            s.oldDelDate?fmtDate(s.oldDelDate):"—",s.delDate?fmtDate(s.delDate):"—",s.plnQty||0])),
          style:{marginLeft:"auto",padding:"5px 14px",fontSize:11.5,fontWeight:600,border:"none",
            borderRadius:6,background:"#d97706",color:"#fff",cursor:"pointer",display:"flex",
            alignItems:"center",gap:5}},
          el("i",{className:"ti ti-download",style:{fontSize:13}}),"Export Delivery Date Changes")
      ),
      Table(["Style Name","Line","Garment Type","Start Date","End Date","Delivery Date","Merchant"],
        deFiltered.map(s=>{
          const isLate=s.delDate&&s.endDate&&s.endDate>s.delDate;
          return el("tr",{key:s.id},
            Td(s.styleName,isLate?{color:"#dc2626",fontWeight:700}:{}),
            Td("L-"+s.line),Td(s.gmtType||"—"),
            Td(fmtDate(s.startDate)),Td(fmtDate(s.endDate),{fontWeight:600}),
            TdDelDate(s),Td(s.merchant||"—")
          );
        }))
    );
  }

  const exportCurrent=()=>{
    if(activeReport==="all")exportRows("SGL_All_Styles",
      ["Style Name","Line","Garment Type","PLN QTY","Ord Qty","Daily Qty","Start","End","Del Date","Tgt Cut","Eff%","Merchant"],
      allFiltered.map(s=>[s.styleName,"L-"+s.line,s.gmtType||"—",s.plnQty||0,s.ordQty||0,s.dailyQty||0,
        fmtDateTime(s.startDate),fmtDateTime(s.endDate),fmtDate(s.delDate),fmtDate(s.tgtCutDate),s.eff||0,s.merchant||"—"]));

    else if(activeReport==="atRisk")exportRows("SGL_At_Risk_Styles",
      ["Style Name","Line","Days Late","Eff%","Delivery Date","Risk Score"],
      atRiskStyles.map(s=>[s.styleName,"L-"+s.line,s.daysLate,s.eff||0,fmtDate(s.delDate),s.riskScore]));
    else if(activeReport==="delEdit")exportRows("SGL_Delivery_Dates",
      ["Style Name","Line","Garment Type","Start Date","End Date","Delivery Date","Merchant"],
      deFiltered.map(s=>[s.styleName,"L-"+s.line,s.gmtType||"—",fmtDate(s.startDate),fmtDate(s.endDate),fmtDate(s.delDate),s.merchant||"—"]));
  };

  return el("div",{style:{display:"flex",height:"100%",gap:0}},
    // Sidebar
    el("div",{style:{width:220,flexShrink:0,background:"#f8fafc",borderRight:"1px solid #e2e8f0",

      el("p",{style:{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",
        letterSpacing:.5,margin:"4px 8px 8px"}},"Reports"),
      reportList.map(r=>el("button",{key:r.id,onClick:()=>setActiveReport(r.id),
        style:{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"9px 10px",

        el("i",{className:"ti "+r.icon,style:{fontSize:15,flexShrink:0}}),
        el("span",{style:{flex:1}},r.label),
        r.badge&&el("span",{style:{background:activeReport===r.id?"rgba(255,255,255,.25)":"#fee2e2",
          color:activeReport===r.id?"#fff":"#dc2626",fontSize:10,fontWeight:700,
          borderRadius:10,padding:"1px 6px"}},r.badge)
      ))
    ),
    // Main content
    el("div",{style:{flex:1,display:"flex",flexDirection:"column",padding:20,overflow:"hidden"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:14}},
        el("h2",{style:{margin:0,fontSize:18,color:"#0f172a"}},header),
        boardDateFilter&&el("span",{style:{fontSize:11,background:"#fef3c7",color:"#d97706",
          padding:"3px 9px",borderRadius:20,fontWeight:600}},boardDateFilter.label),
        activeReport==="all"&&el("input",{placeholder:"Search styles...",value:search,
          onChange:e=>setSearch(e.target.value),

        el("button",{onClick:exportCurrent,
          style:{marginLeft:"auto",padding:"6px 16px",borderRadius:6,border:"none",cursor:"pointer",
            fontSize:12,fontWeight:600,background:ORANGE,color:"#fff",display:"flex",alignItems:"center",gap:6}},

      ),
      content
    )
  );
}

// ─── DashboardPage ────────────────────────────────────────────────────────────
function DashboardPage({styles,boardDateFilter}){
  const filteredStyles=useMemo(()=>{
    if(!boardDateFilter)return styles;
    return styles.filter(s=>s.startDate&&s.endDate&&
      s.endDate>=boardDateFilter.from&&s.startDate<=boardDateFilter.to);
  },[styles,boardDateFilter]);

  const allLines=useMemo(()=>[...new Set(filteredStyles.map(s=>s.line))].sort((a,b)=>a-b),[filteredStyles]);
  const [selLine,setSelLine]=useState(null);
  const [expandedId,setExpandedId]=useState(null);
  useEffect(()=>{if(selLine===null&&allLines.length>0)setSelLine(allLines[0]);},[allLines,selLine]);
  useEffect(()=>{setGmtFilter("all");},[selLine]);

  const lineStyles=useMemo(()=>filteredStyles.filter(s=>s.line===selLine)
    .sort((a,b)=>a.startDate-b.startDate),[filteredStyles,selLine]);

  // Plan-wide average (for the "compare to other lines" snapshot)
  const planAvgQtyPerLine=useMemo(()=>{
    if(allLines.length===0)return 0;
    return r2(filteredStyles.reduce((s,st)=>s+(st.plnQty||0),0)/allLines.length);
  },[filteredStyles,allLines]);

  const lineSummary=useMemo(()=>{
    if(lineStyles.length===0)return null;
    const totalQty=lineStyles.reduce((s,st)=>s+(st.plnQty||0),0);
    const avgEff=r2(lineStyles.reduce((s,st)=>s+(st.eff||0),0)/lineStyles.length);
    const minStart=lineStyles.reduce((m,st)=>!m||st.startDate<m?st.startDate:m,null);
    const maxEnd=lineStyles.reduce((m,st)=>!m||st.endDate>m?st.endDate:m,null);
    const activeDaySet=new Set();
    lineStyles.forEach(st=>{
      let cur=new Date(st.startDate);let guard=0;
      while(cur<=st.endDate&&guard++<400){activeDaySet.add(ds(cur));cur=nextWorkDay(cur);cur.setHours(7,0,0,0);}
    });
    let totalWorkDays=0;
    if(minStart&&maxEnd){
      let cur=new Date(minStart);cur.setHours(0,0,0,0);let guard=0;
      while(cur<=maxEnd&&guard++<400){if(cur.getDay()!==0)totalWorkDays++;cur=addDays(cur,1);}
    }
    const maxDurStyle=[...lineStyles].sort((a,b)=>
      durationWorkMinutes(b.startDate,b.endDate)-durationWorkMinutes(a.startDate,a.endDate))[0];
    return{totalQty,avgEff,minStart,maxEnd,activeDays:activeDaySet.size,
      idleDays:Math.max(0,totalWorkDays-activeDaySet.size),maxDurStyle};
  },[lineStyles]);

  const gmtMix=useMemo(()=>{
    const byGmt={};
    lineStyles.forEach(s=>{
      const k=s.gmtType||"—";
      if(!byGmt[k])byGmt[k]={gmtType:k,count:0,totalQty:0};
      byGmt[k].count++;byGmt[k].totalQty+=s.plnQty||0;
    });
    return Object.values(byGmt).sort((a,b)=>b.totalQty-a.totalQty);
  },[lineStyles]);

  // Idle gaps between consecutive styles on this line
  const idleGaps=useMemo(()=>{
    const gaps=[];
    for(let i=0;i<lineStyles.length-1;i++){
      const a=lineStyles[i],b=lineStyles[i+1];
      const gapMin=(b.startDate-a.endDate)/60000;
      if(gapMin>2)gaps.push({after:a.styleName,before:b.styleName,from:a.endDate,to:b.startDate,gapMin:Math.round(gapMin)});
    }
    return gaps;
  },[lineStyles]);

  const [gmtFilter,setGmtFilter]=useState("all");
  const lineStylesFiltered=useMemo(()=>gmtFilter==="all"?lineStyles:
    lineStyles.filter(s=>s.gmtType===gmtFilter),[lineStyles,gmtFilter]);

  const lineDeliveryRisk=useMemo(()=>lineStyles
    .filter(s=>s.delDate&&s.endDate&&s.endDate>s.delDate)
    .map(s=>({...s,daysLate:Math.round((s.endDate-s.delDate)/86400000)})),[lineStyles]);

  function fmtGapMin(m){
    if(m<60)return m+" min";
    const h=Math.floor(m/60),mm=m%60;
    return h+"h"+(mm?" "+mm+"m":"");
  }

  function exportLine(){
    if(!lineStyles.length)return;
    const rows=lineStyles.map(s=>[s.styleName,s.gmtType||"—",fmtDateTime(s.startDate),fmtDateTime(s.endDate),
      s.plnQty||0,s.eff||0,fmtDate(s.delDate)]);
    const ws=XLSX.utils.aoa_to_sheet([["Style Name","Garment Type","Start","End","PLN QTY","Eff%","Delivery Date"],...rows]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"L-"+selLine);
    XLSX.writeFile(wb,"SGL_Line_"+selLine+"_Dashboard_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  if(!styles.length)return el(NoData,{});
  if(allLines.length===0)return el(NoData,{});

  function StatCard(label,value,color="#0f172a"){
    return el("div",{style:{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,
      padding:"12px 16px",flex:1,minWidth:120}},
      el("p",{style:{margin:"0 0 4px",fontSize:10.5,color:"#94a3b8",textTransform:"uppercase",letterSpacing:.4}},label),
      el("p",{style:{margin:0,fontSize:19,fontWeight:700,color}},value)
    );
  }

  return el("div",{style:{display:"flex",height:"100%"}},
    // Line switcher sidebar
    el("div",{style:{width:110,flexShrink:0,background:"#f8fafc",borderRight:"1px solid #e2e8f0",
      padding:10,overflowY:"auto"}},
      el("p",{style:{fontSize:10.5,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",
        margin:"2px 4px 8px"}},"Lines"),
      allLines.map(l=>el("button",{key:l,onClick:()=>setSelLine(l),
        style:{width:"100%",padding:"9px 8px",marginBottom:3,border:"none",borderRadius:7,cursor:"pointer",
          background:selLine===l?NAVY:"transparent",color:selLine===l?"#fff":"#334155",
          fontSize:12.5,fontWeight:selLine===l?700:400,textAlign:"left"}},"L-"+l)
      )
    ),
    // Main content
    el("div",{style:{flex:1,padding:20,overflowY:"auto"}},
      el("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16}},
        el("h2",{style:{margin:0,fontSize:18,color:"#0f172a"}},"Line "+selLine+" Dashboard"),
        boardDateFilter&&el("span",{style:{fontSize:11,background:"#fef3c7",color:"#d97706",
          padding:"3px 9px",borderRadius:20,fontWeight:600}},boardDateFilter.label),
        el("button",{onClick:exportLine,
          style:{marginLeft:"auto",padding:"6px 16px",borderRadius:6,border:"none",cursor:"pointer",
            fontSize:12,fontWeight:600,background:ORANGE,color:"#fff",display:"flex",alignItems:"center",gap:6}},
          el("i",{className:"ti ti-download",style:{fontSize:14}}),"Export This Line")
      ),
      !lineSummary?el(NoData,{}):el(React.Fragment,{},
        // Summary stat cards
        el("div",{style:{display:"flex",gap:12,flexWrap:"wrap",marginBottom:20}},
          StatCard("Total Styles",lineStyles.length),
          StatCard("Total PLN QTY",lineSummary.totalQty.toLocaleString()),
          StatCard("Avg Efficiency",lineSummary.avgEff+"%",lineSummary.avgEff<50?"#dc2626":"#16a34a"),
          StatCard("Date Range",fmtDateShort(lineSummary.minStart)+" – "+fmtDateShort(lineSummary.maxEnd)),
          StatCard("Idle Days",lineSummary.idleDays,lineSummary.idleDays>0?"#d97706":"#16a34a"),
        ),
        // Max duration style + garment mix
        el("div",{style:{display:"flex",gap:16,marginBottom:20,flexWrap:"wrap"}},
          el("div",{style:{flex:1,minWidth:260,background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:14}},
            el("p",{style:{margin:"0 0 8px",fontSize:12,fontWeight:700,color:"#334155"}},"Longest-Running Style"),
            lineSummary.maxDurStyle?el("div",{},
              el("p",{style:{margin:0,fontSize:13.5,fontWeight:600,color:"#0f172a"}},lineSummary.maxDurStyle.styleName),
              el("p",{style:{margin:"2px 0 0",fontSize:11.5,color:"#64748b"}},
                fmtDateTime(lineSummary.maxDurStyle.startDate)+" → "+fmtDateTime(lineSummary.maxDurStyle.endDate))
            ):el("p",{style:{fontSize:12,color:"#94a3b8"}},"—")
          ),
          el("div",{style:{flex:2,minWidth:300,background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:14}},
            el("div",{style:{display:"flex",alignItems:"center",marginBottom:8}},
              el("p",{style:{margin:0,fontSize:12,fontWeight:700,color:"#334155"}},"Garment Type Mix"),
              gmtFilter!=="all"&&el("button",{onClick:()=>setGmtFilter("all"),
                style:{marginLeft:"auto",fontSize:10.5,color:"#64748b",background:"none",border:"none",
                  cursor:"pointer",textDecoration:"underline"}},"Clear filter")
            ),
            el("div",{style:{display:"flex",flexWrap:"wrap",gap:8}},
              gmtMix.map(g=>el("div",{key:g.gmtType,onClick:()=>setGmtFilter(p=>p===g.gmtType?"all":g.gmtType),
                style:{background:gmtFilter===g.gmtType?NAVY:"#f1f5f9",borderRadius:8,padding:"6px 12px",
                  cursor:"pointer",border:"1px solid "+(gmtFilter===g.gmtType?NAVY:"transparent")}},
                el("span",{style:{fontSize:12,fontWeight:600,color:gmtFilter===g.gmtType?"#fff":"#0f172a"}},g.gmtType+" "),
                el("span",{style:{fontSize:11,color:gmtFilter===g.gmtType?"rgba(255,255,255,.8)":"#64748b"}},
                  "("+g.count+" styles, "+g.totalQty.toLocaleString()+" pcs)")
              ))
            )
          )
        ),
        // Idle gaps
        idleGaps.length>0&&el("div",{style:{marginBottom:20,background:"#fffbeb",border:"1px solid #fde68a",
          borderRadius:10,padding:14}},
          el("p",{style:{margin:"0 0 8px",fontSize:12,fontWeight:700,color:"#92400e"}},
            el("i",{className:"ti ti-clock-pause",style:{marginRight:5}}),"Idle Gaps ("+idleGaps.length+")"),
          idleGaps.map((g,i)=>el("p",{key:i,style:{margin:"3px 0",fontSize:11.5,color:"#92400e"}},
            fmtGapMin(g.gapMin)+" idle between \""+g.after+"\" ending "+fmtDateTime(g.from)+
            " and \""+g.before+"\" starting "+fmtDateTime(g.to)))
        ),
        // Delivery risk for this line
        lineDeliveryRisk.length>0&&el("div",{style:{marginBottom:20,background:"#fef2f2",border:"1px solid #fecaca",
          borderRadius:10,padding:14}},
          el("p",{style:{margin:"0 0 8px",fontSize:12,fontWeight:700,color:"#dc2626"}},
            el("i",{className:"ti ti-alert-triangle",style:{marginRight:5}}),"Delivery Risk on This Line ("+lineDeliveryRisk.length+")"),
          lineDeliveryRisk.map(s=>el("p",{key:s.id,style:{margin:"3px 0",fontSize:11.5,color:"#dc2626"}},
            s.styleName+" — "+s.daysLate+" days late (Del: "+fmtDate(s.delDate)+")"))
        ),
        // Style table with expandable day-by-day breakdown
        el("p",{style:{margin:"0 0 8px",fontSize:13,fontWeight:700,color:"#334155"}},
          "Styles on This Line — click a row for day-by-day quantity"+
          (gmtFilter!=="all"?" (filtered: "+gmtFilter+")":"")),
        el("div",{style:{border:"1px solid #e2e8f0",borderRadius:8,overflow:"hidden"}},
          lineStylesFiltered.map(s=>{
            const isOpen=expandedId===s.id;
            const byDay=isOpen?dayByDayFromChunks(s.chunks):null;
            return el("div",{key:s.id,style:{borderBottom:"1px solid #f1f5f9"}},
              el("div",{onClick:()=>setExpandedId(p=>p===s.id?null:s.id),
                style:{display:"flex",alignItems:"center",gap:14,padding:"10px 14px",cursor:"pointer",
                  background:isOpen?"#f8fafc":"#fff"}},
                el("i",{className:"ti ti-chevron-"+(isOpen?"down":"right"),style:{fontSize:13,color:"#94a3b8"}}),
                el("span",{style:{fontSize:13,fontWeight:600,color:"#0f172a",flex:1}},s.styleName),
                el("span",{style:{fontSize:11.5,color:"#64748b"}},s.gmtType||"—"),
                el("span",{style:{fontSize:14,fontWeight:700,color:NAVY,fontFamily:"'DM Mono',monospace",
                  background:"#eff6ff",padding:"3px 10px",borderRadius:6}},
                  (s.plnQty||0).toLocaleString()+" pcs"),
                el("span",{style:{fontSize:12.5,fontWeight:600,color:"#334155",fontFamily:"'DM Mono',monospace"}},
                  fmtDateTime(s.startDate)+" → "+fmtDateTime(s.endDate))
              ),
              isOpen&&el("div",{style:{padding:"10px 14px 14px 40px",background:"#f8fafc"}},
                el("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
                  Object.entries(byDay).sort().map(([d,info])=>el("div",{key:d,style:{
                    background:"#fff",border:"1px solid #e2e8f0",borderRadius:7,padding:"6px 10px",minWidth:110}},
                    el("p",{style:{margin:0,fontSize:10,color:"#94a3b8"}},d),
                    el("p",{style:{margin:0,fontSize:13,fontWeight:700,color:"#0f172a"}},Math.round(info.qty)+" pcs"),
                    el("p",{style:{margin:0,fontSize:9.5,color:"#94a3b8",fontFamily:"'DM Mono',monospace"}},
                      fmtTimeOfDay(info.from)+" – "+fmtTimeOfDay(info.to))
                  ))
                )
              )
            );
          })
        )
      )
    )
  );
}

// ─── StyleSimilaritiesTab ─────────────────────────────────────────────────────
function StyleSimilaritiesTab({styles,obMap,simTabState,setSimTabState}){
  // Use lifted state from App so it persists across tab navigation
  const selectedLine=simTabState.selectedLine;
  const selectedStyleId=simTabState.selectedStyleId;
  const filters=simTabState.filters;
  const threshold=simTabState.threshold;
  const results=simTabState.results;
  const expandedMatch=simTabState.expandedMatch;

  // Setters that update the lifted state
  function setSelectedLine(v){setSimTabState(p=>({...p,selectedLine:typeof v==="function"?v(p.selectedLine):v}));}
  function setSelectedStyleId(v){setSimTabState(p=>({...p,selectedStyleId:typeof v==="function"?v(p.selectedStyleId):v}));}
  function setFilters(v){setSimTabState(p=>({...p,filters:typeof v==="function"?v(p.filters):v}));}
  function setThreshold(v){setSimTabState(p=>({...p,threshold:typeof v==="function"?v(p.threshold):v}));}
  function setResults(v){setSimTabState(p=>({...p,results:typeof v==="function"?v(p.results):v}));}
  function setExpandedMatch(v){setSimTabState(p=>({...p,expandedMatch:typeof v==="function"?v(p.expandedMatch):v}));}

  const allLines=[...new Set(styles.map(s=>s.line))].sort((a,b)=>a-b);
  const refMap=useMemo(()=>buildRefIds(styles),[styles]);

  const lineStyles=useMemo(()=>{
    if(selectedLine==="all")return[];
    return [...styles.filter(s=>String(s.line)===String(selectedLine))].sort((a,b)=>a.startDate-b.startDate);
  },[styles,selectedLine]);

  const selectedStyle=selectedStyleId?styles.find(s=>s.id===selectedStyleId):null;

  function runCheck(){
    if(!selectedStyle)return;
    const refOps=getStyleOps(selectedStyle,obMap);
    if(!refOps){
      const obLoaded=obMap&&Object.keys(obMap).length>0;
      setResults({error:obLoaded
        ?"No operations data found for "+selectedStyle.styleName+" in the loaded OB file. The OB file style names must match the FR Plan Style# Optional column exactly."
        :"No OB file loaded. Please upload the Operation Breakdown file on the Upload page first."
      });return;
    }

    const matches=[];
    styles.forEach(s=>{
      if(s.id===selectedStyleId)return;
      const sOps=getStyleOps(s,obMap);
      if(!sOps)return;
      // If gmtType filter on and garment types differ → 0% similarity
      let pct;
      if(filters.gmtType&&(selectedStyle.gmtType||"").toLowerCase().trim()!==(s.gmtType||"").toLowerCase().trim()){
        pct=0;
      }else{
        pct=calcSimilarity(refOps,sOps,filters);
      }
      if(pct!==null)matches.push({s,pct,refId:refMap[s.id]||"?"});
    });
    matches.sort((a,b)=>b.pct-a.pct);
    setResults({matches,refStyle:selectedStyle,refOps});
    setExpandedMatch({});
  }

  function exportResults(){
    if(!results||!results.matches)return;
    const rows=results.matches.map(m=>({
      "Ref ID":m.refId,"Style Name":m.s.styleName,"Line":m.s.line,
      "Start":ds(m.s.startDate),"End":ds(m.s.endDate),
      "PLN QTY":m.s.plnQty,"Del Date":ds(m.s.delDate),
      "Similarity %":m.pct,
    }));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Similarities");
    XLSX.writeFile(wb,"StyleSimilarities_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  const aboveThreshold=results&&results.matches?results.matches.filter(m=>m.pct>=threshold):[];
  const belowThreshold=results&&results.matches?results.matches.filter(m=>m.pct<threshold):[];

  // Mini board styles: reference style + above-threshold matches
  const miniBoardStyles=results&&results.matches?
    [selectedStyle,...aboveThreshold.map(m=>m.s)].filter(Boolean):[];

  return el("div",{style:{display:"flex",flexDirection:"column",gap:16,paddingBottom:40}},

    // ── Header card ────────────────────────────────────────────────────────
    el("div",{style:{background:"#fff",border:"0.5px solid #e2e8f0",borderRadius:14,padding:20}},
      el("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16}},
        el("div",{style:{width:36,height:36,borderRadius:9,background:"#EEF2F8",
          display:"flex",alignItems:"center",justifyContent:"center"}},
          el("i",{className:"ti ti-arrows-diff","aria-hidden":"true",style:{fontSize:18,color:NAVY}})),
        el("div",{},
          el("p",{style:{fontWeight:700,fontSize:15,color:"#0f172a",margin:0}},"Style Similarities"),
          el("p",{style:{fontSize:12,color:"#64748b",margin:0}},"Find styles across all lines that share similar operations")
        )
      ),

      // Step 1: Select line
      el("div",{style:{marginBottom:14}},
        el("label",{style:{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}},
          "Step 1 — Select a line to browse styles"),
        el("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
          allLines.map(l=>el("button",{key:l,onClick:()=>{setSelectedLine(String(l));setSelectedStyleId(null);setResults(null);},
            style:{padding:"7px 16px",borderRadius:8,border:`1px solid ${String(selectedLine)===String(l)?NAVY:"#cbd5e1"}`,
              background:String(selectedLine)===String(l)?NAVY:"#fff",
              color:String(selectedLine)===String(l)?"#fff":"#374151",
              fontWeight:String(selectedLine)===String(l)?700:400,fontSize:13,cursor:"pointer"}},
            "Line "+l))
        )
      ),

      // Step 2: Style list for selected line
      selectedLine!=="all"&&el("div",{style:{marginBottom:14}},
        el("label",{style:{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}},
          "Step 2 — Select a reference style from Line "+selectedLine),
        el("div",{style:{border:"0.5px solid #e2e8f0",borderRadius:10,overflow:"hidden"}},
          // Header
          el("div",{style:{display:"grid",gridTemplateColumns:"60px 1fr 100px 100px 80px 100px",
            padding:"7px 14px",background:"#f8fafc",borderBottom:"0.5px solid #e2e8f0"}},
            ["Ref","Style Name","Start","End","PLN QTY","Del"].map(h=>
              el("span",{key:h,style:{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:.5}},h)
            )
          ),
          el("div",{style:{maxHeight:240,overflowY:"auto"}},
            lineStyles.map((s,i)=>el("div",{key:s.id,
              onClick:()=>{setSelectedStyleId(s.id);setResults(null);},
              style:{display:"grid",gridTemplateColumns:"60px 1fr 100px 100px 80px 100px",
                padding:"9px 14px",borderBottom:"0.5px solid #f1f5f9",cursor:"pointer",
                background:selectedStyleId===s.id?NAVY:i%2===0?"#fff":"#fafafa",
                transition:"background .1s"}},
              el("span",{style:{fontSize:11,fontWeight:700,color:selectedStyleId===s.id?"#93c5fd":NAVY,
                fontFamily:"'DM Mono',monospace"}},refMap[s.id]||"-"),

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){

  const [originalStyles,setOriginalStyles]=useState([]);// snapshot at load time for change detection
  const [obRawBytes,setObRawBytes]=useState(null);// raw bytes of OB file for GitHub save
  const [uploadInfo,setUploadInfo]=useState(null);
  const [obInfo,setObInfo]=useState(null);
  const [colorMode,setColorMode]=useState("style");
  // Which slice of the data to DISPLAY on the read-only Planning Board — purely a view filter.
  // The full `styles` array (all months) is always what's edited, saved, and exported; this only
  // narrows what's shown on screen. null = show everything.
  const [boardDateFilter,setBoardDateFilter]=useState(null); // {from:Date,to:Date,label:string}
  const [monthFilterOpen,setMonthFilterOpen]=useState(false);
  // Auto-detect which calendar months are actually present in the uploaded data, so the
  // dropdown can offer them directly (e.g. "September 2026") instead of a blank date picker.
  const boardMonthOptions=useMemo(()=>{
    const seen=new Map(); // "YYYY-M" -> {year,month,label}
    styles.forEach(s=>{
      if(!s.startDate||!s.endDate)return;
      let cur=new Date(s.startDate.getFullYear(),s.startDate.getMonth(),1);
      const end=new Date(s.endDate.getFullYear(),s.endDate.getMonth(),1);
      while(cur<=end){
        const key=cur.getFullYear()+"-"+cur.getMonth();
        if(!seen.has(key))seen.set(key,{year:cur.getFullYear(),month:cur.getMonth(),
          label:MONS[cur.getMonth()]+" "+cur.getFullYear()});
        cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
      }
    });
    return[...seen.values()].sort((a,b)=>a.year-b.year||a.month-b.month);
  },[styles]);
  // Which garment type (if any) is focused via clicking a legend chip — matching styles stay
  // full-color/sharp, everything else dims. Read-only Planning Board only, not the canvas.
  const [gmtFocus,setGmtFocus]=useState(null);
  const [canvasOpen,setCanvasOpen]=useState(false);
  const [ghStatus,setGhStatus]=useState(null);
  const [ghSaveMenu,setGhSaveMenu]=useState(false);
  const [exportMenu,setExportMenu]=useState(false);
  const [obGhLoading,setObGhLoading]=useState(false);
  const [obGhStatus,setObGhStatus]=useState(null);
  const [ghLoading,setGhLoading]=useState(false);
  const [ghLoadErr,setGhLoadErr]=useState(null);
  const [fileKey,setFileKey]=useState(0);
  const [frDragging,setFrDragging]=useState(false);
  const [obDragging,setObDragging]=useState(false);
  const [selectMode,setSelectMode]=useState(false);
  const [selectedId,setSelectedId]=useState(null);
  const [simMode,setSimMode]=useState(false);
  const [simFilters,setSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  // Always-on consecutive similarity
  const [alwaysSimFilters,setAlwaysSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [lineSimMode,setLineSimMode]=useState(false);
  const [lineSimFilters,setLineSimFilters]=useState({description:true,mcCode:false,gmtType:false});
  const [lineSimThreshold,setLineSimThreshold]=useState(80);
  const [lineSimSelectedId,setLineSimSelectedId]=useState(null);
  const [simSubTab,setSimSubTab]=useState('consecutive');
  const [showSimGroupInfo,setShowSimGroupInfo]=useState(false);
  const [viewPanelOpen,setViewPanelOpen]=useState(false);
  const [boardZoom,setBoardZoom]=useState(1);
  // simGroups computed lazily — NOT on every styles change (O(n²) blocks UI on confirm)
  // simGroups — useMemo for instant recompute whenever styles/obMap change
  const simGroups=useMemo(()=>{
    if(!styles.length||!obMap||Object.keys(obMap).length===0)return{colorMap:{},groups:[]};
    const result=buildSimGroups(styles,obMap);
    console.log("[SimGroups] Total groups:",result.groups.length);
    console.log("[SimGroups] Styles with color:",Object.keys(result.colorMap).length,"/ total:",styles.length);
    result.groups.forEach((g,i)=>{
      const names=styles.filter(s=>g.styleIds.includes(s.id)).map(s=>s.styleName);
      console.log("[SimGroups] Group "+(i+1)+" ("+g.color+"):",names.join(", "));
    });
    // Log any 520562/520563 styles specifically
    const check=styles.filter(s=>s.styleName.includes("52056"));
    check.forEach(s=>console.log("[SimGroups] 52056x style:",s.styleName,"id:",s.id,"color:",result.colorMap[s.id]||"grey(no group)","hasOps:",!!obMap[s.styleName]));
    return result;
  },[styles,obMap]);
  const [simShowPanel,setSimShowPanel]=useState(false);
  // Persistent state for StyleSimilaritiesTab — survives tab navigation
  const [simTabState,setSimTabState]=useState({
    selectedLine:"all",selectedStyleId:null,
    filters:{description:true,mcCode:false,gmtType:false},
    threshold:90,results:null,expandedMatch:{}
  });
  const frRef=useRef();const obRef=useRef();

  function loadFRFile(file){
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:false,raw:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const result=parseFRPlan(ws);
        const parsed=result.styles;
        const lines=[...new Set(parsed.map(s=>s.line))].sort((a,b)=>a-b);
        setStyles(parsed);
        setOriginalStyles(parsed.map(s=>({...s})));// snapshot for change detection
        setRawFRData(result);// store raw data for faithful save
        setFileKey(k=>k+1);
        setUploadInfo({file:file.name,count:parsed.length,lines:lines.length,linesList:lines});
        // Stay on upload page so user can also load OB data before proceeding
      }catch(err){setUploadInfo({error:err.message});}
    };
    reader.readAsArrayBuffer(file);
  }

  function loadOBFile(file){
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const bytes=new Uint8Array(ev.target.result);
        // Parse OB data
        const wb=XLSX.read(bytes,{type:"array",cellDates:false,raw:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const map=parseOB(ws);
        setObMap(map);
        // Store original bytes directly as base64 — no re-encoding
        // This preserves the file exactly as uploaded, works for both .xls and .xlsx
        setObRawBytes(bytesToBase64(bytes));
        setObInfo({file:file.name,count:Object.keys(map).length});
      }catch(err){setObInfo({error:err.message});}
    };
    reader.readAsArrayBuffer(file);
  }

  async function loadOBFromGitHub(){
    try{
      setObGhLoading(true);setObGhStatus('loading');
      // Step 1: Get file metadata to get the SHA (works even for large files)
      const metaRes=await fetch(GH_OB_URL,{headers:{Authorization:'Bearer '+GH_TOKEN,Accept:'application/vnd.github+json'}});
      if(!metaRes.ok){
        if(metaRes.status===404)throw new Error('No OB file in GitHub yet. Upload your OB file and use Save OB Data first.');
        throw new Error('GitHub error '+metaRes.status);
      }
      const meta=await metaRes.json();
      let bytes;
      // GitHub Contents API returns empty content for files >1MB
      // Must use Git Blobs API with the file's SHA for large files
      if(meta.content&&meta.content.replace(/[\n\r]/g,'').length>0){
        // Small file — content returned directly
        const b64=meta.content.replace(/[\n\r]/g,'');
        const bin=atob(b64);
        bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      }else{
        // Large file (>1MB) — use Git Blobs API
        const blobUrl='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/git/blobs/'+meta.sha;
        const blobRes=await fetch(blobUrl,{headers:{
          Authorization:'Bearer '+GH_TOKEN,
          Accept:'application/vnd.github+json'
        }});
        if(!blobRes.ok)throw new Error('Blob fetch failed: '+blobRes.status);
        const blobData=await blobRes.json();
        const b64=blobData.content.replace(/[\n\r]/g,'');
        const bin=atob(b64);
        bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      }
      // Parse OB data
      const wb=XLSX.read(bytes,{type:'array',cellDates:false,raw:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const map=parseOB(ws);
      setObMap(map);
      setObRawBytes(bytesToBase64(bytes));
      const obStyleCount=Object.keys(map).length;
      setObInfo({file:'OB_Data.xlsx (GitHub)',count:obStyleCount});
      setObGhStatus('loaded');
      setTimeout(()=>setObGhStatus(null),3000);
    }catch(e){
      console.error('OB GitHub error:',e);
      setObGhStatus('error:'+e.message);
      alert('OB Load Error: '+e.message);
      setTimeout(()=>setObGhStatus(null),8000);
    }finally{setObGhLoading(false);}
  }

  async function loadFromGitHub(){
    try{
      setGhLoading(true);setGhLoadErr(null);
      const res=await fetch(GH_URL,{headers:{Authorization:"Bearer "+GH_TOKEN,Accept:"application/vnd.github+json"}});
      if(!res.ok){if(res.status===404)throw new Error("No plan saved yet.");throw new Error("GitHub error "+res.status);}
      const data=await res.json();
      const b64=data.content.split("\n").join("");
      const bin=atob(b64);const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      loadFRFile(new File([blob],"Production_Plan.xlsx"));
      setGhLoading(false);
    }catch(e){setGhLoadErr(e.message);setGhLoading(false);}
  }

  function handleConfirm(newStyles){
    setStyles(newStyles);
    setCanvasOpen(false);
    setPage("board");// always return to planning board after confirm
  }

  function exportChanges(){
    if(!originalStyles.length){alert("No original plan loaded to compare against.");return;}
    const ds=d=>d?fmtDate(d):"—";
    const tm=d=>d?fmtTimeOfDay(d):"—";
    const origMap={};
    originalStyles.forEach(s=>{origMap[s.id]=s;});
    const changes=[];
    styles.forEach(s=>{
      const o=origMap[s.id];
      if(!o)return;
      const lineChanged=s.line!==o.line;
      // Compare full timestamps (date + time), not just the date — a time-only change
      // (e.g. dragged 30 minutes later, same day) should still count as a real change.
      const startChanged=s.startDate?.getTime()!==o.startDate?.getTime();
      const endChanged=s.endDate?.getTime()!==o.endDate?.getTime();
      if(!lineChanged&&!startChanged&&!endChanged)return;
      const types=[];
      if(lineChanged)types.push("Line Changed");
      if(startChanged||endChanged)types.push("Time Changed");
      changes.push([
        s.styleName,s.gmtType||"",
        "L-"+o.line,"L-"+s.line,
        ds(o.startDate),tm(o.startDate),ds(s.startDate),tm(s.startDate),
        ds(o.endDate),tm(o.endDate),ds(s.endDate),tm(s.endDate),
        ds(s.delDate),ds(s.tgtCutDate),
        types.join(" & ")
      ]);
    });
    if(!changes.length){alert("No changes detected from the original plan.");return;}
    const wb=XLSX.utils.book_new();
    const hdr=["Style Name","GMT Type","Original Line","New Line",
      "Original Start Date","Original Start Time","New Start Date","New Start Time",
      "Original End Date","Original End Time","New End Date","New End Time",
      "Delivery Date","Target Cut Date","Change Type"];
    const ws=XLSX.utils.aoa_to_sheet([hdr,...changes]);
    ws["!cols"]=[{wch:28},{wch:18},{wch:14},{wch:12},{wch:16},{wch:14},{wch:16},{wch:14},
      {wch:16},{wch:14},{wch:16},{wch:14},{wch:14},{wch:14},{wch:22}];
    XLSX.utils.book_append_sheet(wb,ws,"Changes");
    XLSX.writeFile(wb,"SGL_Plan_Changes_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  function handleExport(what="fr"){
    const stamp=new Date().toISOString().slice(0,10);
    if(what==="ob"&&obRawBytes){
      // obRawBytes is base64 — decode and download
      const bin=atob(obRawBytes);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download="SGL_OB_Data_"+stamp+".xlsx";a.click();URL.revokeObjectURL(a.href);
      return;
    }
    // Export FR Plan — faithful format if raw data available
    if(rawFRData){
      const b64=buildFRPlanBase64(styles,rawFRData);
      const bin=atob(b64);const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download="SGL_FR_Plan_"+stamp+".xlsx";a.click();URL.revokeObjectURL(a.href);
      return;

          el(PlanningBoardView,{
            styles:boardDateFilter
              ?styles.filter(s=>s.startDate&&s.endDate&&s.endDate>=boardDateFilter.from&&s.startDate<=boardDateFilter.to)

      // COMPACT VIEW

      page==="reports"&&el(ReportsPage,{styles,boardDateFilter,key:fileKey,originalStyles,
